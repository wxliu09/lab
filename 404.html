<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · lab</title>
<style>
  :root {
    --bg: #fcfcfb;
    --text: #17181c;
    --text-2: #55596a;
    --muted: #8b8f9e;
    --line: #e6e5e1;
    --accent: #2f6f5e;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC",
            "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1013;
      --text: #e9e9ec;
      --text-2: #a3a7b4;
      --muted: #717684;
      --line: #262930;
      --accent: #6dc0a6;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 30rem; }

  .code {
    font-family: var(--mono);
    font-size: 3.5rem;
    font-weight: 500;
    letter-spacing: -.02em;
    color: var(--muted);
  }

  h1 { margin: 4px 0 0; font-size: 1.25rem; font-weight: 600; }

  .path {
    margin: 16px 0 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: .8125rem;
    color: var(--text-2);
    word-break: break-all;
  }

  p { margin: 16px 0 0; color: var(--text-2); font-size: .9375rem; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>找不到這個頁面</h1>
    <p class="path" id="path"></p>
    <p><a id="home" href="/lab/">&larr; 回 lab 專案索引</a></p>
  </main>

<script>
  // GitHub Pages 以此頁回應站台內所有不存在的路徑，網址是任意的，
  // 因此站台根目錄要從 pathname 推算，不能用相對連結。
  var path = location.pathname;
  var ADMIN = '/vueProj/admin/';
  var i = path.indexOf(ADMIN);

  if (i !== -1) {
    // admin 是 history 模式的 SPA，GitHub Pages 沒有 SPA fallback，
    // 重新整理內頁會落到這裡。導回 app 進入點讓 router 重新接手。
    location.replace(path.slice(0, i + ADMIN.length));
  } else {
    document.getElementById('path').textContent = path;
    document.getElementById('home').href = path.indexOf('/lab/') === 0 ? '/lab/' : '/';
  }
</script>
</body>
</html>
