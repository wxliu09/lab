<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08331f"/>
      <stop offset="1" stop-color="#040d09"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd07a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2fd07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3d25"/>
      <stop offset="0.6" stop-color="#13804a"/>
      <stop offset="1" stop-color="#0b3d25"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13804a"/>
      <stop offset="1" stop-color="#072a18"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#2fd07a" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .flow { animation: flow 1s linear infinite; }
    .cell { animation: breathe 2s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="150" rx="185" ry="130" fill="url(#halo)"/>
  <ellipse cx="200" cy="262" rx="150" ry="8" fill="#2fd07a" opacity="0.22"/>

  <!-- 左：資料表 -->
  <g class="float" stroke-linecap="round" stroke-linejoin="round">
    <rect x="28" y="98" width="90" height="108" rx="6" fill="none" stroke="#2fd07a" stroke-width="12" stroke-opacity="0.2"/>
    <rect x="28" y="98" width="90" height="108" rx="6" fill="#0b2a1b" stroke="#2fd07a" stroke-width="3"/>
    <path d="M28 120 L118 120" stroke="#2fd07a" stroke-width="3"/>
    <rect x="30" y="100" width="86" height="19" rx="4" fill="#13804a"/>
    <path d="M58 100 L58 206 M88 100 L88 206 M28 142 L118 142 M28 164 L118 164 M28 186 L118 186" fill="none" stroke="#2fd07a" stroke-width="2" stroke-opacity="0.7"/>
    <rect class="cell" x="60" y="144" width="26" height="18" fill="#a6f5c9" opacity="0.6"/>
  </g>

  <!-- 右：物件大括號 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M306 98 Q290 98 290 114 L290 140 Q290 152 280 152 Q290 152 290 164 L290 190 Q290 206 306 206 M340 98 Q356 98 356 114 L356 140 Q356 152 366 152 Q356 152 356 164 L356 190 Q356 206 340 206" stroke="#2fd07a" stroke-width="16" stroke-opacity="0.2"/>
    <path d="M306 98 Q290 98 290 114 L290 140 Q290 152 280 152 Q290 152 290 164 L290 190 Q290 206 306 206 M340 98 Q356 98 356 114 L356 140 Q356 152 366 152 Q356 152 356 164 L356 190 Q356 206 340 206" stroke="#a6f5c9" stroke-width="6"/>
    <path class="cell" d="M308 130 L338 130 M308 152 L330 152 M308 174 L336 174" stroke="#2fd07a" stroke-width="3.5"/>
  </g>

  <!-- 翻譯官：圓柱頭 + 長袍 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 142 Q200 124 250 142 L292 262 L108 262 Z" fill="none" stroke="#2fd07a" stroke-width="14" stroke-opacity="0.22"/>
    <path d="M150 142 Q200 124 250 142 L292 262 L108 262 Z" fill="url(#robe)" stroke="#2fd07a" stroke-width="3.5"/>
    <path d="M200 176 L200 262" fill="none" stroke="#2fd07a" stroke-width="3"/>
    <path d="M114 250 L286 250" fill="none" stroke="#a6f5c9" stroke-width="2.5" stroke-dasharray="6 6"/>
    <!-- 袖子與手 -->
    <path d="M156 150 L118 194 L140 204 L170 172 Z" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <path d="M244 150 L282 194 L260 204 L230 172 Z" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <circle cx="124" cy="203" r="7" fill="#0b3d25" stroke="#2fd07a" stroke-width="3"/>
    <circle cx="276" cy="203" r="7" fill="#0b3d25" stroke="#2fd07a" stroke-width="3"/>
    <!-- 衣領 -->
    <path d="M172 138 L200 178 L228 138" fill="#0b3d25" stroke="#a6f5c9" stroke-width="3"/>
    <!-- 圓柱頭 -->
    <path d="M158 62 L158 128 A42 12 0 0 0 242 128 L242 62 Z" fill="url(#head)" stroke="#2fd07a" stroke-width="3.5"/>
    <path d="M158 104 A42 12 0 0 0 242 104" fill="none" stroke="#2fd07a" stroke-width="2.5"/>
    <ellipse cx="200" cy="62" rx="42" ry="12" fill="#2fd07a" stroke="#a6f5c9" stroke-width="3"/>
    <ellipse cx="192" cy="59" rx="20" ry="3.5" fill="#a6f5c9" opacity="0.5"/>
    <!-- 臉 -->
    <path d="M176 80 L193 84 M207 84 L224 80" fill="none" stroke="#a6f5c9" stroke-width="3.5"/>
    <ellipse cx="186" cy="92" rx="5.5" ry="6" fill="#ffffff"/>
    <ellipse cx="214" cy="92" rx="5.5" ry="6" fill="#ffffff"/>
    <circle cx="187" cy="93" r="3" fill="#04140b"/>
    <circle cx="215" cy="93" r="3" fill="#04140b"/>
    <circle cx="214" cy="92" r="11" fill="#a6f5c9" fill-opacity="0.15" stroke="#a6f5c9" stroke-width="2.5"/>
    <path d="M207 87 L211 83" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M225 97 Q234 108 232 124" fill="none" stroke="#a6f5c9" stroke-width="1.8" stroke-dasharray="2 4"/>
    <path d="M188 104 Q194 99 200 103 Q206 99 212 104" fill="none" stroke="#a6f5c9" stroke-width="3"/>
  </g>

  <!-- 雙向轉換光流 -->
  <g fill="none" stroke-linecap="round">
    <path d="M122 168 C170 150 230 150 278 168" stroke="#2fd07a" stroke-width="12" stroke-opacity="0.25"/>
    <path d="M278 196 C230 214 170 214 122 196" stroke="#2fd07a" stroke-width="12" stroke-opacity="0.25"/>
    <path class="flow" d="M122 168 C170 150 230 150 278 168" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="12 10"/>
    <path class="flow" d="M278 196 C230 214 170 214 122 196" stroke="#a6f5c9" stroke-width="3.5" stroke-dasharray="12 10"/>
  </g>
  <path d="M286 171 L275.3 159.2 L270.3 172.4 Z" fill="#ffffff"/>
  <path d="M114 193 L129.7 191.7 L124.7 204.8 Z" fill="#a6f5c9"/>

  <!-- 粒子 -->
  <g class="breathe" fill="#a6f5c9">
    <circle cx="70" cy="70" r="2.5"/>
    <circle cx="330" cy="72" r="2.5"/>
    <circle cx="62" cy="232" r="2"/>
    <circle cx="344" cy="234" r="2"/>
  </g>
</svg>
