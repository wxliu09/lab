<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#073a40"/>
      <stop offset="1" stop-color="#030d0f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fe0e6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2fe0e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6a72"/>
      <stop offset="1" stop-color="#0b3d44"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#2fe0e6" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.2s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .replay { stroke-dasharray: 24 140; animation: replay 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes replay { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: -110; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="190" cy="160" rx="180" ry="125" fill="url(#halo)"/>
  <ellipse cx="166" cy="248" rx="110" ry="9" fill="#2fe0e6" opacity="0.2"/>
  <!-- 流程鏈：N1–N3 已完成，N4 進行中，N5 未來 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 244 L314 214 L344 172" stroke="#2fe0e6" stroke-width="12" stroke-opacity="0.2"/>
    <path d="M276 244 L314 214 L344 172 L352 124" stroke="#2fe0e6" stroke-width="3.5"/>
    <path d="M352 124 L334 78" stroke="#0f8f99" stroke-width="3" stroke-dasharray="5 7"/>
    <path d="M244 210 Q262 232 276 244" stroke="#b0f7f9" stroke-width="2" stroke-dasharray="3 6" stroke-opacity="0.7"/>
  </g>
  <!-- 從最後一個檢查點往回重播的光 -->
  <g fill="none" stroke-linecap="round">
    <path class="replay" d="M344 172 L314 214 L276 244" stroke="#b0f7f9" stroke-width="12" stroke-opacity="0.35"/>
    <path class="replay" d="M344 172 L314 214 L276 244" stroke="#ffffff" stroke-width="4"/>
  </g>
  <!-- 檢查點旗標 -->
  <g stroke="#b0f7f9" stroke-width="2.5" stroke-linecap="round">
    <path d="M276 233 V206 M314 203 V176 M344 161 V134"/>
  </g>
  <g fill="#2fe0e6" stroke="#b0f7f9" stroke-width="1.5" stroke-linejoin="round">
    <path d="M276 206 H292 L287 212 L292 218 H276 Z"/>
    <path d="M314 176 H330 L325 182 L330 188 H314 Z"/>
    <path d="M344 134 H360 L355 140 L360 146 H344 Z"/>
  </g>
  <g stroke="#b0f7f9" stroke-width="2.5">
    <circle cx="276" cy="244" r="11" fill="#2fe0e6"/>
    <circle cx="314" cy="214" r="11" fill="#2fe0e6"/>
    <circle cx="344" cy="172" r="11" fill="#2fe0e6"/>
  </g>
  <g fill="none" stroke="#062a2f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M271 244 L275 248 L282 240 M309 214 L313 218 L320 210 M339 172 L343 176 L350 168"/>
  </g>
  <circle class="breathe" cx="352" cy="124" r="17" fill="none" stroke="#2fe0e6" stroke-width="2"/>
  <circle cx="352" cy="124" r="10" fill="#0b3d44" stroke="#2fe0e6" stroke-width="3"/>
  <circle cx="334" cy="78" r="9" fill="#030d0f" stroke="#0f8f99" stroke-width="2.5" stroke-dasharray="4 4"/>
  <!-- 長大的雲精靈：和 Azure Function 同一張臉 -->
  <g class="float">
    <g stroke-linejoin="round">
      <path d="M92 215 C62 215 58 178 84 170 C80 138 116 124 134 140 C142 102 196 98 210 132 C236 120 262 144 250 172 C274 178 270 215 244 215 Z" fill="none" stroke="#2fe0e6" stroke-width="13" stroke-opacity="0.22"/>
      <path d="M92 215 C62 215 58 178 84 170 C80 138 116 124 134 140 C142 102 196 98 210 132 C236 120 262 144 250 172 C274 178 270 215 244 215 Z" fill="url(#body)" stroke="#2fe0e6" stroke-width="3.5"/>
      <path d="M98 160 C102 150 112 146 120 150 M150 118 C160 110 176 110 186 118" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/>
    </g>
    <g stroke="#b0f7f9" stroke-width="3" stroke-linecap="round">
      <path d="M143 158 H157 M175 158 H189"/>
    </g>
    <g fill="#ffffff">
      <ellipse cx="150" cy="170" rx="6" ry="7.5"/>
      <ellipse cx="182" cy="170" rx="6" ry="7.5"/>
    </g>
    <g fill="#b0f7f9" opacity="0.35">
      <ellipse cx="137" cy="184" rx="5.5" ry="3.2"/>
      <ellipse cx="195" cy="184" rx="5.5" ry="3.2"/>
    </g>
    <path d="M159 187 q7 5.5 14 0" fill="none" stroke="#b0f7f9" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
