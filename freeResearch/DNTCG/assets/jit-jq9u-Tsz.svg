<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1150"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="head" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.55" stop-color="#c4b5ff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#7b5cff" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3s ease-in-out infinite; }
    .streak { stroke-dasharray: 34 20; animation: streak 0.9s linear infinite; }
    .t1 { animation: tier 1.6s ease-in-out infinite; }
    .t2 { animation: tier 1.3s ease-in-out -0.2s infinite; }
    .t3 { animation: tier 1s ease-in-out -0.4s infinite; }
    .t4 { animation: tier 0.8s ease-in-out -0.6s infinite; }
    .flick { animation: flick 0.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes streak { to { stroke-dashoffset: 54; } }
    @keyframes tier { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes flick { from { transform: scaleY(0.8); } to { transform: scaleY(1.15); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="230" cy="150" rx="175" ry="120" fill="url(#halo)"/>
  <!-- 速度線 -->
  <g class="streak" stroke="#c4b5ff" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <path d="M40 78H210M30 112H120M36 192H130M44 226H220"/>
  </g>
  <!-- 尾焰 -->
  <path d="M262 150C205 98 120 112 40 150C120 188 205 202 262 150Z" fill="url(#plume)"/>
  <!-- 分層 chevron：越後面的層級越亮、越快 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g class="t1">
      <path d="M77 120L95 150L77 180" stroke="#512bd4" stroke-width="16" stroke-opacity="0.3"/>
      <path d="M77 120L95 150L77 180" stroke="#512bd4" stroke-width="6"/>
    </g>
    <g class="t2">
      <path d="M116 110L140 150L116 190" stroke="#7b5cff" stroke-width="18" stroke-opacity="0.3"/>
      <path d="M116 110L140 150L116 190" stroke="#7b5cff" stroke-width="8"/>
    </g>
    <g class="t3">
      <path d="M155 100L185 150L155 200" stroke="#c4b5ff" stroke-width="20" stroke-opacity="0.3"/>
      <path d="M155 100L185 150L155 200" stroke="#c4b5ff" stroke-width="10"/>
    </g>
    <g class="t4">
      <path d="M193 92L228 150L193 208" stroke="#fff" stroke-width="22" stroke-opacity="0.3"/>
      <path d="M193 92L228 150L193 208" stroke="#fff" stroke-width="12"/>
    </g>
  </g>
  <!-- 頭部火焰 -->
  <path class="flick" d="M286 112C284 92 296 82 304 70C306 86 318 92 314 112Z" fill="#c4b5ff" opacity="0.85"/>
  <path d="M240 150C240 112 268 98 300 108C320 116 338 136 344 150C338 164 320 184 300 192C268 202 240 188 240 150Z" fill="none" stroke="#7b5cff" stroke-width="14" stroke-opacity="0.35" stroke-linejoin="round"/>
  <path d="M240 150C240 112 268 98 300 108C320 116 338 136 344 150C338 164 320 184 300 192C268 202 240 188 240 150Z" fill="url(#head)" stroke="#7b5cff" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#1e1450">
    <ellipse cx="298" cy="143" rx="4.5" ry="6.5"/>
    <ellipse cx="318" cy="143" rx="4.5" ry="6.5"/>
  </g>
  <path d="M300 162Q308 168 316 162" fill="none" stroke="#1e1450" stroke-width="3" stroke-linecap="round"/>
  <!-- 火花 -->
  <g class="breathe" fill="#fff">
    <circle cx="60" cy="96" r="2.5"/><circle cx="104" cy="214" r="2"/><circle cx="350" cy="96" r="2.5"/><circle cx="356" cy="206" r="2"/>
    <path d="M362 150l4-9 4 9-4 9z"/>
  </g>
</svg>
