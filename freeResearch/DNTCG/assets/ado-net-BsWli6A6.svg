<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08331f"/>
      <stop offset="1" stop-color="#040d09"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd07a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2fd07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3d25"/>
      <stop offset="0.6" stop-color="#13804a"/>
      <stop offset="1" stop-color="#0b3d25"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#2fd07a" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .write { animation: write 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 254px 207px; }
    .ink { animation: ink 3s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes write { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes ink { 0% { stroke-dashoffset: 46; } 70%, 100% { stroke-dashoffset: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="210" cy="160" rx="165" ry="115" fill="url(#halo)"/>
  <ellipse cx="215" cy="246" rx="140" ry="9" fill="#2fd07a" opacity="0.22"/>

  <!-- 卷軸：一行一行手寫的 SQL -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="230" y="126" width="110" height="112" fill="none" stroke="#2fd07a" stroke-width="12" stroke-opacity="0.18"/>
    <rect x="230" y="126" width="110" height="112" fill="#0b2a1b" stroke="#a6f5c9" stroke-width="2.5"/>
    <rect x="222" y="118" width="126" height="13" rx="6.5" fill="#13804a" stroke="#a6f5c9" stroke-width="2.5"/>
    <rect x="222" y="233" width="126" height="13" rx="6.5" fill="#13804a" stroke="#a6f5c9" stroke-width="2.5"/>
    <g fill="none" stroke-width="3.5">
      <path d="M244 146 L268 146" stroke="#a6f5c9"/>
      <path d="M274 146 L326 146" stroke="#2fd07a"/>
      <path d="M244 160 L262 160" stroke="#a6f5c9"/>
      <path d="M268 160 L318 160" stroke="#2fd07a"/>
      <path d="M252 174 L310 174" stroke="#2fd07a"/>
      <path d="M244 188 L270 188" stroke="#a6f5c9"/>
      <path d="M276 188 L328 188" stroke="#2fd07a"/>
      <path d="M252 202 L300 202" stroke="#2fd07a" stroke-opacity="0.8"/>
      <path class="ink" d="M244 216 L290 216" stroke="#a6f5c9" stroke-dasharray="46"/>
    </g>
  </g>

  <!-- 圓柱職人 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 腳 -->
    <ellipse cx="142" cy="234" rx="13" ry="7" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <ellipse cx="180" cy="234" rx="13" ry="7" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <!-- 身體 -->
    <path d="M114 118 L114 218 A46 13 0 0 0 206 218 L206 118 Z" fill="none" stroke="#2fd07a" stroke-width="13" stroke-opacity="0.22"/>
    <path d="M114 118 L114 218 A46 13 0 0 0 206 218 L206 118 Z" fill="url(#body)" stroke="#2fd07a" stroke-width="3.5"/>
    <path d="M114 163 A46 13 0 0 0 206 163 M114 195 A46 13 0 0 0 206 195" fill="none" stroke="#2fd07a" stroke-width="3"/>
    <ellipse cx="160" cy="118" rx="46" ry="13" fill="#2fd07a" stroke="#a6f5c9" stroke-width="3"/>
    <ellipse cx="152" cy="115" rx="22" ry="4" fill="#a6f5c9" opacity="0.5"/>
    <!-- 左手 -->
    <path d="M114 182 L98 198" fill="none" stroke="#2fd07a" stroke-width="4"/>
    <circle cx="96" cy="200" r="6" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <!-- 臉：濃眉、眼睛、單片眼鏡、八字鬍 -->
    <path d="M137 134 L152 135.5 M169 135.5 L184 134" fill="none" stroke="#a6f5c9" stroke-width="3.5"/>
    <ellipse cx="145" cy="142" rx="5.5" ry="6.5" fill="#ffffff"/>
    <ellipse cx="176" cy="142" rx="5.5" ry="6.5" fill="#ffffff"/>
    <circle cx="146" cy="143" r="3" fill="#04140b"/>
    <circle cx="177" cy="143" r="3" fill="#04140b"/>
    <circle cx="176" cy="142" r="11.5" fill="#a6f5c9" fill-opacity="0.15" stroke="#a6f5c9" stroke-width="2.5"/>
    <path d="M169 137 L173 133" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M186 148 Q198 160 196 178" fill="none" stroke="#a6f5c9" stroke-width="1.8" stroke-dasharray="2 4"/>
    <path d="M148 155 Q154 150 160 154 Q166 150 172 155" fill="none" stroke="#a6f5c9" stroke-width="3"/>
    <!-- 右手握羽毛筆 -->
    <path d="M206 178 L238 192" fill="none" stroke="#2fd07a" stroke-width="4"/>
  </g>
  <g class="write" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 207 L262 188 C274 160 288 130 306 104 C300 136 288 166 268 196 Z" fill="none" stroke="#2fd07a" stroke-width="10" stroke-opacity="0.2"/>
    <path d="M254 207 L262 188 C274 160 288 130 306 104 C300 136 288 166 268 196 Z" fill="#13804a" stroke="#a6f5c9" stroke-width="2.5"/>
    <path d="M264 192 C276 166 290 136 304 108" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.8"/>
    <path d="M275 160 L289 156 M282 144 L296 140 M270 174 L282 172" fill="none" stroke="#a6f5c9" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="240" cy="193" r="6.5" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
  </g>

  <!-- 粒子 -->
  <g class="float" fill="#a6f5c9">
    <circle cx="70" cy="80" r="2.5"/>
    <circle cx="88" cy="150" r="2"/>
    <circle cx="350" cy="96" r="2.5"/>
    <circle cx="232" cy="70" r="2"/>
  </g>
</svg>
