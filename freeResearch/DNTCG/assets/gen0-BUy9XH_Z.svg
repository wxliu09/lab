<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1150"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2690"/>
      <stop offset="1" stop-color="#1e1450"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#7b5cff" stroke-opacity="0.12"/>
    </pattern>
    <g id="cube" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
      <path d="M0-11L10-5.5L0 0L-10-5.5Z" fill="#c4b5ff"/>
      <path d="M-10-5.5L0 0V11L-10 5.5Z" fill="#7b5cff"/>
      <path d="M10-5.5V5.5L0 11V0Z" fill="#512bd4"/>
    </g>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .blink { animation: blink 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 5s ease-in-out infinite; }
    .float2 { animation: float 4s ease-in-out -2s infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="165" rx="165" ry="125" fill="url(#halo)"/>
  <ellipse cx="200" cy="240" rx="125" ry="10" fill="#7b5cff" opacity="0.25"/>
  <!-- 地上等著被回收的小物件 -->
  <g opacity="0.5">
    <use href="#cube" transform="translate(92 236) scale(0.7)"/>
    <use href="#cube" transform="translate(112 244) scale(0.5)"/>
    <use href="#cube" transform="translate(300 246) scale(0.55)"/>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 手臂：外框描邊 + 內層填色，做出管狀 -->
    <path d="M150 196Q126 200 120 218" stroke="#7b5cff" stroke-width="12"/>
    <path d="M150 196Q126 200 120 218" stroke="#2a1a6e" stroke-width="6"/>
    <path d="M250 192Q282 186 296 204" stroke="#7b5cff" stroke-width="12"/>
    <path d="M250 192Q282 186 296 204" stroke="#2a1a6e" stroke-width="6"/>
    <path d="M296 202Q304 188 316 192M296 206Q304 222 316 219" stroke="#7b5cff" stroke-width="4"/>
  </g>
  <!-- 被撿起來的發光物件 -->
  <circle class="breathe" cx="322" cy="206" r="20" fill="#c4b5ff" opacity="0.35"/>
  <use href="#cube" transform="translate(322 206)"/>
  <!-- 底座 -->
  <rect x="126" y="205" width="148" height="28" rx="14" fill="none" stroke="#7b5cff" stroke-width="12" stroke-opacity="0.25"/>
  <rect x="126" y="205" width="148" height="28" rx="14" fill="#1e1450" stroke="#7b5cff" stroke-width="3.5"/>
  <g class="breathe" fill="#c4b5ff">
    <circle cx="150" cy="219" r="2.5"/><circle cx="175" cy="219" r="2.5"/><circle cx="200" cy="219" r="2.5"/><circle cx="225" cy="219" r="2.5"/><circle cx="250" cy="219" r="2.5"/>
  </g>
  <!-- 圓頂身體 -->
  <path d="M140 212C140 150 166 112 200 112C234 112 260 150 260 212Z" fill="none" stroke="#7b5cff" stroke-width="12" stroke-opacity="0.25" stroke-linejoin="round"/>
  <path d="M140 212C140 150 166 112 200 112C234 112 260 150 260 212Z" fill="url(#body)" stroke="#7b5cff" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M158 150C163 133 176 123 190 119" fill="none" stroke="#c4b5ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <!-- 天線 -->
  <path d="M200 112V92" stroke="#7b5cff" stroke-width="4" stroke-linecap="round"/>
  <circle class="breathe" cx="200" cy="85" r="14" fill="#c4b5ff" opacity="0.4"/>
  <circle cx="200" cy="85" r="7" fill="#fff"/>
  <!-- 護目鏡 -->
  <rect x="150" y="140" width="100" height="38" rx="19" fill="#0d0a2a" stroke="#7b5cff" stroke-width="3"/>
  <ellipse cx="182" cy="159" rx="14" ry="16" fill="#c4b5ff" opacity="0.35"/>
  <ellipse cx="218" cy="159" rx="14" ry="16" fill="#c4b5ff" opacity="0.35"/>
  <g class="blink" fill="#fff">
    <ellipse cx="182" cy="159" rx="9" ry="11"/>
    <ellipse cx="218" cy="159" rx="9" ry="11"/>
  </g>
  <ellipse cx="160" cy="190" rx="7" ry="4" fill="#ff5fa2" opacity="0.45"/>
  <ellipse cx="240" cy="190" rx="7" ry="4" fill="#ff5fa2" opacity="0.45"/>
  <path d="M190 191Q200 199 210 191" fill="none" stroke="#c4b5ff" stroke-width="3" stroke-linecap="round"/>
  <!-- 漂浮粒子 -->
  <g class="float" fill="#c4b5ff">
    <circle cx="80" cy="110" r="3"/><circle cx="330" cy="90" r="2.5"/><rect x="292" y="132" width="5" height="5" transform="rotate(20 294 134)"/>
  </g>
  <g class="float2" fill="#fff" opacity="0.8">
    <circle cx="112" cy="70" r="2"/><circle cx="270" cy="62" r="2"/><rect x="96" y="160" width="4" height="4"/>
  </g>
</svg>
