<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0a22"/>
      <stop offset="1" stop-color="#0d0308"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ff5fa2" stroke-opacity="0.1"/>
    </pattern>
    <g id="card">
      <rect width="62" height="22" rx="5" fill="#3a0f26" stroke="#ff5fa2" stroke-width="2"/>
      <path d="M8 8H44M8 15H30" stroke="#ffc0dc" stroke-width="3" stroke-opacity="0.7"/>
    </g>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .spin { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
    .lift { animation: lift 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .dash { animation: dash 1.6s linear infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
