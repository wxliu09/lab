<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2150"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a9cdff"/>
      <stop offset="1" stop-color="#3b8cff"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#3b8cff" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    .wave { animation: wave 3.6s ease-out infinite; transform-box: view-box; transform-origin: 200px 92px; }
    .w2 { animation-delay: -1.2s; }
    .w3 { animation-delay: -2.4s; }
    .rx { animation: rx 1.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes wave { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(5.5); opacity: 0; } }
    @keyframes rx { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="140" rx="170" ry="125" fill="url(#halo)"/>
  <ellipse cx="200" cy="255" rx="110" ry="8" fill="#3b8cff" opacity="0.25"/>

  <!-- 廣播波 -->
  <g fill="none" stroke="#a9cdff" stroke-width="3">
    <circle class="wave" cx="200" cy="92" r="30" vector-effect="non-scaling-stroke"/>
    <circle class="wave w2" cx="200" cy="92" r="30" vector-effect="non-scaling-stroke"/>
    <circle class="wave w3" cx="200" cy="92" r="30" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- 接收點：同時亮起 -->
  <g stroke-linecap="round">
    <g class="rx" fill="#a9cdff">
      <circle cx="62" cy="78" r="5"/>
      <circle cx="338" cy="78" r="5"/>
      <circle cx="46" cy="186" r="5"/>
      <circle cx="354" cy="186" r="5"/>
      <circle cx="104" cy="240" r="5"/>
      <circle cx="296" cy="240" r="5"/>
    </g>
    <g fill="none" stroke="#3b8cff" stroke-width="2.5">
      <circle cx="62" cy="78" r="11"/>
      <circle cx="338" cy="78" r="11"/>
      <circle cx="46" cy="186" r="11"/>
      <circle cx="354" cy="186" r="11"/>
      <circle cx="104" cy="240" r="11"/>
      <circle cx="296" cy="240" r="11"/>
    </g>
  </g>

  <!-- 塔身 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 118 L150 250 L250 250 L214 118 Z" fill="none" stroke="#3b8cff" stroke-width="13" stroke-opacity="0.22"/>
    <path d="M186 118 L150 250 L250 250 L214 118 Z" fill="#0c2560" stroke="#3b8cff" stroke-width="3.5"/>
    <path d="M182 134 L218 134 M176 166 L224 166 M167 200 L233 200 M158 232 L242 232" fill="none" stroke="#3b8cff" stroke-width="2.5"/>
    <path d="M182 134 L224 166 L167 200 L242 232 M218 134 L176 166 L233 200 L158 232" fill="none" stroke="#a9cdff" stroke-width="2" stroke-opacity="0.55"/>
    <rect x="136" y="248" width="128" height="10" rx="5" fill="#1c4fb8" stroke="#3b8cff" stroke-width="3"/>
    <!-- 小天線 -->
    <path d="M182 74 L160 50 M218 74 L240 50" fill="none" stroke="#3b8cff" stroke-width="3.5"/>
    <circle class="rx" cx="158" cy="48" r="5" fill="#ffffff"/>
    <circle class="rx" cx="242" cy="48" r="5" fill="#ffffff"/>
  </g>

  <!-- 頂端發光核心（頭） -->
  <circle cx="200" cy="92" r="40" fill="#3b8cff" opacity="0.25"/>
  <circle cx="200" cy="92" r="28" fill="url(#core)" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="190" cy="91" rx="4.5" ry="6.5" fill="#0a1a40"/>
  <ellipse cx="210" cy="91" rx="4.5" ry="6.5" fill="#0a1a40"/>
  <circle cx="191.5" cy="88.5" r="1.6" fill="#ffffff"/>
  <circle cx="211.5" cy="88.5" r="1.6" fill="#ffffff"/>
  <path d="M193 102 Q200 108 207 102" fill="none" stroke="#0a1a40" stroke-width="2.5" stroke-linecap="round"/>
</svg>
