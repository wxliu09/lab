<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0d2a66"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6aa8ff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#3b8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingNear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9cdff"/>
      <stop offset="0.45" stop-color="#3b8cff"/>
      <stop offset="1" stop-color="#1c4fb8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4fb8"/>
      <stop offset="1" stop-color="#0c2560"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#3b8cff" stroke-opacity="0.12"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3s ease-in-out infinite; }
    .spin { animation: spin 40s linear infinite; transform-box: view-box; transform-origin: 225px 150px; }
    .stream { animation: stream 0.8s linear infinite; }
    .dive { animation: dive 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle { animation: breathe 1.6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes stream { to { stroke-dashoffset: 48; } }
    @keyframes dive { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(5px, 3px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>

  <!-- LTS：放射光芒與大光暈 -->
  <g class="spin" fill="#a9cdff" opacity="0.08">
    <path d="M225 150 L225 -60 L250 -60 Z"/>
    <path d="M225 150 L435 150 L435 175 Z"/>
    <path d="M225 150 L225 360 L200 360 Z"/>
    <path d="M225 150 L15 150 L15 125 Z"/>
    <path d="M225 150 L373 2 L391 20 Z"/>
    <path d="M225 150 L373 298 L355 316 Z"/>
    <path d="M225 150 L77 298 L59 280 Z"/>
    <path d="M225 150 L77 2 L95 -16 Z"/>
  </g>
  <ellipse class="breathe" cx="225" cy="150" rx="190" ry="140" fill="url(#halo)"/>
  <circle class="spin" cx="225" cy="150" r="122" fill="none" stroke="#a9cdff" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="3 9 22 9"/>

  <!-- 高速光流（從左上往鳥身後拖曳） -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#3b8cff" stroke-width="10" stroke-opacity="0.18">
      <path d="M6 22 L150 104"/>
      <path d="M0 86 L118 152"/>
      <path d="M40 180 L150 242"/>
    </g>
    <g class="stream" stroke="#a9cdff" stroke-width="3" stroke-dasharray="30 18">
      <path d="M6 22 L150 104"/>
      <path d="M0 86 L118 152"/>
      <path d="M40 180 L150 242"/>
    </g>
    <path class="stream" d="M70 40 L190 108" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="14 34" stroke-opacity="0.8"/>
  </g>

  <!-- 封包粒子 -->
  <g class="twinkle" fill="#a9cdff">
    <rect x="58" y="120" width="9" height="9" transform="rotate(45 62.5 124.5)"/>
    <rect x="26" y="40" width="7" height="7" transform="rotate(45 29.5 43.5)"/>
    <rect x="96" y="210" width="8" height="8" transform="rotate(45 100 214)"/>
    <rect x="340" y="70" width="7" height="7" transform="rotate(45 343.5 73.5)"/>
  </g>

  <g class="dive" stroke-linecap="round" stroke-linejoin="round">
    <!-- 遠側翅膀（較暗） -->
    <path d="M250 160 L236 228 L128 260 L176 226 L138 222 L196 204 L160 194 L214 182 L232 168 Z" fill="none" stroke="#3b8cff" stroke-width="13" stroke-opacity="0.2"/>
    <path d="M250 160 L236 228 L128 260 L176 226 L138 222 L196 204 L160 194 L214 182 L232 168 Z" fill="#0b2257" stroke="#3b8cff" stroke-width="3" stroke-opacity="0.75"/>
    <path d="M240 172 L150 252 M236 176 L150 220 M236 176 L172 196" fill="none" stroke="#3b8cff" stroke-width="1.8" stroke-opacity="0.5"/>

    <!-- 身體與尾羽 -->
    <path d="M334 203 L306 168 L284 160 L218 126 L158 100 L98 70 L120 95 L92 92 L118 108 L104 116 L160 118 L226 152 L286 196 L312 208 Z" fill="none" stroke="#3b8cff" stroke-width="14" stroke-opacity="0.28"/>
    <path d="M334 203 L306 168 L284 160 L218 126 L158 100 L98 70 L120 95 L92 92 L118 108 L104 116 L160 118 L226 152 L286 196 L312 208 Z" fill="url(#body)" stroke="#3b8cff" stroke-width="3.5"/>
    <path d="M232 160 L284 194" fill="none" stroke="#a9cdff" stroke-width="2.5" stroke-opacity="0.7"/>

    <!-- 近側翅膀：銳利多邊形羽片 -->
    <path d="M258 150 L232 72 L116 40 L170 70 L128 82 L188 98 L148 114 L208 120 L228 140 Z" fill="none" stroke="#3b8cff" stroke-width="14" stroke-opacity="0.3"/>
    <path d="M258 150 L232 72 L116 40 L170 70 L128 82 L188 98 L148 114 L208 120 L228 140 Z" fill="url(#wingNear)" stroke="#3b8cff" stroke-width="3.5"/>
    <path d="M246 132 L130 46 M246 132 L134 82 M246 132 L156 112" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.55"/>
    <path d="M232 72 L250 128" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8"/>

    <!-- 頭部 -->
    <path d="M334 203 L306 168 L284 160 L272 178 L292 202 L312 208 Z" fill="#1c4fb8" stroke="#3b8cff" stroke-width="3"/>
    <path d="M334 203 L318 190 L313 205 Z" fill="#a9cdff" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M290 182 Q300 171 312 178 Q302 187 290 182 Z" fill="#ffffff"/>
    <circle cx="303" cy="179" r="3.2" fill="#050914"/>
    <path d="M298 187 L293 201" fill="none" stroke="#050914" stroke-width="3"/>
  </g>

  <!-- 星芒 -->
  <g class="twinkle" fill="#ffffff">
    <path d="M352 120 L355 130 L365 133 L355 136 L352 146 L349 136 L339 133 L349 130 Z"/>
    <path d="M300 46 L302 52 L308 54 L302 56 L300 62 L298 56 L292 54 L298 52 Z"/>
  </g>
</svg>
