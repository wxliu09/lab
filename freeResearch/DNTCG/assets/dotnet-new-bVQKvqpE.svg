<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#0d0603"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8f3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8f3d"/>
      <stop offset="1" stop-color="#ffd0a8"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ff8f3d" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .sway { animation: sway 5s ease-in-out infinite; transform-box: view-box; transform-origin: 258px 225px; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .twinkle { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle:nth-child(2) { animation-delay: -0.7s; }
    .twinkle:nth-child(3) { animation-delay: -1.5s; }
    .twinkle:nth-child(4) { animation-delay: -2.1s; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { transform: scale(0.6); opacity: 0.4; } 50% { transform: scale(1.1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="220" cy="150" rx="170" ry="125" fill="url(#halo)"/>
  <ellipse cx="200" cy="258" rx="130" ry="8" fill="#ff8f3d" opacity="0.28"/>
  <g stroke-linejoin="round">
    <rect x="90" y="130" width="220" height="125" rx="12" fill="#2e1405" stroke="#ff8f3d" stroke-width="13" stroke-opacity="0.22"/>
    <rect x="90" y="130" width="220" height="125" rx="12" fill="#2e1405" stroke="#ff8f3d" stroke-width="3.5"/>
    <path d="M90 154H310" stroke="#ff8f3d" stroke-width="3"/>
  </g>
  <g fill="#ff8f3d">
    <circle cx="106" cy="142" r="4"/>
    <circle cx="120" cy="142" r="4" opacity="0.7"/>
    <circle cx="134" cy="142" r="4" opacity="0.45"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 178L126 190L112 202" stroke="#ffd0a8" stroke-width="12" stroke-opacity="0.25"/>
    <path d="M112 178L126 190L112 202" stroke="#ffd0a8" stroke-width="4.5"/>
    <path d="M142 190H196M112 222H170M112 238H146" stroke="#ff8f3d" stroke-width="5" stroke-opacity="0.55"/>
  </g>
  <rect class="blink" x="204" y="181" width="13" height="19" rx="2" fill="#ffd0a8"/>
  <g class="sway" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 225C256 190 262 150 268 120C272 100 270 85 268 70" fill="none" stroke="#ffd0a8" stroke-width="12" stroke-opacity="0.3"/>
    <path d="M258 225C256 190 262 150 268 120C272 100 270 85 268 70" fill="none" stroke="#ffd0a8" stroke-width="4"/>
    <path d="M266 108C240 104 222 84 220 62C246 62 263 82 266 108Z" fill="url(#leaf)" stroke="#ff8f3d" stroke-width="3"/>
    <path d="M268 94C290 87 306 70 309 48C286 50 270 68 268 94Z" fill="url(#leaf)" stroke="#ff8f3d" stroke-width="3"/>
    <path d="M266 108C252 98 240 86 230 72M268 94C280 82 292 68 300 58" fill="none" stroke="#b8501a" stroke-width="2"/>
    <circle class="breathe" cx="268" cy="68" r="7" fill="#ffffff"/>
  </g>
  <g fill="#ffd0a8">
    <path class="twinkle" d="M130 62L134 74L146 78L134 82L130 94L126 82L114 78L126 74Z"/>
    <path class="twinkle" d="M190 44L193 53L202 56L193 59L190 68L187 59L178 56L187 53Z"/>
    <path class="twinkle" d="M338 106L341 115L350 118L341 121L338 130L335 121L326 118L335 115Z"/>
    <path class="twinkle" d="M80 108L82 114L88 116L82 118L80 124L78 118L72 116L78 114Z"/>
  </g>
</svg>
