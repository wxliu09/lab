<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22283a"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a8b0c2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a8b0c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6378"/>
      <stop offset="1" stop-color="#a8b0c2"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#a8b0c2" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .blink { animation: blink 5s steps(1) infinite; transform-box: fill-box; transform-origin: center; }
    .wave { animation: wave 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
    .click { animation: click 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 5s steps(4) infinite; }
    .float2 { animation: float 4s steps(4) -2s infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.2); } }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
    @keyframes click { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="155" rx="160" ry="120" fill="url(#halo)"/>
  <ellipse cx="200" cy="244" rx="110" ry="9" fill="#a8b0c2" opacity="0.22"/>
  <!-- 方正的小短腳 -->
  <g fill="#2a3044" stroke="#a8b0c2" stroke-width="3">
    <rect x="152" y="212" width="16" height="22"/><rect x="232" y="212" width="16" height="22"/>
    <rect x="142" y="232" width="30" height="10"/><rect x="228" y="232" width="30" height="10"/>
  </g>
  <!-- 手臂：右手揮手 -->
  <g fill="#2a3044" stroke="#a8b0c2" stroke-width="3">
    <rect x="110" y="152" width="20" height="10"/><rect x="98" y="148" width="14" height="20"/>
  </g>
  <g class="wave" fill="#2a3044" stroke="#a8b0c2" stroke-width="3">
    <rect x="270" y="146" width="20" height="10"/><rect x="288" y="128" width="14" height="22"/>
  </g>
  <!-- 視窗本體 -->
  <rect x="128" y="78" width="144" height="136" rx="3" fill="none" stroke="#a8b0c2" stroke-width="12" stroke-opacity="0.25"/>
  <rect x="128" y="78" width="144" height="136" rx="3" fill="#1c2130" stroke="#a8b0c2" stroke-width="3.5"/>
  <rect x="130" y="80" width="140" height="22" fill="url(#title)"/>
  <path d="M130 102H270" stroke="#a8b0c2" stroke-width="2"/>
  <rect x="136" y="85" width="12" height="12" fill="#e3e7f0"/>
  <path d="M136 85h6v6h-6z" fill="#5b6378"/>
  <!-- 最小化、最大化、關閉 -->
  <g fill="#1c2130" stroke="#e3e7f0" stroke-width="1.5">
    <rect x="216" y="83" width="15" height="15"/><rect x="234" y="83" width="15" height="15"/><rect x="252" y="83" width="15" height="15"/>
  </g>
  <g fill="none" stroke="#e3e7f0" stroke-width="2" stroke-linecap="square">
    <path d="M220 94H227"/><rect x="238" y="87" width="7" height="7"/><path d="M256 87L263 94M263 87L256 94"/>
  </g>
  <!-- 方形眼 -->
  <g fill="#e3e7f0" opacity="0.3"><rect x="155" y="119" width="28" height="28"/><rect x="217" y="119" width="28" height="28"/></g>
  <g class="blink">
    <rect x="160" y="124" width="18" height="18" fill="#fff"/>
    <rect x="222" y="124" width="18" height="18" fill="#fff"/>
    <rect x="169" y="130" width="6" height="6" fill="#1c2130"/>
    <rect x="231" y="130" width="6" height="6" fill="#1c2130"/>
  </g>
  <g fill="#ff5fa2" opacity="0.45"><rect x="146" y="160" width="8" height="6"/><rect x="246" y="160" width="8" height="6"/></g>
  <!-- 嘴巴是一顆立體按鈕 -->
  <rect x="168" y="162" width="64" height="26" fill="#3a4258"/>
  <path d="M168 188V162H232" fill="none" stroke="#e3e7f0" stroke-width="2.5"/>
  <path d="M232 162V188H168" fill="none" stroke="#08090d" stroke-width="2.5"/>
  <path d="M186 175H214" stroke="#e3e7f0" stroke-width="3" stroke-linecap="square"/>
  <!-- 游標與雙擊波紋 -->
  <g fill="none" stroke="#e3e7f0" stroke-width="2">
    <circle class="click" cx="322" cy="94" r="14"/>
  </g>
  <path d="M322 94V118L328 113L333 123L338 121L333 111L341 111Z" fill="#fff" stroke="#08090d" stroke-width="2" stroke-linejoin="round"/>
  <!-- 像素粒子 -->
  <g class="float" fill="#e3e7f0">
    <rect x="76" y="94" width="6" height="6"/><rect x="338" y="182" width="6" height="6"/><rect x="104" y="208" width="4" height="4"/>
  </g>
  <g class="float2" fill="#a8b0c2">
    <rect x="68" y="150" width="5" height="5"/><rect x="300" y="60" width="5" height="5"/><rect x="150" y="56" width="4" height="4"/>
  </g>
</svg>
