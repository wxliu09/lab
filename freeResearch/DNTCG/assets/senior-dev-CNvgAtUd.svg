  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float2 { animation-delay: -2.5s; }
    .steam { animation: steam 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    .steam2 { animation-delay: -1.4s; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: 0.9; } 100% { transform: translateY(-10px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
