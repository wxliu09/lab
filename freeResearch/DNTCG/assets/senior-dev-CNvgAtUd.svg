      <stop offset="0" stop-color="#3a0a22"/>
      <stop offset="1" stop-color="#0d0308"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ff5fa2" stroke-opacity="0.1"/>
    </pattern>
    <g id="win">
