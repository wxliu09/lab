<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22283a"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8cfdd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a8b0c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e7f0" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#a8b0c2" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e3e7f0" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6378"/>
      <stop offset="1" stop-color="#e3e7f0"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7f0"/>
      <stop offset="1" stop-color="#5b6378"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#a8b0c2" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .blink { animation: blink 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .hover { animation: hover 4.5s ease-in-out infinite; }
    .flow { stroke-dasharray: 14 10; animation: flow 2.4s linear infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="150" rx="170" ry="125" fill="url(#halo)"/>
  <ellipse class="breathe" cx="200" cy="252" rx="80" ry="8" fill="#e3e7f0" opacity="0.3"/>
  <!-- 環繞的向量曲線與貝茲把手 -->
  <g fill="none" stroke-linecap="round">
    <path d="M52 232C40 170 130 180 112 92M290 58C360 90 300 180 350 222" stroke="#e3e7f0" stroke-width="10" stroke-opacity="0.15"/>
    <path class="flow" d="M52 232C40 170 130 180 112 92M290 58C360 90 300 180 350 222" stroke="#e3e7f0" stroke-width="3"/>
    <path d="M118 52C170 30 230 30 282 52" stroke="#a8b0c2" stroke-width="2" stroke-dasharray="3 7" opacity="0.6"/>
    <g stroke="#a8b0c2" stroke-width="1.5" opacity="0.8">
      <path d="M52 232L40 170M112 92L130 180M290 58L360 90M350 222L300 180"/>
    </g>
  </g>
  <g class="breathe" fill="#e3e7f0"><circle cx="40" cy="170" r="5"/><circle cx="130" cy="180" r="5"/><circle cx="360" cy="90" r="5"/><circle cx="300" cy="180" r="5"/></g>
  <g fill="#1c2130" stroke="#fff" stroke-width="2">
    <rect x="48" y="228" width="8" height="8"/><rect x="108" y="88" width="8" height="8"/><rect x="286" y="54" width="8" height="8"/><rect x="346" y="218" width="8" height="8"/>
  </g>
  <!-- 玻璃視窗本體，懸浮 -->
  <g class="hover">
    <path d="M132 104C132 84 150 74 200 74C250 74 268 84 268 104L274 196C274 226 244 234 200 234C156 234 126 226 126 196Z" fill="none" stroke="#e3e7f0" stroke-width="13" stroke-opacity="0.22" stroke-linejoin="round"/>
    <path d="M132 104C132 84 150 74 200 74C250 74 268 84 268 104L274 196C274 226 244 234 200 234C156 234 126 226 126 196Z" fill="#1c2130" fill-opacity="0.75"/>
    <path d="M132 104C132 84 150 74 200 74C250 74 268 84 268 104L274 196C274 226 244 234 200 234C156 234 126 226 126 196Z" fill="url(#glass)" stroke="#e3e7f0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M132 104C132 84 150 74 200 74C250 74 268 84 268 104Z" fill="url(#title)" opacity="0.85"/>
    <g fill="#1c2130" stroke="#fff" stroke-width="1.5">
      <rect x="216" y="84" width="13" height="13" rx="4"/><rect x="233" y="84" width="13" height="13" rx="4"/><rect x="250" y="84" width="13" height="13" rx="4"/>
    </g>
    <path d="M144 118C150 160 144 192 150 214" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
    <path d="M236 112L252 112L196 226L180 226Z" fill="#fff" opacity="0.07"/>
    <!-- 方形眼，邊角變圓潤 -->
    <g fill="#e3e7f0" opacity="0.3"><rect x="157" y="121" width="28" height="28" rx="6"/><rect x="215" y="121" width="28" height="28" rx="6"/></g>
    <g class="blink">
      <rect x="162" y="126" width="18" height="18" rx="3.5" fill="#fff"/>
      <rect x="220" y="126" width="18" height="18" rx="3.5" fill="#fff"/>
      <rect x="170" y="132" width="6" height="6" rx="1.5" fill="#1c2130"/>
      <rect x="228" y="132" width="6" height="6" rx="1.5" fill="#1c2130"/>
    </g>
    <g fill="#ff5fa2" opacity="0.4"><ellipse cx="150" cy="166" rx="7" ry="4"/><ellipse cx="250" cy="166" rx="7" ry="4"/></g>
    <rect x="172" y="168" width="56" height="20" rx="10" fill="url(#btn)" stroke="#fff" stroke-width="1.5"/>
    <path d="M184 172H214" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- 光點 -->
  <g class="breathe" fill="#fff">
    <path d="M78 76l3-8 3 8 8 3-8 3-3 8-3-8-8-3z"/>
    <path d="M318 262l2-6 2 6 6 2-6 2-2 6-2-6-6-2z" opacity="0.8"/>
    <circle cx="336" cy="140" r="2"/><circle cx="72" cy="126" r="2"/>
  </g>
</svg>
