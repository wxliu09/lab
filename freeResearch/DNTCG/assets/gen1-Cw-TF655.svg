<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1150"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2690"/>
      <stop offset="1" stop-color="#1e1450"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#7b5cff" stroke-opacity="0.12"/>
    </pattern>
    <g id="cube" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
      <path d="M0-11L10-5.5L0 0L-10-5.5Z" fill="#c4b5ff"/>
      <path d="M-10-5.5L0 0V11L-10 5.5Z" fill="#7b5cff"/>
      <path d="M10-5.5V5.5L0 11V0Z" fill="#512bd4"/>
    </g>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .blink { animation: blink 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spin { animation: spin 3s linear infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 5s ease-in-out infinite; }
    .float2 { animation: float 4s ease-in-out -2s infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @keyframes spin { to { transform: rotate(-360deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="155" rx="175" ry="130" fill="url(#halo)"/>
  <ellipse cx="200" cy="246" rx="145" ry="11" fill="#7b5cff" opacity="0.25"/>
  <!-- 被壓縮成小方塊的物件 -->
  <g class="float">
    <use href="#cube" transform="translate(58 118) scale(0.8)"/>
    <use href="#cube" transform="translate(338 126) scale(0.7)"/>
  </g>
  <g class="float2" opacity="0.75">
    <use href="#cube" transform="translate(96 74) scale(0.55)"/>
    <use href="#cube" transform="translate(306 70) scale(0.6)"/>
    <use href="#cube" transform="translate(344 196) scale(0.45)"/>
  </g>
  <!-- 機械手臂 -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M130 170L92 188L80 218M270 170L308 188L320 218" stroke="#7b5cff" stroke-width="16"/>
    <path d="M130 170L92 188L80 218M270 170L308 188L320 218" stroke="#2a1a6e" stroke-width="8"/>
    <path d="M80 216Q64 226 68 244M80 216Q96 228 92 246M320 216Q304 228 308 246M320 216Q336 226 332 244" stroke="#7b5cff" stroke-width="5"/>
  </g>
  <g fill="#512bd4" stroke="#c4b5ff" stroke-width="2">
    <circle cx="92" cy="188" r="8"/><circle cx="308" cy="188" r="8"/>
  </g>
  <!-- 底座 -->
  <rect x="112" y="205" width="176" height="32" rx="16" fill="none" stroke="#7b5cff" stroke-width="12" stroke-opacity="0.25"/>
  <rect x="112" y="205" width="176" height="32" rx="16" fill="#1e1450" stroke="#7b5cff" stroke-width="3.5"/>
  <g class="breathe" fill="#c4b5ff">
    <circle cx="138" cy="221" r="2.5"/><circle cx="169" cy="221" r="2.5"/><circle cx="231" cy="221" r="2.5"/><circle cx="262" cy="221" r="2.5"/>
  </g>
  <!-- 圓頂身體 -->
  <path d="M120 212C120 140 155 82 200 82C245 82 280 140 280 212Z" fill="none" stroke="#7b5cff" stroke-width="13" stroke-opacity="0.25" stroke-linejoin="round"/>
  <path d="M120 212C120 140 155 82 200 82C245 82 280 140 280 212Z" fill="url(#body)" stroke="#7b5cff" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- 裝甲板 -->
  <g fill="#512bd4" stroke="#c4b5ff" stroke-width="1.5" stroke-linejoin="round">
    <path d="M165 101L200 88L235 101V109L200 97L165 109Z"/>
    <path d="M128 160L146 150V200L126 206Z"/>
    <path d="M272 160L254 150V200L274 206Z"/>
  </g>
  <g fill="#512bd4" stroke="#7b5cff" stroke-width="3">
    <circle cx="130" cy="170" r="13"/><circle cx="270" cy="170" r="13"/>
  </g>
  <!-- 天線 -->
  <path d="M200 88V64" stroke="#7b5cff" stroke-width="4.5" stroke-linecap="round"/>
  <circle class="breathe" cx="200" cy="56" r="15" fill="#c4b5ff" opacity="0.4"/>
  <circle cx="200" cy="56" r="7.5" fill="#fff"/>
  <!-- 護目鏡 -->
  <rect x="140" y="112" width="120" height="40" rx="20" fill="#0d0a2a" stroke="#7b5cff" stroke-width="3"/>
  <ellipse cx="180" cy="132" rx="15" ry="17" fill="#c4b5ff" opacity="0.35"/>
  <ellipse cx="220" cy="132" rx="15" ry="17" fill="#c4b5ff" opacity="0.35"/>
  <g class="blink" fill="#fff">
    <ellipse cx="180" cy="132" rx="10" ry="12"/>
    <ellipse cx="220" cy="132" rx="10" ry="12"/>
  </g>
  <!-- 吸入口漩渦 -->
  <circle cx="200" cy="182" r="22" fill="#0d0a2a" stroke="#7b5cff" stroke-width="3"/>
  <path class="spin" d="M200 166a16 16 0 1 1-16 16a11 11 0 1 1 11-11a6 6 0 1 1-6 6" fill="none" stroke="#c4b5ff" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#c4b5ff" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M168 168Q160 182 168 196M232 168Q240 182 232 196"/>
  </g>
  <!-- 漂浮粒子 -->
  <g class="float2" fill="#fff" opacity="0.8">
    <circle cx="70" cy="170" r="2"/><circle cx="330" cy="164" r="2"/><circle cx="150" cy="58" r="2"/><circle cx="252" cy="52" r="2.5"/>
  </g>
</svg>
