<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33270a"/>
      <stop offset="1" stop-color="#0d0a03"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcb3d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffcb3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.5" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#ffcb3d"/>
    </radialGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8f3d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8f3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ffcb3d" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .spin { animation: spin 6s linear infinite; transform-box: view-box; transform-origin: 200px 140px; }
    .orbit { stroke-dasharray: 30 18; animation: orbit 1.2s linear infinite; }
    .orbit.b { animation-duration: 0.9s; }
    .orbit.c { animation-duration: 0.6s; }
    .twinkle { animation: twinkle 2.6s ease-in-out infinite; }
    .d2 { animation-delay: -0.9s; }
    .d3 { animation-delay: -1.7s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes orbit { to { stroke-dashoffset: -96; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="200" cy="150" rx="165" ry="125" fill="url(#halo)"/>
  <!-- CPU 晶片：火花在上面原地空轉 -->
  <g stroke="#b88600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 206 L292 234 L200 262 L108 234 Z" fill="#2a1f05"/>
    <path d="M131 227 l-3 -10 M154 220 l-3 -10 M177 213 l-3 -10 M223 213 l3 -10 M246 220 l3 -10 M269 227 l3 -10 M269 241 l3 10 M246 248 l3 10 M223 255 l3 10 M177 255 l-3 10 M154 248 l-3 10 M131 241 l-3 10"/>
  </g>
  <ellipse cx="200" cy="232" rx="66" ry="20" fill="url(#heat)"/>
  <!-- 螺旋軌跡 -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="200" cy="226" rx="80" ry="20" stroke="#ffcb3d" stroke-width="10" stroke-opacity="0.18"/>
    <ellipse class="orbit" cx="200" cy="226" rx="80" ry="20" stroke="#ffcb3d" stroke-width="3"/>
    <ellipse class="orbit b" cx="200" cy="216" rx="58" ry="14" stroke="#ffe9a6" stroke-width="3"/>
    <ellipse class="orbit c" cx="200" cy="207" rx="36" ry="8" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- 火花身體 -->
  <g class="spin" stroke-linejoin="round">
    <path d="M200 78 L209 118 L228 112 L222 131 L262 140 L222 149 L228 168 L209 162 L200 202 L191 162 L172 168 L178 149 L138 140 L178 131 L172 112 L191 118 Z" fill="none" stroke="#ffcb3d" stroke-width="14" stroke-opacity="0.25"/>
    <path d="M200 78 L209 118 L228 112 L222 131 L262 140 L222 149 L228 168 L209 162 L200 202 L191 162 L172 168 L178 149 L138 140 L178 131 L172 112 L191 118 Z" fill="#ffcb3d" stroke="#ffe9a6" stroke-width="3.5"/>
  </g>
  <circle cx="200" cy="140" r="30" fill="url(#core)" stroke="#ffcb3d" stroke-width="3"/>
  <!-- 臉 -->
  <g fill="#2a1f05">
    <ellipse cx="189" cy="137" rx="4.5" ry="7"/>
    <ellipse cx="211" cy="137" rx="4.5" ry="7"/>
  </g>
  <g fill="#ffffff">
    <circle cx="190.5" cy="134" r="1.7"/>
    <circle cx="212.5" cy="134" r="1.7"/>
  </g>
  <g fill="#ff8f3d" opacity="0.6">
    <ellipse cx="181" cy="149" rx="4" ry="2.5"/>
    <ellipse cx="219" cy="149" rx="4" ry="2.5"/>
  </g>
  <path d="M195 151 q5 5 10 0" fill="none" stroke="#2a1f05" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 噴濺的火星 -->
  <g stroke="#ffcb3d" stroke-width="3" stroke-linecap="round">
    <path class="twinkle d2" d="M276 112 L298 100 M282 162 L306 172 M124 112 L102 100 M118 162 L94 172"/>
  </g>
  <g fill="#ffe9a6">
    <path class="twinkle" transform="translate(108 80)" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z"/>
    <path class="twinkle d3" transform="translate(300 72)" d="M0 -11 L3 -3 L11 0 L3 3 L0 11 L-3 3 L-11 0 L-3 -3 Z"/>
    <path class="twinkle d2" transform="translate(326 210)" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z"/>
    <path class="twinkle" transform="translate(70 206)" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z"/>
  </g>
  <g fill="#ffffff">
    <circle class="twinkle d3" cx="318" cy="132" r="2.5"/>
    <circle class="twinkle" cx="82" cy="136" r="2"/>
    <circle class="twinkle d2" cx="258" cy="60" r="2"/>
    <circle class="twinkle d3" cx="146" cy="56" r="2.5"/>
  </g>
</svg>
