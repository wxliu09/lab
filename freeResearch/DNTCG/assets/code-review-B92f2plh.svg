      <rect x="58" y="174" width="284" height="18" rx="4" fill="#ff4d6d" fill-opacity="0.18" stroke="none"/>
      <path d="M66 183H76" stroke="#ff4d6d" stroke-width="4"/>
      <path d="M108 183H190" stroke="#ff8fa3"/>
      <rect x="58" y="196" width="284" height="18" rx="4" fill="#2fd07a" fill-opacity="0.18" stroke="none"/>
      <path d="M66 205H76M71 200V210" stroke="#2fd07a" stroke-width="4"/>
      <path d="M108 205H160M172 205H254" stroke="#a6f5c9"/>
      <path d="M88 227H170" stroke="#ffc0dc" stroke-opacity="0.75"/>
    </g>
    <path id="bub" d="M-16 -13H16A8 8 0 0 1 24 -5V5A8 8 0 0 1 16 13H-4L-14 21L-12 13H-16A8 8 0 0 1 -24 5V-5A8 8 0 0 1 -16 -13Z"/>
    <g id="comment">
      <use href="#bub" fill="none" stroke="#ff5fa2" stroke-width="10" stroke-opacity="0.25"/>
      <use href="#bub" fill="#3a0f26" stroke="#ff5fa2" stroke-width="3"/>
      <g fill="#ffffff"><circle cx="-9" cy="0" r="2.6"/><circle cx="0" cy="0" r="2.6"/><circle cx="9" cy="0" r="2.6"/></g>
    </g>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .pop { animation: pop 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pop2 { animation-delay: -1.5s; }
    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes pop { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.06); } }
    @keyframes scan { 0%, 100% { transform: translateY(-46px); } 50% { transform: translateY(46px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="150" rx="175" ry="130" fill="url(#halo)"/>
  <rect x="50" y="56" width="300" height="190" rx="12" fill="none" stroke="#ff5fa2" stroke-width="12" stroke-opacity="0.2"/>
  <rect x="50" y="56" width="300" height="190" rx="12" fill="#22071a" stroke="#ff5fa2" stroke-width="3"/>
  <use href="#code"/>
  <path d="M241 176L296 231" stroke="#ff5fa2" stroke-width="26" stroke-opacity="0.22"/>
  <path d="M241 176L296 231" stroke="#ff5fa2" stroke-width="18"/>
  <path d="M244 179L293 228" stroke="#3a0f26" stroke-width="10"/>
  <circle cx="200" cy="135" r="56" fill="#0d0308"/>
  <g clip-path="url(#lens)">
