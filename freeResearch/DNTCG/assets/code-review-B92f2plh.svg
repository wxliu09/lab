<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0a22"/>
      <stop offset="1" stop-color="#0d0308"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ff5fa2" stroke-opacity="0.1"/>
    </pattern>
    <clipPath id="lens"><circle cx="200" cy="135" r="56"/></clipPath>
    <g id="code" fill="none" stroke-width="7">
      <path d="M88 73H210" stroke="#ffc0dc" stroke-opacity="0.75"/>
      <rect x="58" y="86" width="284" height="18" rx="4" fill="#ff4d6d" fill-opacity="0.18" stroke="none"/>
      <path d="M66 95H76" stroke="#ff4d6d" stroke-width="4"/>
      <path d="M88 95H250" stroke="#ff8fa3"/>
      <rect x="58" y="108" width="284" height="18" rx="4" fill="#2fd07a" fill-opacity="0.18" stroke="none"/>
      <path d="M66 117H76M71 112V122" stroke="#2fd07a" stroke-width="4"/>
      <path d="M88 117H236" stroke="#a6f5c9"/>
      <rect x="58" y="130" width="284" height="18" rx="4" fill="#2fd07a" fill-opacity="0.18" stroke="none"/>
      <path d="M66 139H76M71 134V144" stroke="#2fd07a" stroke-width="4"/>
