    <rect class="scan" x="140" y="131" width="120" height="8" fill="#ffffff" opacity="0.35"/>
  </g>
  <circle cx="200" cy="135" r="56" fill="#ff5fa2" fill-opacity="0.08" stroke="#ff5fa2" stroke-width="22" stroke-opacity="0.22"/>
  <circle cx="200" cy="135" r="56" fill="none" stroke="#ffc0dc" stroke-width="10"/>
