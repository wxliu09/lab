<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08331f"/>
      <stop offset="1" stop-color="#040d09"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd07a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2fd07a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#13804a"/>
      <stop offset="1" stop-color="#0b3d25"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#2fd07a" stroke-opacity="0.1"/>
    </pattern>
    <!-- 記憶體晶片 -->
    <symbol id="chip" viewBox="0 0 24 24">
      <path d="M8 1V5M12 1V5M16 1V5M8 19V23M12 19V23M16 19V23M1 8H5M1 12H5M1 16H5M19 8H23M19 12H23M19 16H23" stroke="#a6f5c9" stroke-width="2" stroke-linecap="round"/>
      <rect x="4" y="4" width="16" height="16" rx="3" fill="#2fd07a" stroke="#a6f5c9" stroke-width="1.5"/>
      <rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="#0b3d25"/>
      <circle cx="12" cy="12" r="1.8" fill="#ffffff"/>
    </symbol>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .glint { animation: breathe 1.6s ease-in-out infinite; }
    .fall { animation: fall 2.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
    .fall2 { animation: fall 2.8s ease-in -1.4s infinite; transform-box: fill-box; transform-origin: center; }
    .wobble { animation: wobble 3s ease-in-out infinite; transform-box: view-box; transform-origin: 200px 250px; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes fall { 0% { transform: translateY(-6px) rotate(0deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(34px) rotate(80deg); opacity: 0; } }
    @keyframes wobble { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="160" rx="160" ry="120" fill="url(#halo)"/>
  <ellipse cx="200" cy="256" rx="110" ry="8" fill="#2fd07a" opacity="0.22"/>

  <g class="wobble" stroke-linecap="round" stroke-linejoin="round">
    <!-- 耳朵 -->
    <circle cx="156" cy="84" r="17" fill="#0b3d25" stroke="#2fd07a" stroke-width="3.5"/>
    <circle cx="244" cy="84" r="17" fill="#0b3d25" stroke="#2fd07a" stroke-width="3.5"/>
    <circle cx="156" cy="84" r="8" fill="#2fd07a" opacity="0.6"/>
    <circle cx="244" cy="84" r="8" fill="#2fd07a" opacity="0.6"/>
    <!-- 身體 -->
    <ellipse cx="200" cy="212" rx="68" ry="44" fill="none" stroke="#2fd07a" stroke-width="13" stroke-opacity="0.2"/>
    <ellipse cx="200" cy="212" rx="68" ry="44" fill="url(#fur)" stroke="#2fd07a" stroke-width="3.5"/>
    <ellipse cx="200" cy="222" rx="42" ry="28" fill="#13804a" opacity="0.7"/>
    <ellipse cx="174" cy="254" rx="14" ry="6" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <ellipse cx="226" cy="254" rx="14" ry="6" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <!-- 頭 -->
    <ellipse cx="200" cy="128" rx="58" ry="50" fill="none" stroke="#2fd07a" stroke-width="13" stroke-opacity="0.2"/>
    <ellipse cx="200" cy="128" rx="58" ry="50" fill="url(#fur)" stroke="#2fd07a" stroke-width="3.5"/>
    <!-- 塞滿晶片而鼓脹的臉頰 -->
    <circle cx="147" cy="150" r="32" fill="#0f5a35" stroke="#2fd07a" stroke-width="3.5"/>
    <circle cx="253" cy="150" r="32" fill="#0f5a35" stroke="#2fd07a" stroke-width="3.5"/>
    <g class="glint">
      <use href="#chip" x="128" y="134" width="20" height="20" transform="rotate(-15 138 144)"/>
      <use href="#chip" x="146" y="148" width="18" height="18" transform="rotate(12 155 157)"/>
      <use href="#chip" x="130" y="158" width="14" height="14"/>
      <use href="#chip" x="250" y="134" width="20" height="20" transform="rotate(15 260 144)"/>
      <use href="#chip" x="236" y="150" width="18" height="18" transform="rotate(-10 245 159)"/>
      <use href="#chip" x="256" y="158" width="14" height="14"/>
    </g>
    <!-- 臉 -->
    <circle cx="180" cy="116" r="9.5" fill="#04140b" stroke="#a6f5c9" stroke-width="2"/>
    <circle cx="220" cy="116" r="9.5" fill="#04140b" stroke="#a6f5c9" stroke-width="2"/>
    <circle cx="183" cy="112" r="3.5" fill="#ffffff"/>
    <circle cx="223" cy="112" r="3.5" fill="#ffffff"/>
    <circle cx="177" cy="120" r="1.5" fill="#ffffff"/>
    <circle cx="217" cy="120" r="1.5" fill="#ffffff"/>
    <ellipse cx="200" cy="133" rx="5" ry="3.5" fill="#a6f5c9"/>
    <path d="M191 140 Q195.5 146 200 140 Q204.5 146 209 140" fill="none" stroke="#a6f5c9" stroke-width="2.5"/>
    <!-- 懷裡抱著的一堆晶片 -->
    <use href="#chip" x="163" y="202" width="26" height="26"/>
    <use href="#chip" x="187" y="202" width="26" height="26"/>
    <use href="#chip" x="211" y="202" width="26" height="26"/>
    <use href="#chip" x="175" y="180" width="26" height="26"/>
    <use href="#chip" x="199" y="180" width="26" height="26"/>
    <use href="#chip" x="187" y="160" width="26" height="26" transform="rotate(-8 200 173)"/>
    <!-- 小爪子 -->
    <ellipse cx="160" cy="210" rx="10" ry="8" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <ellipse cx="240" cy="210" rx="10" ry="8" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
  </g>

  <!-- 記太多：溢出掉落的晶片 -->
  <use class="fall" href="#chip" x="282" y="196" width="22" height="22"/>
  <use class="fall2" href="#chip" x="100" y="214" width="18" height="18"/>
  <g class="glint" fill="#a6f5c9">
    <path d="M300 168 L303 177 L312 180 L303 183 L300 192 L297 183 L288 180 L297 177 Z"/>
    <circle cx="96" cy="84" r="2.5"/>
    <circle cx="320" cy="98" r="2"/>
    <circle cx="80" cy="168" r="2"/>
  </g>
</svg>
