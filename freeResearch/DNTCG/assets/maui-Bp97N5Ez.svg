<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22283a"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4dae6" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#a8b0c2" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a8b0c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e7f0" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#a8b0c2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e3e7f0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6378"/>
      <stop offset="1" stop-color="#e3e7f0"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#a8b0c2" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .blink { animation: blink 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .orbit { stroke-dasharray: 6 14; animation: orbit 6s linear infinite; }
    .link { stroke-dasharray: 4 12; animation: link 1.2s linear infinite; }
    .rays { animation: spin 30s linear infinite; transform-origin: 200px 142px; }
    .bob { animation: bob 4s ease-in-out infinite; }
    .bob2 { animation: bob 4s ease-in-out -2s infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @keyframes orbit { to { stroke-dashoffset: -200; } }
    @keyframes link { to { stroke-dashoffset: -32; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="145" rx="200" ry="150" fill="url(#halo)"/>
  <!-- 中心放射光 -->
  <g class="rays" stroke="#e3e7f0" stroke-width="2" stroke-linecap="round" opacity="0.18">
    <path d="M200 52V22M200 232V262M110 142H80M290 142H320M136 78L115 57M264 78L285 57M136 206L115 227M264 206L285 227"/>
  </g>
  <ellipse class="orbit" cx="200" cy="148" rx="162" ry="100" fill="none" stroke="#e3e7f0" stroke-width="2" opacity="0.5"/>
  <!-- 中心連到四個裝置 -->
  <g fill="none" stroke-linecap="round">
    <path d="M140 112L98 100M260 112L302 98M140 178L114 200M260 178L288 196" stroke="#e3e7f0" stroke-width="9" stroke-opacity="0.15"/>
    <path d="M140 112L98 100M260 112L302 98M140 178L114 200M260 178L288 196" stroke="#a8b0c2" stroke-width="2.5"/>
    <path class="link" d="M140 112L98 100M260 112L302 98M140 178L114 200M260 178L288 196" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- 手機 -->
  <g class="bob">
    <rect x="60" y="66" width="36" height="64" rx="7" fill="#1c2130" stroke="#e3e7f0" stroke-width="3"/>
    <rect x="64" y="74" width="28" height="48" rx="2" fill="#0d0f16"/>
    <path d="M73 70H83" stroke="#a8b0c2" stroke-width="2" stroke-linecap="round"/>
    <g fill="#fff"><rect x="68" y="90" width="7" height="7" rx="1.5"/><rect x="81" y="90" width="7" height="7" rx="1.5"/></g>
    <path d="M72 106Q78 110 84 106" fill="none" stroke="#a8b0c2" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 手錶 -->
  <g class="bob2">
    <rect x="312" y="62" width="20" height="68" rx="5" fill="#2a3044" stroke="#5b6378" stroke-width="2"/>
    <rect x="302" y="76" width="40" height="40" rx="11" fill="#1c2130" stroke="#e3e7f0" stroke-width="3"/>
    <rect x="342" y="90" width="4" height="10" rx="1.5" fill="#e3e7f0"/>
    <g fill="#fff"><rect x="311" y="89" width="7" height="7" rx="1.5"/><rect x="326" y="89" width="7" height="7" rx="1.5"/></g>
    <path d="M316 104Q322 108 328 104" fill="none" stroke="#a8b0c2" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 平板 -->
  <g class="bob2">
    <rect x="46" y="180" width="68" height="50" rx="6" fill="#1c2130" stroke="#e3e7f0" stroke-width="3"/>
    <rect x="52" y="186" width="56" height="38" rx="2" fill="#0d0f16"/>
    <g fill="#fff"><rect x="65" y="196" width="8" height="8" rx="1.5"/><rect x="87" y="196" width="8" height="8" rx="1.5"/></g>
    <path d="M73 212Q80 216 87 212" fill="none" stroke="#a8b0c2" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 筆電 -->
  <g class="bob">
    <rect x="288" y="178" width="64" height="44" rx="4" fill="#1c2130" stroke="#e3e7f0" stroke-width="3"/>
    <rect x="294" y="184" width="52" height="32" rx="2" fill="#0d0f16"/>
    <path d="M278 222H362L356 232H284Z" fill="#2a3044" stroke="#e3e7f0" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#fff"><rect x="305" y="191" width="8" height="8" rx="1.5"/><rect x="327" y="191" width="8" height="8" rx="1.5"/></g>
    <path d="M313 206Q320 210 327 206" fill="none" stroke="#a8b0c2" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 中心：同一張視窗臉，最終型 -->
  <rect x="134" y="84" width="132" height="116" rx="16" fill="none" stroke="#e3e7f0" stroke-width="16" stroke-opacity="0.22"/>
  <rect x="134" y="84" width="132" height="116" rx="16" fill="#1c2130"/>
  <rect x="134" y="84" width="132" height="116" rx="16" fill="url(#glass)" stroke="#e3e7f0" stroke-width="3.5"/>
  <path d="M136 106V100Q136 86 150 86H250Q264 86 264 100V106Z" fill="url(#title)" opacity="0.9"/>
  <g fill="#1c2130" stroke="#fff" stroke-width="1.5">
    <rect x="213" y="90" width="12" height="12" rx="4"/><rect x="229" y="90" width="12" height="12" rx="4"/><rect x="245" y="90" width="12" height="12" rx="4"/>
  </g>
  <g fill="#e3e7f0" opacity="0.3"><rect x="160" y="118" width="30" height="30" rx="6"/><rect x="210" y="118" width="30" height="30" rx="6"/></g>
  <g class="blink">
    <rect x="165" y="123" width="20" height="20" rx="4" fill="#fff"/>
    <rect x="215" y="123" width="20" height="20" rx="4" fill="#fff"/>
    <rect x="174" y="130" width="7" height="7" rx="1.5" fill="#1c2130"/>
    <rect x="224" y="130" width="7" height="7" rx="1.5" fill="#1c2130"/>
  </g>
  <rect x="174" y="162" width="52" height="20" rx="10" fill="#5b6378" stroke="#fff" stroke-width="1.5"/>
  <path d="M186 172H214" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <g class="breathe" fill="#fff"><circle cx="140" cy="112" r="4"/><circle cx="260" cy="112" r="4"/><circle cx="140" cy="178" r="4"/><circle cx="260" cy="178" r="4"/></g>
</svg>
