<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08331f"/>
      <stop offset="1" stop-color="#040d09"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd07a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2fd07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3d25"/>
      <stop offset="0.6" stop-color="#13804a"/>
      <stop offset="1" stop-color="#0b3d25"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#2fd07a" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .flow { animation: flow 1.5s linear infinite; }
    .flow2 { animation: flow2 1.5s linear infinite; }
    .drop { animation: drop 2.4s ease-in infinite; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: -0.8s; }
    .d3 { animation-delay: -1.6s; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -34; } }
    @keyframes flow2 { from { stroke-dashoffset: -20; } to { stroke-dashoffset: -54; } }
    @keyframes drop { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(46px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="150" rx="170" ry="125" fill="url(#halo)"/>
  <ellipse cx="200" cy="250" rx="120" ry="8" fill="#2fd07a" opacity="0.22"/>

  <!-- 同一個圓柱角色，長高了 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="180" cy="238" rx="14" ry="7" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <ellipse cx="220" cy="238" rx="14" ry="7" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <path d="M150 72 L150 222 A50 14 0 0 0 250 222 L250 72 Z" fill="none" stroke="#2fd07a" stroke-width="14" stroke-opacity="0.22"/>
    <path d="M150 72 L150 222 A50 14 0 0 0 250 222 L250 72 Z" fill="url(#body)" stroke="#2fd07a" stroke-width="3.5"/>
    <path d="M150 150 A50 14 0 0 0 250 150 M150 186 A50 14 0 0 0 250 186" fill="none" stroke="#2fd07a" stroke-width="3"/>
    <ellipse cx="200" cy="72" rx="50" ry="14" fill="#2fd07a" stroke="#a6f5c9" stroke-width="3"/>
    <ellipse cx="191" cy="69" rx="24" ry="4" fill="#a6f5c9" opacity="0.5"/>
    <!-- 臉 -->
    <path d="M174 90 L192 94 M208 94 L226 90" fill="none" stroke="#a6f5c9" stroke-width="3.5"/>
    <ellipse cx="184" cy="104" rx="6" ry="7" fill="#ffffff"/>
    <ellipse cx="216" cy="104" rx="6" ry="7" fill="#ffffff"/>
    <circle cx="185" cy="105" r="3.2" fill="#04140b"/>
    <circle cx="217" cy="105" r="3.2" fill="#04140b"/>
    <circle cx="216" cy="104" r="12.5" fill="#a6f5c9" fill-opacity="0.15" stroke="#a6f5c9" stroke-width="2.5"/>
    <path d="M208 99 L212 95" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M228 110 Q240 124 238 142" fill="none" stroke="#a6f5c9" stroke-width="1.8" stroke-dasharray="2 4"/>
    <path d="M187 119 Q193 114 200 118 Q207 114 213 119" fill="none" stroke="#a6f5c9" stroke-width="3"/>
    <!-- 雙手舉起 -->
    <path d="M150 140 L102 128 M250 140 L298 128" fill="none" stroke="#2fd07a" stroke-width="4.5"/>
  </g>

  <!-- 兩手之間流動的資料鏈 -->
  <g fill="none" stroke-linecap="round">
    <path d="M100 132 Q200 262 300 132" stroke="#2fd07a" stroke-width="22" stroke-opacity="0.15"/>
    <path class="flow" d="M100 132 Q200 262 300 132" stroke="#2fd07a" stroke-width="11" stroke-dasharray="12 22"/>
    <path class="flow" d="M100 132 Q200 262 300 132" stroke="#0b2a1b" stroke-width="4" stroke-dasharray="12 22"/>
    <path class="flow2" d="M100 132 Q200 262 300 132" stroke="#a6f5c9" stroke-width="4" stroke-dasharray="5 29" stroke-dashoffset="-20"/>
  </g>
  <g stroke-linecap="round">
    <circle cx="98" cy="128" r="8" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
    <circle cx="302" cy="128" r="8" fill="#13804a" stroke="#2fd07a" stroke-width="3"/>
  </g>

  <!-- 被篩掉的資料往下掉 -->
  <g fill="#a6f5c9">
    <circle class="drop" cx="160" cy="190" r="3.5"/>
    <circle class="drop d2" cx="214" cy="200" r="3"/>
    <circle class="drop d3" cx="250" cy="182" r="3.5"/>
  </g>
  <!-- 通過篩選的資料 -->
  <g class="breathe" fill="#ffffff">
    <circle cx="80" cy="96" r="3"/>
    <circle cx="70" cy="110" r="2"/>
    <circle cx="320" cy="96" r="3"/>
    <circle cx="332" cy="110" r="2"/>
  </g>
</svg>
