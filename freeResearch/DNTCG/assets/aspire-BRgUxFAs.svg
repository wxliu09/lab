<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#073a40"/>
      <stop offset="1" stop-color="#030d0f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fe0e6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2fe0e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#107780"/>
      <stop offset="1" stop-color="#0b3d44"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#2fe0e6" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 3s ease-in-out infinite; }
    .b2 { animation-delay: -0.75s; }
    .b3 { animation-delay: -1.5s; }
    .b4 { animation-delay: -2.25s; }
    .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="200" cy="160" rx="190" ry="140" fill="url(#halo)"/>
  <ellipse cx="200" cy="246" rx="150" ry="10" fill="#2fe0e6" opacity="0.22"/>
  <!-- 背後的儀表板弧 -->
  <g fill="none">
    <path d="M97.8 106 A118 118 0 0 1 302.2 106" stroke="#2fe0e6" stroke-width="10" stroke-dasharray="2 11" stroke-opacity="0.6"/>
    <path d="M108.2 112 A106 106 0 0 1 291.8 112" stroke="#0f8f99" stroke-width="2.5"/>
  </g>
  <!-- 星座連線：服務節點與檢查點 -->
  <g class="flow" fill="none" stroke="#b0f7f9" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M52 190 L62 110 M62 80 L122 62 M278 62 L340 76 M340 104 L350 186 M52 212 Q200 280 350 214 M80 124 L62 106 M320 124 L340 104"/>
  </g>
  <!-- 服務節點 -->
  <g class="breathe" stroke="#b0f7f9" stroke-width="1.5" stroke-linejoin="round">
    <path d="M62 80 L76 87 L62 94 L48 87 Z" fill="#b0f7f9"/>
    <path d="M48 87 L62 94 L62 110 L48 103 Z" fill="#2fe0e6"/>
    <path d="M62 94 L76 87 L76 103 L62 110 Z" fill="#0f8f99"/>
  </g>
  <g class="breathe b2" stroke="#b0f7f9" stroke-width="1.5">
    <path d="M326 80 V100 A14 5 0 0 0 354 100 V80 Z" fill="#0f8f99"/>
    <path d="M326 90 A14 5 0 0 0 354 90" fill="none"/>
    <ellipse cx="340" cy="80" rx="14" ry="5" fill="#b0f7f9"/>
  </g>
  <path class="breathe b3" d="M38 210 C30 210 30 198 38 197 C38 188 50 185 54 192 C58 184 70 186 68 197 C76 197 76 210 68 210 Z" fill="#2fe0e6" stroke="#b0f7f9" stroke-width="1.5" stroke-linejoin="round"/>
  <g class="breathe b4">
    <path d="M364 200 L357 212 L343 212 L336 200 L343 188 L357 188 Z" fill="#0f8f99" stroke="#2fe0e6" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="350" cy="200" r="4" fill="#b0f7f9"/>
  </g>
  <!-- Durable Functions 留下來的檢查點旗標 -->
  <g stroke="#b0f7f9" stroke-width="2" stroke-linecap="round">
    <path d="M122 55 V38 M278 55 V38"/>
  </g>
  <g fill="#2fe0e6" stroke="#b0f7f9" stroke-width="1.5" stroke-linejoin="round">
    <path class="breathe b2" d="M122 38 H136 L132 43 L136 48 H122 Z"/>
    <path class="breathe b4" d="M278 38 H292 L288 43 L292 48 H278 Z"/>
    <circle cx="122" cy="62" r="7"/>
    <circle cx="278" cy="62" r="7"/>
  </g>
  <!-- 雲之指揮家 -->
  <g class="float">
    <g fill="none" stroke-linecap="round">
      <path d="M120 182 C98 170 86 150 80 128 M280 182 C302 170 314 150 320 128" stroke="#2fe0e6" stroke-width="30" stroke-opacity="0.18"/>
      <path d="M120 182 C98 170 86 150 80 128 M280 182 C302 170 314 150 320 128" stroke="#2fe0e6" stroke-width="22"/>
      <path d="M120 182 C98 170 86 150 80 128 M280 182 C302 170 314 150 320 128" stroke="#0e5a62" stroke-width="15"/>
    </g>
    <g stroke="#ffffff" stroke-width="2">
      <circle class="breathe" cx="80" cy="122" r="8" fill="#b0f7f9"/>
      <circle class="breathe b3" cx="320" cy="122" r="8" fill="#b0f7f9"/>
    </g>
    <g stroke-linejoin="round">
      <path d="M118 232 C82 232 76 190 106 180 C98 142 136 122 160 138 C166 98 236 92 248 132 C276 116 314 140 302 176 C330 184 326 232 290 232 Z" fill="none" stroke="#2fe0e6" stroke-width="14" stroke-opacity="0.22"/>
      <path d="M118 232 C82 232 76 190 106 180 C98 142 136 122 160 138 C166 98 236 92 248 132 C276 116 314 140 302 176 C330 184 326 232 290 232 Z" fill="url(#body)" stroke="#2fe0e6" stroke-width="3.5"/>
      <path d="M112 170 C116 160 126 154 136 156 M180 114 C194 104 214 104 228 114 M262 140 C274 136 286 142 290 150" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.75"/>
    </g>
    <!-- 同一張雲臉，眉線上揚顯得威嚴 -->
    <g stroke="#b0f7f9" stroke-width="3" stroke-linecap="round">
      <path d="M168 155 L187 159 M232 155 L213 159"/>
    </g>
    <g fill="#ffffff">
      <ellipse cx="178" cy="171" rx="7" ry="8.5"/>
      <ellipse cx="222" cy="171" rx="7" ry="8.5"/>
    </g>
    <g fill="#b0f7f9" opacity="0.35">
      <ellipse cx="163" cy="187" rx="6" ry="3.5"/>
      <ellipse cx="237" cy="187" rx="6" ry="3.5"/>
    </g>
    <path d="M191 192 q9 6 18 0" fill="none" stroke="#b0f7f9" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
