<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33270a"/>
      <stop offset="1" stop-color="#0d0a03"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcb3d" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffcb3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.5" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#ffcb3d"/>
    </radialGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4d08"/>
      <stop offset="1" stop-color="#2a1f05"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ffcb3d" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 4s ease-in-out infinite; }
    .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow { animation: flow 2.4s linear infinite; }
    .flow.slow { animation-duration: 3.6s; }
    .d2 { animation-delay: -1.3s; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes flow { to { stroke-dashoffset: -54; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="140" rx="185" ry="135" fill="url(#halo)"/>
  <!-- 平穩流動的時間軸 -->
  <g fill="none" stroke-linecap="round">
    <path class="flow" d="M-20 236 H420" stroke="#ffcb3d" stroke-width="3" stroke-dasharray="40 14" stroke-opacity="0.8"/>
    <path class="flow slow" d="M-20 252 H420" stroke="#b88600" stroke-width="2.5" stroke-dasharray="18 9"/>
    <path d="M110 226 V246 M118 226 V246 M282 226 V246 M290 226 V246" stroke="#ffe9a6" stroke-width="3"/>
  </g>
  <g class="float">
    <!-- 閃電羽翼 -->
    <g fill="none" stroke-linecap="round">
      <path d="M186 122 C150 92 110 70 58 66 M184 134 C145 118 105 116 50 122 M182 148 C150 148 115 162 66 182 M214 122 C250 92 290 70 342 66 M216 134 C255 118 295 116 350 122 M218 148 C250 148 285 162 334 182" stroke="#ffcb3d" stroke-width="12" stroke-opacity="0.22"/>
      <path d="M186 122 C150 92 110 70 58 66 M184 134 C145 118 105 116 50 122 M182 148 C150 148 115 162 66 182 M214 122 C250 92 290 70 342 66 M216 134 C255 118 295 116 350 122 M218 148 C250 148 285 162 334 182" stroke="#ffcb3d" stroke-width="3.5"/>
      <path d="M170 116 C140 96 110 84 80 80 M230 116 C260 96 290 84 320 80" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
    </g>
    <g fill="#ffe9a6">
      <path class="breathe" transform="translate(58 66)" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z"/>
      <path class="breathe d2" transform="translate(342 66)" d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z"/>
      <circle class="breathe d2" cx="50" cy="122" r="3.5"/>
      <circle class="breathe" cx="350" cy="122" r="3.5"/>
      <circle class="breathe" cx="66" cy="182" r="3"/>
      <circle class="breathe d2" cx="334" cy="182" r="3"/>
    </g>
    <!-- 閃電軀幹 -->
    <g stroke-linejoin="round">
      <path d="M184 118 L220 118 L206 160 L230 160 L196 262 L203 184 L178 184 Z" fill="none" stroke="#ffcb3d" stroke-width="14" stroke-opacity="0.25"/>
      <path d="M184 118 L220 118 L206 160 L230 160 L196 262 L203 184 L178 184 Z" fill="url(#torso)" stroke="#ffcb3d" stroke-width="3.5"/>
      <path d="M200 126 L192 172 L214 170 L200 236" fill="none" stroke="#ffe9a6" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- 胸口沙漏：等待但不阻塞 -->
    <circle cx="200" cy="148" r="14" fill="#1a1303" stroke="#ffe9a6" stroke-width="2.5"/>
    <path d="M193 140 H207 L200 148 L207 156 H193 L200 148 Z" fill="#ffe9a6"/>
    <path d="M196 156 L200 151 L204 156 Z" fill="#ffffff"/>
    <!-- 頭部：Thread 那顆火花長大後的樣子 -->
    <g stroke-linejoin="round">
      <path d="M200 42 L208 72 L231 61 L220 84 L240 92 L220 100 L224 116 L208 112 L200 124 L192 112 L176 116 L180 100 L160 92 L180 84 L169 61 L192 72 Z" fill="none" stroke="#ffcb3d" stroke-width="14" stroke-opacity="0.25"/>
      <path d="M200 42 L208 72 L231 61 L220 84 L240 92 L220 100 L224 116 L208 112 L200 124 L192 112 L176 116 L180 100 L160 92 L180 84 L169 61 L192 72 Z" fill="#ffcb3d" stroke="#ffe9a6" stroke-width="3.5"/>
    </g>
    <circle cx="200" cy="92" r="28" fill="url(#core)" stroke="#ffcb3d" stroke-width="3"/>
    <path d="M183 80 L195 83 M217 80 L205 83" stroke="#b88600" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#2a1f05">
      <ellipse cx="190" cy="91" rx="4.2" ry="5.8"/>
      <ellipse cx="210" cy="91" rx="4.2" ry="5.8"/>
    </g>
    <g fill="#ffffff">
      <circle cx="191.4" cy="88.5" r="1.6"/>
      <circle cx="211.4" cy="88.5" r="1.6"/>
    </g>
    <g fill="#ff8f3d" opacity="0.55">
      <ellipse cx="182" cy="101" rx="3.8" ry="2.3"/>
      <ellipse cx="218" cy="101" rx="3.8" ry="2.3"/>
    </g>
    <path d="M194 103 q6 4 12 0" fill="none" stroke="#2a1f05" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
