<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33270a"/>
      <stop offset="1" stop-color="#0d0a03"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcb3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffcb3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.5" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#ffcb3d"/>
    </radialGradient>
    <radialGradient id="mouth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#ffcb3d"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ffcb3d" stroke-opacity="0.1"/>
    </pattern>
    <!-- 帶 <T> 的貨物方塊，原點在底邊中央 -->
    <g id="box" transform="rotate(-17.1)" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-15" y="-30" width="30" height="30" rx="4" fill="none" stroke="#ffcb3d" stroke-width="9" stroke-opacity="0.22"/>
      <rect x="-15" y="-30" width="30" height="30" rx="4" fill="#4a3606" stroke="#ffcb3d" stroke-width="2.5"/>
      <path d="M-6 -21 L-10 -15 L-6 -9 M6 -21 L10 -15 L6 -9 M-3 -19 H3 M0 -19 V-11" fill="none" stroke="#ffe9a6" stroke-width="2"/>
    </g>
  </defs>
  <style>
    .move { animation: move 6s linear infinite; }
    .m2 { animation-delay: -1.5s; }
    .m3 { animation-delay: -3s; }
    .m4 { animation-delay: -4.5s; }
    .flow { animation: flow 0.8s linear infinite; }
    .breathe { animation: breathe 3s ease-in-out infinite; }
    @keyframes move {
      0% { transform: translate(0, 0); opacity: 0; }
      8% { opacity: 1; }
      88% { opacity: 1; }
      100% { transform: translate(234px, -72px); opacity: 0; }
    }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes breathe { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="200" cy="160" rx="180" ry="120" fill="url(#halo)"/>
  <ellipse cx="200" cy="258" rx="170" ry="8" fill="#ffcb3d" opacity="0.2"/>
  <!-- 支架 -->
  <g stroke="#b88600" stroke-width="6" stroke-linecap="round">
    <path d="M140 206 V256 M260 169 V256 M40 196 V256"/>
    <path d="M140 226 L260 196" stroke-width="3"/>
  </g>
  <!-- 消費者：接收口，旁邊的刻度顯示 BoundedChannel 快滿了 -->
  <g stroke-linejoin="round">
    <rect x="320" y="62" width="48" height="92" rx="10" fill="none" stroke="#ffcb3d" stroke-width="12" stroke-opacity="0.2"/>
    <rect x="320" y="62" width="48" height="92" rx="10" fill="#2a1f05" stroke="#ffcb3d" stroke-width="3"/>
  </g>
  <ellipse class="breathe" cx="326" cy="110" rx="9" ry="28" fill="url(#mouth)"/>
  <g fill="#ffcb3d">
    <rect x="350" y="132" width="10" height="10" rx="2"/>
    <rect x="350" y="118" width="10" height="10" rx="2"/>
    <rect x="350" y="104" width="10" height="10" rx="2"/>
    <rect x="350" y="90" width="10" height="10" rx="2" fill="#4a3606" stroke="#b88600" stroke-width="1.5"/>
    <rect x="350" y="76" width="10" height="10" rx="2" fill="#4a3606" stroke="#b88600" stroke-width="1.5"/>
  </g>
  <!-- 輸送帶 -->
  <g stroke-linejoin="round">
    <path d="M70 203 L330 123 L330 147 L70 227 Z" fill="none" stroke="#ffcb3d" stroke-width="14" stroke-opacity="0.2"/>
    <path d="M70 203 L330 123 L330 147 L70 227 Z" fill="#2a1f05" stroke="#ffcb3d" stroke-width="3"/>
  </g>
  <path class="flow" d="M70 209 L330 129" fill="none" stroke="#ffcb3d" stroke-width="3" stroke-dasharray="8 12" stroke-linecap="round"/>
  <path d="M70 221 L330 141" fill="none" stroke="#b88600" stroke-width="2"/>
  <g fill="#4a3606" stroke="#ffcb3d" stroke-width="3">
    <circle cx="70" cy="215" r="14"/>
    <circle cx="330" cy="135" r="14"/>
  </g>
  <g fill="#ffe9a6">
    <circle cx="70" cy="215" r="4"/>
    <circle cx="330" cy="135" r="4"/>
  </g>
  <!-- 帶上移動的方塊 -->
  <g transform="translate(83 199)">
    <g class="move"><use href="#box"/></g>
    <g class="move m2"><use href="#box"/></g>
    <g class="move m3"><use href="#box"/></g>
    <g class="move m4"><use href="#box"/></g>
  </g>
  <!-- 生產者：一顆小火花站在台座上 -->
  <path d="M26 192 H62" stroke="#b88600" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(46 168) scale(1.1)" stroke-linejoin="round">
    <path d="M0 -18 L2.7 -6.5 L8.5 -8.5 L6.5 -2.7 L18 0 L6.5 2.7 L8.5 8.5 L2.7 6.5 L0 18 L-2.7 6.5 L-8.5 8.5 L-6.5 2.7 L-18 0 L-6.5 -2.7 L-8.5 -8.5 L-2.7 -6.5 Z" fill="none" stroke="#ffcb3d" stroke-width="8" stroke-opacity="0.25"/>
    <path d="M0 -18 L2.7 -6.5 L8.5 -8.5 L6.5 -2.7 L18 0 L6.5 2.7 L8.5 8.5 L2.7 6.5 L0 18 L-2.7 6.5 L-8.5 8.5 L-6.5 2.7 L-18 0 L-6.5 -2.7 L-8.5 -8.5 L-2.7 -6.5 Z" fill="#ffcb3d" stroke="#ffe9a6" stroke-width="2"/>
    <circle r="8.5" fill="url(#core)" stroke="#ffcb3d" stroke-width="1.5"/>
    <ellipse cx="-3" cy="-0.5" rx="1.6" ry="2.6" fill="#2a1f05"/>
    <ellipse cx="3" cy="-0.5" rx="1.6" ry="2.6" fill="#2a1f05"/>
  </g>
</svg>
