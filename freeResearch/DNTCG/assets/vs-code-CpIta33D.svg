<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2150"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#3b8cff" stroke-opacity="0.12"/>
    </pattern>
    <g id="ext">
      <path d="M-11 -11H11V-4A4 4 0 0 1 11 4V11H-11Z" fill="none" stroke="#3b8cff" stroke-width="10" stroke-opacity="0.3"/>
      <path d="M-11 -11H11V-4A4 4 0 0 1 11 4V11H-11Z" fill="#0b1f47" stroke="#a9cdff" stroke-width="2.5"/>
      <path d="M-5 0H5M0 -5V5" stroke="#ffffff" stroke-width="3"/>
    </g>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .fly { animation: fly 2.4s ease-in-out infinite; }
    .fly2 { animation-delay: -0.8s; }
    .fly3 { animation-delay: -1.6s; }
    .speed { animation: speed 0.9s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes fly { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @keyframes speed { to { stroke-dashoffset: -60; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="220" cy="150" rx="175" ry="125" fill="url(#halo)"/>
