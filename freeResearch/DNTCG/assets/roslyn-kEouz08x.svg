<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1150"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b7bff" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#7b5cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#7b5cff" stroke-opacity="0.12"/>
    </pattern>
    <!-- 樹葉：程式符號 -->
    <path id="brace" d="M-4-9Q-8-9-8-5V-2Q-8 0-11 0Q-8 0-8 2V5Q-8 9-4 9M4-9Q8-9 8-5V-2Q8 0 11 0Q8 0 8 2V5Q8 9 4 9"/>
    <path id="angle" d="M-4-7L-11 0L-4 7M4-7L11 0L4 7"/>
    <path id="semi" d="M0-6.5V-5.5M1 1.5Q1.5 7-3 9"/>
    <path id="star" d="M0-8L2-2L8 0L2 2L0 8L-2 2L-8 0L-2-2Z"/>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .twinkle { animation: breathe 2.4s ease-in-out -1.2s infinite; }
    .flow { stroke-dasharray: 10 30; animation: flow 1.6s linear infinite; }
    .ring { animation: spin 40s linear infinite; transform-origin: 200px 112px; }
    .rise { animation: rise 5s ease-in infinite; }
    .rise2 { animation: rise 6s ease-in -2.5s infinite; }
    .rise3 { animation: rise 4.5s ease-in -1.2s infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse class="breathe" cx="200" cy="125" rx="200" ry="150" fill="url(#halo)"/>
  <g class="ring" fill="none" stroke="#c4b5ff">
    <circle cx="200" cy="112" r="108" stroke-width="2" stroke-dasharray="2 10" opacity="0.5"/>
    <circle cx="200" cy="112" r="124" stroke-width="1.5" stroke-dasharray="40 16 4 16" opacity="0.3"/>
  </g>
  <ellipse cx="200" cy="256" rx="130" ry="10" fill="#7b5cff" opacity="0.35"/>
  <!-- 枝幹：語法樹的邊 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#c4b5ff" stroke-opacity="0.25" stroke-width="10">
      <path d="M200 175L145 140L100 118L62 108M100 118L78 150M145 140L140 92L112 64M200 175L255 140L300 118L338 108M300 118L322 150M255 140L260 92L288 64M200 175L200 118L180 78L165 52M200 118L220 78L235 52"/>
      <path d="M200 252L160 260L125 256M200 252L240 260L275 256M200 252V264"/>
    </g>
    <g stroke="#7b5cff" stroke-width="3.5">
      <path d="M200 175L145 140L100 118L62 108M100 118L78 150M145 140L140 92L112 64M200 175L255 140L300 118L338 108M300 118L322 150M255 140L260 92L288 64M200 175L200 118L180 78L165 52M200 118L220 78L235 52"/>
      <path d="M200 252L160 260L125 256M200 252L240 260L275 256M200 252V264"/>
    </g>
    <path d="M200 254C197 222 203 198 200 175" stroke="#c4b5ff" stroke-width="20" stroke-opacity="0.25"/>
    <path d="M200 254C197 222 203 198 200 175" stroke="#7b5cff" stroke-width="9"/>
    <path class="flow" d="M200 254C197 222 203 198 200 175" stroke="#fff" stroke-width="4"/>
  </g>
  <!-- 節點 -->
  <g fill="#0d0a2a" stroke="#c4b5ff" stroke-width="3">
    <circle cx="200" cy="175" r="10"/>
    <circle cx="145" cy="140" r="7"/><circle cx="255" cy="140" r="7"/><circle cx="200" cy="118" r="7"/>
    <circle cx="100" cy="118" r="6"/><circle cx="140" cy="92" r="6"/><circle cx="300" cy="118" r="6"/><circle cx="260" cy="92" r="6"/><circle cx="180" cy="78" r="6"/><circle cx="220" cy="78" r="6"/>
  </g>
  <g fill="#fff">
    <circle cx="200" cy="175" r="4.5"/>
    <circle cx="145" cy="140" r="3"/><circle cx="255" cy="140" r="3"/><circle cx="200" cy="118" r="3"/>
    <circle cx="100" cy="118" r="2.5"/><circle cx="140" cy="92" r="2.5"/><circle cx="300" cy="118" r="2.5"/><circle cx="260" cy="92" r="2.5"/><circle cx="180" cy="78" r="2.5"/><circle cx="220" cy="78" r="2.5"/>
  </g>
  <!-- 根部節點網路 -->
  <g fill="#c4b5ff"><circle cx="160" cy="260" r="3.5"/><circle cx="125" cy="256" r="3"/><circle cx="240" cy="260" r="3.5"/><circle cx="275" cy="256" r="3"/></g>
  <!-- 樹葉 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#c4b5ff" stroke-width="9" stroke-opacity="0.35">
      <use href="#brace" transform="translate(62 108) scale(1.2)"/>
      <use href="#semi" transform="translate(78 150) scale(1.2)"/>
      <use href="#angle" transform="translate(112 64) scale(1.2)"/>
      <use href="#semi" transform="translate(165 52) scale(1.2)"/>
      <use href="#brace" transform="translate(235 52) scale(1.2)"/>
      <use href="#angle" transform="translate(288 64) scale(1.2)"/>
      <use href="#brace" transform="translate(338 108) scale(1.2)"/>
      <use href="#semi" transform="translate(322 150) scale(1.2)"/>
    </g>
    <g class="breathe" stroke="#fff" stroke-width="3.2">
      <use href="#brace" transform="translate(62 108) scale(1.2)"/>
      <use href="#semi" transform="translate(78 150) scale(1.2)"/>
      <use href="#angle" transform="translate(112 64) scale(1.2)"/>
      <use href="#semi" transform="translate(165 52) scale(1.2)"/>
      <use href="#brace" transform="translate(235 52) scale(1.2)"/>
      <use href="#angle" transform="translate(288 64) scale(1.2)"/>
      <use href="#brace" transform="translate(338 108) scale(1.2)"/>
      <use href="#semi" transform="translate(322 150) scale(1.2)"/>
    </g>
  </g>
  <!-- 光點與往上飄的粒子 -->
  <g class="twinkle" fill="#fff">
    <use href="#star" transform="translate(60 60) scale(0.9)"/>
    <use href="#star" transform="translate(348 58) scale(0.7)"/>
    <use href="#star" transform="translate(200 40) scale(0.6)"/>
  </g>
  <g class="rise" fill="#c4b5ff"><circle cx="128" cy="230" r="3"/><circle cx="292" cy="214" r="2.5"/></g>
  <g class="rise2" fill="#fff"><circle cx="168" cy="216" r="2"/><circle cx="252" cy="236" r="2.5"/><circle cx="90" cy="196" r="2"/></g>
  <g class="rise3" fill="#c4b5ff"><circle cx="226" cy="206" r="2"/><circle cx="318" cy="240" r="2.5"/><rect x="146" y="240" width="4" height="4" transform="rotate(45 148 242)"/></g>
</svg>
