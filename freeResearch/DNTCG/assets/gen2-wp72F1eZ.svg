<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1150"/>
      <stop offset="1" stop-color="#07060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2690"/>
      <stop offset="1" stop-color="#170f40"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#7b5cff" stroke-opacity="0.12"/>
    </pattern>
    <g id="cube" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
      <path d="M0-11L10-5.5L0 0L-10-5.5Z" fill="#c4b5ff"/>
      <path d="M-10-5.5L0 0V11L-10 5.5Z" fill="#7b5cff"/>
      <path d="M10-5.5V5.5L0 11V0Z" fill="#512bd4"/>
    </g>
    <!-- 左臂與巨爪，右臂用鏡像重用 -->
    <g id="arm" stroke-linecap="round" stroke-linejoin="round">
      <path d="M112 152L62 176L58 206" fill="none" stroke="#7b5cff" stroke-width="24"/>
      <path d="M112 152L62 176L58 206" fill="none" stroke="#2a1a6e" stroke-width="15"/>
      <circle cx="62" cy="176" r="11" fill="#512bd4" stroke="#c4b5ff" stroke-width="2.5"/>
      <g fill="#2a1a6e" stroke="#7b5cff" stroke-width="3.5">
        <path d="M48 206Q28 220 32 250Q42 232 56 222Z"/>
        <path d="M56 212Q52 238 60 258Q70 238 68 214Z"/>
        <path d="M66 206Q86 214 92 242Q80 230 64 222Z"/>
      </g>
    </g>
    <g id="pad">
      <path d="M96 162Q98 120 134 112L142 146Q118 152 108 178Z" fill="#512bd4" stroke="#7b5cff" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="120" cy="136" r="3" fill="#c4b5ff"/>
    </g>
  </defs>
  <style>
    .breathe { animation: breathe 3.5s ease-in-out infinite; }
    .pulse { animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="200" cy="150" rx="190" ry="140" fill="url(#halo)"/>
  <!-- Stop-the-World：停住的時鐘光環 -->
  <g class="breathe" fill="none">
    <circle cx="200" cy="152" r="115" stroke="#c4b5ff" stroke-width="12" stroke-opacity="0.2"/>
    <circle cx="200" cy="152" r="115" stroke="#c4b5ff" stroke-width="3"/>
    <circle cx="200" cy="152" r="104" stroke="#c4b5ff" stroke-width="9" stroke-dasharray="3 51.45" transform="rotate(-90.8 200 152)"/>
  </g>
  <path d="M200 40V66" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="200" cy="252" rx="165" ry="12" fill="#7b5cff" opacity="0.3"/>
  <!-- 被凍結在半空中的物件（世界暫停，所以不動） -->
  <g opacity="0.8">
    <use href="#cube" transform="translate(48 96) scale(0.75)"/>
    <use href="#cube" transform="translate(352 92) scale(0.6)"/>
    <use href="#cube" transform="translate(358 150) scale(0.45)"/>
  </g>
  <g stroke="#c4b5ff" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M26 96H38M330 92H342M340 150H350"/>
  </g>
  <use href="#arm"/>
  <use href="#arm" transform="translate(400 0) scale(-1 1)"/>
  <!-- 履帶底座 -->
  <rect x="92" y="218" width="216" height="30" rx="15" fill="#1e1450" stroke="#7b5cff" stroke-width="3.5"/>
  <path d="M110 224V242M128 224V242M146 224V242M164 224V242M182 224V242M200 224V242M218 224V242M236 224V242M254 224V242M272 224V242M290 224V242" stroke="#512bd4" stroke-width="4" stroke-linecap="round"/>
  <!-- 身體 -->
  <path d="M102 224C102 132 146 66 200 66C254 66 298 132 298 224Z" fill="none" stroke="#7b5cff" stroke-width="14" stroke-opacity="0.28" stroke-linejoin="round"/>
  <path d="M102 224C102 132 146 66 200 66C254 66 298 132 298 224Z" fill="url(#body)" stroke="#7b5cff" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#512bd4" stroke="#c4b5ff" stroke-width="1.5" stroke-linejoin="round">
    <path d="M162 84L200 72L238 84V92L200 80L162 92Z"/>
    <path d="M112 172L134 162V214L108 220Z"/>
    <path d="M288 172L266 162V214L292 220Z"/>
  </g>
  <g fill="#c4b5ff"><circle cx="122" cy="182" r="2.5"/><circle cx="121" cy="204" r="2.5"/><circle cx="278" cy="182" r="2.5"/><circle cx="279" cy="204" r="2.5"/></g>
  <use href="#pad"/>
  <use href="#pad" transform="translate(400 0) scale(-1 1)"/>
  <!-- 雙天線 -->
  <path d="M174 76L156 50M226 76L244 50" stroke="#7b5cff" stroke-width="4.5" stroke-linecap="round"/>
  <g class="pulse" fill="#c4b5ff" opacity="0.45"><circle cx="154" cy="46" r="13"/><circle cx="246" cy="46" r="13"/></g>
  <g fill="#fff"><circle cx="154" cy="46" r="6.5"/><circle cx="246" cy="46" r="6.5"/></g>
  <!-- 銳利的橫條眼 -->
  <rect x="135" y="94" width="130" height="38" rx="12" fill="#0d0a2a" stroke="#7b5cff" stroke-width="3"/>
  <g stroke="#c4b5ff" stroke-width="9" stroke-opacity="0.4" stroke-linejoin="round" fill="#fff">
    <path d="M150 104L188 111L186 121L148 114Z"/>
    <path d="M250 104L212 111L214 121L252 114Z"/>
  </g>
  <g fill="#fff">
    <path d="M150 104L188 111L186 121L148 114Z"/>
    <path d="M250 104L212 111L214 121L252 114Z"/>
  </g>
  <!-- 吸入格柵 -->
  <rect x="165" y="140" width="70" height="26" rx="6" fill="#0d0a2a" stroke="#7b5cff" stroke-width="3"/>
  <path d="M174 148H226M174 153H226M174 158H226" stroke="#c4b5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- 胸口暫停符號 -->
  <polygon points="200,172 222,183 222,205 200,216 178,205 178,183" fill="#512bd4" stroke="#c4b5ff" stroke-width="2.5"/>
  <circle class="pulse" cx="200" cy="194" r="18" fill="#c4b5ff" opacity="0.4"/>
  <g fill="#fff"><rect x="190" y="184" width="6" height="20" rx="1.5"/><rect x="204" y="184" width="6" height="20" rx="1.5"/></g>
</svg>
