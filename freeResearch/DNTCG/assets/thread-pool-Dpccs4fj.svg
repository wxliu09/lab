<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33270a"/>
      <stop offset="1" stop-color="#0d0a03"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcb3d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffcb3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.5" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#ffcb3d"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ffcb3d" stroke-opacity="0.1"/>
    </pattern>
    <!-- 小火花：和 Thread 同一張臉 -->
    <g id="mini" stroke-linejoin="round">
      <path d="M0 -18 L2.7 -6.5 L8.5 -8.5 L6.5 -2.7 L18 0 L6.5 2.7 L8.5 8.5 L2.7 6.5 L0 18 L-2.7 6.5 L-8.5 8.5 L-6.5 2.7 L-18 0 L-6.5 -2.7 L-8.5 -8.5 L-2.7 -6.5 Z" fill="none" stroke="#ffcb3d" stroke-width="8" stroke-opacity="0.25"/>
      <path d="M0 -18 L2.7 -6.5 L8.5 -8.5 L6.5 -2.7 L18 0 L6.5 2.7 L8.5 8.5 L2.7 6.5 L0 18 L-2.7 6.5 L-8.5 8.5 L-6.5 2.7 L-18 0 L-6.5 -2.7 L-8.5 -8.5 L-2.7 -6.5 Z" fill="#ffcb3d" stroke="#ffe9a6" stroke-width="2"/>
      <circle r="8.5" fill="url(#core)" stroke="#ffcb3d" stroke-width="1.5"/>
      <ellipse cx="-3" cy="-0.5" rx="1.6" ry="2.6" fill="#2a1f05"/>
      <ellipse cx="3" cy="-0.5" rx="1.6" ry="2.6" fill="#2a1f05"/>
    </g>
  </defs>
  <style>
    .spin { animation: spin 7s linear infinite; transform-box: view-box; transform-origin: 200px 125px; }
    .flow { animation: flow 1s linear infinite; }
    .twinkle { animation: twinkle 2.8s ease-in-out infinite; }
    .d2 { animation-delay: -1s; }
    .d3 { animation-delay: -1.9s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flow { to { stroke-dashoffset: -48; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="200" cy="150" rx="175" ry="130" fill="url(#halo)"/>
  <!-- 環形跑道（池子） -->
  <g fill="none">
    <ellipse cx="200" cy="200" rx="150" ry="48" stroke="#ffcb3d" stroke-width="34" stroke-opacity="0.12"/>
    <ellipse cx="200" cy="200" rx="150" ry="48" stroke="#b88600" stroke-width="24"/>
    <ellipse cx="200" cy="200" rx="150" ry="48" stroke="#2a1f05" stroke-width="18"/>
    <ellipse class="flow" cx="200" cy="200" rx="150" ry="48" stroke="#ffcb3d" stroke-width="2.5" stroke-dasharray="10 14" stroke-linecap="round"/>
  </g>
  <!-- 互相傳遞工作的光線 -->
  <g class="flow" fill="none" stroke="#ffe9a6" stroke-width="2.5" stroke-dasharray="6 10" stroke-linecap="round" opacity="0.85">
    <path d="M200 125 L315 213 M200 125 L200 230 M200 125 L85 213 M200 125 L59 166 M200 125 L341 166 M200 125 L137 139 M200 125 L263 139"/>
  </g>
  <use href="#mini" transform="translate(137 139) scale(0.8)" opacity="0.7"/>
  <use href="#mini" transform="translate(263 139) scale(0.8)" opacity="0.7"/>
  <!-- 中央的大火花 -->
  <g class="spin" stroke-linejoin="round">
    <path d="M200 69 L209 103 L227 98 L222 116 L256 125 L222 134 L227 152 L209 147 L200 181 L191 147 L173 152 L178 134 L144 125 L178 116 L173 98 L191 103 Z" fill="none" stroke="#ffcb3d" stroke-width="14" stroke-opacity="0.25"/>
    <path d="M200 69 L209 103 L227 98 L222 116 L256 125 L222 134 L227 152 L209 147 L200 181 L191 147 L173 152 L178 134 L144 125 L178 116 L173 98 L191 103 Z" fill="#ffcb3d" stroke="#ffe9a6" stroke-width="3.5"/>
  </g>
  <circle cx="200" cy="125" r="27" fill="url(#core)" stroke="#ffcb3d" stroke-width="3"/>
  <g fill="#2a1f05">
    <ellipse cx="190" cy="122" rx="4.2" ry="6.5"/>
    <ellipse cx="210" cy="122" rx="4.2" ry="6.5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="191.4" cy="119" r="1.6"/>
    <circle cx="211.4" cy="119" r="1.6"/>
  </g>
  <g fill="#ff8f3d" opacity="0.6">
    <ellipse cx="182" cy="133" rx="3.8" ry="2.3"/>
    <ellipse cx="218" cy="133" rx="3.8" ry="2.3"/>
  </g>
  <path d="M195 135 q5 4.5 10 0" fill="none" stroke="#2a1f05" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 跑道前排的小火花 -->
  <use href="#mini" transform="translate(59 166)"/>
  <use href="#mini" transform="translate(341 166)"/>
  <use href="#mini" transform="translate(85 213)"/>
  <use href="#mini" transform="translate(315 213)"/>
  <use href="#mini" transform="translate(200 230)"/>
  <g fill="#ffffff">
    <circle class="twinkle" cx="96" cy="74" r="2.5"/>
    <circle class="twinkle d2" cx="306" cy="70" r="2.5"/>
    <circle class="twinkle d3" cx="350" cy="110" r="2"/>
    <circle class="twinkle d2" cx="52" cy="112" r="2"/>
  </g>
  <g fill="#ffe9a6">
    <path class="twinkle d3" transform="translate(140 60)" d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z"/>
    <path class="twinkle" transform="translate(268 52)" d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z"/>
  </g>
</svg>
