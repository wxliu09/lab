<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#073a40"/>
      <stop offset="1" stop-color="#030d0f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fe0e6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2fe0e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#2fe0e6" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#0f8f99" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0f8f99" stop-opacity="0.08"/>
    </radialGradient>
    <!-- 輪廓由上往下淡出，像是剛從虛空浮現 -->
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="0" y1="115" x2="0" y2="205">
      <stop offset="0" stop-color="#b0f7f9"/>
      <stop offset="0.6" stop-color="#2fe0e6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2fe0e6" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#2fe0e6" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .wake { animation: wake 4s ease-in-out infinite; }
    .ping { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .ping.d2 { animation-delay: -1.2s; }
    .rise { animation: rise 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .r2 { animation-delay: -1.2s; }
    .r3 { animation-delay: -2.4s; }
    @keyframes wake { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(2.3); opacity: 0; } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 40% { opacity: 0.9; } 100% { transform: translateY(-40px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="200" cy="155" rx="160" ry="120" fill="url(#halo)"/>
  <!-- 往上匯聚成雲的粒子 -->
  <g fill="#b0f7f9">
    <circle class="rise" cx="160" cy="246" r="3"/>
    <circle class="rise r2" cx="205" cy="254" r="2.5"/>
    <circle class="rise r3" cx="248" cy="240" r="3"/>
    <circle class="rise r2" cx="122" cy="226" r="2"/>
    <circle class="rise r3" cx="286" cy="230" r="2"/>
    <circle class="rise" cx="230" cy="262" r="2"/>
  </g>
  <g class="wake">
    <g stroke-linecap="round">
      <path d="M150 210 H180 M196 210 H226 M240 210 H256" stroke="#2fe0e6" stroke-width="3" stroke-opacity="0.4"/>
      <path d="M170 222 H190 M210 222 H232" stroke="#2fe0e6" stroke-width="3" stroke-opacity="0.2"/>
    </g>
    <g stroke-linejoin="round">
      <path d="M135 200 C112 200 108 170 130 164 C128 138 160 128 175 142 C182 112 228 110 238 138 C262 128 285 148 274 168 C296 172 292 200 268 200 Z" fill="none" stroke="#2fe0e6" stroke-width="12" stroke-opacity="0.2"/>
      <path d="M135 200 C112 200 108 170 130 164 C128 138 160 128 175 142 C182 112 228 110 238 138 C262 128 285 148 274 168 C296 172 292 200 268 200 Z" fill="url(#body)" stroke="url(#edge)" stroke-width="3.5"/>
      <path d="M150 150 C156 140 166 138 172 144 M190 126 C200 118 214 118 222 126" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
    </g>
    <!-- 半睜的眼睛：剛被叫醒 -->
    <g stroke="#b0f7f9" stroke-width="3" stroke-linecap="round">
      <path d="M177 167 H191 M209 167 H223"/>
    </g>
    <g fill="#ffffff">
      <path d="M178 167 A6 5 0 0 0 190 167 Z"/>
      <path d="M210 167 A6 5 0 0 0 222 167 Z"/>
    </g>
    <g fill="#b0f7f9" opacity="0.35">
      <ellipse cx="172" cy="181" rx="5" ry="3"/>
      <ellipse cx="228" cy="181" rx="5" ry="3"/>
    </g>
    <ellipse cx="200" cy="184" rx="3.5" ry="4.5" fill="#062a2f" stroke="#b0f7f9" stroke-width="1.5"/>
  </g>
  <!-- 頭上的觸發通知 -->
  <g fill="none" stroke="#b0f7f9" stroke-width="2">
    <circle class="ping" cx="200" cy="92" r="16"/>
    <circle class="ping d2" cx="200" cy="92" r="16"/>
  </g>
  <circle cx="200" cy="92" r="16" fill="#0b3d44" stroke="#b0f7f9" stroke-width="2.5"/>
  <path d="M203 80 L192 95 H200 L196 105 L209 89 H201 Z" fill="#ffcb3d" stroke="#ffe9a6" stroke-width="1" stroke-linejoin="round"/>
</svg>
