<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a08"/>
      <stop offset="1" stop-color="#0d0603"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8f3d" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff8f3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ingot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffd0a8"/>
      <stop offset="1" stop-color="#ff8f3d"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#ff8f3d" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <style>
    .breathe { animation: breathe 2.4s ease-in-out infinite; }
    .slam { animation: slam 2.4s cubic-bezier(0.6, 0, 0.4, 1) infinite; }
    .flash { animation: flash 2.4s linear infinite; }
    .drift { animation: drift 4s ease-in-out infinite; }
    .drift.r { animation-direction: reverse; }
    @keyframes breathe { 0%, 100% { opacity: 0.6; } 66% { opacity: 1; } }
    @keyframes slam { 0%, 55% { transform: translateY(-16px); } 64%, 78% { transform: translateY(0); } 100% { transform: translateY(-16px); } }
    @keyframes flash { 0%, 62% { opacity: 0; } 66% { opacity: 1; } 88%, 100% { opacity: 0; } }
    @keyframes drift { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
