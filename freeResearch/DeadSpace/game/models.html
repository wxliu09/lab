<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>XENOCYTE 模型展示（開發用）</title>
    <style>
      html, body { margin: 0; height: 100%; background: #030507; overflow: hidden; font: 12px/1.3 'JetBrains Mono', monospace; color: #9fe7ff; }
      #c { width: 100vw; height: 100vh; display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .lb { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-align: center; text-shadow: 0 0 3px #000, 0 0 2px #000; }
      .lb b { color: #fff; font-weight: 600; }
      .lb i { color: #8aa; font-style: normal; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <!-- 只給 dev server／截圖腳本使用；正式 build 的入口只有 index.html -->
    <script type="module" src="/src/devtools/modelGallery.ts"></script>
  </body>
</html>
