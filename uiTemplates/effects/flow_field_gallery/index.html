<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Field · 100k Particles</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #05050a; overflow: hidden; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      font: 13px/1.4 system-ui, sans-serif; color: #ccc;
      background: rgba(10, 10, 18, 0.72); backdrop-filter: blur(6px);
      padding: 10px 12px; border-radius: 10px; border: 1px solid #ffffff22;
    }
    #ui input {
      width: 90px; background: #ffffff11; color: #eee;
      border: 1px solid #ffffff33; border-radius: 6px; padding: 5px 8px; font: inherit;
    }
    #ui button {
      background: #ffffff14; color: #eee; border: 1px solid #ffffff33;
      border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit;
    }
    #ui button:hover { background: #ffffff28; }
    #ui .hint { opacity: 0.55; margin-left: 4px; }
    #ui a { color: #8ecae6; }
  </style>
</head>
<body>
  <div id="ui">
    <label>seed <input id="seed" type="number" value="1234"></label>
    <button id="apply">Apply</button>
    <button id="random">🎲 Random</button>
    <button id="palette">🎨</button>
    <button id="export">💾 Export 4K</button>
    <span class="hint">1–5 palette · S export · R reseed · <a href="gallery.html">gallery</a></span>
  </div>
  <script src="flowfield.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
