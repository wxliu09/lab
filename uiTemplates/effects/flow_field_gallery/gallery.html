<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Field Gallery</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    html, body { margin: 0; background: #05050a; color: #ddd; font: 15px/1.5 system-ui, sans-serif; }
    header { padding: 28px 32px 8px; }
    header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
    header a { color: #8ecae6; text-decoration: none; }
    #grid {
      display: grid; gap: 20px; padding: 20px 32px 40px;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    }
    .card {
      display: block; color: inherit; text-decoration: none;
      background: #ffffff0a; border: 1px solid #ffffff1a; border-radius: 12px;
      overflow: hidden; transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: #ffffff44; }
    .thumb canvas { display: block; width: 100%; height: auto; }
    .caption { padding: 10px 14px; font-size: 13px; opacity: 0.75; }
  </style>
</head>
<body>
  <header>
    <h1>Flow Field Gallery</h1>
    <a href="index.html">← back to generator</a> — click any piece to open it in the generator
  </header>
  <div id="grid"></div>
  <script src="flowfield.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
