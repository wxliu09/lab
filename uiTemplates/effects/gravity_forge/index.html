<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRAVITY FORGE · 引力熔爐</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; cursor: crosshair; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 16px; bottom: 14px; z-index: 5;
      font: 12px/1.7 ui-monospace, Consolas, monospace; color: #ffffff66;
      letter-spacing: 0.08em; user-select: none; pointer-events: none;
      text-shadow: 0 0 8px #000;
    }
    #hud b { color: #ffffffaa; font-weight: 600; }
    #title {
      position: fixed; left: 16px; top: 14px; z-index: 5;
      font: 600 15px/1.4 ui-monospace, Consolas, monospace; color: #ffffff88;
      letter-spacing: 0.35em; user-select: none; pointer-events: none;
      text-shadow: 0 0 12px #f0f;
    }
  </style>
</head>
<body>
  <div id="title">GRAVITY FORGE</div>
  <div id="hud">
    <b>MOVE</b> 拖曳奇點 &nbsp; <b>CLICK / SPACE</b> 超新星爆發 &nbsp; <b>WHEEL</b> 引力強度<br>
    <b>1–4</b> 色譜 &nbsp; <b>S</b> 截圖 &nbsp; <b>C</b> 清除
  </div>
  <script src="sketch.js"></script>
</body>
</html>
