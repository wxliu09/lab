<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商務通 95 · 進銷存系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'MS Sans Serif','Noto Sans TC',Tahoma,sans-serif}
body{background:#008080;min-height:100vh;overflow:hidden;font-size:13px;color:#000}
.desktop{position:fixed;inset:0 0 40px 0;padding:16px}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;width:88px;padding:8px 4px;cursor:pointer;color:#fff;text-align:center;text-shadow:1px 1px 0 #000;font-size:12px}
a.icon{text-decoration:none}
.icon:hover{background:rgba(0,0,128,.35)}
.icon .pic{font-size:30px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.4))}
.win{position:absolute;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:3px 3px 0 rgba(0,0,0,.4);min-width:340px}
.win .tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:3px 4px 3px 8px;display:flex;justify-content:space-between;align-items:center;cursor:move;user-select:none}
.win .tb .btns span{display:inline-block;width:16px;height:14px;background:#c0c0c0;color:#000;text-align:center;font-size:10px;line-height:13px;margin-left:2px;border:1.5px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer}
.win .menu{display:flex;gap:2px;padding:2px;border-bottom:1px solid #808080}
.win .menu span{padding:3px 10px;cursor:default}
.win .menu span:hover{background:#000080;color:#fff}
.win .content{padding:10px;background:#c0c0c0}
.fieldset{border:2px solid;border-color:#808080 #fff #fff #808080;padding:10px;margin-bottom:10px;background:#fff}
.fieldset legend{padding:0 6px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
th{background:#c0c0c0;border:1px solid;border-color:#fff #808080 #808080 #fff;padding:4px 8px;text-align:left;font-weight:400}
td{border:1px solid #d4d0c8;padding:4px 8px}
tr.sel td{background:#000080;color:#fff}
.btn{border:2px solid;border-color:#fff #404040 #404040 #fff;background:#c0c0c0;padding:4px 16px;cursor:pointer;font-size:12px}
.btn:active{border-color:#404040 #fff #fff #404040}
.btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
input[type=text],select{border:2px solid;border-color:#808080 #fff #fff #808080;padding:3px 6px;font-size:12px;background:#fff;outline:none}
.formrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.formrow label{width:80px;text-align:right}
.statusbar{border:2px solid;border-color:#808080 #fff #fff #808080;margin-top:8px;padding:3px 8px;display:flex;gap:14px;font-size:11.5px;background:#c0c0c0}
.taskbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;padding:3px 6px;gap:6px;z-index:100}
.start{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;font-weight:700;padding:5px 14px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:13px}
.start:active{border-color:#404040 #fff #fff #404040}
.taskbtn{border:2px solid;border-color:#fff #404040 #404040 #fff;background:#c0c0c0;padding:5px 14px;font-size:12px;min-width:130px;text-align:left;cursor:pointer}
a.taskbtn{text-decoration:none;color:#000;display:inline-block}
.taskbtn.act{border-color:#404040 #fff #fff #404040;background:#e0e0e0;font-weight:700}
.clock{margin-left:auto;border:2px solid;border-color:#808080 #fff #fff #808080;padding:4px 12px;font-size:12px}
.kpibar{display:flex;gap:10px;margin-bottom:10px}
.kpibar .k{flex:1;border:2px solid;border-color:#808080 #fff #fff #808080;background:#fff;padding:8px;text-align:center}
.kpibar .k b{display:block;font-size:18px;color:#000080}
.kpibar .k span{font-size:11px;color:#555}
</style>
</head>
<body>
<div class="desktop">
  <a class="icon" href="index.html"><span class="pic">💾</span>進銷存系統</a>
  <a class="icon" href="account.html"><span class="pic">📒</span>帳務總覽</a>
  <a class="icon" href="reports.html"><span class="pic">🖨️</span>報表中心</a>
  <div class="icon"><span class="pic">🗑️</span>資源回收筒</div>

  <div class="win" id="w1" style="left:120px;top:40px;width:560px;z-index:3">
    <div class="tb"><span>📊 商務通 95 — 進銷存主控台</span><span class="btns"><span>_</span><span>□</span><span>×</span></span></div>
    <div class="menu"><span>檔案(F)</span><span>作業(O)</span><span>報表(R)</span><span>說明(H)</span></div>
    <div class="content">
      <div class="kpibar">
        <div class="k"><b>$482K</b><span>本月銷售額</span></div>
        <div class="k"><b>1,847</b><span>出貨單數</span></div>
        <div class="k"><b>23</b><span>低於安全庫存</span></div>
      </div>
      <div class="fieldset"><legend>庫存警示(低於安全存量)</legend>
        <table>
          <tr><th>料號</th><th>品名</th><th>現有量</th><th>安全量</th><th>狀態</th></tr>
          <tr class="sel"><td>P-2041</td><td>USB-C 集線器</td><td>12</td><td>50</td><td>緊急採購</td></tr>
          <tr><td>P-1188</td><td>機械鍵盤 青軸</td><td>31</td><td>60</td><td>已下單</td></tr>
          <tr><td>P-3357</td><td>27吋螢幕支架</td><td>8</td><td>30</td><td>緊急採購</td></tr>
          <tr><td>P-0920</td><td>護眼檯燈</td><td>44</td><td>50</td><td>觀察</td></tr>
        </table>
      </div>
      <div class="btnrow"><button class="btn">產生採購建議</button><button class="btn">列印清單</button></div>
      <div class="statusbar"><span>就緒</span><span>使用者:張經理</span><span>DB:INV95.MDB</span></div>
    </div>
  </div>

  <div class="win" id="w2" style="left:520px;top:190px;width:380px;z-index:4">
    <div class="tb"><span>🧾 新增銷貨單</span><span class="btns"><span>_</span><span>□</span><span>×</span></span></div>
    <div class="content">
      <div class="formrow"><label>客戶代號</label><input type="text" value="C-0087 鼎新科技"></div>
      <div class="formrow"><label>品項</label><select><option>P-2041 USB-C 集線器</option><option>P-1188 機械鍵盤</option></select></div>
      <div class="formrow"><label>數量</label><input type="text" value="40" style="width:80px"></div>
      <div class="formrow"><label>單價</label><input type="text" value="1,190" style="width:100px"></div>
      <div class="formrow"><label>稅額</label><input type="text" value="2,380" style="width:100px" readonly></div>
      <div class="btnrow"><button class="btn">確定存檔</button><button class="btn">取消</button></div>
    </div>
  </div>
</div>
<div class="taskbar">
  <button class="start">🪟 開始</button>
  <a class="taskbtn act" href="index.html">📊 進銷存主控台</a>
  <a class="taskbtn" href="account.html">📒 帳務總覽</a>
  <a class="taskbtn" href="reports.html">🖨️ 報表中心</a>
  <a class="taskbtn" href="customer.html">👥 客戶資料</a>
  <span class="clock" id="clk">下午 07:28</span>
</div>
<script>
setInterval(()=>{document.getElementById('clk').textContent=new Date().toLocaleTimeString('zh-TW')},1000);
let topZ=10;
document.querySelectorAll('.win').forEach(w=>{
  w.addEventListener('mousedown',()=>{w.style.zIndex=++topZ});
  const tb=w.querySelector('.tb');
  tb.addEventListener('mousedown',e=>{
    if(e.target.closest('.btns'))return;
    const r=w.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;
    const mv=ev=>{w.style.left=(ev.clientX-ox)+'px';w.style.top=(ev.clientY-oy)+'px'};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);
  });
});
</script>
</body>
</html>
