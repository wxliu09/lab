<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>曜城 OPS｜終端指令中樞</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  canvas{display:block;}
  .crt{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);}
  .vig{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.6) 100%);}
  a.back{position:fixed;right:22px;bottom:22px;z-index:50;font:12px/1 'Consolas',monospace;letter-spacing:.2em;
    color:#33ff66;text-decoration:none;background:rgba(0,20,6,.85);border:1px solid rgba(51,255,102,.4);
    padding:10px 18px;transition:.25s;}
  a.back:hover{background:rgba(51,255,102,.15);box-shadow:0 0 18px rgba(51,255,102,.4);}
</style>
</head>
<body>
<div class="crt"></div><div class="vig"></div>
<a class="back" href="showcase.html">← EXIT</a>
<script>
const GLYPHS = 'アイウエオカキクケコサシスセソタチツテト0123456789';
let cols = [];
let shown = [], typing = '', ci = 0, li = 0, phase = 'boot';
let alertMsg = null, alertBorn = 0;
const boot = [
  'YAO-CITY OPS TERMINAL  v3.2.1',
  '(c) 2026 曜城市政府資訊局 — 授權存取，全程錄影',
  '',
  '> boot --sequence city-core',
  '  [OK] 核心服務啟動 ............ 12/12',
  '  [OK] 資料庫連線池就緒 ........ 24ms',
  '  [OK] 加密通道建立 ............ TLS 1.3',
  '  [OK] 排程引擎同步 ............ 148 jobs',
  '> auth --user sysadmin',
  '  密碼驗證通過 ★ 權限等級： ROOT',
  '> monitor --live --all-nodes',
  ''
];
const alerts = [
  ['ALERT', '節點 C-07 回應逾時 — 已自動切換備援'],
  ['WARN ', '登入失敗次數異常（IP 183.x.x.x）已封鎖'],
  ['ALERT', '儲存池使用率達 85% — 擴充程序啟動'],
  ['WARN ', '支付閘道延遲 420ms — 持續觀察中']
];
let procs = [
  { pid: 1024, name: 'household-svc', base: 32 },
  { pid: 2048, name: 'welfare-api', base: 24 },
  { pid: 3096, name: 'traffic-stream', base: 58 },
  { pid: 4096, name: 'open-data-gw', base: 41 },
  { pid: 5120, name: 'backup-agent', base: 12 }
];

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('Consolas');
  const n = floor(width / 22);
  for (let i = 0; i < n; i++) cols.push({ x: i * 22 + 8, y: random(-height, 0), s: random(4, 12) });
}

function draw() {
  background(0, 40);
  drawRain();
  drawPanel();
}

function drawRain() {
  textSize(14);
  noStroke();
  for (const c of cols) {
    for (let k = 0; k < 3; k++) {
      const yy = c.y - k * 18;
      fill(0, 255, 70, k === 0 ? 150 : 55 - k * 15);
      text(GLYPHS[floor(random(GLYPHS.length))], c.x, yy);
    }
    c.y += c.s;
    if (c.y - 60 > height) { c.y = random(-200, -30); c.s = random(4, 12); }
  }
}

function bar(v, w) {
  const n = round(constrain(v, 0, 100) / 100 * w);
  let s = '';
  for (let i = 0; i < w; i++) s += i < n ? '█' : '░';
  return s;
}

function drawPanel() {
  const px = 40, py = 40, pw = width - 80, ph = height - 80;
  fill(1, 9, 3, 228); stroke(0, 255, 70, 90); strokeWeight(1);
  rect(px, py, pw, ph, 6);
  // 標題列
  noStroke(); fill(0, 255, 70, 20); rect(px, py, pw, 34, 6);
  fill(57, 255, 99); textSize(13); textAlign(LEFT, CENTER);
  text('■ YAO-CITY OPS // LIVE MONITOR', px + 16, py + 17);
  textAlign(RIGHT, CENTER);
  text(nf(hour(), 2) + ':' + nf(minute(), 2) + ':' + nf(second(), 2) + ' TST', px + pw - 16, py + 17);

  const tx = px + 20;
  let ty = py + 54;
  const lh = 20;
  textAlign(LEFT, TOP); textSize(13);

  // 開機序列（打字機）
  if (phase === 'boot' && frameCount % 2 === 0) {
    typing += boot[li].charAt(ci); ci++;
    if (ci >= boot[li].length) {
      shown.push(typing); typing = ''; ci = 0; li++;
      if (li >= boot.length) phase = 'run';
    }
  }
  const maxLog = phase === 'run' ? 9 : 13;
  const logLines = shown.slice(-maxLog);
  for (const l of logLines) {
    if (l.includes('[OK]') || l.includes('通過')) fill(57, 255, 99);
    else if (l.startsWith('>')) fill(190, 255, 205);
    else fill(20, 150, 70);
    text(l, tx, ty); ty += lh;
  }
  if (phase === 'boot') {
    fill(57, 255, 99);
    text(typing + (frameCount % 40 < 22 ? '▌' : ''), tx, ty); ty += lh;
  } else {
    ty = py + 54 + 9 * lh + 8;
    drawLive(tx, ty, pw - 40, py + ph - ty - 16);
  }
}

function drawLive(x, y, w, h) {
  const lh = 20;
  // 系統儀表
  const cpu = 52 + sin(frameCount * 0.018) * 16 + noise(frameCount * 0.01) * 12;
  const mem = 68 + sin(frameCount * 0.011 + 3) * 8;
  const net = 40 + abs(sin(frameCount * 0.03)) * 45;
  const io = 22 + noise(frameCount * 0.02 + 9) * 30;
  const rows = [
    ['CPU ', cpu], ['MEM ', mem], ['NET ', net], ['I/O ', io]
  ];
  textSize(13);
  for (const [lb, v] of rows) {
    fill(20, 150, 70); text(lb, x, y);
    const danger = v > 80;
    fill(danger ? color(255, 80, 80) : color(57, 255, 99));
    text('[' + bar(v, 24) + ']', x + 52, y);
    text(nf(round(v), 2) + '%', x + 52 + 26 * 13 * 0.62 + 30, y);
    y += lh;
  }
  y += 8;
  // 程序表
  fill(190, 255, 205);
  text(' PID    SERVICE             STATE   CPU%', x, y); y += lh;
  for (const p of procs) {
    const v = p.base + sin(frameCount * 0.02 + p.pid) * p.base * 0.4;
    const st = v > 45 ? 'RUN ' : 'idle';
    fill(20, 150, 70);
    text(' ' + p.pid + '    ' + (p.name + '                  ').slice(0, 20) + ' ' + st + '   ' + nf(v, 2, 1) + '%', x, y);
    y += lh;
  }
  y += 6;
  // 隨機告警
  if (frameCount % 400 === 200 && !alertMsg) {
    alertMsg = alerts[floor(random(alerts.length))];
    alertBorn = frameCount;
  }
  if (alertMsg) {
    const el = frameCount - alertBorn;
    if (el > 240) alertMsg = null;
    else if (el % 40 < 26) {
      fill(alertMsg[0] === 'ALERT' ? color(255, 70, 70) : color(255, 190, 60));
      text('!! ' + alertMsg[0] + ' ' + alertMsg[1], x, y);
    }
    y += lh;
  }
  // 輸入列固定在面板底部
  fill(190, 255, 205);
  text('root@yao-city:~$ ' + (frameCount % 50 < 28 ? '▌' : ' '), x, py + ph - 30);
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
