<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 · 節氣詩集</title>
<style>
:root{--washi:#efe9dd;--washi2:#e5ddcd;--sumi:#26241f;--ash:#7a7468;
  --vermilion:#b23a2e;--moss:#6d7458;--ochre:#96783c;--indigo:#5a6473}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--washi);color:var(--sumi);min-height:100vh;overflow-x:hidden;position:relative;
  font-family:"Yu Mincho","Noto Serif TC","PMingLiU","MS Mincho",Georgia,serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.55;
  background-image:
    radial-gradient(circle at 12% 22%,rgba(140,130,110,.10) 0 1px,transparent 2px),
    radial-gradient(circle at 68% 8%,rgba(140,130,110,.09) 0 1px,transparent 2px),
    radial-gradient(circle at 34% 76%,rgba(140,130,110,.08) 0 1px,transparent 2px),
    linear-gradient(107deg,rgba(255,255,255,.5),transparent 40%);
  background-size:180px 180px,220px 220px,260px 260px,100% 100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 180px rgba(120,108,86,.32)}
a:focus-visible,button:focus-visible{outline:2px solid var(--vermilion);outline-offset:4px}

.home{position:fixed;left:20px;bottom:22px;z-index:40;text-decoration:none;color:var(--washi);
  background:var(--sumi);padding:12px 18px;font-size:12px;letter-spacing:.34em;transition:.3s;border-radius:1px}
.home:hover{background:var(--vermilion);letter-spacing:.42em}
.nav{position:relative;z-index:6;display:flex;flex-wrap:wrap;border-bottom:1px solid rgba(38,36,31,.18)}
.nav a{padding:16px 26px;font-size:11.5px;letter-spacing:.36em;color:#5d584c;text-decoration:none;
  border-right:1px solid rgba(38,36,31,.12);transition:.3s}
.nav a:hover{background:rgba(178,58,46,.06);color:var(--vermilion)}
.nav a.on{color:var(--sumi);background:rgba(38,36,31,.05)}

.stage{position:relative;z-index:5;max-width:1240px;margin:0 auto;padding:46px 34px 70px}
.head{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:clamp(34px,6vw,62px);letter-spacing:.22em;font-weight:400;line-height:1.1}
.head .en{font-size:10.5px;letter-spacing:.6em;color:var(--ash);text-transform:uppercase;padding-top:14px}
.seal{width:54px;height:54px;background:var(--vermilion);color:#fff;display:grid;place-items:center;
  font-size:14px;line-height:1.15;text-align:center;letter-spacing:.06em;border-radius:3px;
  box-shadow:0 0 0 1px rgba(178,58,46,.35),0 0 0 5px rgba(178,58,46,.12);
  transform:rotate(-2deg);opacity:.92;margin-left:auto}
.lede{font-size:14px;line-height:2.4;letter-spacing:.12em;color:#3a372f;max-width:62ch;margin-bottom:30px}

.tabs{display:flex;flex-wrap:wrap;border-top:1px solid rgba(38,36,31,.18);
  border-bottom:1px solid rgba(38,36,31,.18);margin-bottom:34px}
.tab{appearance:none;background:none;border:0;border-right:1px solid rgba(38,36,31,.12);
  cursor:pointer;font:inherit;font-size:14px;letter-spacing:.32em;color:#5d584c;padding:14px 30px;transition:.3s}
.tab:hover{color:var(--vermilion)}
.tab[aria-pressed="true"]{color:var(--sumi);background:var(--c,rgba(38,36,31,.06))}

/* ---------- album leaves ---------- */
.leaves{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.leaf{position:relative;height:360px;background:var(--washi2);cursor:pointer;text-align:left;
  border:0;font:inherit;color:inherit;padding:0;overflow:hidden;transition:transform .4s,box-shadow .4s;
  box-shadow:0 3px 10px rgba(110,98,76,.2),inset 0 0 0 1px rgba(38,36,31,.1)}
.leaf::before{content:"";position:absolute;inset:9px;border:1px solid rgba(38,36,31,.16);pointer-events:none}
.leaf:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(110,98,76,.32),inset 0 0 0 1px rgba(38,36,31,.14)}
.leaf.hide{display:none}
.leaf .face{position:absolute;inset:22px;display:flex;flex-direction:row-reverse;
  align-items:flex-start;gap:14px;transition:opacity .35s}
.leaf .verse{writing-mode:vertical-rl;font-size:17px;letter-spacing:.24em;line-height:2.05;
  max-height:100%;color:#2e2b25}
.leaf .col{writing-mode:vertical-rl;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.leaf .tname{font-size:19px;letter-spacing:.3em;color:var(--sumi)}
.leaf .tdate{font-size:9.5px;letter-spacing:.3em;color:#a29a89}
.leaf .src{position:absolute;left:22px;bottom:20px;writing-mode:vertical-rl;font-size:9.5px;
  letter-spacing:.24em;color:var(--ash);max-height:200px}
.leaf .stamp{position:absolute;right:16px;bottom:16px;width:30px;height:30px;background:var(--vermilion);
  color:#fff;display:grid;place-items:center;font-size:11px;border-radius:2px;opacity:.86;
  transform:rotate(-4deg);box-shadow:0 0 0 3px rgba(178,58,46,.13)}
.leaf .back{position:absolute;inset:20px;opacity:0;pointer-events:none;transition:opacity .35s;
  display:flex;flex-direction:column;justify-content:center;gap:12px}
.leaf .back .bt{font-size:10px;letter-spacing:.4em;color:var(--vermilion)}
.leaf .back p{font-size:12.5px;line-height:2.15;letter-spacing:.06em;color:#3f3b33}
.leaf.open .face{opacity:0}
.leaf.open .back{opacity:1}
.leaf.open{background:var(--washi)}
.leaf[data-q="0"]{border-top:3px solid rgba(109,116,88,.55)}
.leaf[data-q="1"]{border-top:3px solid rgba(178,58,46,.5)}
.leaf[data-q="2"]{border-top:3px solid rgba(150,120,60,.55)}
.leaf[data-q="3"]{border-top:3px solid rgba(90,100,115,.5)}

.hint{margin-top:30px;font-size:10.5px;letter-spacing:.4em;color:var(--ash);text-align:center}
.ftr{text-align:center;padding:34px 0 6px;font-size:10px;letter-spacing:.5em;color:#a8a091}
@media(max-width:760px){.stage{padding:32px 18px 70px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="home" href="../../index.html">← 返 回 入 口</a>

<nav class="nav">
  <a href="index.html">主　畫　面</a>
  <a href="detail.html">節　氣　詳　情</a>
  <a href="almanac.html">年　曆　覽</a>

<div class="stage">
  <div class="head">
    <h1>節氣詩集</h1>
    <div class="en">Poems of the Solar Terms</div>
    <div class="seal">詩箋<br>冊</div>
  </div>

  <p class="lede">二十四節氣，節節有詩。古人以詩記物候，以詞詠時序，留下無數描繪天地流轉的篇章。下列詩箋依節氣次序排列，每箋一聯；點箋翻面，可讀其賞析。</p>

  <div class="tabs" id="tabs">
    <button class="tab" data-q="all" aria-pressed="true">全　集</button>
    <button class="tab" data-q="0" style="--c:rgba(109,116,88,.14)" aria-pressed="false">春　六</button>
    <button class="tab" data-q="1" style="--c:rgba(178,58,46,.12)" aria-pressed="false">夏　六</button>
    <button class="tab" data-q="2" style="--c:rgba(150,120,60,.14)" aria-pressed="false">秋　六</button>
    <button class="tab" data-q="3" style="--c:rgba(90,100,115,.12)" aria-pressed="false">冬　六</button>
  </div>

  <div class="leaves" id="leaves"></div>
  <div class="hint">— 點 箋 翻 面 · 再 點 復 原 —</div>
  <div class="ftr">侘 寂 · W A B I - S A B I · D E S I G N  0 5 / 4 0</div>
</div>

<script>
// [節氣, 日期, 詩句(以｜斷行), 出處, 賞析]
const P = [
  ["立春","02.04","律回歲晚冰霜少｜春到人間草木知","宋·張栻《立春偶成》",
   "冰霜漸稀而草木先知，張栻以「知」字賦草木以感官，寫出春意入人間的那一瞬。"],
  ["雨水","02.19","好雨知時節｜當春乃發生","唐·杜甫《春夜喜雨》",
   "以擬人手法寫春雨體貼萬物、靜默滋潤之態。一個「知」字，千載傳誦。"],
  ["驚蟄","03.05","微雨眾卉新｜一雷驚蟄始","唐·韋應物《觀田家》",
   "一聲春雷驚醒蟄蟲，農家一年的耕作自此開始，萬物生機勃發。"],
  ["春分","03.20","燕子來時新社｜梨花落後清明","宋·晏殊《破陣子》",
   "燕子北返、梨花飄落，晏殊以兩個時間座標勾勒仲春，清新明麗。"],
  ["清明","04.05","清明時節雨紛紛｜路上行人欲斷魂","唐·杜牧《清明》",
   "淒迷雨中的行旅，一問一指之間畫面全出，成為清明最廣為人知的詩篇。"],
  ["穀雨","04.20","穀雨如絲復似塵｜煮茶浮出正芳春","清·許嗣隆《穀雨》",
   "穀雨既是播種時節，也是採春茶的末班車。「穀雨茶」之名即由此而來。"],
  ["立夏","05.05","綠樹蔭濃夏日長｜樓台倒影入池塘","唐·高駢《山亭夏日》",
   "綠蔭、倒影、微風、薔薇，四句寫盡初夏山亭的悠閒與雅致。"],
  ["小滿","05.21","最愛壟頭麥｜迎風笑落紅","宋·歐陽修《小滿》",
   "麥粒初飽而未熟，麥浪在風中搖曳，是豐收到來之前最從容的一刻。"],
  ["芒種","06.05","芒種看今日｜螳螂應節生","唐·元稹《詠廿四氣詩》",
   "有芒之穀可種，過此則失其時。螳螂破卵而出，農事最為紛忙。"],
  ["夏至","06.21","天惟客子苦炎蒸｜蟬抱高枝不肯聲","宋·楊萬里《夏至後初暑》",
   "連蟬都懶得鳴叫，只想脫殼遁涼。炎夏的慵倦，盡在這一句裡。"],
  ["小暑","07.07","倏忽溫風至｜因循小暑來","唐·元稹《詠廿四氣詩》",
   "「倏忽」二字寫暑氣來得無聲無息，竹喧先覺雨，山暗已聞雷。"],
  ["大暑","07.22","萬瓦鱗鱗若火龍｜日車不動汗珠融","宋·王令《大熱》",
   "屋瓦如火龍鱗片，日輪彷彿停駐不動，酷暑之難耐被寫到極處。"],
  ["立秋","08.07","乳鴉啼散玉屏空｜一枕新涼一扇風","唐·劉翰《立秋》",
   "一覺睡醒，涼風已入窗，梧桐葉落滿階。秋聲來得極輕，卻無處不在。"],
  ["處暑","08.23","離離暑雲散｜嫋嫋涼風起","唐·白居易《早秋曲江感懷》",
   "暑雲散而涼風起，荷花結子，秋意悄悄爬上蓮池。節氣交替的微妙全在筆下。"],
  ["白露","09.07","蒹葭蒼蒼｜白露為霜","先秦《詩經·蒹葭》",
   "以白露時節的蒼茫水景，寄託對彼岸伊人的渴望，是《詩經》中最美的思念之作。"],
  ["秋分","09.23","金風玉露一相逢｜便勝卻人間無數","宋·秦觀《鵲橋仙》",
   "「金風玉露」正是秋分物候。以節氣入情語，將相會之貴寫得清冷而熾烈。"],
  ["寒露","10.08","寒露驚秋晚｜朝看菊漸黃","唐·元稹《詠廿四氣詩》",
   "露氣寒冷將凝為霜，菊花始開。此時白露不露身、寒露不露腳。"],
  ["霜降","10.23","停車坐愛楓林晚｜霜葉紅於二月花","唐·杜牧《山行》",
   "霜降之後草木黃落，唯楓葉愈紅。以「紅於二月花」翻轉了秋日的蕭瑟印象。"],
  ["立冬","11.07","凍筆新詩懶寫｜寒爐美酒時溫","唐·李白《立冬》",
   "筆凍而詩懶，爐暖而酒溫。李白把立冬寫成了一種可以縱容的慵懶。"],
  ["小雪","11.22","花雪隨風不厭看｜更多還肯失林巒","唐·戴叔倫《小雪》",
   "雪初落而未盛，隨風飄舞可久看不厭；若再多些，林巒便要被掩去了。"],
  ["大雪","12.07","千里黃雲白日曛｜北風吹雁雪紛紛","唐·高適《別董大》",
   "黃雲蔽日、北風吹雁，大雪紛飛的送別場景，遼闊而蒼涼。"],
  ["冬至","12.21","天時人事日相催｜冬至陽生春又來","唐·杜甫《小至》",
   "日短至而一陽初生。杜甫在最深的冬日裡，先一步看見了春天。"],
  ["小寒","01.05","小寒連大呂｜歡鵲壘新巢","唐·元稹《詠廿四氣詩》",
   "「大呂」為十二律之一，對應十二月。寒氣未極，喜鵲已開始築新巢。"],
  ["大寒","01.20","舊雪未及消｜新雪又擁戶","宋·邵雍《大寒吟》",
   "歲末最冷之節，雪落不停。然寒之逆極，正意味著立春已在門外。"]
];

const box = document.getElementById("leaves");
box.innerHTML = P.map(([n, d, v, s, note], i) =>
  '<button class="leaf" type="button" data-q="' + Math.floor(i / 6) + '">' +
    '<div class="face">' +
      '<div class="col"><div class="tname">' + n + '</div><div class="tdate">' + d + "</div></div>" +
      '<div class="verse">' + v.split("｜").join("<br>") + "</div></div>" +
    '<div class="src">—— ' + s + "</div>" +
    '<div class="stamp">' + n.charAt(0) + "</div>" +
    '<div class="back"><div class="bt">賞　析</div><p>' + note + "</p>" +
      '<p style="font-size:11px;color:#7a7468;letter-spacing:.2em">' + n + " · " + d + " · " + s + "</p></div>" +
  "</button>").join("");

box.querySelectorAll(".leaf").forEach(l =>
  l.addEventListener("click", () => l.classList.toggle("open")));

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  const q = b.dataset.q;
  box.querySelectorAll(".leaf").forEach(l => {
    l.classList.remove("open");
    l.classList.toggle("hide", q !== "all" && l.dataset.q !== q);
  });
}));
</script>
</body>
</html>
