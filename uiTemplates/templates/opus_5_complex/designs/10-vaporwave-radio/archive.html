<style>
:root{--p1:#ff6ec7;--p2:#8a4dff;--c1:#00e5ff;--c2:#00ffa3;--sun:#ffd166;--night:#12042b}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow-x:hidden;color:#f4e9ff;position:relative;
  background:linear-gradient(180deg,#1b0140 0%,#3d0a63 34%,#7b1fa2 62%,#ff6ec7 88%,#ffb36b 100%);

.scene{position:fixed;inset:0;z-index:0;overflow:hidden}
.sun{position:absolute;left:50%;top:40%;transform:translateX(-50%);width:min(400px,66vw);aspect-ratio:1;

  box-shadow:0 0 120px rgba(255,110,199,.45);animation:sunrise 9s ease-in-out infinite alternate}
@keyframes sunrise{to{transform:translate(-50%,-16px) scale(1.03)}}
.floor{position:absolute;left:-50%;right:-50%;bottom:0;height:36vh;opacity:.55;
  background:repeating-linear-gradient(90deg,rgba(0,229,255,.55) 0 2px,transparent 2px 90px),

  transform:perspective(340px) rotateX(72deg);transform-origin:bottom;animation:scroll 2.4s linear infinite}
@keyframes scroll{to{background-position:0 60px,0 60px}}
.grain{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.16;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px,transparent 1px 3px)}
.grain::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% 30%,transparent 45%,rgba(20,0,45,.75))}
a:focus-visible,button:focus-visible{outline:2px solid var(--c2);outline-offset:3px}

.home{position:fixed;left:18px;top:18px;z-index:80;text-decoration:none;
  font-family:"Courier New",monospace;font-weight:bold;font-size:12px;letter-spacing:.16em;
  color:#12042b;background:linear-gradient(180deg,#00ffa3,#00e5ff);padding:10px 18px;
  border:2px solid #fff;box-shadow:4px 4px 0 rgba(255,110,199,.9);transition:.15s}
.home:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(255,110,199,.9)}

.wrap{position:relative;z-index:10;max-width:1180px;margin:0 auto;padding:96px 20px 70px}
h1{font-size:clamp(42px,10vw,116px);letter-spacing:.06em;line-height:.9;text-transform:uppercase;
  color:#fff;text-align:center;transform:perspective(500px) rotateX(14deg);
  text-shadow:3px 3px 0 var(--c1),6px 6px 0 var(--p1),0 0 34px rgba(255,110,199,.85),0 0 70px rgba(0,229,255,.5)}
.jp{font-family:"MS Mincho","Noto Serif TC",serif;font-size:clamp(14px,3vw,26px);text-align:center;
  letter-spacing:.7em;color:#00e5ff;text-shadow:0 0 18px rgba(0,229,255,.8);margin:18px 0 6px}
.freq{font-family:"Courier New",monospace;font-size:12px;letter-spacing:.4em;color:#ffd166;
  text-align:center;text-shadow:0 0 12px rgba(255,209,102,.7),0 2px 8px rgba(18,4,43,.95)}
.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.nav a{font-family:"Courier New",monospace;font-weight:bold;font-size:12px;letter-spacing:.16em;
  padding:10px 18px;background:rgba(18,4,43,.62);color:#00e5ff;border:2px solid #00e5ff;
  text-decoration:none;text-shadow:0 0 10px rgba(0,229,255,.8);transition:.18s}
.nav a:hover{background:#00e5ff;color:#12042b;text-shadow:none;box-shadow:0 0 26px rgba(0,229,255,.7)}
.nav a.on{background:var(--p1);border-color:var(--p1);color:#12042b;text-shadow:none}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:44px}
.stat{border:2px solid rgba(0,229,255,.45);background:rgba(20,4,50,.86);padding:16px;text-align:center;
  backdrop-filter:blur(4px)}
.stat .v{font-size:34px;color:#fff;text-shadow:0 0 18px rgba(255,110,199,.7);letter-spacing:.02em}
.stat .k{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.22em;color:#c9a8ff;margin-top:8px}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:40px 0 26px}
.f{font-family:"Courier New",monospace;font-weight:bold;font-size:11.5px;letter-spacing:.14em;
  padding:9px 16px;background:rgba(20,4,50,.86);color:#c9a8ff;border:1px solid rgba(0,229,255,.35);
  cursor:pointer;transition:.18s}
.f:hover{color:#fff;border-color:var(--c1)}
.f[aria-pressed="true"]{background:var(--c);color:#12042b;border-color:var(--c);
  box-shadow:0 0 22px -4px var(--c)}

/* ---------- VHS rack ---------- */
.rack{position:relative;padding:26px 20px 0;overflow-x:auto;
  border:3px solid rgba(0,229,255,.5);border-bottom:0;
  background:linear-gradient(180deg,rgba(20,4,50,.86),rgba(20,4,50,.94))}
.shelf{display:flex;gap:7px;align-items:flex-end;min-width:min-content;padding-bottom:0}
.tape{flex:0 0 auto;width:52px;height:290px;cursor:pointer;position:relative;font:inherit;
  border:2px solid rgba(255,255,255,.35);border-bottom:0;padding:12px 4px 10px;

  display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff}
.tape:hover{transform:translateY(-14px)}
.tape.on{transform:translateY(-30px);box-shadow:0 0 30px -4px var(--c),0 22px 30px rgba(0,0,0,.5);
  border-color:var(--c)}
.tape.hide{display:none}
.tape .band{width:100%;height:9px;background:var(--c);box-shadow:0 0 12px var(--c);flex:0 0 auto}
.tape .lbl{writing-mode:vertical-rl;font-size:14px;letter-spacing:.1em;line-height:1.2;
  flex:1;overflow:hidden;text-align:left}
.tape .dt{writing-mode:vertical-rl;font-family:"Courier New",monospace;font-size:9px;
  letter-spacing:.14em;color:#c9a8ff;font-weight:normal}
.rackfloor{height:16px;border:3px solid rgba(0,229,255,.5);

.dhead{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:0}

@media(max-width:800px){.dhead .r{border-left:0;border-top:3px solid rgba(0,229,255,.3)}}
.sticker{border:2px solid var(--c);padding:12px 14px;background:rgba(255,255,255,.06);width:100%}

.wave{padding:18px 24px;border-top:3px solid rgba(0,229,255,.3)}
.wave svg{width:100%;height:96px;display:block}
.wave .wb{fill:var(--c);opacity:.85}

.wctrl{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  margin-top:14px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.16em;color:#c9a8ff}
.btn{font-family:"Courier New",monospace;font-weight:bold;font-size:12px;letter-spacing:.16em;
  padding:10px 20px;background:transparent;color:#00e5ff;border:2px solid #00e5ff;cursor:pointer;
  text-shadow:0 0 10px rgba(0,229,255,.8);transition:.18s}
.btn:hover{background:#00e5ff;color:#12042b;text-shadow:none;box-shadow:0 0 26px rgba(0,229,255,.7)}

.tlist{padding:20px 24px 26px;border-top:3px solid rgba(0,229,255,.3)}
.tlist h3{font-family:"Courier New",monospace;font-size:11px;letter-spacing:.24em;color:var(--sun);
  margin-bottom:14px}
.tl{display:grid;grid-template-columns:34px minmax(0,1fr) 56px;gap:12px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-weight:normal}
.tl:last-child{border-bottom:0}
.tl .n{font-family:"Courier New",monospace;font-size:11px;color:#8f7bc4}
.tl .nm{font-size:15px;color:#fff;font-family:inherit}
.tl .nm em{font-style:normal;display:block;font-family:"Courier New",monospace;font-size:10.5px;
  letter-spacing:.12em;color:#00ffa3;margin-top:5px}
.tl .d{font-family:"Courier New",monospace;font-size:11px;color:#c9a8ff;text-align:right}
.ftr{margin-top:46px;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.34em;
  color:rgba(255,255,255,.6);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function paintShelf(){

  const rnd = () => (s = s * 16807 % 2147483647) / 2147483647;
  const N = 120;
  for (let i = 0; i < N; i++){
    const h = 12 + Math.abs(Math.sin(i / 7 + seed)) * 44 + rnd() * 34;
    g += '<rect class="wb' + (i / N < p ? "" : " past") + '" x="' + (i * (1000 / N) + 1) +
         '" y="' + (48 - h / 2) + '" width="' + (1000 / N - 2) + '" height="' + h + '" rx="1"/>';
  }
  return g;
}
function paintDetail(){
  const e = EP[sel], c = HC[e[4]];
  const p = pos / e[5];
  document.getElementById("detail").innerHTML =
    '<div class="dhead" style="--c:' + c + '"><div class="l">' +
      "<h2>" + e[2] + '</h2><div class="en">' + e[3] + " · 主持：" + e[4] + "</div>" +
      "<p>" + e[7] + '</p><div class="tags">' +
      e[6].map(t => "<span>" + t + "</span>").join("") + "</div></div>" +
      '<div class="r"><div class="sticker"><div class="t">TAPE ' +
        String(1248 - sel).padStart(4, "0") + '</div><div class="n">' + e[2] +
        '</div><div class="d">' + e[0] + "<br>" + e[1] + "<br>" + hms(e[5]) + "</div></div></div></div>" +
    '<div class="wave" style="--c:' + c + '">' +
      '<svg viewBox="0 0 1000 96" preserveAspectRatio="none" role="img" aria-label="' +
        e[2] + ' 整集音訊波形，亮色為已播放段落">' + wave(sel + 1, e[5], p) + "</svg>" +
      '<div class="wctrl"><span>' + mmss(pos) + " / " + mmss(e[5]) + "</span>" +
      '<button class="btn" id="pp">' + (playing ? "❚❚ PAUSE" : "▶ PLAY EPISODE") + "</button>" +
      "<span>BITRATE 320 kbps · STEREO</span></div></div>" +
    '<div class="tlist"><h3>◆ 本集播出曲目（節錄前五首）</h3>' +
      e[8].map((t, i) =>
        '<div class="tl"><span class="n">' + String(i + 1).padStart(2, "0") + '</span>' +
        '<span class="nm">' + t[0] + "<em>" + t[1] + "</em></span>" +
        '<span class="d">' + mmss(t[2]) + "</span></div>").join("") + "</div>";
  document.getElementById("pp").addEventListener("click", () => {
    playing = !playing; paintDetail();
  });
}
document.querySelectorAll(".f").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".f").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  host = b.dataset.h;
  if (host !== "全部"){
    const i = EP.findIndex(e => e[4] === host);
    if (i >= 0){ sel = i; pos = 0; playing = false; }
  }
  paintShelf(); paintDetail();
}));
setInterval(() => {
  if (!playing) return;
  pos = Math.min(pos + 7, EP[sel][5]);
  if (pos >= EP[sel][5]) playing = false;
  paintDetail();
}, 1000);
paintShelf(); paintDetail();
</script>
