<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學生檔案卡冊 － 樂學國小 CLAY CAMPUS</title>
<style>
:root{
  --bg:#f3eefb;--clay:#ffffff;--ink:#4a3f63;--dim:#9c93b5;
  --lav:#b8a6f5;--pink:#ffa8c9;--mint:#8fe3c5;--peach:#ffc59b;--sky:#9fd0ff;--lemon:#ffe58f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding:26px;overflow-x:hidden;
  font-family:"Nunito","Segoe UI Rounded","Varela Round","Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px;background-image:
    radial-gradient(circle at 8% 12%,rgba(184,166,245,.28),transparent 42%),
    radial-gradient(circle at 92% 82%,rgba(255,168,201,.26),transparent 44%),
    radial-gradient(circle at 68% 8%,rgba(143,227,197,.24),transparent 38%)}
.clay{background:var(--clay);border-radius:30px;
  box-shadow:10px 12px 26px rgba(120,100,175,.2),-6px -8px 20px rgba(255,255,255,.95),
    inset 3px 4px 8px rgba(255,255,255,.9),inset -4px -6px 12px rgba(150,130,200,.12)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--lav);outline-offset:3px}

.home{position:fixed;right:26px;bottom:26px;z-index:99;text-decoration:none;color:#fff;
  background:linear-gradient(145deg,#c4b3ff,#9b83e8);padding:16px 26px;border-radius:26px;
  font-weight:800;font-size:14px;letter-spacing:.02em;
  box-shadow:8px 10px 22px rgba(140,110,230,.42),inset 2px 3px 7px rgba(255,255,255,.6),
    inset -3px -4px 9px rgba(90,60,180,.28);transition:.25s}
.home:hover{transform:translateY(-4px) scale(1.03)}
.home:active{transform:translateY(1px)}

.shell{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px}
.brand{display:flex;align-items:center;gap:13px;flex:0 0 auto}
.brand .b{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(145deg,#ffd9ea,#ffa8c9);
  box-shadow:5px 6px 14px rgba(255,120,170,.35),inset 2px 3px 6px rgba(255,255,255,.8),
    inset -3px -4px 8px rgba(220,100,150,.3)}
.brand b{font-size:16px;font-weight:800;display:block;line-height:1.3}
.brand small{font-size:10px;letter-spacing:.16em;color:var(--dim);font-weight:800}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.pills a{text-decoration:none;color:var(--dim);padding:11px 17px;border-radius:18px;font-weight:800;font-size:13px;
  display:flex;align-items:center;gap:7px;transition:.22s}
.pills a:hover{color:var(--ink);background:rgba(184,166,245,.16)}
.pills a[aria-current]{color:#fff;background:linear-gradient(145deg,#c8b8ff,#a48ff0);
  box-shadow:5px 6px 14px rgba(140,110,230,.36),inset 2px 3px 6px rgba(255,255,255,.55),
    inset -3px -4px 9px rgba(90,60,180,.24)}
.pills a i{font-style:normal;font-size:16px}

/* ---------- 檢索台 ---------- */
.desk{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.desk h1{font-size:27px;font-weight:800;letter-spacing:-.02em}
.desk h1 small{display:block;font-size:12.5px;color:var(--dim);font-weight:800;margin-top:5px;letter-spacing:.05em}
.search{display:flex;align-items:center;gap:11px;padding:6px 8px 6px 18px;border-radius:22px;min-width:260px;
  box-shadow:inset 4px 5px 11px rgba(140,110,200,.2),inset -3px -4px 9px rgba(255,255,255,.95)}
.search span{font-size:17px}
.search input{border:0;background:transparent;font:inherit;font-weight:800;font-size:14px;color:var(--ink);
  padding:11px 4px;width:100%;min-width:0}
.search input::placeholder{color:var(--dim);font-weight:700}
.search button{border:0;background:linear-gradient(145deg,#ffdeeb,#ffb9d4);color:#a3335e;cursor:pointer;
  font:inherit;font-weight:800;font-size:12px;padding:10px 14px;border-radius:16px;flex:0 0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;padding-top:4px}
.fchip{font-family:inherit;font-weight:800;font-size:12.5px;border:0;cursor:pointer;color:var(--dim);
  background:var(--clay);padding:10px 16px;border-radius:17px;transition:.2s;
  box-shadow:5px 6px 13px rgba(120,100,175,.16),-3px -4px 10px rgba(255,255,255,.9),
    inset 2px 2px 5px rgba(255,255,255,.9),inset -2px -3px 7px rgba(150,130,200,.12)}
.fchip:hover{transform:translateY(-2px);color:var(--ink)}
.fchip[aria-pressed="true"]{color:#fff;background:linear-gradient(145deg,#c8b8ff,#a48ff0);
  box-shadow:5px 6px 14px rgba(140,110,230,.36),inset 2px 3px 6px rgba(255,255,255,.5),
    inset -3px -4px 9px rgba(90,60,180,.24)}
.fchip em{font-style:normal;opacity:.8;margin-left:5px;font-size:11px}

/* ---------- 冊頁跨頁 ---------- */
.spread{display:grid;grid-template-columns:340px minmax(0,1fr);overflow:hidden;position:relative}
.leaf{padding:30px}
.leaf.l{box-shadow:inset -18px 0 26px -18px rgba(150,130,200,.4)}
.leaf.r{box-shadow:inset 18px 0 26px -18px rgba(150,130,200,.4)}
.pagectl{position:absolute;right:22px;top:22px;display:flex;gap:9px;align-items:center;z-index:3}
.pbtn{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:14px;color:var(--ink);background:var(--clay);
  width:44px;height:44px;border-radius:16px;transition:.2s;
  box-shadow:5px 6px 13px rgba(120,100,175,.2),-3px -4px 10px rgba(255,255,255,.9),
    inset 2px 2px 5px rgba(255,255,255,.9),inset -2px -3px 7px rgba(150,130,200,.14)}
.pbtn:hover{transform:translateY(-3px)}
.pbtn:active{transform:translateY(1px);box-shadow:inset 4px 5px 11px rgba(150,130,200,.28)}
.pnum{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.06em;white-space:nowrap}

.face{display:flex;flex-direction:column;align-items:center;text-align:center}
.frame{width:172px;height:172px;border-radius:44px;display:grid;place-items:center;padding:8px;
  box-shadow:inset 5px 6px 13px rgba(140,110,200,.22),inset -4px -5px 12px rgba(255,255,255,.95)}
.frame svg{width:100%;height:100%;display:block;filter:drop-shadow(4px 6px 12px rgba(120,100,175,.28))}
.face h2{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:18px 0 8px}
.tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chip{font-size:11px;padding:6px 13px;border-radius:14px;font-weight:800;display:inline-block;
  box-shadow:inset 2px 2px 5px rgba(255,255,255,.72),inset -2px -3px 7px rgba(140,110,200,.2)}
.ok{background:linear-gradient(145deg,#c9f2e2,#9de8cd);color:#2c7a5f}
.wn{background:linear-gradient(145deg,#ffe6cf,#ffcda8);color:#9c5c1e}
.bd{background:linear-gradient(145deg,#ffdeeb,#ffb9d4);color:#a3335e}
.nu{background:linear-gradient(145deg,#e3daff,#cfbdff);color:#5b45ae}
.sy{background:linear-gradient(145deg,#dfeeff,#b6dcff);color:#25628f}

.info{width:100%;display:flex;flex-direction:column;gap:0;margin-bottom:22px}
.ir{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:9px 0;text-align:left;
  border-bottom:2px dotted rgba(156,147,181,.26);font-size:12.5px;font-weight:800}
.ir:last-child{border-bottom:0}
.ir dt{color:var(--dim)}
.ir dd{color:var(--ink)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.ring{text-align:center}
.ring svg{display:block;margin:0 auto;filter:drop-shadow(3px 4px 9px rgba(120,100,175,.24))}
.ring b{display:block;font-size:12.5px;font-weight:800;margin-top:8px}
.ring small{display:block;font-size:10.5px;color:var(--dim);font-weight:800;margin-top:2px}
.rv{font-size:16px;font-weight:800;fill:#4a3f63}

.sect{font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--dim);margin:28px 0 14px;
  display:flex;align-items:center;gap:12px}
.sect::after{content:"";flex:1;height:2px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(156,147,181,.34) 0 5px,transparent 5px 10px)}
.leaf.r .sect:first-child{margin-top:0}
.scorebox{overflow-x:auto}
.scorebox svg{display:block;width:100%;min-width:330px;height:auto}
.sl{font-size:12px;font-weight:800;fill:#4a3f63}
.sv{font-size:12px;font-weight:800;fill:#7d5fe0}
.sd{font-size:9.5px;font-weight:800;fill:#9c93b5}

.tl{position:relative;padding-left:30px;margin-top:2px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:4px;border-radius:3px;
  background:linear-gradient(180deg,#ded0ff,#ffd9ea)}
.tv{position:relative;padding:0 0 20px}
.tv:last-child{padding-bottom:0}
.tv::before{content:"";position:absolute;left:-27px;top:3px;width:18px;height:18px;border-radius:7px;
  box-shadow:inset 1px 2px 4px rgba(255,255,255,.8),inset -2px -3px 6px rgba(120,90,180,.3)}
.tv.c0::before{background:linear-gradient(145deg,#d5c8ff,#b8a6f5)}
.tv.c1::before{background:linear-gradient(145deg,#b6f0dc,#8fe3c5)}
.tv.c2::before{background:linear-gradient(145deg,#ffdcc0,#ffc59b)}
.tv.c3::before{background:linear-gradient(145deg,#ffd0e3,#ffa8c9)}
.tv.c4::before{background:linear-gradient(145deg,#cfe6ff,#9fd0ff)}
.tv .d{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.08em}
.tv .h{font-size:14.5px;font-weight:800;margin:2px 0 4px}
.tv .x{font-size:12.5px;font-weight:700;color:#7b7095;line-height:1.85}
.comment{margin-top:22px;padding:18px 20px;border-radius:22px;
  background:linear-gradient(145deg,#fff8e2,#ffeeb8);
  box-shadow:inset 3px 4px 9px rgba(255,255,255,.8),inset -4px -5px 12px rgba(210,170,40,.22)}
.comment b{display:block;font-size:12.5px;color:#8a6c14;letter-spacing:.1em;margin-bottom:7px}
.comment p{font-size:13px;font-weight:700;color:#7a5f14;line-height:1.9}

/* ---------- 索引條 ---------- */
.idx{padding:22px 24px}
.idxhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.idxhead h2{font-size:17px;font-weight:800}
.idxhead p{font-size:12px;font-weight:800;color:var(--dim);margin-left:auto}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{border:0;cursor:pointer;font:inherit;background:var(--clay);padding:9px 8px 8px;border-radius:20px;
  width:82px;text-align:center;transition:.2s;
  box-shadow:5px 6px 13px rgba(120,100,175,.16),-3px -4px 10px rgba(255,255,255,.9),
    inset 2px 2px 5px rgba(255,255,255,.9),inset -2px -3px 7px rgba(150,130,200,.12)}
.tile:hover{transform:translateY(-4px)}
.tile svg{width:48px;height:48px;display:block;margin:0 auto 5px}
.tile b{display:block;font-size:11.5px;font-weight:800;color:var(--ink);line-height:1.3}
.tile small{display:block;font-size:9.5px;font-weight:800;color:var(--dim)}
.tile[aria-pressed="true"]{background:linear-gradient(145deg,#e3daff,#c8b8ff);
  box-shadow:6px 8px 17px rgba(140,110,230,.36),inset 2px 3px 6px rgba(255,255,255,.6),
    inset -3px -4px 9px rgba(90,60,180,.2)}
.tile[aria-pressed="true"] b{color:#4a3f63}
.empty{padding:26px;text-align:center;color:var(--dim);font-weight:800;width:100%}
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px;
  border-top:2px dotted rgba(156,147,181,.3);padding-top:18px}
.su{padding:13px 15px;border-radius:19px;
  box-shadow:inset 2px 3px 6px rgba(255,255,255,.78),inset -3px -4px 9px rgba(140,110,200,.18)}
.su small{display:block;font-size:11px;font-weight:800;color:var(--dim)}
.su b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.u1{background:linear-gradient(145deg,#ece5ff,#ded0ff)}
.u2{background:linear-gradient(145deg,#e6f9f1,#c9f2e2)}
.u3{background:linear-gradient(145deg,#fff2e2,#ffe6cf)}
.u4{background:linear-gradient(145deg,#ffeef5,#ffdeeb)}
.u5{background:linear-gradient(145deg,#e7f2ff,#d3e8ff)}
.ftr{text-align:center;font-size:11px;color:var(--dim);font-weight:800;letter-spacing:.22em;padding:10px 0 44px}

@media(max-width:960px){
  .spread{grid-template-columns:1fr}
  .leaf.l{box-shadow:inset 0 -18px 26px -18px rgba(150,130,200,.4)}
  .leaf.r{box-shadow:none}
  .pagectl{position:static;justify-content:flex-end;padding:16px 22px 0}
  .desk{grid-template-columns:1fr}
}
@media(max-width:900px){
  .leaf{padding:24px}
  .face h2{font-size:22px}
  .frame{width:152px;height:152px;border-radius:40px}
  .search{min-width:0;width:100%}
}
@media(max-width:640px){
  body{padding:14px}
  .desk h1{font-size:22px}
  .leaf{padding:20px}
  .idx{padding:18px}
  .tile{width:72px}
  .pills{width:100%;margin-left:0}
  .pills a{padding:9px 12px;font-size:12px}
  .home{right:14px;bottom:14px;padding:13px 20px}
  .rings{grid-template-columns:1fr 1fr 1fr;gap:6px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var c="";
  if(i===6) c="小明個性熱心、體育課總是最投入的一個，但數學抽象概念需要更多具體操作。已與家長約定每天 20 分鐘計算練習，並由潘怡臻老師接手課後補救；本學期作業繳交 46 / 55 件，請家長協助每晚檢查聯絡簿。";
  else if(i===17) c="承翰這學期的轉變讓我印象深刻：作業從不遲交、上課主動舉手，自然與社會兩科都拿下 98 分。已推薦他擔任下學期學藝股長，並鼓勵報名校內科學閱讀營。";
  else if(i===24) c="柏睿對自然科的好奇心很強，落葉分解實驗連續記錄六週，資料整理得相當完整。國語 97 分也顯示他的表達能力在進步，建議持續投入科展寫作。";
  else if(i===21) c="雅婷在小組討論裡總是願意先聽別人說話，是很好的組員。五科成績分佈平均但都在班平均之下，英語口說補考前已安排每週一次午休練習，請家長多給予鼓勵。";
  else if(i===11) c="怡君擔任午餐股長非常盡責，六月因病請假兩天，回校後主動找小老師補齊社會科進度，社會拿到全班第一的 97 分，值得肯定。";
  else if(a>=93) c=s.n.slice(1)+"的學習穩定度高，五科都在班平均之上，"+SUBN[bestOf(s)]+"表現尤其突出。建議在"+s.cl+"之外，可挑戰校內跨年級的進階課程，把餘裕轉成更深入的探究。";
  else if(a>=86) c=s.n.slice(1)+"上課專注、作業完成度佳（"+s.hw+" / 55 件），本次段考"+(d>=0?"進步 "+fx(d):"略退 "+fx(-d))+" 分。"+SUBN[worstOf(s)]+"是目前相對弱項，已安排小老師共讀，維持現在的節奏就很好。";
  else if(a>=80) c=s.n.slice(1)+"在"+s.cl+"活動中很有責任感，課業上"+SUBN[bestOf(s)]+"表現不錯，"+SUBN[worstOf(s)]+"（"+s.g[worstOf(s)]+" 分）需要多花時間。已把每日回家作業拆成兩段，降低一次完成的壓力。";
  else c=s.n.slice(1)+"這學期五科平均 "+fx(a)+" 分，"+SUBN[worstOf(s)]+"僅 "+s.g[worstOf(s)]+" 分，落差主要在基本題型的熟練度。已編入課後學習扶助小組（每週二、四第 6 節），並請家長於聯絡簿簽名確認練習完成。";
  $("sCmt").innerHTML=c;
  var v=visible(), k=v.indexOf(i);
  $("pnum").textContent=k<0?"不在目前篩選內":"第 "+(k+1)+" / "+v.length+" 張";
}
function bestOf(s){var b=0,k;for(k=1;k<5;k++)if(s.g[k]>s.g[b])b=k;return b;}
function worstOf(s){var b=0,k;for(k=1;k<5;k++)if(s.g[k]<s.g[b])b=k;return b;}

/* ---------- 索引 ---------- */
function drawIndex(){
  var v=visible();
  $("tiles").innerHTML=v.length?v.map(function(i){
    var s=ST[i];
    return '<button type="button" class="tile" data-i="'+i+'" aria-pressed="'+(i===S.sel)+
      '" aria-label="'+s.n+" 座號 "+pad(i+1)+"，五科平均 "+fx(avg5(s.g))+' 分">'+
      avatar(i,"tl")+"<b>"+s.n+"</b><small>座號 "+pad(i+1)+"</small></button>";
  }).join(""):'<div class="empty">找不到符合「'+S.q+'」的學生，請換個關鍵字或按「清除」。</div>';
  $("idxNote").textContent="顯示 "+v.length+" / 28 位　·　點頭像即可翻到該張卡片";
  var perfect=ST.filter(function(s){return s.av.length===0;}).length;
  var hwsum=ST.reduce(function(t,s){return t+s.hw;},0);
  var cavg=AVG.reduce(function(t,x){return t+x;},0)/28;
  $("sums").innerHTML=
    '<div class="su u1"><small>班級人數</small><b>28<em style="font-size:13px;font-style:normal;color:#9c93b5"> 人</em></b></div>'+
    '<div class="su u2"><small>男 / 女</small><b>15 / 13</b></div>'+
    '<div class="su u3"><small>六月全勤</small><b>'+perfect+'<em style="font-size:13px;font-style:normal;color:#9c93b5"> 人</em></b></div>'+
    '<div class="su u4"><small>作業繳交率</small><b>'+(hwsum/1540*100).toFixed(1)+"%</b></div>"+
    '<div class="su u5"><small>班級平均</small><b>'+fx(cavg)+"</b></div>";
}
$("tiles").addEventListener("click",function(e){
  var b=e.target.closest("[data-i]"); if(!b) return;
  S.sel=+b.dataset.i; render();
});

function render(){ drawFilters(); drawLeaf(); drawRight(); drawIndex(); }
render();
</script>
</body>
</html>
