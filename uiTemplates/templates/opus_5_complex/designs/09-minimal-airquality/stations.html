<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>測站總覽 — AIR · 空品監測</title>
<style>
:root{--w:#fbfbfa;--k:#111;--g:#9a9a97;--hair:#e3e3e0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--w);color:var(--k);font-weight:300;-webkit-font-smoothing:antialiased;
  font-family:"Helvetica Neue",Helvetica,Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif}
a:focus-visible,button:focus-visible{outline:1px solid var(--k);outline-offset:4px}
.home{position:fixed;left:32px;top:32px;z-index:50;text-decoration:none;color:var(--k);
  font-size:11px;letter-spacing:.34em;text-transform:uppercase;padding-bottom:4px;
  border-bottom:1px solid var(--k);transition:.4s cubic-bezier(.2,.8,.2,1)}
.home:hover{letter-spacing:.5em;opacity:.5}

.page{max-width:1180px;margin:0 auto;padding:0 32px}
.top{display:flex;justify-content:flex-end;align-items:baseline;gap:44px;padding:34px 0 0;
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--g)}
.top b{color:var(--k);font-weight:400}
.subnav{display:flex;margin-top:28px;border-top:1px solid var(--k);border-bottom:1px solid var(--hair);
  font-size:10px;letter-spacing:.28em;text-transform:uppercase}
.subnav a{text-decoration:none;color:var(--g);padding:14px 20px;border-right:1px solid var(--hair);
  transition:.25s;white-space:nowrap}
.subnav a:first-child{padding-left:0}
.subnav a:last-child{border-right:none}
.subnav a.active{color:var(--k);box-shadow:inset 0 -2px 0 0 var(--k)}
.subnav a:hover{color:var(--k)}
.label{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--g)}

.hd{padding:76px 0 0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:end}
@media(max-width:860px){.hd{grid-template-columns:1fr;gap:30px}}
.hd h1{font-size:clamp(34px,5.6vw,70px);font-weight:200;letter-spacing:-.035em;line-height:1.05;margin-top:22px}
.hd .sum{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--k)}
.hd .sum div{padding:16px 16px 16px 0;border-bottom:1px solid var(--hair);border-right:1px solid var(--hair)}
.hd .sum div:nth-child(even){padding-left:16px;padding-right:0;border-right:0}
.hd .sum .k{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--g)}
.hd .sum .v{font-size:32px;font-weight:200;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums}

.regions{display:flex;margin-top:46px;border-top:1px solid var(--k);border-bottom:1px solid var(--hair);flex-wrap:wrap}
.rb{appearance:none;background:none;border:0;border-right:1px solid var(--hair);cursor:pointer;
  font:inherit;color:var(--g);font-size:11.5px;letter-spacing:.24em;padding:16px 22px;transition:.25s}
.rb:last-child{border-right:0}
.rb:hover{color:var(--k)}
.rb[aria-pressed="true"]{color:var(--k);box-shadow:inset 0 -2px 0 0 var(--k)}

/* ---------- dot map ---------- */
.maprow{margin-top:66px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:48px;align-items:start}
@media(max-width:900px){.maprow{grid-template-columns:1fr;gap:30px}}
.map svg{width:100%;height:auto;display:block;overflow:visible}
.coast{fill:none;stroke:var(--hair);stroke-width:1}
.riv{fill:none;stroke:var(--hair);stroke-width:1.5;stroke-dasharray:5 5}
.pin{cursor:pointer}
.pin circle{stroke:var(--k);stroke-width:1;transition:.25s}
.pin:hover circle,.pin.on circle{stroke-width:2.4}
.pin.dim{opacity:.16}
.pin text{font-size:10px;fill:var(--k);letter-spacing:.04em}
.pin.dim text{opacity:0}
.mlegend{display:flex;flex-wrap:wrap;gap:24px;margin-top:26px;font-size:10.5px;
  letter-spacing:.2em;color:var(--g);text-transform:uppercase;align-items:center}
.mlegend s{display:inline-block;border:1px solid var(--k);border-radius:50%;
  text-decoration:none;vertical-align:middle;margin-right:8px}

.detail{border-top:1px solid var(--k);padding-top:22px}
.detail .nm{font-size:30px;font-weight:200;letter-spacing:-.02em}
.detail .en{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--g);margin-top:8px}
.detail .aqi{font-size:76px;font-weight:200;letter-spacing:-.05em;line-height:1;margin:22px 0 6px;
  font-variant-numeric:tabular-nums}
.detail .gr{font-size:13px;letter-spacing:.1em;color:#55554f;margin-bottom:20px}
.detail dl div{display:flex;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid var(--hair);font-size:12.5px}
.detail dt{color:var(--g);letter-spacing:.1em}
.detail dd{font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.tbl{margin-top:104px;padding-bottom:120px}
.trow{display:grid;grid-template-columns:minmax(120px,1.4fr) minmax(80px,.8fr) minmax(66px,.6fr)
  minmax(90px,.9fr) repeat(4,minmax(62px,.6fr)) minmax(66px,.6fr);
  gap:14px;align-items:center;padding:19px 0;border-bottom:1px solid var(--hair);
  transition:padding .5s cubic-bezier(.2,.8,.2,1);font-variant-numeric:tabular-nums;cursor:default}
.trow.head{border-bottom:1px solid var(--k);padding:0 0 14px;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--g)}
.trow.head button{appearance:none;background:none;border:0;cursor:pointer;font:inherit;
  color:inherit;padding:0;text-align:inherit;transition:.25s}
.trow.head button:hover{color:var(--k)}
.trow:not(.head):hover,.trow.on{padding-left:12px;background:rgba(17,17,17,.02)}
.trow.hide{display:none}
.trow span{text-align:right}
.trow .nm{text-align:left;font-size:16px}
.trow .nm em{font-style:normal;display:block;font-size:9.5px;letter-spacing:.22em;
  color:var(--g);margin-top:6px;text-transform:uppercase}
.trow .di{text-align:left;font-size:12.5px;color:var(--g)}
.trow .aq{font-size:22px;font-weight:200}
.trow .st{font-size:11px;letter-spacing:.14em;color:#55554f}
.grp{padding:34px 0 12px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--g);
  border-bottom:1px solid var(--k)}
.grp.hide{display:none}
.ftr{border-top:1px solid var(--k);padding:22px 0 60px;display:flex;justify-content:space-between;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--g);flex-wrap:wrap;gap:12px}
@media(max-width:900px){
  .trow{grid-template-columns:1.4fr .8fr .6fr .9fr}
  .trow.head{display:none}
  .trow span:nth-child(n+5){display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="home" href="../../index.html">Index</a>

<div class="page">
  <div class="top">
    <span>臺北都會 · 全區測站</span><span>2026.08.28</span><span><b id="t">19:47</b></span>
  </div>
  <nav class="subnav">
    <a href="index.html">← 即時首頁</a>
    <a href="stations.html" class="active">測站總覽</a>
    <a href="history.html">歷史資料</a>
    <a href="forecast.html">未來預報</a>
  </nav>

  <section class="hd">
    <div>
      <div class="label">Monitoring Network — 空品測站網絡</div>
      <h1>全區 22 個測站<br>即時空品資料</h1>
    </div>
    <div class="sum" id="sum"></div>
  </section>

  <div class="regions" id="regions"></div>

  <section class="maprow">
    <div class="map">
      <svg id="map" viewBox="0 0 800 580" role="img"
           aria-label="臺北都會區測站分佈點圖，圓點大小與明度對應 AQI 數值"></svg>
      <div class="mlegend">
        <span><s style="width:10px;height:10px;background:#f2f2f0"></s>AQI 20</span>
        <span><s style="width:14px;height:14px;background:#c8c8c3"></s>40</span>
        <span><s style="width:18px;height:18px;background:#8a8a85"></s>60</span>
        <span><s style="width:22px;height:22px;background:#111"></s>80+</span>
        <span>虛線為淡水河與基隆河</span>
      </div>
    </div>
    <aside class="detail" id="detail"></aside>
  </section>

  <section class="tbl">
    <div class="label" style="margin-bottom:30px">Station Table — 測站明細（點欄位標題排序）</div>
    <div class="trow head">
      <button data-s="0" style="text-align:left">測站名稱 ↕</button>
      <button data-s="1" style="text-align:left">行政區</button>
      <button data-s="2">AQI ↕</button>
      <span>狀態</span>
      <button data-s="4">PM₂.₅ ↕</button>
      <button data-s="5">PM₁₀ ↕</button>
      <button data-s="6">O₃ ↕</button>
      <button data-s="7">NO₂ ↕</button>
      <span>更新</span>
    </div>
    <div id="rows"></div>
  </section>

  <div class="ftr">
    <span>Air Quality Monitoring</span><span>Swiss Minimal · Hairline Grid</span><span>Design 09 / 40</span>
  </div>
</div>

<script>
// [名, 行政區, AQI, 英文, PM2.5, PM10, O3, NO2, 區域, x, y, 更新]
const ST = [
  ["中山","中山區",42,"Zhongshan",12,28,54,9,"北",400,278,"19:45"],
  ["士林","士林區",38,"Shilin",11,25,49,7,"北",382,188,"19:45"],
  ["大同","大同區",45,"Datong",13,30,56,11,"北",342,258,"19:40"],
  ["松山","松山區",41,"Songshan",12,27,52,10,"北",492,272,"19:45"],
  ["內湖","內湖區",39,"Neihu",11,26,50,8,"北",562,222,"19:40"],
  ["南港","南港區",43,"Nangang",12,29,55,9,"北",622,296,"19:45"],
  ["古亭","中正區",44,"Guting",13,29,55,10,"南",382,346,"19:45"],
  ["萬華","萬華區",52,"Wanhua",16,35,61,13,"南",322,346,"19:40"],
  ["大安","大安區",46,"Daan",14,31,57,11,"南",432,346,"19:45"],
  ["中正","中正區",47,"Zhongzheng",14,32,58,12,"南",372,316,"19:45"],
  ["文山","文山區",35,"Wenshan",9,23,46,6,"南",432,446,"19:40"],
  ["信義","信義區",45,"Xinyi",13,30,56,11,"南",492,346,"19:45"],
  ["板橋","板橋區",58,"Banqiao",18,39,66,15,"新北",252,376,"19:40"],
  ["三重","三重區",61,"Sanchong",19,41,68,17,"新北",282,262,"19:45"],
  ["新莊","新莊區",56,"Xinzhuang",17,38,64,14,"新北",192,296,"19:40"],
  ["永和","永和區",53,"Yonghe",16,36,62,13,"新北",342,400,"19:45"],
  ["汐止","汐止區",44,"Xizhi",13,29,55,10,"新北",690,246,"19:40"],
  ["淡水","淡水區",33,"Tamsui",9,22,44,6,"新北",232,96,"19:45"],
  ["陽明山","北投區",26,"Yangmingshan",7,17,38,4,"山區",420,116,"19:30"],
  ["觀音山","五股區",29,"Guanyinshan",8,19,41,5,"山區",162,156,"19:30"],
  ["大屯","北投區",24,"Datun",6,16,36,4,"山區",372,86,"19:30"],
  ["二格山","文山區",28,"Erge",7,18,40,5,"山區",512,476,"19:30"]
];
const REGIONS = ["全部","北","南","新北","山區"];
const RNAME = {"北":"臺北北區 · NORTHERN TAIPEI","南":"臺北南區 · SOUTHERN TAIPEI",
               "新北":"新北周邊 · NEW TAIPEI","山區":"山區 · MOUNTAIN"};
let region = "全部", sel = 0, sortCol = 2, sortDir = 1;

const tone = v => v >= 80 ? "#111" : v >= 60 ? "#54544f" : v >= 45 ? "#8a8a85" :
                  v >= 35 ? "#c8c8c3" : "#f2f2f0";
const grade = v => v >= 151 ? "不良" : v >= 101 ? "敏感族群不良" : v >= 51 ? "普通" : "良好";
const rad = v => 5 + v / 8;

document.getElementById("regions").innerHTML = REGIONS.map(r => {
  const n = r === "全部" ? ST.length : ST.filter(s => s[8] === r).length;
  return '<button class="rb" data-r="' + r + '" aria-pressed="' + (r === "全部") + '">' +
    (r === "全部" ? "全部 / ALL" : RNAME[r].split(" · ")[0]) + " (" + n + ")</button>";
}).join("");

function paintMap(){
  let g = '<path class="coast" d="M120 40 C200 20 320 30 420 60 C540 96 640 90 720 130 ' +
          'C760 200 770 320 700 420 C620 520 460 560 340 520 C210 476 120 380 110 260 Z"/>' +
          '<path class="riv" d="M232 110 C280 200 300 260 330 330 C356 392 400 440 430 470"/>' +
          '<path class="riv" d="M690 250 C610 280 520 300 430 310 C380 316 350 320 330 330"/>';
  ST.forEach((s, i) => {
    const dim = region !== "全部" && s[8] !== region;
    g += '<g class="pin' + (i === sel ? " on" : "") + (dim ? " dim" : "") + '" data-i="' + i + '">' +
      '<circle cx="' + s[9] + '" cy="' + s[10] + '" r="' + rad(s[2]).toFixed(1) +
      '" fill="' + tone(s[2]) + '"/>' +
      '<text x="' + s[9] + '" y="' + (s[10] - rad(s[2]) - 7) + '" text-anchor="middle">' +
      s[0] + " " + s[2] + "</text></g>";
  });
  const m = document.getElementById("map");
  m.innerHTML = g;
  m.querySelectorAll(".pin").forEach(p => p.addEventListener("click", () => {
    sel = +p.dataset.i; paintAll();
  }));
}
function paintDetail(){
  const s = ST[sel];
  document.getElementById("detail").innerHTML =
    '<div class="nm">' + s[0] + '</div><div class="en">' + s[3] + " · " + s[1] + "</div>" +
    '<div class="aqi">' + s[2] + '</div><div class="gr">' + grade(s[2]) + " / AQI 指標</div><dl>" +
    [["PM₂.₅", s[4] + " μg/m³"], ["PM₁₀", s[5] + " μg/m³"], ["O₃ 8hr", s[6] + " ppb"],
     ["NO₂", s[7] + " ppb"], ["所屬區域", RNAME[s[8]].split(" · ")[0]], ["最後更新", s[11]]]
    .map(([k, v]) => "<div><dt>" + k + "</dt><dd>" + v + "</dd></div>").join("") + "</dl>";
}
function paintTable(){
  const list = ST.map((s, i) => [s, i]).sort((a, b) => {
    const x = a[0][sortCol], y = b[0][sortCol];
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "zh-Hant")) * sortDir;
  });
  document.getElementById("rows").innerHTML = list.map(([s, i]) =>
    '<div class="trow' + (i === sel ? " on" : "") +
      (region !== "全部" && s[8] !== region ? " hide" : "") + '" data-i="' + i + '">' +
      '<span class="nm">' + s[0] + "<em>" + s[3] + '</em></span><span class="di">' + s[1] + "</span>" +
      '<span class="aq">' + s[2] + '</span><span class="st">' + grade(s[2]) + "</span>" +
      "<span>" + s[4] + "</span><span>" + s[5] + "</span><span>" + s[6] + "</span><span>" + s[7] + "</span>" +
      '<span style="color:var(--g);font-size:11px">' + s[11] + "</span></div>").join("");
  document.querySelectorAll("#rows .trow").forEach(r => {
    r.addEventListener("mouseenter", () => { sel = +r.dataset.i; paintMap(); paintDetail(); });
  });
}
function paintSum(){
  const list = region === "全部" ? ST : ST.filter(s => s[8] === region);
  const avg = Math.round(list.reduce((a, s) => a + s[2], 0) / list.length);
  const mx = list.reduce((a, s) => s[2] > a[2] ? s : a);
  const mn = list.reduce((a, s) => s[2] < a[2] ? s : a);
  document.getElementById("sum").innerHTML =
    [["測站數", list.length], ["區域均值", avg],
     ["最高 " + mx[0], mx[2]], ["最低 " + mn[0], mn[2]]]
    .map(([k, v]) => '<div><div class="k">' + k + '</div><div class="v">' + v + "</div></div>").join("");
}
function paintAll(){ paintMap(); paintDetail(); paintTable(); paintSum(); }

document.querySelectorAll(".rb").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".rb").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  region = b.dataset.r;
  if (region !== "全部"){
    const first = ST.findIndex(s => s[8] === region);
    if (first >= 0) sel = first;
  }
  paintAll();
}));
document.querySelectorAll(".trow.head button").forEach(b => b.addEventListener("click", () => {
  const c = +b.dataset.s;
  sortDir = (c === sortCol) ? -sortDir : 1;
  sortCol = c;
  paintTable();
}));
paintAll();

let mins = 19 * 60 + 47;
setInterval(() => {
  mins = (mins + 1) % 1440;
  document.getElementById("t").textContent =
    String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0");
}, 60000);
</script>
</body>
</html>
