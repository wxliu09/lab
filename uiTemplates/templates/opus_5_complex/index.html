<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40 套版面設計目錄 — Design Catalogue</title>
<style>
  :root{
    --ink:#0b0b0f;
    --paper:#f2f0e9;
    --accent:#ff3b1f;
    --accent2:#00e0a4;
    --muted:#8a8a94;
    --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* ---- animated backdrop ---- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden}
  .bg::before{
    content:"";position:absolute;inset:-30%;
    background:
      radial-gradient(40vw 40vw at 15% 20%, rgba(255,59,31,.22), transparent 60%),
      radial-gradient(45vw 45vw at 85% 30%, rgba(0,224,164,.16), transparent 60%),
      radial-gradient(50vw 50vw at 50% 90%, rgba(90,80,255,.20), transparent 60%);
    filter:blur(20px);
    animation:drift 24s ease-in-out infinite alternate;
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:80px 80px;
    mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 78%);
    opacity:.5;
  }
  @keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.1)}}

  .wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,56px) 100px}

  /* ---- header ---- */
  header{padding:clamp(48px,9vh,110px) 0 34px}
  .kicker{
    font-family:"Consolas",ui-monospace,monospace;font-size:12px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--accent2);margin-bottom:22px;
  }
  h1{
    font-size:clamp(46px,10.5vw,150px);line-height:.86;letter-spacing:-.04em;
    font-weight:800;text-transform:uppercase;
  }
  h1 span{
    display:block;
    background:linear-gradient(96deg,#fff 0%,#fff 42%,var(--accent) 58%,var(--accent2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:220% 100%;animation:sweep 9s linear infinite;
  }
  @keyframes sweep{to{background-position:220% 0}}
  .lede{
    margin-top:26px;max-width:62ch;color:#c9c8d2;font-size:clamp(14px,1.5vw,17px);line-height:1.85;
  }
  .stats{display:flex;flex-wrap:wrap;gap:36px;margin-top:34px;
    font-family:"Consolas",ui-monospace,monospace;font-size:12px;letter-spacing:.12em;color:var(--muted)}
  .stats b{display:block;font-size:30px;color:#fff;letter-spacing:-.02em;font-family:inherit}

  /* ---- filter bar ---- */
  .bar{
    position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:16px 0;margin-bottom:26px;
    background:linear-gradient(180deg,rgba(11,11,15,.96) 70%,rgba(11,11,15,0));
    backdrop-filter:blur(6px);
  }
  .chip{
    border:1px solid rgba(255,255,255,.24);background:transparent;color:#dcdce4;
    padding:9px 20px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;
    letter-spacing:.06em;transition:.22s;
  }
  .chip:hover{border-color:#fff;color:#fff}
  .chip[aria-pressed="true"]{background:var(--paper);color:#0b0b0f;border-color:var(--paper);font-weight:700}
  .search{
    flex:1;min-width:180px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
    color:#fff;padding:9px 16px;border-radius:999px;font:inherit;font-size:13px;outline:none;
  }
  .search:focus{border-color:var(--accent2)}
  .prog{font-family:"Consolas",monospace;font-size:12px;color:var(--muted);white-space:nowrap}

  /* ---- grid ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
  .card{
    position:relative;display:block;text-decoration:none;color:inherit;
    border:1px solid rgba(255,255,255,.14);border-radius:4px;
    background:rgba(255,255,255,.035);
    padding:20px 20px 22px;min-height:184px;overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),background .28s,border-color .28s;
  }
  .card::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transform:scaleX(0);transform-origin:0 50%;transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover{transform:translateY(-6px);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4)}
  .card:hover::after{transform:scaleX(1)}
  .card .no{
    font-family:"Consolas",monospace;font-size:44px;line-height:1;font-weight:700;
    color:rgba(255,255,255,.16);letter-spacing:-.03em;transition:color .28s;
  }
  .card:hover .no{color:var(--accent)}
  .card .cat{
    display:inline-block;margin:14px 0 10px;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;padding:3px 9px;border-radius:2px;font-family:"Consolas",monospace;
  }
  .cat.public{background:rgba(255,59,31,.16);color:#ff8f7a;border:1px solid rgba(255,59,31,.4)}
  .cat.mis{background:rgba(0,224,164,.13);color:#5ef0c6;border:1px solid rgba(0,224,164,.35)}
  .card h3{font-size:19px;letter-spacing:-.01em;margin-bottom:8px;font-weight:700}
  .card p{font-size:12.5px;line-height:1.7;color:#a7a7b3}
  .card .go{
    position:absolute;top:18px;right:18px;font-size:18px;color:#fff;opacity:0;
    transform:translateX(-6px);transition:.28s;
  }
  .card:hover .go{opacity:1;transform:none}

  .card.todo{opacity:.42;pointer-events:none;filter:grayscale(.6)}
  .card.todo .badge{
    position:absolute;top:16px;right:16px;font-family:"Consolas",monospace;font-size:10px;
    letter-spacing:.16em;border:1px dashed rgba(255,255,255,.4);padding:3px 8px;color:#bbb;
  }
  .card .sub{
    display:inline-flex;align-items:center;gap:5px;margin-top:12px;font-family:"Consolas",monospace;
    font-size:10.5px;letter-spacing:.12em;color:#7d7d8c;
    border-top:1px solid rgba(255,255,255,.09);padding-top:10px;width:100%;transition:color .28s;
  }
  .card .sub i{font-style:normal;color:var(--accent);font-weight:700}
  .card:hover .sub{color:#d6d6e0}

  footer{margin-top:70px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12);
    font-family:"Consolas",monospace;font-size:11.5px;color:var(--muted);letter-spacing:.1em;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
  @media(max-width:640px){ .bar{position:static} h1{letter-spacing:-.02em} }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <header>
    <div class="kicker">Interface Design Study · 2026</div>
    <h1>Forty<span>Layouts</span></h1>
    <p class="lede">四十套彼此互斥的介面語彙研究：二十套面向大眾的公開資訊展示頁，二十套面向操作者的 MIS 管理系統。每一套從配色、字體、網格到動態細節都刻意拉開距離，追求第一眼的記憶點。</p>
    <div class="stats">
      <div><b id="s-all">40</b>TOTAL LAYOUTS</div>
      <div><b>20</b>PUBLIC INFO SITES</div>
      <div><b>20</b>MIS CONSOLES</div>
      <div><b id="s-done">0</b>COMPLETED</div>
      <div><b id="s-pages">0</b>TOTAL SCREENS</div>
    </div>
  </header>

  <nav class="bar">
    <button class="chip" data-f="all" aria-pressed="true">全部 40</button>
    <button class="chip" data-f="public" aria-pressed="false">公開展示型 20</button>
    <button class="chip" data-f="mis" aria-pressed="false">MIS 系統 20</button>
    <input class="search" id="q" placeholder="搜尋風格名稱、關鍵字…" aria-label="搜尋">
    <span class="prog" id="prog"></span>
  </nav>

  <main class="grid" id="grid"></main>

  <footer>
    <span>相對路徑 · 本機直接開啟即可瀏覽</span>
    <span>DESIGN CATALOGUE / 40 ENTRIES</span>
  </footer>
</div>

<script>
const DATA = [
 [1,'public','瑞士國際主義新聞牆','01-swiss-news-grid','紅黑白極端網格，巨型無襯線字壓版的報導式排版',true,4],
 [2,'public','霓虹賽博交通看板','02-cyber-transit','暗夜城市中的洋紅／青綠輝光與掃描線即時運輸資訊',true,3],
 [3,'public','Y2K 千禧氣象站','03-y2k-weather','鉻金屬漸層、氣泡按鈕與虹彩光暈的千禧未來感天氣頁',true,3],
 [4,'public','粗獷主義公共服務','04-brutalist-civic','裸露邊框、等寬字與粗黑線條的反修飾市政資訊',true,4],
 [5,'public','侘寂和風節氣曆','05-wabi-sabi-sekki','和紙質感、直書排版與留白呼吸的二十四節氣',true,3],
 [6,'public','手繪繪本旅遊指南','06-sketchbook-travel','蠟筆塗鴉、歪斜手繪邊框與貼紙感的城市散步地圖',true,3],
 [7,'public','任務控制中心 HUD','07-mission-control','太空總署式深空儀表、軌道追蹤與遙測資料流',true,4],
 [8,'public','孟菲斯派對活動頁','08-memphis-festival','八〇年代幾何色塊亂舞、斜線與波浪的節慶宣傳',true,3],
 [9,'public','鐘錶級極簡空品','09-minimal-airquality','單色細線、巨大數字與大量留白的空氣品質儀表',true,3],
 [10,'public','蒸汽波懷舊電台','10-vaporwave-radio','紫青漸層地平線、日出格線與 CRT 雜訊的線上電台',true,3],
 [11,'public','活版印刷體育快報','11-letterpress-sports','報紙分欄、網點印刷與襯線大標的賽事戰報',true,4],
 [12,'public','玻璃擬態海洋保育','12-glass-ocean','深海藍光下的多層毛玻璃與漂浮氣泡資料卡',true,4],
 [13,'public','像素點陣遊戲祭','13-pixel-arcade','8-bit 調色盤、精靈動畫與掃描線的復古遊戲活動頁',true,4],
 [14,'public','植物學典藏標本館','14-botanical-archive','古典銅版畫、米色紙張與花體襯線的植物標本索引',true,3],
 [15,'public','機械翻牌時刻表','15-splitflap-rail','琥珀色翻牌動畫與月台燈箱的鐵路時刻資訊',true,3],
 [16,'public','極光星空觀測','16-aurora-astro','深空極光漸層、視差星野與星座連線的觀星指南',true,3],
 [17,'public','包浩斯幾何美術館','17-bauhaus-museum','三原色與圓／三角／方構成的展覽導覽',true,4],
 [18,'public','熱感紙市集物價','18-receipt-market','鋸齒收據紙、點陣字與蓋章戳記的民生物價表',true,4],
 [19,'public','液態金屬發表會','19-liquid-chrome','流動鉻金屬團塊與反射高光的新品發表頁',true,4],
 [20,'public','水墨禪意茶文化','20-ink-tea','宣紙暈染、飛白筆觸與硃砂印的茶席文化',true,4],
 [21,'mis','磷光終端機管理台','21-phosphor-terminal','CRT 綠字、掃描線與指令列風格的系統維運介面',true,4],
 [22,'mis','霓虹暗色數據儀表板','22-neon-dashboard','紫青輝光卡片與發光折線的深色營運總覽',true,4],
 [23,'mis','醫療潔淨病房管理','23-clinical-his','純白青綠、超高易讀性的臨床照護資訊系統',true,4],
 [24,'mis','工業 SCADA 廠務監控','24-scada-plant','鋼灰琥珀、管線示意圖與指針錶頭的產線監控',true,4],
 [25,'mis','金融交易終端','25-bloomberg-terminal','黑底琥珀、極高密度數表與跑馬燈的交易台',true,4],
 [26,'mis','新擬物銀行後台','26-neumorphic-bank','柔和凹凸陰影、無邊界元件的軟性金融管理',true,4],
 [27,'mis','文件式知識庫 CMS','27-doc-cms','留白襯線、側欄大綱與行內標記的內容管理',true,4],
 [28,'mis','紙本卷宗式 ERP','28-paper-dossier','牛皮紙資料夾、索引標籤與打字機表單的企業資源',true,4],
 [29,'mis','霧面玻璃資產管理','29-glass-itam','深色毛玻璃層疊與光暈邊框的 IT 資產盤點',true,4],
 [30,'mis','等距 3D 倉儲 WMS','30-isometric-wms','等角視角立體儲位圖與貨架熱區的倉儲管理',true,4],
 [31,'mis','資安戰情作戰室','31-soc-warroom','紅色警戒、世界地圖攻擊軌跡與告警瀑布流',true,4],
 [32,'mis','極簡排版式人資系統','32-editorial-hr','細線分隔、等寬數字與版面留白的人事管理',true,4],
 [33,'mis','復古 Win98 進銷存','33-win98-inventory','立體浮雕按鈕、標題列與像素圖示的懷舊庫存系統',true,4],
 [34,'mis','智慧建築 BMS','34-bms-building','深藍樓層平面、環境滑桿與設備狀態的建築控制',true,4],
 [35,'mis','黏土風教務系統','35-clay-campus','粉彩黏土立體圓角、柔軟投影的校務管理',true,4],
 [36,'mis','機場運務排班台','36-airport-ops','午夜藍甘特圖、登機門排程與航班狀態燈',true,4],
 [37,'mis','車隊即時調度地圖','37-fleet-dispatch','地圖為主體、路徑動線與派車佇列的物流調度',true,4],
 [38,'mis','溫室物聯網控管','38-greenhouse-iot','有機綠意、感測環形圖與葉脈紋理的農業監控',true,4],
 [39,'mis','電商營運指揮中心','39-commerce-ops','高密度分析、熱力圖與漏斗轉換的電商總部',true,4],
 [40,'mis','電網調度中樞','40-powergrid-control','拓撲節點、動態潮流光束與負載曲線的能源調度',true,4]
];
const CATNAME={public:'PUBLIC INFO',mis:'MIS CONSOLE'};
const grid=document.getElementById('grid');
let filter='all', term='';

function render(){
  const list=DATA.filter(d=>(filter==='all'||d[1]===filter)&&
    (term===''||(d[2]+d[4]+d[3]).toLowerCase().includes(term)));
  grid.innerHTML=list.map(d=>{
    const [n,cat,name,slug,desc,done,sub]=d;
    const num=String(n).padStart(2,'0');
    if(!done) return `<div class="card todo"><div class="no">${num}</div>
      <span class="badge">未完成</span>
      <span class="cat ${cat}">${CATNAME[cat]}</span>
      <h3>${name}</h3><p>${desc}</p></div>`;
    return `<a class="card" href="designs/${slug}/index.html"><div class="no">${num}</div>
      <span class="go">↗</span>
      <span class="cat ${cat}">${CATNAME[cat]}</span>
      <h3>${name}</h3><p>${desc}</p>
      <span class="sub">主畫面 + <i>${sub||0}</i> 個延伸子頁面 · 共 <i>${(sub||0)+1}</i> 畫面</span></a>`;
  }).join('');
  const done=DATA.filter(d=>d[5]).length;
  const screens=DATA.reduce((a,d)=>a+(d[5]?(d[6]||0)+1:0),0);
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-pages').textContent=screens;
  document.getElementById('prog').textContent=`顯示 ${list.length} / 完成 ${done}/40 · ${screens} 個畫面`;
}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); filter=b.dataset.f; render();
}));
document.getElementById('q').addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();render();});
render();
</script>
</body>
</html>
