<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>缺失列表 · 藍晒負片工程查報系統</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --b1:#2456a8; --b2:#3f7ad1; --line:#eef4ff; --soft:#8fb4e8; --hi:#bfe0ff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  color:var(--line);min-height:100vh;overflow-x:hidden;
  background:
    radial-gradient(ellipse 90% 70% at 20% 10%, rgba(255,255,255,.14), transparent 55%),
    radial-gradient(ellipse 70% 60% at 85% 90%, rgba(255,255,255,.10), transparent 50%),
    linear-gradient(135deg, var(--b1), var(--b2) 55%, var(--b1));
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(238,244,255,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(238,244,255,.07) 1px, transparent 1px),
    linear-gradient(rgba(238,244,255,.14) 1px, transparent 1px),
    linear-gradient(90deg, rgba(238,244,255,.14) 1px, transparent 1px);
  background-size:20px 20px, 20px 20px, 100px 100px, 100px 100px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  box-shadow:inset 0 0 180px rgba(10,25,60,.75), inset 0 0 60px rgba(255,255,255,.12);
  animation:bloom 9s ease-in-out infinite alternate;
}
@keyframes bloom{
  from{box-shadow:inset 0 0 180px rgba(10,25,60,.75), inset 0 0 60px rgba(255,255,255,.10)}
  to  {box-shadow:inset 0 0 220px rgba(10,25,60,.55), inset 0 0 90px rgba(255,255,255,.18)}
}
.mono{font-family:'Share Tech Mono',monospace}
.cross{position:fixed;width:26px;height:26px;z-index:1;pointer-events:none;opacity:.7}
.cross::before,.cross::after{content:'';position:absolute;background:var(--line)}
.cross::before{left:50%;top:0;width:1.5px;height:100%}
.cross::after{top:50%;left:0;height:1.5px;width:100%}

/* 頂部圖簽 */
.titlebar{
  position:relative;z-index:5;display:flex;align-items:stretch;gap:0;flex-wrap:wrap;
  border-bottom:2px solid var(--line);margin:22px 26px 0;
}
.cell{padding:12px 18px;border-right:1.5px solid rgba(238,244,255,.55);display:flex;flex-direction:column;justify-content:center}
.cell:last-child{border-right:none}
.cell .k{font-size:10px;letter-spacing:2px;color:var(--soft)}
.cell .v{font-size:14px;font-weight:500;margin-top:2px}
.back{
  align-self:center;text-decoration:none;color:var(--b1);font-weight:700;font-size:14px;
  background:var(--line);padding:9px 18px;margin-right:16px;border:1.5px solid var(--line);
  transition:all .2s;letter-spacing:1px;
}
.back:hover{background:transparent;color:var(--line)}
.brand-cell{flex:1;min-width:220px}
.brand{font-size:22px;font-weight:700;letter-spacing:3px}
.brand small{display:block;font-size:11px;letter-spacing:4px;color:var(--soft);font-weight:300;margin-top:2px}
.subnav{align-self:center;display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px}
.subnav a{color:var(--line);text-decoration:none;font-size:13px;letter-spacing:1px;border-bottom:1px dashed var(--soft);padding-bottom:2px;transition:all .2s}
.subnav a:hover{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.08)}
.subnav a.on{border-bottom:2px solid #fff;font-weight:700}

.layout{position:relative;z-index:5;display:grid;gap:26px;padding:26px;max-width:1500px;margin:0 auto}
.expose{opacity:0;filter:blur(6px) brightness(.6);animation:develop 1.1s ease-out forwards}
@keyframes develop{to{opacity:1;filter:blur(0) brightness(1)}}
.panel{
  border:2px solid var(--line);padding:22px;position:relative;
  background:rgba(255,255,255,.04);
  box-shadow:0 0 0 1px rgba(36,86,168,.9), 0 0 24px rgba(191,224,255,.10) inset;
}
.panel::before,.panel::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--line)}
.panel::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.panel::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
h3.sec{
  font-size:13px;letter-spacing:3px;color:var(--hi);margin-bottom:18px;
  display:flex;align-items:center;gap:10px;font-weight:500;
}
h3.sec::after{content:'';flex:1;height:1.5px;background:repeating-linear-gradient(90deg,var(--line),var(--line) 8px,transparent 8px,transparent 14px)}
h3.sec .no{font-family:'Share Tech Mono';border:1.5px solid var(--line);padding:1px 8px;font-size:12px}

/* KPI 圖簽格 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1.5px solid rgba(238,244,255,.55)}
.kpis .kpi{padding:16px 20px;border-right:1.5px solid rgba(238,244,255,.35)}
.kpis .kpi:last-child{border-right:none}
.kpi .n{font-family:'Share Tech Mono';font-size:30px;line-height:1}
.kpi .t{font-size:11px;letter-spacing:3px;color:var(--soft);margin-top:6px}

/* 篩選 */
.list-head{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.chip{
  padding:6px 16px;border:1.5px solid var(--soft);font-size:13px;letter-spacing:1px;
  background:transparent;color:var(--line);cursor:pointer;font-family:inherit;transition:all .18s;
}
.chip:hover{border-color:#fff}
.chip.on{background:var(--line);color:var(--b1);font-weight:700}
.sitepick{
  margin-left:auto;padding:7px 12px;font-family:inherit;font-size:13px;color:var(--line);
  background:rgba(10,30,70,.35);border:1.5px solid var(--soft);outline:none;
}
.sitepick option{color:#1c2f55}

/* 通報票卡 */
.ticket{
  display:grid;grid-template-columns:110px 1fr 150px;gap:16px;align-items:stretch;
  border:1.5px solid rgba(238,244,255,.7);margin-bottom:14px;padding:14px;position:relative;
  background:rgba(255,255,255,.03);transition:background .2s, transform .2s;cursor:pointer;
}
.ticket:hover{background:rgba(255,255,255,.09);transform:translateX(4px)}
@media(max-width:760px){.ticket{grid-template-columns:1fr}}
.photo{border:1.5px dashed var(--soft);position:relative;display:grid;place-items:center;min-height:96px;overflow:hidden}
.photo svg{width:100%;height:100%;position:absolute;inset:0}
.photo .ph-label{position:relative;font-size:10px;letter-spacing:2px;color:var(--soft);text-align:center;line-height:1.7}
.t-main .t-id{font-family:'Share Tech Mono';font-size:12px;color:var(--soft);letter-spacing:1px}
.t-main .t-title{font-size:16px;font-weight:700;margin:3px 0 6px}
.t-main .t-desc{font-size:13px;color:#d7e5fb;line-height:1.7;font-weight:300}
.t-tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 10px;border:1px solid var(--soft);letter-spacing:1px}
.tag.sev1{border-color:var(--hi);color:var(--hi)}
.tag.sev2{border-color:#fff;color:#fff}
.tag.sev3{background:#fff;color:#a33333;border-color:#fff;font-weight:700}
.st-open{background:rgba(191,224,255,.16)}
.st-fix{background:transparent}
.st-review{background:rgba(238,244,255,.28);font-weight:700}
.st-done{background:#eef4ff;color:#2456a8;font-weight:700}
.t-right{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right;gap:10px}
.countdown{font-family:'Share Tech Mono';font-size:13px;line-height:1.5}
.countdown .lbl{font-size:10px;letter-spacing:2px;color:var(--soft);font-family:'Noto Sans TC'}
.countdown.over{color:#fff;background:#a33333;padding:2px 8px}
.countdown.urgent{color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.detail-link{
  font-size:12px;letter-spacing:2px;color:var(--hi);text-decoration:none;
  border:1px solid var(--soft);padding:5px 12px;transition:all .18s;
}
.detail-link:hover{background:var(--line);color:var(--b1);border-color:var(--line)}
.panel .empty{padding:30px;text-align:center;color:var(--soft);letter-spacing:2px;font-size:13px}
</style>
</head>
<body>

<div class="cross" style="top:12px;left:12px"></div>
<div class="cross" style="top:12px;right:12px"></div>
<div class="cross" style="bottom:12px;left:12px"></div>
<div class="cross" style="bottom:12px;right:12px"></div>

<header class="titlebar expose">
  <a class="back" href="../../index.html">← 返回入口</a>
  <div class="cell brand-cell">
    <div class="brand">缺失列表 DEFICIENCY LIST<small>CYANOTYPE SITE DEFICIENCY REPORT — SHEET L-102</small></div>
  </div>
  <nav class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="list.html" class="on">缺失列表</a>
    <a href="detail.html">缺失詳情</a>
    <a href="form.html">新增通報</a>
    <a href="review.html">複查紀錄</a>
  </nav>
  <div class="cell"><div class="k">圖號 DWG NO.</div><div class="v mono">INS-2026-040-L</div></div>
  <div class="cell"><div class="k">出圖日期 DATE</div><div class="v mono">2026-08-28</div></div>
</header>

<div class="layout">
  <!-- KPI -->
  <section class="panel expose" style="animation-delay:.1s">
    <h3 class="sec"><span class="no">01</span>通報狀態統計 STATUS SUMMARY</h3>
    <div class="kpis">
      <div class="kpi"><div class="n" id="kOpen">2</div><div class="t">待改善 OPEN</div></div>
      <div class="kpi"><div class="n" id="kFix">2</div><div class="t">改善中 FIXING</div></div>
      <div class="kpi"><div class="n" id="kReview">2</div><div class="t">待複查 REVIEW</div></div>
      <div class="kpi"><div class="n" id="kDone">2</div><div class="t">已結案 CLOSED</div></div>
      <div class="kpi"><div class="n" style="color:#fff">1</div><div class="t">重大缺失 SEV-3</div></div>
    </div>
  </section>

  <!-- 列表 -->
  <section class="panel expose" style="animation-delay:.25s">
    <h3 class="sec"><span class="no">02</span>缺失一覽 ALL RECORDS</h3>
    <div class="list-head" id="chips">
      <button class="chip on" data-f="">全部</button>
      <button class="chip" data-f="open">待改善</button>
      <button class="chip" data-f="fix">改善中</button>
      <button class="chip" data-f="review">待複查</button>
      <button class="chip" data-f="done">已結案</button>
      <select class="sitepick" id="fSite">
        <option value="">全部工地</option>
        <option>南港機廠聯開大樓</option>
        <option>台中捷運綠線 G08 站</option>
        <option>高雄港旅運中心二期</option>
        <option>桃園航空城配水池</option>
      </select>
    </div>
    <div id="list"></div>
  </section>
</div>

<script>
const NOW = Date.now();
const H = 3600e3, D = 24*H;
const REPORTS = [
  {id:'DR-2608-014', site:'南港機廠聯開大樓', cat:'結構體裂縫', sev:3, status:'open',
   desc:'7F 版 S12 區域灌漿面出現貫穿裂縫，寬約 0.5mm，疑似拆模過早。', due: NOW + 0.35*D},
  {id:'DR-2608-013', site:'台中捷運綠線 G08 站', cat:'施工架安全', sev:3, status:'open',
   desc:'穿堂層施工架未設置護欄且踏板間隙過大，現場人員通行頻繁。', due: NOW + 0.8*D},
  {id:'DR-2608-012', site:'高雄港旅運中心二期', cat:'防水層破損', sev:2, status:'fix',
   desc:'屋頂 PU 防水層於女兒牆轉角處起泡剝離約 2 ㎡，已通知防水班進場。', due: NOW + 1.6*D},
  {id:'DR-2608-011', site:'桃園航空城配水池', cat:'鋼筋鏽蝕外露', sev:2, status:'fix',
   desc:'池壁頂部保護層不足，主筋外露鏽蝕約 6 處，廠商已安排除鏽補強。', due: NOW + 2.9*D},
  {id:'DR-2608-010', site:'南港機廠聯開大樓', cat:'機電管線不符', sev:1, status:'review',
   desc:'B1 機房消防排煙風管吊筋間距與核准圖不符，廠商回報已重吊，待複查。', due: NOW + 4.2*D},
  {id:'DR-2608-009', site:'台中捷運綠線 G08 站', cat:'環境髒亂 / 廢料', sev:1, status:'done',
   desc:'月台層模板廢料堆置阻礙動線，已清運完成並複查合格結案。', due: NOW - 1.2*D},
  {id:'DR-2608-008', site:'高雄港旅運中心二期', cat:'結構體裂縫', sev:2, status:'done',
   desc:'3F 梁 L-22 蜂窩現象經環氧樹脂灌注修復，超音波檢測通過。', due: NOW - 3.5*D},
  {id:'DR-2607-031', site:'桃園航空城配水池', cat:'施工架安全', sev:2, status:'review',
   desc:'外牆施工架斜撐數量不足已補齊，複查照片已上傳待確認。', due: NOW - 0.4*D},
];
const STATUS = {open:['待改善','st-open'], fix:['改善中','st-fix'], review:['待複查','st-review'], done:['已結案','st-done']};
const SEV = {1:['輕微','sev1'], 2:['中等','sev2'], 3:['重大','sev3']};
let filter = '';

function fmtCountdown(ms){
  if (ms < 0) return '<span class="countdown over">已逾期 ' + Math.ceil(-ms/D) + ' 天</span>';
  const d = Math.floor(ms/D), h = Math.floor(ms%D/H), m = Math.floor(ms%H/60e3), s = Math.floor(ms%60e3/1e3);
  const urgent = ms < D ? ' urgent' : '';
  return `<span class="countdown${urgent}"><span class="lbl">改善期限倒數</span><br>${d}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span>`;
}
function photoSVG(seed){
  const kinds = [
    '<path d="M10,80 L30,55 L45,62 L60,30 L78,44 L95,15" fill="none" stroke="#eef4ff" stroke-width="1.4"/><circle cx="60" cy="30" r="4" fill="none" stroke="#eef4ff" stroke-width="1.2"/>',
    '<rect x="14" y="20" width="72" height="55" fill="none" stroke="#eef4ff" stroke-width="1.3"/><line x1="14" y1="40" x2="86" y2="40" stroke="#eef4ff" stroke-width="1"/><line x1="35" y1="20" x2="35" y2="75" stroke="#eef4ff" stroke-width="1"/><line x1="62" y1="20" x2="62" y2="75" stroke="#eef4ff" stroke-width="1"/>',
    '<line x1="15" y1="75" x2="50" y2="18" stroke="#eef4ff" stroke-width="1.4"/><line x1="50" y1="18" x2="85" y2="75" stroke="#eef4ff" stroke-width="1.4"/><line x1="28" y1="55" x2="72" y2="55" stroke="#eef4ff" stroke-width="1.2"/><line x1="38" y1="38" x2="62" y2="38" stroke="#eef4ff" stroke-width="1.2"/>'
  ];
  return `<svg viewBox="0 0 100 90" preserveAspectRatio="xMidYMid meet">${kinds[seed % 3]}</svg>`;
}

function render(){
  const site = document.getElementById('fSite').value;
  const list = document.getElementById('list');
  const rows = REPORTS.filter(r => (!filter || r.status === filter) && (!site || r.site === site));
  if (!rows.length){ list.innerHTML = '<div class="empty">— 此篩選條件下無通報紀錄 —</div>'; return; }
  list.innerHTML = rows.map((r,i)=>{
    const [slabel, scls] = STATUS[r.status];
    const [vlabel, vcls] = SEV[r.sev];
    return `<article class="ticket" data-id="${r.id}">
      <div class="photo">${photoSVG(r.sev + i)}<span class="ph-label">PHOTO<br>佈景線稿</span></div>
      <div class="t-main">
        <div class="t-id">${r.id} ｜ ${r.site}</div>
        <div class="t-title">${r.cat}</div>
        <div class="t-desc">${r.desc}</div>
        <div class="t-tags">
          <span class="tag ${vcls}">嚴重度：${vlabel}</span>
          <span class="tag ${scls}">${slabel}</span>
        </div>
      </div>
      <div class="t-right">
        <div>${r.status==='done' ? '<span class="countdown"><span class="lbl">已於期限內結案</span><br>— CLOSED —</span>' : fmtCountdown(r.due - Date.now())}</div>
        <a class="detail-link" href="detail.html">詳情 ▸</a>
      </div>
    </article>`;
  }).join('');
  list.querySelectorAll('.ticket').forEach(t=>t.addEventListener('click', e=>{
    if (e.target.closest('a')) return;
    location.href = 'detail.html';
  }));
}

document.getElementById('chips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.f; render();
});
document.getElementById('fSite').addEventListener('change', render);

render();
setInterval(render, 1000);
</script>
</body>
</html>
