<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增分錄 · 總帳管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Caveat:wght@600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6efe0;--rule:#d8cba8;--ink:#3b2f1e;--red:#c0392b;--blue:#2c5f8a;--seal:#b03a2e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9dfc7;font-family:'Noto Serif TC',serif;color:var(--ink);padding:28px 20px 60px}
.page{max-width:1180px;margin:0 auto;background:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  border:1px solid #cbb98d;box-shadow:0 10px 40px rgba(60,40,10,.35), inset 0 0 60px rgba(180,150,90,.15);
  padding:0 40px 50px 92px;position:relative;animation:pageIn .9s cubic-bezier(.2,.7,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(-26px) rotateX(8deg)}to{opacity:1;transform:none}}
.page::before{content:"";position:absolute;top:0;bottom:0;left:60px;width:2px;background:var(--red);opacity:.75}
.page::after{content:"";position:absolute;top:0;bottom:0;left:66px;width:1px;background:var(--red);opacity:.35}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:34px 0 10px;border-bottom:3px double var(--ink)}
h1{font-size:30px;font-weight:900;letter-spacing:8px}
h1 small{display:block;font-size:12px;letter-spacing:4px;color:#7a6a4a;font-weight:500;margin-top:6px}
.back-link{font-family:'ZCOOL XiaoWei',serif;font-size:15px;color:var(--blue);text-decoration:none;border:1px solid var(--blue);padding:6px 14px;border-radius:3px;background:rgba(44,95,138,.06);transition:.25s}
.back-link:hover{background:var(--blue);color:var(--paper);transform:translateX(-4px)}
.subnav{display:flex;gap:8px;padding:12px 0;border-bottom:1px dashed #b7a678;flex-wrap:wrap}
.subnav a{font-family:'ZCOOL XiaoWei',serif;font-size:15px;color:#7a6a4a;text-decoration:none;padding:4px 14px;border:1px solid transparent;border-radius:3px;transition:.2s}
.subnav a:hover{color:var(--blue);border-color:var(--blue)}
.subnav a.active{color:var(--blue);border-color:var(--blue);background:rgba(44,95,138,.08)}
.section-title{margin:26px 0 12px;font-size:19px;letter-spacing:8px;font-weight:700;display:flex;align-items:center;gap:14px}
.section-title::after{content:"";flex:1;height:1px;background:#b7a678}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
label.f{display:block;font-size:13px;letter-spacing:3px;color:#8a774e;margin-bottom:6px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:rgba(255,252,240,.8);border:1px solid #c9b888;border-radius:3px;
  padding:9px 12px;font-size:15px;color:var(--ink);outline:none;font-family:'Noto Serif TC',serif}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,95,138,.12)}
textarea{resize:vertical;min-height:90px}
.radio-row,.chk-row{display:flex;gap:20px;flex-wrap:wrap;padding-top:4px}
.radio-row label,.chk-row label{display:flex;align-items:center;gap:7px;font-size:14.5px;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}
.cn-amount{margin-top:10px;border:1px dashed var(--blue);background:rgba(44,95,138,.06);padding:10px 16px;font-size:15px;letter-spacing:2px}
.cn-amount b{color:var(--blue)}
.btn{font-family:'ZCOOL XiaoWei',serif;font-size:17px;letter-spacing:4px;border:none;border-radius:3px;padding:11px 34px;cursor:pointer;background:var(--blue);color:var(--paper);transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.toast{display:none;margin-top:14px;border:1px solid var(--blue);background:rgba(44,95,138,.08);color:var(--blue);padding:12px 16px;font-size:14.5px;letter-spacing:2px}
.toast.show{display:block;animation:ink .4s}
@keyframes ink{from{opacity:0}to{opacity:1}}
.notebox{border:1px dashed #b7a678;padding:14px 18px;font-size:13.5px;line-height:2;color:#7a6a4a;background:rgba(255,252,240,.5)}
.notebox b{color:var(--ink)}
.seal{width:104px;height:104px;border:4px solid var(--seal);border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--seal);font-weight:900;font-size:17px;letter-spacing:3px;line-height:1.4;transform:rotate(-12deg);opacity:.85;
  box-shadow:inset 0 0 0 2px rgba(176,58,46,.4);user-select:none;margin-left:auto}
footer{margin-top:40px;font-size:12px;color:#8a774e;letter-spacing:3px;display:flex;justify-content:space-between}
@media (max-width:900px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>新增分錄<small>NEW JOURNAL ENTRY · 傳票繕寫</small></h1>
    <a class="back-link" href="../../index.html">← 返回入口</a>
  </header>
  <nav class="subnav">
    <a href="index.html">← 返回主控台</a>
    <a href="entries.html">分錄列表</a>
    <a href="entry-form.html" class="active">新增分錄</a>
    <a href="report.html">月結報表</a>
    <a href="accounts.html">科目設定</a>
  </nav>

  <div class="section-title">繕 寫 傳 票（JV-0831）</div>
  <form id="entryForm">
    <div class="form-grid">
      <div><label class="f">交易日期 *</label><input type="date" value="2026-08-28" required></div>
      <div>
        <label class="f">會計科目 *</label>
        <select required>
          <option>現金</option><option>銀行存款</option><option>應收帳款</option><option>應付帳款</option>
          <option>營業收入</option><option>利息收入</option><option>租金費用</option><option>薪資費用</option>
          <option>文具用品</option><option>設備資產</option><option>預收款項</option>
        </select>
      </div>
      <div>
        <label class="f">借貸別 *</label>
        <div class="radio-row">
          <label><input type="radio" name="dc" checked> 借方（支出 / 資產增加）</label>
          <label><input type="radio" name="dc"> 貸方（收入 / 負債增加）</label>
        </div>
      </div>
      <div><label class="f">金額（元）*</label><input type="number" id="amt" value="12800" min="1" required></div>
      <div>
        <label class="f">收付方式</label>
        <div class="radio-row">
          <label><input type="radio" name="pay" checked> 銀行轉帳</label>
          <label><input type="radio" name="pay"> 現金</label>
          <label><input type="radio" name="pay"> 支票</label>
          <label><input type="radio" name="pay"> 暫掛</label>
        </div>
      </div>
      <div><label class="f">憑證字號</label><input type="text" placeholder="例：統一發票 AB-12345678"></div>
    </div>
    <div class="cn-amount" id="cnAmount">大寫金額：<b>壹萬貳仟捌佰元整</b></div>
    <div style="margin-top:16px"><label class="f">摘要 *</label><textarea placeholder="例：支付八月份辦公室租金，房東：大安建設…" required></textarea></div>
    <div class="chk-row" style="margin-top:14px">
      <label><input type="checkbox"> 金額逾 10 萬元，需經理覆核</label>
      <label><input type="checkbox" checked> 檢附原始憑證掃描檔</label>
      <label><input type="checkbox"> 屬關係人交易</label>
    </div>
    <div style="margin-top:22px;display:flex;gap:14px;align-items:center">
      <button type="submit" class="btn">登錄傳票</button>
      <button type="reset" class="btn ghost">重寫</button>
      <span style="font-size:13px;color:#8a774e">送出後狀態為「待審核」，由王啟文經理覆核。</span>
    </div>
    <div class="toast" id="toast">✔ 傳票 JV-0831 已繕寫完成並送審，可至「分錄列表」查看。</div>
  </form>

  <div style="display:flex;gap:26px;margin-top:30px;align-items:flex-start">
    <div class="notebox" style="flex:1;margin-top:0">
      <b>繕寫須知：</b>借貸必相等；同日多筆交易請分開開立傳票。摘要限 50 字內，
      須載明交易對象與事由。大寫金額由系統自動換算，繕寫人請再核對一次。
    </div>
    <div class="seal">傳票專用<br>會計室</div>
  </div>

  <footer>
    <span>開元商業銀行 · 企業帳務 MIS</span>
    <span>帳頁編號 JE-NEW · 第 19 頁</span>
  </footer>
</div>
<script>
const D='零壹貳參肆伍陸柒捌玖',U=['','拾','佰','仟'],B=['','萬','億'];
function toCN(n){
  n=Math.floor(+n||0);
  if(n===0)return '零元整';
  let s='',bi=0;
  while(n>0){
    let seg=n%10000,segS='';
    for(let i=0;seg>0;i++){const d=seg%10;if(d>0)segS=D[d]+U[i]+segS;else if(segS&&!segS.startsWith('零'))segS='零'+segS;seg=Math.floor(seg/10);}
    if(segS)s=segS+B[bi]+s;n=Math.floor(n/10000);bi++;
  }
  return s.replace(/零+/g,'零').replace(/零$/,'')+'元整';
}
const amt=document.getElementById('amt');
function refresh(){document.getElementById('cnAmount').innerHTML='大寫金額：<b>'+toCN(amt.value)+'</b>';}
amt.addEventListener('input',refresh);refresh();
document.getElementById('entryForm').addEventListener('submit',e=>{
  e.preventDefault();
  document.getElementById('toast').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
