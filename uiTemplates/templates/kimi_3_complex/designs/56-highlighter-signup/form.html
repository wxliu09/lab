<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增活動 · 螢光標記報名審核系統</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfcf7; --ink:#2b3a67; --pencil:#8a8672;
  --hl-y:#fffd8a; --hl-p:#ffc9e3; --hl-g:#c8f7c5; --red:#e05252;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(transparent 31px, rgba(43,58,103,.06) 32px);
  background-size:100% 32px; min-height:100vh;
}
.hand{font-family:'Kalam','Noto Sans TC',cursive}

.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 28px;border-bottom:2px solid var(--ink);
  background:#fffdf4;position:sticky;top:0;z-index:50;
}
.back{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--ink);font-weight:700;font-size:14px;padding:6px 14px;
  border:2px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  background:linear-gradient(transparent 55%, var(--hl-y) 55%);
  transition:transform .15s;
}
.back:hover{transform:rotate(-2deg) scale(1.05)}
.brand{font-size:22px;font-weight:700;letter-spacing:1px}
.brand .hl{background:linear-gradient(transparent 45%, var(--hl-p) 45%);padding:0 6px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.subnav a{
  text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;padding:5px 12px;
  border:2px solid transparent;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  transition:all .15s;
}
.subnav a:hover{border-color:var(--ink);background:linear-gradient(transparent 55%, var(--hl-g) 55%);transform:rotate(-1.5deg)}
.subnav a.on{border-color:var(--ink);background:linear-gradient(transparent 55%, var(--hl-g) 55%)}

.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;padding:28px;max-width:1320px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.sketch{
  border:2px solid var(--ink);background:#fffef9;position:relative;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  box-shadow:3px 4px 0 rgba(43,58,103,.12);
}
.col .sketch{padding:26px;margin-bottom:24px}
h3.sec{font-size:18px;margin-bottom:14px;display:inline-block;
  background:linear-gradient(transparent 50%, var(--hl-y) 50%);padding:0 8px;transform:rotate(-.6deg)}

.btn{
  font-family:'Kalam','Noto Sans TC';font-size:15px;font-weight:700;cursor:pointer;
  padding:10px 24px;border:2px solid var(--ink);color:var(--ink);
  border-radius:225px 15px 255px 15px/15px 255px 15px 225px;background:#fff;
  transition:transform .12s, background .2s;
}
.btn:hover{transform:rotate(-1.5deg) scale(1.04)}
.btn.ok{background:linear-gradient(transparent 45%,var(--hl-g) 45%)}

/* 表單 */
.newform{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:6px}
.newform .full{grid-column:1/-1}
.newform label{font-size:13px;font-weight:700;color:var(--pencil);display:block;margin-bottom:4px}
.newform input[type=text],.newform input[type=date],.newform input[type=number],.newform select,.newform textarea{
  width:100%;padding:9px 12px;font-family:inherit;font-size:14px;color:var(--ink);
  border:2px solid var(--ink);background:#fff;border-radius:4px 15px 4px 15px/15px 4px 15px 4px;
}
.newform input:focus,.newform select:focus,.newform textarea:focus{outline:none;background:linear-gradient(transparent 50%,rgba(255,253,138,.5) 50%)}
.newform textarea{resize:vertical;min-height:70px}
.radios,.checks{display:flex;gap:12px;flex-wrap:wrap;padding-top:4px}
.radios label,.checks label{
  display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);
  font-weight:400;cursor:pointer;padding:3px 10px;
}
.radios input,.checks input{accent-color:var(--ink);width:16px;height:16px}
.radios label:has(input:checked){background:linear-gradient(transparent 45%,var(--hl-p) 45%);border-radius:6px}
.checks label:has(input:checked){background:linear-gradient(transparent 45%,var(--hl-g) 45%);border-radius:6px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 預覽卡 */
.ev-name{font-size:20px;font-weight:700;margin:8px 0 4px}
.ev-meta{font-size:13px;color:var(--pencil);line-height:1.9}
.ev-meta b{color:var(--ink)}
.tag{display:inline-block;padding:2px 12px;font-size:12.5px;font-weight:700;transform:rotate(-1deg)}
.tag.pending{background:rgba(255,253,138,.85)}
.tag.draft{background:rgba(255,201,227,.85)}
.note{font-size:13px;line-height:2.1;color:var(--pencil)}
.note b{color:var(--ink)}

.toast{
  position:fixed;bottom:28px;right:28px;background:#fffef9;border:2px solid var(--ink);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:14px 22px;
  font-weight:700;box-shadow:3px 4px 0 rgba(43,58,103,.2);z-index:99;
  animation:popin .35s cubic-bezier(.2,1.5,.4,1);
}
.toast .mark{background:linear-gradient(transparent 45%,var(--hl-g) 45%);padding:0 4px}
@keyframes popin{from{transform:scale(.5) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<header class="topbar">
  <a class="back hand" href="../../index.html">← 返回入口</a>
  <div class="brand hand">螢光標記 <span class="hl">報名審核</span> 系統</div>
  <nav class="subnav hand">
    <a href="index.html">返回主控台</a>
    <a href="events.html">活動列表</a>
    <a href="detail.html">報名詳情</a>
    <a href="form.html" class="on">新增活動</a>
    <a href="report.html">統計報表</a>
  </nav>
</header>

<div class="layout">
  <!-- ── 左欄：新增活動表單 ── -->
  <div class="col">
    <div class="sketch">
      <h3 class="sec" style="font-size:22px">新增活動（送簽後上架）</h3>
      <form class="newform" id="evForm">
        <div class="full"><label>活動名稱 *</label><input type="text" id="eName" placeholder="例：2026 夏季溯溪體驗營"></div>
        <div>
          <label>主辦單位</label>
          <select id="eUnit">
            <option>戶外活動組</option><option>攝影同好會</option><option>親子共學社</option><option>員工福利委員會</option>
          </select>
        </div>
        <div><label>名額上限 *</label><input type="number" id="eCap" value="30" min="5" max="200"></div>
        <div><label>開始日期 *</label><input type="date" id="eFrom" value="2026-05-09"></div>
        <div><label>結束日期 *</label><input type="date" id="eTo" value="2026-05-10"></div>
        <div class="full"><label>集合地點</label><input type="text" id="ePlace" placeholder="例：台中干城站 07:00"></div>
        <div class="full">
          <label>開放組別（可複選）</label>
          <div class="checks">
            <label><input type="checkbox" name="grp" value="新手體驗組" checked>新手體驗組</label>
            <label><input type="checkbox" name="grp" value="縱走挑戰組">縱走挑戰組</label>
            <label><input type="checkbox" name="grp" value="攝影慢遊組">攝影慢遊組</label>
            <label><input type="checkbox" name="grp" value="親子同樂組">親子同樂組</label>
          </div>
        </div>
        <div class="full">
          <label>保險安排</label>
          <div class="radios">
            <label><input type="radio" name="ins" value="已投保旅平險" checked>已投保旅平險</label>
            <label><input type="radio" name="ins" value="需代辦加保">需代辦加保</label>
            <label><input type="radio" name="ins" value="不含保險（自行負責）">不含保險（自行負責）</label>
          </div>
        </div>
        <div class="full"><label>活動說明（行程摘要、注意事項）</label><textarea id="eDesc" placeholder="例：D1 台中→清境→合歡北峰；D2 日出團→返程。高山氣溫低，務必攜帶保暖衣物…"></textarea></div>
        <div class="full"><button type="submit" class="btn ok">＋ 送出簽核（草稿 → 待上架）</button></div>
      </form>
    </div>
  </div>

  <!-- ── 右欄：即時預覽 + 須知 ── -->
  <div class="col">
    <div class="sketch">
      <h3 class="sec">活動卡即時預覽</h3>
      <div class="ev-name hand" id="pvName">（尚未填寫活動名稱）</div>
      <div class="ev-meta" id="pvMeta">
        主辦單位：<b id="pvUnit">戶外活動組</b><br>
        活動日期：<b id="pvDate">2026/05/09 – 05/10</b><br>
        集合地點：<b id="pvPlace">（未填寫）</b><br>
        名額：<b id="pvCap">30</b> 人 ｜ 保險：<b id="pvIns">已投保旅平險</b><br>
        開放組別：<b id="pvGrp">新手體驗組</b>
      </div>
      <div style="margin-top:12px"><span class="tag draft" id="pvTag">草稿</span></div>
    </div>

    <div class="sketch">
      <h3 class="sec">上架須知</h3>
      <div class="note">
        ✎ 活動送出後先存為<b>草稿</b>，由戶外活動組組長簽核後轉為「報名中」。<br>
        ✎ 名額上限核定後不可調降，僅可加開。<br>
        ✎ 涉及山域活動需另附「入山許可申請」文件。<br>
        ✎ 上架後可在 <b><a href="events.html" style="color:var(--ink)">活動列表</a></b> 追蹤報名進度。
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
function fmt(d){ return d ? d.slice(5).replace('-','/') : '—'; }
function preview(){
  $('pvName').textContent = $('eName').value.trim() || '（尚未填寫活動名稱）';
  $('pvUnit').textContent = $('eUnit').value;
  $('pvDate').textContent = fmt($('eFrom').value) + ' – ' + fmt($('eTo').value);
  $('pvPlace').textContent = $('ePlace').value.trim() || '（未填寫）';
  $('pvCap').textContent = $('eCap').value;
  $('pvIns').textContent = document.querySelector('input[name=ins]:checked').value;
  const grps = [...document.querySelectorAll('input[name=grp]:checked')].map(c=>c.value);
  $('pvGrp').textContent = grps.length ? grps.join('、') : '（未勾選）';
}
document.querySelectorAll('#evForm input, #evForm select').forEach(el=>{
  el.addEventListener('input', preview);
  el.addEventListener('change', preview);
});
preview();

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast hand';
  t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='all .4s'; t.style.opacity=0; t.style.transform='translateY(16px)'; setTimeout(()=>t.remove(),400); }, 2400);
}

$('evForm').addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target;
  if (!$('eName').value.trim() || !$('eFrom').value || !$('eTo').value){
    f.classList.add('shake'); setTimeout(()=>f.classList.remove('shake'), 450);
    toast('⚠ 請填寫 <span class="mark">活動名稱與日期</span>');
    return;
  }
  if (new Date($('eTo').value) < new Date($('eFrom').value)){
    f.classList.add('shake'); setTimeout(()=>f.classList.remove('shake'), 450);
    toast('⚠ 結束日期不可早於開始日期');
    return;
  }
  const tag = $('pvTag');
  tag.className = 'tag pending'; tag.textContent = '待上架（簽核中）';
  toast(`已送出 <span class="mark">${$('eName').value.trim()}</span> 待組長簽核 ✔`);
});
</script>
</body>
</html>
