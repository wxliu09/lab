<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動列表 · 螢光標記報名審核系統</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfcf7; --ink:#2b3a67; --pencil:#8a8672;
  --hl-y:#fffd8a; --hl-p:#ffc9e3; --hl-g:#c8f7c5; --red:#e05252;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(transparent 31px, rgba(43,58,103,.06) 32px);
  background-size:100% 32px; min-height:100vh;
}
.hand{font-family:'Kalam','Noto Sans TC',cursive}

/* ── 頂部工具列 ── */
.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 28px;border-bottom:2px solid var(--ink);
  background:#fffdf4;position:sticky;top:0;z-index:50;
}
.back{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--ink);font-weight:700;font-size:14px;padding:6px 14px;
  border:2px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  background:linear-gradient(transparent 55%, var(--hl-y) 55%);
  transition:transform .15s;
}
.back:hover{transform:rotate(-2deg) scale(1.05)}
.brand{font-size:22px;font-weight:700;letter-spacing:1px}
.brand .hl{background:linear-gradient(transparent 45%, var(--hl-p) 45%);padding:0 6px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.subnav a{
  text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;padding:5px 12px;
  border:2px solid transparent;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  transition:all .15s;
}
.subnav a:hover{border-color:var(--ink);background:linear-gradient(transparent 55%, var(--hl-g) 55%);transform:rotate(-1.5deg)}
.subnav a.on{border-color:var(--ink);background:linear-gradient(transparent 55%, var(--hl-y) 55%)}

/* ── 主版面 ── */
.layout{display:grid;grid-template-columns:300px 1fr;gap:28px;padding:28px;max-width:1440px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.sketch{
  border:2px solid var(--ink);background:#fffef9;position:relative;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  box-shadow:3px 4px 0 rgba(43,58,103,.12);
}
.side .sketch{padding:22px;margin-bottom:24px}
.main .sketch{padding:26px}
h3.sec{font-size:18px;margin-bottom:14px;display:inline-block;
  background:linear-gradient(transparent 50%, var(--hl-y) 50%);padding:0 8px;transform:rotate(-.6deg)}

/* 徽章 */
.badge-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.badge{
  padding:10px 18px;border:2px solid var(--ink);font-size:14px;font-weight:700;
  border-radius:15px 225px 15px 225px/225px 15px 225px 15px;background:#fffef9;position:relative;
}
.badge .n{font-family:'Kalam';font-size:24px;vertical-align:-4px;margin-left:6px}
.badge.pending{background:linear-gradient(transparent 40%,var(--hl-y) 40%)}
.badge.approved{background:linear-gradient(transparent 40%,var(--hl-g) 40%)}
.badge.wait{background:linear-gradient(transparent 40%,var(--hl-p) 40%)}

/* 按鈕 */
.btn{
  font-family:'Kalam','Noto Sans TC';font-size:14px;font-weight:700;cursor:pointer;
  padding:6px 16px;border:2px solid var(--ink);color:var(--ink);text-decoration:none;display:inline-block;
  border-radius:225px 15px 255px 15px/15px 255px 15px 225px;background:#fff;
  transition:transform .12s, background .2s;
}
.btn:hover{transform:rotate(-1.5deg) scale(1.04)}
.btn.ok{background:linear-gradient(transparent 45%,var(--hl-g) 45%)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;padding:10px 12px;font-size:13px;color:var(--pencil);
  border-bottom:2px dashed var(--ink);letter-spacing:1px;font-weight:500;
}
td{padding:12px;border-bottom:1px dashed rgba(43,58,103,.25);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .25s}
tbody tr:hover{background:rgba(255,253,138,.28)}
.num{font-family:'Kalam';font-weight:700}

/* 狀態標籤 */
.tag{display:inline-block;padding:2px 10px;font-size:12.5px;font-weight:700;transform:rotate(-1deg)}
.tag.pending{background:rgba(255,253,138,.85)}
.tag.approved{background:rgba(201,247,197,.9)}
.tag.waitlist{background:rgba(255,201,227,.85)}
.tag.closed{background:transparent;color:var(--red);text-decoration:line-through wavy var(--red)}

/* 名額條 */
.cap-cell{display:flex;align-items:center;gap:10px}
.cap-bar{height:10px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;width:120px;flex-shrink:0}
.cap-fill{height:100%;background:repeating-linear-gradient(-45deg,var(--hl-g),var(--hl-g) 6px,#a4e8a0 6px,#a4e8a0 12px);width:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.cap-bar.full .cap-fill{background:repeating-linear-gradient(-45deg,var(--hl-p),var(--hl-p) 6px,#f0a8cc 6px,#f0a8cc 12px)}

/* 篩選 */
.filter label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--pencil)}
.filter select,.filter input{
  width:100%;padding:8px 12px;font-family:inherit;font-size:14px;color:var(--ink);
  border:2px solid var(--ink);background:#fff;border-radius:15px 4px 15px 4px/4px 15px 4px 15px;
}
.filter select:focus,.filter input:focus{outline:none;background:linear-gradient(transparent 50%,rgba(255,253,138,.5) 50%)}

.note{font-size:13px;line-height:2.1;color:var(--pencil)}
.note b{color:var(--ink)}

/* 手繪圈選 */
.circled{position:relative;display:inline-block;padding:2px 4px}
.circled svg{position:absolute;inset:-8px -12px;width:calc(100% + 24px);height:calc(100% + 16px);pointer-events:none;overflow:visible}
.circled svg path{fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round}
</style>
</head>
<body>

<header class="topbar">
  <a class="back hand" href="../../index.html">← 返回入口</a>
  <div class="brand hand">螢光標記 <span class="hl">報名審核</span> 系統</div>
  <nav class="subnav hand">
    <a href="index.html">返回主控台</a>
    <a href="events.html" class="on">活動列表</a>
    <a href="detail.html">報名詳情</a>
    <a href="form.html">新增活動</a>
    <a href="report.html">統計報表</a>
  </nav>
</header>

<div class="layout">
  <!-- ── 左側欄 ── -->
  <aside class="side">
    <div class="sketch filter">
      <h3 class="sec">活動篩選</h3>
      <label>活動狀態</label>
      <select id="fStatus">
        <option value="">全部狀態</option>
        <option value="open">報名中</option>
        <option value="full">已額滿</option>
        <option value="prep">籌備中</option>
        <option value="closed">已結束</option>
      </select>
      <label>關鍵字（名稱 / 代號）</label>
      <input id="fKw" placeholder="輸入關鍵字…">
    </div>

    <div class="sketch">
      <h3 class="sec">承辦小抄</h3>
      <div class="note">
        ✎ 點活動列可前往<b>報名詳情</b>示範頁。<br>
        ✎ 「管理報名」回到主控台審核名單。<br>
        ✎ 新活動請走 <b><a href="form.html" style="color:var(--ink)">新增活動</a></b> 表單，送簽後才會上架。<br>
        ✎ 每週五 17:00 前記得匯出 <b><a href="report.html" style="color:var(--ink)">統計報表</a></b> 給組長。
      </div>
    </div>
  </aside>

  <!-- ── 主區 ── -->
  <main class="main">
    <div class="sketch">
      <h3 class="sec" style="font-size:22px">
        活動列表
        <span class="circled hand" style="font-size:14px;color:var(--red)">額滿的要留意候補！
          <svg viewBox="0 0 200 40" preserveAspectRatio="none">
            <path d="M8,22 C10,6 90,2 150,6 C192,9 196,18 188,27 C176,38 60,40 22,34 C4,31 2,26 12,18" />
          </svg>
        </span>
      </h3>
      <div class="badge-row">
        <div class="badge pending">報名中 <span class="n" id="cOpen">0</span></div>
        <div class="badge wait">已額滿 <span class="n" id="cFull">0</span></div>
        <div class="badge">籌備中 <span class="n" id="cPrep">0</span></div>
        <div class="badge approved">已結束 <span class="n" id="cClosed">0</span></div>
      </div>

      <table>
        <thead>
          <tr><th>代號</th><th>活動名稱</th><th>活動日期</th><th>名額使用</th><th>狀態</th><th>操作</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
const EVENTS = [
  {code:'EV-2603', name:'2026 春季登山社 · 合歡北峰兩日營', date:'04/11 – 04/12', used:38, cap:50, status:'open'},
  {code:'EV-2604', name:'九九峰攝影晨拍 + 早餐野餐',         date:'04/19',        used:12, cap:25, status:'open'},
  {code:'EV-2602', name:'雪山東峰一日單攻（進階）',           date:'03/28',        used:20, cap:20, status:'full'},
  {code:'EV-2605', name:'大屯山夜觀生態導覽',                 date:'05/02',        used:15, cap:30, status:'prep'},
  {code:'EV-2601', name:'溪頭森林浴步道健行',                 date:'03/08',        used:30, cap:30, status:'closed'},
];
const STATUS = {open:['報名中','pending'], full:['已額滿','waitlist'], prep:['籌備中','approved'], closed:['已結束','closed']};
const tbody = document.getElementById('tbody');

function counts(){
  const c = {open:0, full:0, prep:0, closed:0};
  EVENTS.forEach(e=>c[e.status]++);
  document.getElementById('cOpen').textContent = c.open;
  document.getElementById('cFull').textContent = c.full;
  document.getElementById('cPrep').textContent = c.prep;
  document.getElementById('cClosed').textContent = c.closed;
}

function render(){
  const fs = document.getElementById('fStatus').value;
  const kw = document.getElementById('fKw').value.trim();
  tbody.innerHTML = '';
  EVENTS.filter(e => (!fs || e.status===fs) && (!kw || e.name.includes(kw) || e.code.includes(kw)))
    .forEach(e=>{
      const [label, cls] = STATUS[e.status];
      const pct = Math.round(e.used / e.cap * 100);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="num">${e.code}</td>
        <td><b>${e.name}</b></td>
        <td>${e.date}</td>
        <td><span class="cap-cell"><span class="cap-bar${pct>=100?' full':''}"><span class="cap-fill" data-w="${pct}"></span></span><span class="num">${e.used}/${e.cap}</span></span></td>
        <td><span class="tag ${cls}">${label}</span></td>
        <td><a class="btn ok" href="index.html">管理報名</a></td>`;
      tr.addEventListener('click', ev=>{
        if (ev.target.closest('a')) return;
        location.href = 'detail.html';
      });
      tbody.appendChild(tr);
    });
  if (!tbody.children.length){
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--pencil);padding:26px">— 查無符合條件的活動 —</td></tr>';
  }
  // 名額條淡入
  requestAnimationFrame(()=>setTimeout(()=>{
    tbody.querySelectorAll('.cap-fill').forEach(f=>f.style.width = f.dataset.w + '%');
  }, 60));
}

document.getElementById('fStatus').addEventListener('change', render);
document.getElementById('fKw').addEventListener('input', render);
render(); counts();
</script>
</body>
</html>
