<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統計報表 · 螢光標記報名審核系統</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfcf7; --ink:#2b3a67; --pencil:#8a8672;
  --hl-y:#fffd8a; --hl-p:#ffc9e3; --hl-g:#c8f7c5; --red:#e05252;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  background-color:var(--paper);color:var(--ink);
  background-image:linear-gradient(transparent 31px, rgba(43,58,103,.06) 32px);
  background-size:100% 32px; min-height:100vh;
}
.hand{font-family:'Kalam','Noto Sans TC',cursive}

.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 28px;border-bottom:2px solid var(--ink);
  background:#fffdf4;position:sticky;top:0;z-index:50;
}
.back{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--ink);font-weight:700;font-size:14px;padding:6px 14px;
  border:2px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  background:linear-gradient(transparent 55%, var(--hl-y) 55%);
  transition:transform .15s;
}
.back:hover{transform:rotate(-2deg) scale(1.05)}
.brand{font-size:22px;font-weight:700;letter-spacing:1px}
.brand .hl{background:linear-gradient(transparent 45%, var(--hl-p) 45%);padding:0 6px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.subnav a{
  text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;padding:5px 12px;
  border:2px solid transparent;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  transition:all .15s;
}
.subnav a:hover{border-color:var(--ink);background:linear-gradient(transparent 55%, var(--hl-g) 55%);transform:rotate(-1.5deg)}
.subnav a.on{border-color:var(--ink);background:linear-gradient(transparent 55%, var(--hl-y) 55%)}

.wrap{padding:28px;max-width:1280px;margin:0 auto;display:grid;gap:24px}
.sketch{
  border:2px solid var(--ink);background:#fffef9;position:relative;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  box-shadow:3px 4px 0 rgba(43,58,103,.12);padding:26px;
}
h3.sec{font-size:18px;margin-bottom:14px;display:inline-block;
  background:linear-gradient(transparent 50%, var(--hl-y) 50%);padding:0 8px;transform:rotate(-.6deg)}

.badge-row{display:flex;gap:16px;flex-wrap:wrap}
.badge{
  padding:10px 18px;border:2px solid var(--ink);font-size:14px;font-weight:700;
  border-radius:15px 225px 15px 225px/225px 15px 225px 15px;background:#fffef9;
}
.badge .n{font-family:'Kalam';font-size:26px;vertical-align:-4px;margin-left:6px}
.badge.pending{background:linear-gradient(transparent 40%,var(--hl-y) 40%)}
.badge.approved{background:linear-gradient(transparent 40%,var(--hl-g) 40%)}
.badge.wait{background:linear-gradient(transparent 40%,var(--hl-p) 40%)}

/* 手繪長條圖 */
.bars{display:grid;gap:14px;margin-top:8px}
.bar-row{display:grid;grid-template-columns:170px 1fr 64px;align-items:center;gap:14px;font-size:14px}
.bar-row .lbl{font-weight:600}
.bar-track{height:16px;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.bar-fill{height:100%;width:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.bf-y{background:repeating-linear-gradient(-45deg,var(--hl-y),var(--hl-y) 7px,#efe86a 7px,#efe86a 14px)}
.bf-g{background:repeating-linear-gradient(-45deg,var(--hl-g),var(--hl-g) 7px,#a4e8a0 7px,#a4e8a0 14px)}
.bf-p{background:repeating-linear-gradient(-45deg,var(--hl-p),var(--hl-p) 7px,#f0a8cc 7px,#f0a8cc 14px)}
.bar-row .val{font-family:'Kalam';font-weight:700;text-align:right}

/* 趨勢小柱 */
.trend{display:flex;gap:14px;align-items:flex-end;height:150px;margin-top:16px;padding:0 8px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.tbar{
  width:60%;max-width:54px;border:2px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;
  background:repeating-linear-gradient(-45deg,var(--hl-y),var(--hl-y) 6px,#efe86a 6px,#efe86a 12px);
  height:0;transition:height .7s cubic-bezier(.2,.8,.3,1);
}
.tcol:hover .tbar{background:repeating-linear-gradient(-45deg,var(--hl-g),var(--hl-g) 6px,#a4e8a0 6px,#a4e8a0 12px)}
.tcol .tv{font-family:'Kalam';font-weight:700;font-size:15px}
.tcol .td{font-size:11.5px;color:var(--pencil)}
.trend-base{border-top:2px dashed var(--ink);margin:-24px 8px 0;height:0}

.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar select{
  padding:8px 12px;font-family:inherit;font-size:14px;color:var(--ink);
  border:2px solid var(--ink);background:#fff;border-radius:15px 4px 15px 4px/4px 15px 4px 15px;
}
.btn{
  font-family:'Kalam','Noto Sans TC';font-size:14px;font-weight:700;cursor:pointer;
  padding:7px 18px;border:2px solid var(--ink);color:var(--ink);
  border-radius:225px 15px 255px 15px/15px 255px 15px 225px;background:#fff;
  transition:transform .12s;
}
.btn:hover{transform:rotate(-1.5deg) scale(1.04)}
.btn.ok{background:linear-gradient(transparent 45%,var(--hl-g) 45%)}

.toast{
  position:fixed;bottom:28px;right:28px;background:#fffef9;border:2px solid var(--ink);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:14px 22px;
  font-weight:700;box-shadow:3px 4px 0 rgba(43,58,103,.2);z-index:99;
  animation:popin .35s cubic-bezier(.2,1.5,.4,1);
}
.toast .mark{background:linear-gradient(transparent 45%,var(--hl-g) 45%);padding:0 4px}
@keyframes popin{from{transform:scale(.5) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
.note{font-size:12.5px;color:var(--pencil);margin-top:14px;line-height:1.9}
</style>
</head>
<body>

<header class="topbar">
  <a class="back hand" href="../../index.html">← 返回入口</a>
  <div class="brand hand">螢光標記 <span class="hl">報名審核</span> 系統</div>
  <nav class="subnav hand">
    <a href="index.html">返回主控台</a>
    <a href="events.html">活動列表</a>
    <a href="detail.html">報名詳情</a>
    <a href="form.html">新增活動</a>
    <a href="report.html" class="on">統計報表</a>
  </nav>
</header>

<div class="wrap">
  <!-- 區塊一：總覽 -->
  <div class="sketch">
    <h3 class="sec" style="font-size:22px">報名統計總覽</h3>
    <div class="toolbar">
      <label style="font-size:13px;font-weight:700;color:var(--pencil)">統計月份</label>
      <select id="selMonth">
        <option value="2026-03" selected>2026 年 3 月</option>
        <option value="2026-02">2026 年 2 月</option>
        <option value="2026-01">2026 年 1 月</option>
      </select>
      <button class="btn ok" id="btnExport">⤓ 匯出週報</button>
    </div>
    <div class="badge-row">
      <div class="badge pending">累計報名 <span class="n" id="kTotal">0</span></div>
      <div class="badge approved">已核准 <span class="n" id="kOk">0</span></div>
      <div class="badge wait">候補中 <span class="n" id="kWait">0</span></div>
      <div class="badge">核准率 <span class="n" id="kRate">0%</span></div>
    </div>
  </div>

  <!-- 區塊二：組別 / 狀態分布 -->
  <div class="sketch">
    <h3 class="sec">組別報名分布</h3>
    <div class="bars" id="groupBars"></div>
  </div>

  <div class="sketch">
    <h3 class="sec">審核狀態分布</h3>
    <div class="bars" id="statusBars"></div>
  </div>

  <!-- 區塊三：趨勢 -->
  <div class="sketch">
    <h3 class="sec">每日報名趨勢（近 7 日）</h3>
    <div class="trend" id="trend"></div>
    <div class="trend-base"></div>
    <div class="note">✎ 柱高代表當日新進報名筆數；游標移上會以螢光綠標記。尖峰通常出現在活動公告後 24 小時內。</div>
  </div>
</div>

<script>
const MONTHS = {
  '2026-03': { kpi:[96,71,14,74],
    groups:[['新手體驗組',46,'bf-y'],['縱走挑戰組',31,'bf-g'],['攝影慢遊組',19,'bf-p']],
    status:[['待審核',11,'bf-y'],['已核准',71,'bf-g'],['候補中',14,'bf-p']],
    trend:[['03/02',9],['03/03',14],['03/04',18],['03/05',12],['03/06',21],['03/07',16],['03/08',6]] },
  '2026-02': { kpi:[64,52,6,81],
    groups:[['新手體驗組',30,'bf-y'],['縱走挑戰組',22,'bf-g'],['攝影慢遊組',12,'bf-p']],
    status:[['待審核',6,'bf-y'],['已核准',52,'bf-g'],['候補中',6,'bf-p']],
    trend:[['02/23',7],['02/24',10],['02/25',8],['02/26',13],['02/27',11],['02/28',9],['03/01',6]] },
  '2026-01': { kpi:[41,33,4,80],
    groups:[['新手體驗組',19,'bf-y'],['縱走挑戰組',15,'bf-g'],['攝影慢遊組',7,'bf-p']],
    status:[['待審核',4,'bf-y'],['已核准',33,'bf-g'],['候補中',4,'bf-p']],
    trend:[['01/26',4],['01/27',6],['01/28',9],['01/29',5],['01/30',8],['01/31',5],['02/01',4]] },
};

function renderMonth(key){
  const d = MONTHS[key];
  document.getElementById('kTotal').textContent = d.kpi[0];
  document.getElementById('kOk').textContent = d.kpi[1];
  document.getElementById('kWait').textContent = d.kpi[2];
  document.getElementById('kRate').textContent = d.kpi[3] + '%';

  const paint = (el, rows)=>{
    const max = Math.max(...rows.map(r=>r[1]));
    el.innerHTML = rows.map(([lbl,v,cls])=>`
      <div class="bar-row">
        <span class="lbl">${lbl}</span>
        <span class="bar-track"><span class="bar-fill ${cls}" data-w="${Math.round(v/max*100)}"></span></span>
        <span class="val">${v}</span>
      </div>`).join('');
    requestAnimationFrame(()=>setTimeout(()=>{
      el.querySelectorAll('.bar-fill').forEach(f=>f.style.width = f.dataset.w + '%');
    }, 60));
  };
  paint(document.getElementById('groupBars'), d.groups);
  paint(document.getElementById('statusBars'), d.status);

  const tmax = Math.max(...d.trend.map(t=>t[1]));
  const tr = document.getElementById('trend');
  tr.innerHTML = d.trend.map(([day,v])=>`
    <div class="tcol">
      <span class="tv">${v}</span>
      <span class="tbar" data-h="${Math.round(v/tmax*120)}"></span>
      <span class="td">${day}</span>
    </div>`).join('');
  requestAnimationFrame(()=>setTimeout(()=>{
    tr.querySelectorAll('.tbar').forEach(b=>b.style.height = b.dataset.h + 'px');
  }, 60));
}

document.getElementById('selMonth').addEventListener('change', e=>renderMonth(e.target.value));

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast hand';
  t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='all .4s'; t.style.opacity=0; t.style.transform='translateY(16px)'; setTimeout(()=>t.remove(),400); }, 2200);
}
document.getElementById('btnExport').addEventListener('click', ()=>{
  const m = document.getElementById('selMonth');
  toast(`已匯出 <span class="mark">${m.options[m.selectedIndex].text}</span> 報名週報（CSV）✔`);
});

renderMonth('2026-03');
</script>
</body>
</html>
