<!DOCTYPE html>
<!-- 39 郵票齒孔 · 子頁：訂單列表 list.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂單列表 · 郵務訂單管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#e8dcc8; --stamp:#fdfaf2; --red:#b3402a; --ink:#5b4632;
  --blue:#33526e; --amber:#c98a1b; --green:#4f7d4a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--kraft);
  background-image:radial-gradient(rgba(120,90,50,.08) 1px,transparent 1.4px),radial-gradient(rgba(120,90,50,.05) 1px,transparent 1.4px);
  background-size:26px 26px,17px 17px;background-position:0 0,8px 8px;
  font-family:'Noto Serif TC',serif;color:var(--ink);min-height:100vh;padding-bottom:60px;
}
.topbar{display:flex;align-items:center;gap:18px;padding:22px 34px;border-bottom:2px dashed rgba(91,70,50,.5);flex-wrap:wrap}
.postmark-mini{font-family:'Special Elite';font-size:11px;color:var(--blue);letter-spacing:2px;border:1.5px solid var(--blue);border-radius:50%;width:74px;height:74px;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-9deg);opacity:.8;line-height:1.3;flex-shrink:0}
.logo{font-size:24px;font-weight:900;letter-spacing:4px}
.logo span{color:var(--red)}
.pagenav{display:flex;gap:10px;flex-wrap:wrap}
.pagenav a{
  font-family:'Special Elite';color:var(--blue);text-decoration:none;font-size:13px;letter-spacing:1px;
  border:1.5px solid var(--blue);padding:7px 16px;transition:.2s;background:rgba(51,82,110,.04);
}
.pagenav a:hover{transform:rotate(-2deg);background:rgba(51,82,110,.12)}
.pagenav a.on{background:var(--blue);color:var(--stamp)}
.spacer{flex:1}
.back-link{font-family:'Special Elite';color:var(--red);text-decoration:none;font-size:14px;border:2px solid var(--red);padding:9px 20px;letter-spacing:1px;transition:.25s;background:rgba(179,64,42,.05);white-space:nowrap}
.back-link:hover{background:var(--red);color:var(--stamp);transform:rotate(-2deg)}
.back-link.home{color:var(--green);border-color:var(--green);background:rgba(79,125,74,.05)}
.back-link.home:hover{background:var(--green);color:var(--stamp)}
main{max-width:1280px;margin:0 auto;padding:28px 34px}
h2.sec{font-size:18px;letter-spacing:6px;margin:10px 0 20px;display:flex;align-items:center;gap:14px;font-weight:900}
h2.sec::after{content:"";flex:1;border-top:2px dashed rgba(91,70,50,.5)}
.kpi-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.kpi{
  background:var(--stamp);padding:14px 24px;min-width:170px;flex:1;text-align:center;
  -webkit-mask:radial-gradient(circle 6px at 8px 8px,transparent 97%,#000) -8px -8px/16px 16px;
  mask:radial-gradient(circle 6px at 8px 8px,transparent 97%,#000) -8px -8px/16px 16px;
  box-shadow:0 3px 10px rgba(91,70,50,.25);
}
.kpi h3{font-size:12px;letter-spacing:3px;color:#8a7154;font-weight:500}
.kpi .val{font-family:'Special Elite';font-size:36px;color:var(--ink);line-height:1.2}
.kpi .val.r{color:var(--red)} .kpi .val.b{color:var(--blue)} .kpi .val.g{color:var(--green)}
.kpi .sub{font-size:11px;color:#8a7154;font-family:'Special Elite';letter-spacing:1px}
.sheet{
  background:var(--stamp);padding:26px 30px;margin-bottom:34px;
  -webkit-mask:radial-gradient(circle 7px at 9px 9px,transparent 97%,#000) -9px -9px/18px 18px;
  mask:radial-gradient(circle 7px at 9px 9px,transparent 97%,#000) -9px -9px/18px 18px;
  box-shadow:0 6px 18px rgba(91,70,50,.3);
}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar button{
  font-family:'Special Elite';background:transparent;border:1.5px dashed var(--ink);color:var(--ink);
  padding:7px 18px;font-size:12px;cursor:pointer;letter-spacing:1px;transition:.2s;
}
.filter-bar button.on{background:var(--ink);color:var(--stamp);border-style:solid}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;font-size:13px;border-bottom:1px dashed rgba(91,70,50,.35)}
thead th{font-family:'Special Elite';font-size:11px;letter-spacing:2px;color:#8a7154;border-bottom:2px solid var(--ink)}
tbody tr{cursor:pointer;transition:.15s}
tbody tr:hover{background:rgba(179,64,42,.06)}
.ono{font-family:'Special Elite';color:var(--blue);letter-spacing:1px}
.amt{font-family:'Special Elite';color:var(--red);font-weight:700}
.seal{
  display:inline-flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;
  border:3px double currentColor;font-weight:900;font-size:13px;letter-spacing:2px;
  transform:rotate(12deg);opacity:.75;line-height:1.3;text-align:center;
}
.seal small{display:block;font-family:'Special Elite';font-size:8px;font-weight:400;letter-spacing:1px}
.seal.ship{color:var(--red)} .seal.transit{color:var(--amber)} .seal.done{color:var(--green)} .seal.pend{color:var(--blue)}
.mini-seal{
  display:inline-block;border:2px double currentColor;border-radius:50%;width:62px;height:62px;
  font-size:11px;font-weight:900;letter-spacing:1px;text-align:center;line-height:1.25;padding-top:13px;
  transform:rotate(10deg);opacity:.75;
}
.mini-seal.ship{color:var(--red)} .mini-seal.transit{color:var(--amber)} .mini-seal.done{color:var(--green)} .mini-seal.pend{color:var(--blue)}
.hint{font-size:12px;color:#8a7154;font-family:'Special Elite';letter-spacing:1px}
@media (max-width:900px){table{font-size:12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="postmark-mini">TAIPEI<br>2026.08.28<br>✉</div>
  <div class="logo">郵務訂單管理<span> · POST & PARCEL MIS</span></div>
  <nav class="pagenav">
    <a href="index.html">郵票冊</a>
    <a href="list.html" class="on">訂單列表</a>
    <a href="detail.html">訂單詳情</a>
    <a href="form.html">新增訂單</a>
    <a href="report.html">出貨報表</a>
  </nav>
  <div class="spacer"></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <div class="kpi-row">
    <div class="kpi"><h3>今日訂單</h3><div class="val b">286</div><div class="sub">ORDERS RECEIVED</div></div>
    <div class="kpi"><h3>待出貨</h3><div class="val r">43</div><div class="sub">PENDING PICKUP</div></div>
    <div class="kpi"><h3>配送中</h3><div class="val">112</div><div class="sub">IN TRANSIT</div></div>
    <div class="kpi"><h3>已送達</h3><div class="val g">128</div><div class="sub">DELIVERED TODAY</div></div>
  </div>

  <h2 class="sec">訂 單 總 冊</h2>
  <section class="sheet">
    <div class="filter-bar" id="filterBar">
      <button class="on" data-f="all">全部 ALL</button>
      <button data-f="pend">待出貨</button>
      <button data-f="ship">已出貨</button>
      <button data-f="transit">配送中</button>
      <button data-f="done">已送達</button>
    </div>
    <table>
      <thead><tr><th>訂單編號</th><th>品項</th><th>收件人</th><th>貨運</th><th style="text-align:right">金額</th><th>下單時間</th><th style="text-align:center">狀態章</th></tr></thead>
      <tbody id="orderBody"></tbody>
    </table>
    <p class="hint" style="margin-top:14px">※ 點選任一列可前往該筆訂單詳情頁。</p>
  </section>
</main>
<script>
const orders=[
  {no:'TW-2026-088131',item:'復古打字機造型文具組',who:'許雅雯（新竹市東區）',ship:'中華郵政 · 掛號',amt:'NT$ 760',tm:'08/28 09:12',st:'ship',stTxt:'已出貨'},
  {no:'TW-2026-088123',item:'手工皮革筆記本組',who:'陳思穎（台北市大安區）',ship:'黑貓宅急便 · 常溫',amt:'NT$ 1,280',tm:'08/27 21:14',st:'ship',stTxt:'已出貨'},
  {no:'TW-2026-088110',item:'冷凍虱目魚肚粥六入',who:'吳宗憲（台南市安平區）',ship:'黑貓宅急便 · 冷凍',amt:'NT$ 990',tm:'08/27 08:30',st:'transit',stTxt:'配送中'},
  {no:'TW-2026-088096',item:'阿里山高山烏龍茶禮盒',who:'林志遠（台中市西屯區）',ship:'新竹物流 · 常溫',amt:'NT$ 2,450',tm:'08/26 10:02',st:'transit',stTxt:'配送中'},
  {no:'TW-2026-088082',item:'手繪地圖風明信片套組',who:'郭品彤（花蓮市）',ship:'中華郵政 · 平信',amt:'NT$ 320',tm:'08/26 07:45',st:'transit',stTxt:'配送中'},
  {no:'TW-2026-087950',item:'鶯歌手作陶杯四入組',who:'黃美玲（高雄市左營區）',ship:'中華郵政 · 易碎品',amt:'NT$ 1,680',tm:'08/24 15:47',st:'done',stTxt:'已送達'},
  {no:'TW-2026-087874',item:'手沖咖啡濾杯木架組',who:'鄭宇翔（桃園市中壢區）',ship:'新竹物流 · 常溫',amt:'NT$ 1,150',tm:'08/23 19:55',st:'done',stTxt:'已送達'},
  {no:'TW-2026-088145',item:'檜木香氛蠟燭禮盒',who:'周子涵（宜蘭縣羅東鎮）',ship:'黑貓宅急便 · 常溫',amt:'NT$ 1,020',tm:'08/28 13:26',st:'pend',stTxt:'待出貨'},
  {no:'TW-2026-088152',item:'藍染棉布桌巾',who:'林俊傑（台東市）',ship:'中華郵政 · 包裹',amt:'NT$ 880',tm:'08/28 15:03',st:'pend',stTxt:'待出貨'},
];
const bodyEl=document.getElementById('orderBody');
function render(f){
  const list=f==='all'?orders:orders.filter(o=>o.st===f);
  bodyEl.innerHTML=list.map(o=>`<tr onclick="location.href='detail.html'">
    <td class="ono">NO. ${o.no}</td><td><b>${o.item}</b></td><td>${o.who}</td><td>${o.ship}</td>
    <td class="amt" style="text-align:right">${o.amt}</td>
    <td style="font-family:'Special Elite';font-size:12px">${o.tm}</td>
    <td style="text-align:center"><span class="mini-seal ${o.st}">${o.stTxt}</span></td>
  </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px;color:#8a7154">此分類暫無訂單 ✉</td></tr>';
}
render('all');
document.querySelectorAll('#filterBar button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#filterBar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.f);
}));
</script>
</body>
</html>
