<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收發文一覽 · 公文線上簽核系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Serif TC',serif}
  body{background:#e8e2d2;min-height:100vh;color:#2b2620;padding:24px}
  .paper{background:#fdfaf3;max-width:1420px;margin:0 auto;box-shadow:0 4px 24px rgba(43,38,32,.18),0 0 0 1px rgba(43,38,32,.06);padding:0 0 40px;position:relative}
  .paper::before{content:'';position:absolute;inset:10px;border:1px solid rgba(181,0,0,.25);pointer-events:none}
  .letterhead{text-align:center;padding:34px 20px 20px;position:relative}
  .letterhead .org{font-size:34px;font-weight:900;letter-spacing:14px;color:#b50000;text-indent:14px}
  .letterhead .sys{font-size:15px;letter-spacing:6px;color:#2b2620;margin-top:8px}
  .dbl-line{height:0;border-top:3px solid #b50000;border-bottom:1px solid #b50000;padding-top:2px;margin:16px 30px 0}
  .toolbar{display:flex;align-items:center;gap:12px;padding:16px 30px;border-bottom:1px solid #e0d8c4;flex-wrap:wrap}
  .back{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#fdfaf3;background:#4a4234;padding:8px 16px;border-radius:2px;text-decoration:none;letter-spacing:2px;transition:.2s}
  .back:hover{background:#b50000}
  .back.alt{background:#fdfaf3;color:#4a4234;border:1px solid #b8ad95}
  .back.alt:hover{background:#b50000;color:#fdfaf3;border-color:#b50000}
  .qbox{margin-left:auto;display:flex;gap:10px;align-items:center}
  .q{font-family:'Noto Sans TC',sans-serif;font-size:13px;padding:8px 14px;border:1px solid #b8ad95;background:#fffdf7;color:#2b2620;width:250px;outline:none}
  .q:focus{border-color:#b50000}
  .tabs{display:flex;gap:0;padding:0 30px;border-bottom:2px solid #4a4234}
  .tab{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;letter-spacing:2px;padding:11px 22px;cursor:pointer;color:#7d7466;border:1px solid transparent;border-bottom:none;transition:.2s}
  .tab:hover{color:#b50000}
  .tab.on{background:#fdfaf3;color:#b50000;font-weight:700;border-color:#4a4234;position:relative;top:2px;border-top:3px solid #b50000}
  .listwrap{padding:22px 30px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:#4a4234;color:#fdfaf3;font-weight:600;padding:10px 8px;letter-spacing:2px;font-size:13px}
  td{padding:11px 8px;border-bottom:1px solid #e0d8c4;vertical-align:middle}
  tbody tr{transition:.15s}
  tbody tr:hover{background:#f5efdd}
  .docno{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:#4a4234;font-weight:500;white-space:nowrap}
  .subject{font-weight:500;line-height:1.55}
  .sec{font-size:12px;padding:2px 8px;border:1px solid;letter-spacing:1px;white-space:nowrap}
  .sec-secret{color:#b50000;border-color:#b50000}
  .sec-conf{color:#c2410c;border-color:#c2410c}
  .sec-normal{color:#3f6212;border-color:#3f6212}
  .stamp{display:inline-block;font-weight:900;color:#c0392b;border:2.5px solid #c0392b;border-radius:4px;padding:2px 7px;font-size:13px;letter-spacing:2px;transform:rotate(-7deg)}
  .plain-speed{font-size:12px;color:#7d7466;letter-spacing:1px}
  .st{font-family:'Noto Sans TC',sans-serif;font-size:11.5px;padding:2px 10px;border-radius:2px;letter-spacing:1px;white-space:nowrap}
  .st-pend{color:#b50000;border:1px solid #b50000}
  .st-run{color:#1d4ed8;border:1px solid #1d4ed8}
  .st-done{color:#3f6212;border:1px solid #3f6212}
  .lnk{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:#b50000;text-decoration:none;border-bottom:1px solid #b50000;padding-bottom:1px;white-space:nowrap}
  .lnk:hover{background:#b50000;color:#fdfaf3}
  .count{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:#7d7466;letter-spacing:1px;margin-bottom:12px}
  .empty{padding:40px;text-align:center;color:#7d7466;letter-spacing:3px;display:none}
</style>
</head>
<body>
<div class="paper">
  <header class="letterhead">
    <div class="org">勤政市政府</div>
    <div class="sys">公 文 線 上 簽 核 管 理 系 統</div>
    <div class="dbl-line"></div>
  </header>

  <div class="toolbar">
    <a class="back" href="../../index.html">← 返回入口</a>
    <a class="back alt" href="index.html">返回主控台</a>
    <a class="back alt" href="form.html">✍ 創稿</a>
    <a class="back alt" href="report.html">統計報表</a>
    <div class="qbox">
      <input class="q" id="q" placeholder="查詢文號、主旨、來文機關…">
    </div>
  </div>

  <div class="tabs" id="tabs">
    <span class="tab on" data-t="all">全部公文</span>
    <span class="tab" data-t="in">收文</span>
    <span class="tab" data-t="out">發文</span>
    <span class="tab" data-t="sign">簽呈</span>
  </div>

  <div class="listwrap">
    <div class="count" id="count"></div>
    <table>
      <thead><tr><th>文號</th><th style="text-align:left">主旨</th><th>類別</th><th>密等</th><th>速別</th><th>辦結期限</th><th>狀態</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">無 符 合 條 件 之 公 文</div>
  </div>
</div>

<script>
const DOCS = [
  {no:'勤政秘字第 1150801234 號', subj:'函轉行政院「115 年度數位政府推動計畫」補助申請須知，請相關局處於期限內提報', t:'in', sec:'普通', speed:'速件', dl:'115.09.02', st:['run','簽核中']},
  {no:'勤政工字第 1150801189 號', subj:'本府「民生東路道路拓寬工程」第 3 次流標檢討及重新招標策略簽呈', t:'sign', sec:'密件', speed:'速件', dl:'115.08.29', st:['run','簽核中']},
  {no:'勤政社字第 1150800976 號', subj:'115 年度下半年低收入戶生活補助費撥付清冊，請核撥新臺幣 1,247 萬元整', t:'sign', sec:'機密', speed:'普通', dl:'115.09.05', st:['run','簽核中']},
  {no:'勤政人字第 1150801042 號', subj:'本府 115 年第 3 季約聘僱人員甄選簡章（草案），計招募 28 名', t:'sign', sec:'普通', speed:'普通', dl:'115.09.10', st:['pend','待會辦']},
  {no:'勤政環字第 1150801201 號', subj:'本市福德坑垃圾焚化廠歲修期間垃圾暫置應變計畫', t:'in', sec:'密件', speed:'速件', dl:'115.08.31', st:['run','核判中']},
  {no:'勤政交字第 1150801156 號', subj:'115 年國慶連假大眾運輸疏運計畫及接驳公車路線圖', t:'out', sec:'普通', speed:'普通', dl:'115.09.08', st:['done','已結案']},
  {no:'勤政教字第 1150800890 號', subj:'本市立國中小 115 學年度營養午餐食材聯合採購決標公告', t:'out', sec:'普通', speed:'普通', dl:'115.08.25', st:['done','已結案']},
  {no:'勤政財字第 1150801267 號', subj:'115 年度第 2 次市庫集中支付作業異常帳務勾稽報告', t:'in', sec:'密件', speed:'普通', dl:'115.09.12', st:['pend','待分文']},
  {no:'勤政觀字第 1150801198 號', subj:'「勤政燈節 116」委託規劃設計案評選委員名單（密件陳核）', t:'sign', sec:'機密', speed:'速件', dl:'115.09.01', st:['run','簽核中']},
  {no:'勤政衛字第 1150800512 號', subj:'本市登革熱防治第 3 級應變解除及復原措施報告', t:'out', sec:'普通', speed:'普通', dl:'115.08.20', st:['done','已結案']}
];
const SEC_CLS={'機密':'sec-secret','密件':'sec-conf','普通':'sec-normal'};
const T_TXT={in:'收文',out:'發文',sign:'簽呈'};
let tab='all';
const tbody=document.getElementById('tbody');
function render(){
  const q=document.getElementById('q').value.trim();
  const list=DOCS.filter(d=>(tab==='all'||d.t===tab)&&(!q||d.no.includes(q)||d.subj.includes(q)));
  document.getElementById('count').textContent=`共 ${list.length} 件（查詢條件：${tab==='all'?'全部':T_TXT[tab]}${q?'，關鍵字「'+q+'」':''}）`;
  tbody.innerHTML='';
  document.getElementById('empty').style.display=list.length?'none':'block';
  list.forEach(d=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td class="docno">${d.no}</td>
      <td class="subject">${d.subj}</td>
      <td style="text-align:center"><span style="font-size:12.5px;color:#7d7466;letter-spacing:2px">${T_TXT[d.t]}</span></td>
      <td style="text-align:center"><span class="sec ${SEC_CLS[d.sec]}">${d.sec}</span></td>
      <td style="text-align:center">${d.speed==='速件'?'<span class="stamp">速件</span>':'<span class="plain-speed">普通</span>'}</td>
      <td class="docno" style="text-align:center">${d.dl}</td>
      <td style="text-align:center"><span class="st st-${d.st[0]}">${d.st[1]}</span></td>
      <td style="text-align:center"><a class="lnk" href="detail.html">調閱</a></td>`;
    tbody.appendChild(tr);
  });
}
document.getElementById('tabs').addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); tab=t.dataset.t; render();
});
document.getElementById('q').addEventListener('input',render);
render();
</script>
</body>
</html>
