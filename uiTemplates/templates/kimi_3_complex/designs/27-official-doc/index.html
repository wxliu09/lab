<!DOCTYPE html>
<!--
  設計規格 — 27-official-doc.html 行政文書·公文系統
  風格定位：政府機關公文線上簽核系統，莊重典雅、紙本文書質感
  配色：公文紙米白 #fdfaf3｜抬頭紅 #b50000（雙線）｜墨黑 #2b2620｜次要 #7d7466
        密等：機密 #b50000、密件 #c2410c、普通 #3f6212｜速件章紅框 #c0392b
  字體：Noto Serif TC（仿宋／標楷體感）、數字 Noto Sans TC
  版面結構：紅色雙線機關抬頭 → 工具列（返回入口＋KPI 統計）→ 左公文列表表格（文號/主旨/密等/速別/簽核進度節點連線）→ 右側簽核詳情面板
  動態效果：點列帶入詳情面板（淡入）、簽核進度節點動畫點亮、速件章加蓋戳章動畫
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公文線上簽核系統 · 勤政市政府</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Serif TC',serif}
  body{background:#e8e2d2;min-height:100vh;color:#2b2620;padding:24px}
  .paper{background:#fdfaf3;max-width:1420px;margin:0 auto;box-shadow:0 4px 24px rgba(43,38,32,.18), 0 0 0 1px rgba(43,38,32,.06);padding:0 0 40px;position:relative}
  .paper::before{content:'';position:absolute;inset:10px;border:1px solid rgba(181,0,0,.25);pointer-events:none}
  .letterhead{text-align:center;padding:34px 20px 20px;position:relative}
  .letterhead .org{font-size:34px;font-weight:900;letter-spacing:14px;color:#b50000;text-indent:14px}
  .letterhead .sys{font-size:15px;letter-spacing:6px;color:#2b2620;margin-top:8px}
  .dbl-line{height:0;border-top:3px solid #b50000;border-bottom:1px solid #b50000;padding-top:2px;margin:16px 30px 0}
  .toolbar{display:flex;align-items:center;gap:16px;padding:16px 30px;border-bottom:1px solid #e0d8c4;flex-wrap:wrap}
  .back{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#fdfaf3;background:#4a4234;padding:8px 16px;border-radius:2px;text-decoration:none;letter-spacing:2px;transition:.2s}
  .back:hover{background:#b50000}
  .stats{display:flex;gap:26px;margin-left:auto}
  .stat{text-align:center}
  .stat b{font-family:'Noto Sans TC',sans-serif;font-size:22px;font-weight:700;display:block;color:#4a4234}
  .stat span{font-size:12px;color:#7d7466;letter-spacing:2px}
  .layout{display:grid;grid-template-columns:1.6fr 1fr;gap:0;align-items:start}
  .list{padding:22px 10px 22px 30px}
  .list h2,.detail h2{font-size:17px;font-weight:700;letter-spacing:4px;border-left:4px solid #b50000;padding-left:10px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:#4a4234;color:#fdfaf3;font-weight:600;padding:10px 8px;letter-spacing:2px;font-size:13px}
  td{padding:11px 8px;border-bottom:1px solid #e0d8c4;vertical-align:middle}
  tbody tr{cursor:pointer;transition:.15s}
  tbody tr:hover{background:#f5efdd}
  tbody tr.sel{background:#f3ead0;box-shadow:inset 3px 0 0 #b50000}
  .docno{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:#4a4234;font-weight:500}
  .subject{font-weight:500;line-height:1.5}
  .sec{font-size:12px;padding:2px 8px;border:1px solid;letter-spacing:1px;white-space:nowrap}
  .sec-secret{color:#b50000;border-color:#b50000}
  .sec-conf{color:#c2410c;border-color:#c2410c}
  .sec-normal{color:#3f6212;border-color:#3f6212}
  .stamp{display:inline-block;font-weight:900;color:#c0392b;border:2.5px solid #c0392b;border-radius:4px;padding:2px 7px;font-size:13px;letter-spacing:2px;transform:rotate(-7deg);opacity:0}
  .stamp.on{animation:stampIn .45s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes stampIn{from{opacity:0;transform:rotate(-7deg) scale(2.4)}to{opacity:.92;transform:rotate(-7deg) scale(1)}}
  .plain-speed{font-size:12px;color:#7d7466;letter-spacing:1px}
  .flow{display:flex;align-items:center;gap:0}
  .node{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #b8ad95;flex:none;transition:.3s}
  .node.done{background:#3f6212;border-color:#3f6212}
  .node.cur{background:#b50000;border-color:#b50000;box-shadow:0 0 0 4px rgba(181,0,0,.15);animation:blink 1.6s infinite}
  @keyframes blink{50%{box-shadow:0 0 0 7px rgba(181,0,0,.05)}}
  .link{width:16px;height:2px;background:#b8ad95;flex:none}
  .link.done{background:#3f6212}
  .flow-labels{display:flex;font-size:10px;color:#7d7466;margin-top:4px}
  .flow-labels span{width:27px;text-align:center;margin-left:-8px}
  .flow-labels span:first-child{margin-left:-5px}
  .detail{padding:22px 30px 22px 18px;position:sticky;top:24px}
  .card{background:#fffdf7;border:1px solid #e0d8c4;box-shadow:3px 3px 0 rgba(74,66,52,.12);padding:22px;animation:cardIn .35s both}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .card h3{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:4px}
  .card .no{font-family:'Noto Sans TC',sans-serif;font-size:12px;color:#7d7466;margin-bottom:14px}
  .kv{display:flex;font-size:13.5px;padding:7px 0;border-bottom:1px dashed #e0d8c4}
  .kv .k{width:86px;color:#7d7466;flex:none;letter-spacing:2px}
  .kv .v{flex:1}
  .signflow{margin-top:16px}
  .sf-step{display:flex;gap:12px;position:relative;padding-bottom:18px}
  .sf-step::before{content:'';position:absolute;left:8px;top:20px;bottom:0;width:2px;background:#e0d8c4}
  .sf-step:last-child::before{display:none}
  .sf-dot{width:18px;height:18px;border-radius:50%;border:2px solid #b8ad95;background:#fffdf7;flex:none;margin-top:2px;z-index:1}
  .sf-step.done .sf-dot{background:#3f6212;border-color:#3f6212}
  .sf-step.now .sf-dot{background:#b50000;border-color:#b50000;animation:blink 1.6s infinite}
  .sf-step .who{font-size:14px;font-weight:600}
  .sf-step .meta{font-size:12px;color:#7d7466;font-family:'Noto Sans TC',sans-serif;margin-top:2px}
  .sf-step .op{font-size:13px;margin-top:5px;background:#f5efdd;padding:7px 10px;border-left:3px solid #b8ad95;line-height:1.6}
  .sf-step.now .op{border-left-color:#b50000}
  @media(max-width:980px){.layout{grid-template-columns:1fr}.detail{position:static}}
</style>
</head>
<body>
<div class="paper">
  <header class="letterhead">
    <div class="org">勤政市政府</div>
    <div class="sys">公 文 線 上 簽 核 管 理 系 統</div>
    <div class="dbl-line"></div>
  </header>

  <div class="toolbar">
    <a class="back" href="../../index.html">← 返回入口</a>
    <a class="back" href="list.html" style="background:#fdfaf3;color:#4a4234;border:1px solid #b8ad95">收發文一覽</a>
    <a class="back" href="form.html" style="background:#fdfaf3;color:#4a4234;border:1px solid #b8ad95">✍ 創稿</a>
    <a class="back" href="report.html" style="background:#fdfaf3;color:#4a4234;border:1px solid #b8ad95">統計報表</a>
    <span style="font-size:13px;color:#7d7466;letter-spacing:1px">承辦人：秘書室 陳雅雯 ｜ 中華民國 115 年 8 月 28 日</span>
    <div class="stats">
      <div class="stat"><b>17</b><span>待簽公文</span></div>
      <div class="stat"><b style="color:#b50000">3</b><span>速件</span></div>
      <div class="stat"><b>45</b><span>本週已結案</span></div>
      <div class="stat"><b>98.2%</b><span>如期辦結率</span></div>
    </div>
  </div>

  <div class="layout">
    <section class="list">
      <h2>待 辦 公 文 一 覽</h2>
      <table>
        <thead><tr><th>文號</th><th style="text-align:left">主旨</th><th>密等</th><th>速別</th><th>簽核進度</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
    <aside class="detail">
      <h2>簽 核 詳 情</h2>
      <div class="card" id="card"></div>
    </aside>
  </div>
</div>

<script>
const DOCS = [
  {no:'勤政秘字第 1150801234 號', subj:'函轉行政院「115 年度數位政府推動計畫」補助申請須知，請相關局處於期限內提報', sec:'普通', speed:'速件', step:2,
   date:'115.08.26', from:'行政院數位發展部', to:'本府各局處', deadline:'115.09.02',
   flow:[{who:'秘書室 陳雅雯', act:'收文登錄', t:'08/26 09:12', op:'分文至資訊局、財政局會辦。', s:'done'},
         {who:'資訊局 黃科長', act:'會辦', t:'08/27 14:30', op:'本局擬提報智慧市政平台子計畫，經費概估 800 萬元。', s:'done'},
         {who:'財政局 林局長', act:'審核中', t:'—', op:'', s:'now'},
         {who:'副市長室', act:'核判', t:'—', op:'', s:''},
         {who:'市長室', act:'決行', t:'—', op:'', s:''}]},
  {no:'勤政工字第 1150801189 號', subj:'本府「民生東路道路拓寬工程」第 3 次流標檢討及重新招標策略簽呈', sec:'密件', speed:'速件', step:1,
   date:'115.08.25', from:'工務局新建工程處', to:'市長室', deadline:'115.08.29',
   flow:[{who:'工務局 張技正', act:'擬辦', t:'08/25 10:05', op:'建議調整底價並採最有利標，檢附流標原因分析表乙份。', s:'done'},
         {who:'工務局 王局長', act:'審核中', t:'—', op:'', s:'now'},
         {who:'主計處', act:'會辦', t:'—', op:'', s:''},
         {who:'市長室', act:'決行', t:'—', op:'', s:''}]},
  {no:'勤政社字第 1150800976 號', subj:'115 年度下半年低收入戶生活補助費撥付清冊，請核撥新臺幣 1,247 萬元整', sec:'機密', speed:'普通', step:3,
   date:'115.08.22', from:'社會局救助科', to:'主計處', deadline:'115.09.05',
   flow:[{who:'社會局 劉科員', act:'擬辦', t:'08/22 11:40', op:'清冊計 3,412 戶，業經比對戶政及稅籍資料無誤。', s:'done'},
         {who:'社會局 許局長', act:'審核', t:'08/24 16:20', op:'同意，請主計處撥付。', s:'done'},
         {who:'主計處 高專員', act:'會辦', t:'08/27 09:15', op:'預算科目 115-社會救助-02 項下支應，餘額足敷。', s:'done'},
         {who:'主計處 林處長', act:'審核中', t:'—', op:'', s:'now'},
         {who:'副市長室', act:'核判', t:'—', op:'', s:''}]},
  {no:'勤政人字第 1150801042 號', subj:'本府 115 年第 3 季約聘僱人員甄選簡章（草案），計招募 28 名', sec:'普通', speed:'普通', step:1,
   date:'115.08.24', from:'人事處任用科', to:'市長室', deadline:'115.09.10',
   flow:[{who:'人事處 吳科長', act:'擬辦', t:'08/24 14:00', op:'簡章草案如附件，預定 9 月中旬辦理筆試。', s:'done'},
         {who:'人事處 莊處長', act:'審核中', t:'—', op:'', s:'now'},
         {who:'秘書處', act:'會辦', t:'—', op:'', s:''},
         {who:'市長室', act:'決行', t:'—', op:'', s:''}]},
  {no:'勤政環字第 1150801201 號', subj:'本市福德坑垃圾焚化廠歲修期間垃圾暫置應變計畫', sec:'密件', speed:'速件', step:2,
   date:'115.08.26', from:'環境保護局', to:'副市長室', deadline:'115.08.31',
   flow:[{who:'環保局 周技士', act:'擬辦', t:'08/26 08:50', op:'歲修 45 日間每日約 600 噸垃圾，擬轉運至鄰近縣市焚化廠。', s:'done'},
         {who:'環保局 柯局長', act:'審核', t:'08/27 17:10', op:'同意，惟轉運費用請再議價。', s:'done'},
         {who:'副市長室', act:'核判中', t:'—', op:'', s:'now'},
         {who:'市長室', act:'決行', t:'—', op:'', s:''}]}
];
const SEC_CLS = {'機密':'sec-secret','密件':'sec-conf','普通':'sec-normal'};
const STEPS = ['收文','擬辦','審核','核判','決行'];
const tbody = document.getElementById('tbody');
DOCS.forEach((d,i)=>{
  const tr = document.createElement('tr');
  const total = d.flow.length;
  let flow = '<div class="flow">';
  d.flow.forEach((f,j)=>{
    flow += `<span class="node ${j<d.step?'done':(j===d.step?'cur':'')}"></span>`;
    if(j<total-1) flow += `<span class="link ${j<d.step?'done':''}"></span>`;
  });
  flow += '</div>';
  tr.innerHTML = `
    <td class="docno">${d.no}</td>
    <td class="subject">${d.subj}</td>
    <td style="text-align:center"><span class="sec ${SEC_CLS[d.sec]}">${d.sec}</span></td>
    <td style="text-align:center">${d.speed==='速件'?`<span class="stamp" data-i="${i}">速件</span>`:`<span class="plain-speed">普通</span>`}</td>
    <td>${flow}</td>`;
  tr.addEventListener('click', ()=>{ document.querySelectorAll('tbody tr').forEach(r=>r.classList.remove('sel')); tr.classList.add('sel'); showDetail(i); });
  tbody.appendChild(tr);
});
function showDetail(i){
  const d = DOCS[i];
  const card = document.getElementById('card');
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  card.innerHTML = `
    <h3>${d.subj}</h3>
    <div class="no">${d.no} ｜ 收文日：${d.date}</div>
    <div class="kv"><span class="k">來文機關</span><span class="v">${d.from}</span></div>
    <div class="kv"><span class="k">受文單位</span><span class="v">${d.to}</span></div>
    <div class="kv"><span class="k">密　　等</span><span class="v"><span class="sec ${SEC_CLS[d.sec]}">${d.sec}</span></span></div>
    <div class="kv"><span class="k">速　　別</span><span class="v">${d.speed}</span></div>
    <div class="kv"><span class="k">辦結期限</span><span class="v">${d.deadline}</span></div>
    <div class="kv"><span class="k">全文調閱</span><span class="v"><a href="detail.html" style="color:#b50000;font-family:'Noto Sans TC',sans-serif;font-size:12.5px;text-decoration:none;border-bottom:1px solid #b50000">開啟公文詳情頁 →</a></span></div>
    <div class="signflow">
      ${d.flow.map(f=>`
        <div class="sf-step ${f.s}">
          <span class="sf-dot"></span>
          <div><div class="who">${f.who} <span style="font-weight:400;color:#7d7466;font-size:12px">— ${f.act}</span></div>
          <div class="meta">${f.t}</div>
          ${f.op?`<div class="op">${f.op}</div>`:''}</div>
        </div>`).join('')}
    </div>`;
}
showDetail(0);
tbody.rows[0].classList.add('sel');
setTimeout(()=>document.querySelectorAll('.stamp').forEach((s,i)=>setTimeout(()=>s.classList.add('on'), 400+i*300)), 500);
</script>
</body>
</html>
