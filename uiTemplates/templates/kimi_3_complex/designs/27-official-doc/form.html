<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創稿 · 公文線上簽核系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Serif TC',serif}
  body{background:#e8e2d2;min-height:100vh;color:#2b2620;padding:24px}
  .paper{background:#fdfaf3;max-width:1420px;margin:0 auto;box-shadow:0 4px 24px rgba(43,38,32,.18),0 0 0 1px rgba(43,38,32,.06);padding:0 0 40px;position:relative}
  .paper::before{content:'';position:absolute;inset:10px;border:1px solid rgba(181,0,0,.25);pointer-events:none}
  .letterhead{text-align:center;padding:34px 20px 20px;position:relative}
  .letterhead .org{font-size:34px;font-weight:900;letter-spacing:14px;color:#b50000;text-indent:14px}
  .letterhead .sys{font-size:15px;letter-spacing:6px;color:#2b2620;margin-top:8px}
  .dbl-line{height:0;border-top:3px solid #b50000;border-bottom:1px solid #b50000;padding-top:2px;margin:16px 30px 0}
  .toolbar{display:flex;align-items:center;gap:12px;padding:16px 30px;border-bottom:1px solid #e0d8c4;flex-wrap:wrap}
  .back{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#fdfaf3;background:#4a4234;padding:8px 16px;border-radius:2px;text-decoration:none;letter-spacing:2px;transition:.2s}
  .back:hover{background:#b50000}
  .back.alt{background:#fdfaf3;color:#4a4234;border:1px solid #b8ad95}
  .back.alt:hover{background:#b50000;color:#fdfaf3;border-color:#b50000}
  .sttag{font-family:'Noto Sans TC',sans-serif;font-size:11.5px;padding:3px 12px;border:1px solid #1d4ed8;color:#1d4ed8;letter-spacing:2px;margin-left:auto}
  .layout{display:grid;grid-template-columns:1.6fr 1fr;gap:0;align-items:start}
  .formside{padding:26px 10px 26px 30px}
  .preview{padding:26px 30px 26px 18px;position:sticky;top:24px}
  h2{font-size:17px;font-weight:700;letter-spacing:4px;border-left:4px solid #b50000;padding-left:10px;margin-bottom:16px}
  .card{background:#fffdf7;border:1px solid #e0d8c4;box-shadow:3px 3px 0 rgba(74,66,52,.12);padding:24px;margin-bottom:20px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13.5px;letter-spacing:2px;color:#4a4234;margin-bottom:7px}
  .field label b{color:#b50000}
  .inp{width:100%;border:1px solid #b8ad95;background:#fffdf7;padding:10px 12px;font-family:inherit;font-size:14px;outline:none;color:#2b2620;transition:.15s}
  .inp:focus{border-color:#b50000;box-shadow:2px 2px 0 rgba(181,0,0,.15)}
  textarea.inp{min-height:150px;resize:vertical;line-height:1.9}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid #b8ad95;background:#fdfaf3;font-size:13.5px;letter-spacing:1px;cursor:pointer;transition:.15s}
  .opt:has(input:checked){border-color:#b50000;color:#b50000;background:#fbf3ef;font-weight:600}
  .opt input{accent-color:#b50000}
  .cnt{font-family:'Noto Sans TC',sans-serif;font-size:12px;color:#7d7466;text-align:right;margin-top:4px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  .abtn{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;letter-spacing:2px;padding:11px 24px;border-radius:2px;cursor:pointer;transition:.2s;border:1px solid #4a4234;background:#fdfaf3;color:#4a4234}
  .abtn.primary{background:#b50000;border-color:#b50000;color:#fdfaf3}
  .abtn.primary:hover{background:#8f0000}
  .abtn:hover{background:#4a4234;color:#fdfaf3}
  .pv{min-height:380px;font-size:14px;line-height:2;letter-spacing:1px}
  .pv .pno{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:#7d7466;border-bottom:1px solid #e0d8c4;padding-bottom:8px;margin-bottom:14px}
  .pv .psubj{font-weight:700;font-size:15.5px;line-height:1.8;margin-bottom:12px}
  .pv .pbody{white-space:pre-wrap;text-align:justify}
  .kv{display:flex;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #e0d8c4}
  .kv .k{width:92px;color:#7d7466;flex:none;letter-spacing:2px}
  .toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,18px);background:#4a4234;color:#fdfaf3;font-family:'Noto Sans TC',sans-serif;font-size:13.5px;letter-spacing:2px;padding:12px 26px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:980px){.layout{grid-template-columns:1fr}.preview{position:static}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="paper">
  <header class="letterhead">
    <div class="org">勤政市政府</div>
    <div class="sys">公 文 線 上 簽 核 管 理 系 統</div>
    <div class="dbl-line"></div>
  </header>

  <div class="toolbar">
    <a class="back" href="../../index.html">← 返回入口</a>
    <a class="back alt" href="index.html">返回主控台</a>
    <a class="back alt" href="list.html">收發文一覽</a>
    <span class="sttag" id="sttag">草稿 · 未送出</span>
  </div>

  <div class="layout">
    <section class="formside">
      <h2>創 稿 （ 函 稿 ）</h2>
      <div class="card">
        <div class="frow">
          <div class="field"><label>文別 <b>*</b></label>
            <select class="inp" id="fKind"><option>函</option><option>書函</option><option>公告</option><option>令</option><option>簽</option></select></div>
          <div class="field"><label>發文日期 <b>*</b></label><input class="inp" type="date" id="fDate" value="2026-08-29"></div>
        </div>
        <div class="frow">
          <div class="field"><label>密等</label>
            <div class="opts">
              <label class="opt"><input type="radio" name="sec" value="普通" checked>普通</label>
              <label class="opt"><input type="radio" name="sec" value="密件">密件</label>
              <label class="opt"><input type="radio" name="sec" value="機密">機密</label>
            </div></div>
          <div class="field"><label>速別</label>
            <div class="opts">
              <label class="opt"><input type="radio" name="spd" value="普通" checked>普通</label>
              <label class="opt"><input type="radio" name="spd" value="速件">速件</label>
              <label class="opt"><input type="radio" name="spd" value="最速件">最速件</label>
            </div></div>
        </div>
        <div class="field"><label>受文者 <b>*</b></label><input class="inp" id="fTo" value="本市各區公所" placeholder="如：本府各局處、本市各區公所…"></div>
        <div class="field"><label>主旨 <b>*</b></label><input class="inp" id="fSubj" placeholder="請填寫主旨（一行為限）" value="檢送本市 115 年防颱整備督導情形報告表乙份，請 查照。"></div>
        <div class="field"><label>說明與辦法</label>
          <textarea class="inp" id="fBody" placeholder="一、依據…&#10;二、…">一、依據災害防救法第 22 條及本府 115 年 7 月 30 日防颱整備會議決議辦理。
二、本市 115 年第 2 次防颱整備督導業於 8 月 18 日至 8 月 22 日辦理完竣，計督導 12 區公所，缺失計 23 項。
三、請各區公所於 115 年 9 月 12 日前檢送改善情形報告表至本府災害防救辦公室彙辦。</textarea>
          <div class="cnt" id="cnt">共 0 字</div>
        </div>
        <div class="field"><label>附件</label>
          <div class="opts">
            <label class="opt"><input type="checkbox" checked>督導情形報告表.pdf</label>
            <label class="opt"><input type="checkbox" checked>缺失改善彙整表.xlsx</label>
            <label class="opt"><input type="checkbox">現場照片紀錄.zip</label>
          </div></div>
        <div class="field"><label>會辦單位</label>
          <div class="opts">
            <label class="opt"><input type="checkbox">主計處</label>
            <label class="opt"><input type="checkbox" checked>消防局</label>
            <label class="opt"><input type="checkbox">民政局</label>
            <label class="opt"><input type="checkbox">政風處</label>
          </div></div>
        <div class="field" style="margin-bottom:6px"><label>保存年限</label>
          <div class="opts">
            <label class="opt"><input type="radio" name="keep" checked>5 年</label>
            <label class="opt"><input type="radio" name="keep">10 年</label>
            <label class="opt"><input type="radio" name="keep">永久</label>
          </div></div>
      </div>
      <div class="btns">
        <button class="abtn primary" id="sendBtn">✍ 核章送簽</button>
        <button class="abtn" id="draftBtn">儲存草稿</button>
        <button class="abtn" onclick="location.href='index.html'">取消</button>
      </div>
    </section>

    <aside class="preview">
      <h2>稿 面 預 覽</h2>
      <div class="card pv">
        <div class="pno" id="pvNo">勤政秘字第 1150801288 號（暫編）｜ 速別：<span id="pvSpd">普通</span> ｜ 密等：<span id="pvSec">普通</span></div>
        <div class="psubj" id="pvSubj">主旨：—</div>
        <div class="pbody" id="pvBody">說明：—</div>
      </div>
      <div class="card">
        <div class="kv"><span class="k">預計流程</span><span class="v">承辦 → 科長 → 秘書處會核 → 副市長 → 市長決行</span></div>
        <div class="kv"><span class="k">承辦人</span><span class="v">秘書室 陳雅雯</span></div>
        <div class="kv"><span class="k">聯絡電話</span><span class="v">02-2720-8889 #2201</span></div>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const subj=document.getElementById('fSubj'), body=document.getElementById('fBody');
function refresh(){
  document.getElementById('pvSubj').textContent='主旨：'+(subj.value.trim()||'—');
  document.getElementById('pvBody').textContent='說明：\n'+(body.value.trim()||'—');
  document.getElementById('cnt').textContent='共 '+body.value.length+' 字';
  document.getElementById('pvSec').textContent=document.querySelector('input[name=sec]:checked').value;
  document.getElementById('pvSpd').textContent=document.querySelector('input[name=spd]:checked').value;
}
[subj,body].forEach(el=>el.addEventListener('input',refresh));
document.querySelectorAll('input[name=sec],input[name=spd]').forEach(el=>el.addEventListener('change',refresh));
refresh();
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
document.getElementById('sendBtn').addEventListener('click',()=>{
  document.getElementById('sttag').textContent='已送簽 · 科長審核中';
  document.getElementById('sttag').style.borderColor='#b50000';
  document.getElementById('sttag').style.color='#b50000';
  toast('創稿已核章送簽，文號：勤政秘字第 1150801288 號');
});
document.getElementById('draftBtn').addEventListener('click',()=>toast('草稿已儲存至「我的草稿匣」'));
</script>
</body>
</html>
