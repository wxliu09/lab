<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>館藏查詢 · 文澜圖書館</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Serif TC',serif}
  body{background:#4a3a28;min-height:100vh;padding:20px;
    background-image:radial-gradient(circle at 20% 10%,rgba(255,235,200,.06),transparent 50%)}
  .beam{background:linear-gradient(180deg,#8a6a45,#6d5236);border-radius:8px 8px 0 0;max-width:1380px;margin:0 auto;
    padding:16px 28px;display:flex;align-items:center;gap:16px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.4);
    border:1px solid #5d4630;border-bottom:none;flex-wrap:wrap}
  .beam h1{color:#f5e6c8;font-size:21px;letter-spacing:6px;text-shadow:0 2px 3px rgba(0,0,0,.4)}
  .beam .sub{color:#cbb489;font-size:12px;letter-spacing:3px}
  .back{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#f5e6c8;background:rgba(0,0,0,.28);
    border:1px solid rgba(245,230,200,.4);padding:7px 15px;border-radius:4px;text-decoration:none;letter-spacing:1px;transition:.2s}
  .back:hover{background:#a63d2f;border-color:#a63d2f}
  .clock{margin-left:auto;color:#cbb489;font-size:12px;letter-spacing:2px;font-family:'Noto Sans TC',sans-serif}
  .cabinet{max-width:1380px;margin:0 auto;background:linear-gradient(180deg,#7a5c3d,#6a4f33);border:1px solid #5d4630;
    border-radius:0 0 8px 8px;padding:22px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  .cabinet h2{color:#f5e6c8;font-size:15px;letter-spacing:4px;margin-bottom:12px;border-bottom:1px solid rgba(245,230,200,.3);padding-bottom:8px}
  .qpanel{background:rgba(0,0,0,.22);border-radius:4px;padding:18px;margin-bottom:20px}
  .qrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px}
  .qrow2{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .inp{width:100%;background:#fdf6e3;border:1px solid #d9c9a3;border-radius:3px;padding:10px 12px;font-family:inherit;font-size:14px;color:#3b2f23;outline:none;box-shadow:inset 1px 2px 3px rgba(0,0,0,.12)}
  .inp:focus{border-color:#a63d2f}
  .lb{font-family:'Noto Sans TC',sans-serif;font-size:11.5px;color:#cbb489;letter-spacing:2px;display:block;margin-bottom:5px}
  .chk{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#e8d9b8;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
  .chk input{accent-color:#a63d2f}
  .btn{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;letter-spacing:2px;background:#a63d2f;color:#fdf6e3;border:1px solid #8a3125;border-radius:4px;padding:10px 26px;cursor:pointer;transition:.2s;box-shadow:0 3px 0 #6d271c}
  .btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #6d271c}
  .cnt{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;color:#cbb489;letter-spacing:1px;margin-bottom:14px}
  .cnt b{color:#f5e6c8}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .ccard{background:#fdf6e3;border:1px solid #d9c9a3;border-radius:3px;padding:16px 18px 14px;position:relative;
    box-shadow:3px 4px 0 rgba(0,0,0,.28);transition:.25s;cursor:pointer;text-decoration:none;color:inherit;display:block}
  .ccard:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:5px 12px 18px rgba(0,0,0,.4);z-index:2}
  .ccard::before{content:'';position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;
    background:#4a3a28;box-shadow:inset 0 2px 4px rgba(0,0,0,.65)}
  .ccard .dewey{font-family:'Noto Sans TC',sans-serif;font-weight:700;color:#a63d2f;font-size:13px;letter-spacing:1px}
  .ccard h3{font-size:16px;font-weight:700;margin:6px 0 2px;padding-bottom:6px;
    background:repeating-linear-gradient(transparent 0 26px,#c9b98f 26px 27px);line-height:27px}
  .ccard .author{font-size:13px;color:#6b5a41;border-bottom:1px solid #c9b98f;padding-bottom:6px}
  .ccard .meta{display:flex;gap:12px;font-size:11.5px;color:#8a7550;margin-top:8px;font-family:'Noto Sans TC',sans-serif;flex-wrap:wrap}
  .st{margin-left:auto;font-weight:700;font-size:11px;padding:2px 8px;border:1px solid;font-family:'Noto Sans TC',sans-serif}
  .st-in{color:#4d7c4d;border-color:#4d7c4d}.st-out{color:#b07d2b;border-color:#b07d2b}.st-over{color:#a63d2f;border-color:#a63d2f}
  .empty{display:none;text-align:center;color:#cbb489;letter-spacing:4px;padding:36px;font-size:14px}
  @media(max-width:1100px){.cards{grid-template-columns:1fr}.qrow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="beam">
  <a class="back" href="../../index.html">← 返回入口</a>
  <a class="back" href="index.html">返回主控台</a>
  <div><h1>文澜市立圖書館</h1><div class="sub">典藏管理系統 · 館藏查詢</div></div>
  <a class="back" href="form.html">＋ 新增館藏</a>
  <a class="back" href="report.html">流通統計</a>
  <span class="clock">開館中 09:00 – 21:00</span>
</header>

<div class="cabinet">
  <h2>館 藏 查 詢</h2>
  <div class="qpanel">
    <div class="qrow">
      <div><span class="lb">關鍵字（書名 / 作者 / ISBN）</span><input class="inp" id="q" placeholder="例如：台北、半導體、978-957…"></div>
      <div><span class="lb">分類</span><select class="inp" id="qCat"><option value="">全部分類</option><option value="300">300 社會科學</option><option value="400">400 語言</option><option value="500">500 自然科學</option><option value="700">700 藝術</option><option value="800">800 文學</option></select></div>
      <div><span class="lb">館別</span><select class="inp" id="qLib"><option value="">全部館別</option><option>總館</option><option>板橋分館</option><option>參考室</option></select></div>
      <div><span class="lb">出版年（起）</span><input class="inp" type="date" id="qYear" value="2025-01-01"></div>
    </div>
    <div class="qrow2">
      <label class="chk"><input type="checkbox" id="qIn">僅顯示在架可借</label>
      <label class="chk"><input type="checkbox">含電子書</label>
      <label class="chk"><input type="checkbox" checked>含各分館</label>
      <span style="flex:1"></span>
      <button class="btn" id="goBtn">查 詢</button>
    </div>
  </div>

  <div class="cnt" id="cnt"></div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty">查 無 館 藏 ・ 請 調 整 條 件</div>
</div>

<script>
const BOOKS=[
  {d:'312.4 / 8642',cat:'300',t:'台灣百年產業變遷史料彙編',a:'林金源 主編 · 南天書局 · 2026',isbn:'978-957-11-8842-3',loc:'總館 3F 社會科學區',st:['st-in','在架'],inlib:1,y:'2026-03'},
  {d:'528.8 / 4423',cat:'500',t:'半導體製程概論（第三版）',a:'張忠謀 等著 · 全華圖書 · 2025',isbn:'978-957-21-9903-7',loc:'總館 4F 科技區',st:['st-out','借出 09/11 到期'],inlib:0,y:'2025-06'},
  {d:'863.57 / 2755',cat:'800',t:'巷弄裡的老台北：城市記憶散策',a:'陳柔縉 著 · 麥田出版 · 2026',isbn:'978-986-34-7210-5',loc:'總館 2F 文學區',st:['st-in','在架'],inlib:1,y:'2026-01'},
  {d:'428.2 / 5518',cat:'400',t:'日文商業書信寫作完全指南',a:'佐藤綾乃 著 · 致良出版 · 2025',isbn:'978-957-78-6304-9',loc:'板橋分館 1F 語言區',st:['st-over','逾期 5 天'],inlib:0,y:'2025-02'},
  {d:'739.5 / 9031',cat:'700',t:'鶯歌陶瓷工藝圖鑑',a:'國立台灣工藝中心 編 · 2026',isbn:'978-986-05-3317-2',loc:'總館 5F 藝術區',st:['st-in','在架'],inlib:1,y:'2026-05'},
  {d:'020.7 / 3366',cat:'000',t:'圖書館自動化系統建置實務',a:'王梅玲 著 · 文華圖書館 · 2025',isbn:'978-957-87-1145-6',loc:'參考室 · 限館內閱覽',st:['st-out','預約 3 人候補'],inlib:0,y:'2025-09'},
  {d:'863.55 / 1180',cat:'800',t:'山海經彩繪圖說（典藏版）',a:'李豐楙 導讀 · 大塊文化 · 2025',isbn:'978-986-22-5561-8',loc:'總館 2F 文學區',st:['st-in','在架'],inlib:1,y:'2025-11'},
  {d:'641.3 / 7745',cat:'500',t:'咖啡烘焙科學：從生豆到風味曲線',a:'吳則霖 著 · 積木文化 · 2026',isbn:'978-986-47-9033-1',loc:'總館 4F 生活科技區',st:['st-in','在架'],inlib:1,y:'2026-04'}
];
const box=document.getElementById('cards');
function render(){
  const q=document.getElementById('q').value.trim();
  const cat=document.getElementById('qCat').value;
  const lib=document.getElementById('qLib').value;
  const y=document.getElementById('qYear').value;
  const onlyIn=document.getElementById('qIn').checked;
  const list=BOOKS.filter(b=>
    (!q||(b.t+b.a+b.isbn).includes(q)) &&
    (!cat||b.d.startsWith(cat[0])) &&
    (!lib||b.loc.includes(lib)) &&
    (!y||b.y>=y.slice(0,7)) &&
    (!onlyIn||b.inlib)
  );
  document.getElementById('cnt').innerHTML=`檢索結果：共 <b>${list.length}</b> 筆館藏（耗時 0.03 秒，同義詞自動擴充）`;
  document.getElementById('empty').style.display=list.length?'none':'block';
  box.innerHTML=list.map(b=>`
    <a class="ccard" href="book.html">
      <span class="dewey">${b.d}</span><h3>${b.t}</h3>
      <div class="author">${b.a}</div>
      <div class="meta"><span>ISBN ${b.isbn}</span><span>${b.loc}</span><span class="st ${b.st[0]}">${b.st[1]}</span></div>
    </a>`).join('');
}
['q','qCat','qLib','qYear'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('qIn').addEventListener('change',render);
document.getElementById('goBtn').addEventListener('click',render);
render();
</script>
</body>
</html>
