<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增館藏 · 文澜圖書館</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Serif TC',serif}
  body{background:#4a3a28;min-height:100vh;padding:20px;
    background-image:radial-gradient(circle at 20% 10%,rgba(255,235,200,.06),transparent 50%)}
  .beam{background:linear-gradient(180deg,#8a6a45,#6d5236);border-radius:8px 8px 0 0;max-width:1380px;margin:0 auto;
    padding:16px 28px;display:flex;align-items:center;gap:16px;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.4);
    border:1px solid #5d4630;border-bottom:none;flex-wrap:wrap}
  .beam h1{color:#f5e6c8;font-size:21px;letter-spacing:6px;text-shadow:0 2px 3px rgba(0,0,0,.4)}
  .beam .sub{color:#cbb489;font-size:12px;letter-spacing:3px}
  .back{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#f5e6c8;background:rgba(0,0,0,.28);
    border:1px solid rgba(245,230,200,.4);padding:7px 15px;border-radius:4px;text-decoration:none;letter-spacing:1px;transition:.2s}
  .back:hover{background:#a63d2f;border-color:#a63d2f}
  .clock{margin-left:auto;color:#cbb489;font-size:12px;letter-spacing:2px;font-family:'Noto Sans TC',sans-serif}
  .cabinet{max-width:1380px;margin:0 auto;background:linear-gradient(180deg,#7a5c3d,#6a4f33);border:1px solid #5d4630;
    border-radius:0 0 8px 8px;padding:22px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  .cabinet h2{color:#f5e6c8;font-size:15px;letter-spacing:4px;margin-bottom:12px;border-bottom:1px solid rgba(245,230,200,.3);padding-bottom:8px}
  .sttag{font-family:'Noto Sans TC',sans-serif;font-size:11.5px;padding:3px 12px;border:1px solid #b07d2b;color:#b07d2b;letter-spacing:2px}
  .main{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
  .formcard{background:#fdf6e3;border:1px solid #d9c9a3;border-radius:3px;padding:24px 26px;box-shadow:4px 6px 0 rgba(0,0,0,.3)}
  .formcard h3{color:#3b2f23;font-size:17px;letter-spacing:3px;border-bottom:2px solid #a63d2f;padding-bottom:8px;margin-bottom:16px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-family:'Noto Sans TC',sans-serif;font-size:12.5px;letter-spacing:1px;color:#6b5a41;margin-bottom:6px}
  .field label b{color:#a63d2f}
  .inp{width:100%;background:#fffdf5;border:1px solid #d9c9a3;border-radius:3px;padding:10px 12px;font-family:inherit;font-size:14px;color:#3b2f23;outline:none;box-shadow:inset 1px 2px 3px rgba(0,0,0,.08);transition:.15s}
  .inp:focus{border-color:#a63d2f;box-shadow:inset 1px 2px 3px rgba(0,0,0,.08),0 0 0 2px rgba(166,61,47,.15)}
  textarea.inp{min-height:110px;resize:vertical;line-height:1.9}
  .opts{display:flex;gap:9px;flex-wrap:wrap}
  .opt{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid #d9c9a3;background:#fffdf5;font-size:13px;cursor:pointer;transition:.15s;font-family:'Noto Sans TC',sans-serif;color:#6b5a41}
  .opt:has(input:checked){border-color:#a63d2f;color:#a63d2f;background:#faf0e6;font-weight:700}
  .opt input{accent-color:#a63d2f}
  .btn{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;letter-spacing:2px;background:#a63d2f;color:#fdf6e3;border:1px solid #8a3125;border-radius:4px;padding:11px 28px;cursor:pointer;transition:.2s;box-shadow:0 3px 0 #6d271c}
  .btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 #6d271c}
  .btn.ghost{background:transparent;border-color:#8a7550;color:#6b5a41;box-shadow:none}
  .btn.ghost:hover{background:rgba(0,0,0,.05)}
  .pv{background:rgba(0,0,0,.22);border-radius:4px;padding:16px}
  .ccard{background:#fdf6e3;border:1px solid #d9c9a3;border-radius:3px;padding:16px 18px 16px;position:relative;box-shadow:3px 4px 0 rgba(0,0,0,.28);margin-bottom:20px}
  .ccard::before{content:'';position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:#4a3a28;box-shadow:inset 0 2px 4px rgba(0,0,0,.65)}
  .ccard .dewey{font-family:'Noto Sans TC',sans-serif;font-weight:700;color:#a63d2f;font-size:13px;letter-spacing:1px}
  .ccard h4{font-size:16px;font-weight:700;margin:6px 0 2px;padding-bottom:6px;background:repeating-linear-gradient(transparent 0 26px,#c9b98f 26px 27px);line-height:27px}
  .ccard .author{font-size:13px;color:#6b5a41;border-bottom:1px solid #c9b98f;padding-bottom:6px}
  .ccard .meta{display:flex;gap:12px;font-size:11.5px;color:#8a7550;margin-top:8px;font-family:'Noto Sans TC',sans-serif;flex-wrap:wrap}
  .st{font-weight:700;font-size:11px;padding:2px 8px;border:1px solid;font-family:'Noto Sans TC',sans-serif;margin-left:auto}
  .st-in{color:#4d7c4d;border-color:#4d7c4d}
  .hint{color:#cbb489;font-size:12px;font-family:'Noto Sans TC',sans-serif;line-height:1.9}
  .toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,18px);background:#fdf6e3;color:#3b2f23;border:1px solid #4d7c4d;font-family:'Noto Sans TC',sans-serif;font-size:13.5px;letter-spacing:2px;padding:12px 26px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:1100px){.main{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="beam">
  <a class="back" href="../../index.html">← 返回入口</a>
  <a class="back" href="index.html">返回主控台</a>
  <a class="back" href="search.html">館藏查詢</a>
  <div><h1>文澜市立圖書館</h1><div class="sub">典藏管理系統 · 新增館藏（編目）</div></div>
  <span class="clock">編目台 #2 ・ 館員 王采蘋</span>
</header>

<div class="cabinet">
  <div class="main">
    <form class="formcard" onsubmit="return false">
      <h3>新 增 館 藏 編 目 <span class="sttag" id="sttag">草稿</span></h3>
      <div class="frow">
        <div class="field"><label>書名 <b>*</b></label><input class="inp" id="fTitle" value="基隆河記：一條河的城市身世" placeholder="正題名"></div>
        <div class="field"><label>作者 <b>*</b></label><input class="inp" id="fAuthor" value="舒國治 著"></div>
      </div>
      <div class="frow">
        <div class="field"><label>ISBN</label><input class="inp" id="fIsbn" value="978-986-13-6602-4"></div>
        <div class="field"><label>出版社 / 出版年</label><input class="inp" id="fPub" value="聯合文學 · 2026"></div>
      </div>
      <div class="frow">
        <div class="field"><label>分類號 <b>*</b></label>
          <select class="inp" id="fCat">
            <option value="863.55">863.55 華文散文</option>
            <option value="312.4">312.4 社會史料</option>
            <option value="528.8">528.8 工程科技</option>
            <option value="739.5">739.5 工藝美術</option>
            <option value="428.2">428.2 語言學習</option>
          </select></div>
        <div class="field"><label>入藏日期 <b>*</b></label><input class="inp" type="date" id="fDate" value="2026-08-28"></div>
      </div>
      <div class="field"><label>資料類型</label>
        <div class="opts">
          <label class="opt"><input type="radio" name="mt" checked>圖書</label>
          <label class="opt"><input type="radio" name="mt">期刊</label>
          <label class="opt"><input type="radio" name="mt">視聽資料</label>
          <label class="opt"><input type="radio" name="mt">電子書</label>
        </div></div>
      <div class="field"><label>典藏屬性（可複選）</label>
        <div class="opts">
          <label class="opt"><input type="checkbox" id="ckNew" checked>新書展示 30 天</label>
          <label class="opt"><input type="checkbox" id="ckRef">參考書（限館內閱覽）</label>
          <label class="opt"><input type="checkbox">熱門書（縮短借期 14 天）</label>
          <label class="opt"><input type="checkbox">地方文獻專區</label>
        </div></div>
      <div class="frow">
        <div class="field"><label>典藏館別</label>
          <select class="inp" id="fLoc"><option>總館 2F 文學區</option><option>總館 3F 社會科學區</option><option>板橋分館 1F</option><option>參考室</option></select></div>
        <div class="field"><label>複本數</label><input class="inp" type="number" id="fCopy" value="2" min="1" max="20"></div>
      </div>
      <div class="field"><label>內容簡介（編目摘要）</label>
        <textarea class="inp" id="fIntro">從清代渡口到現代整治工程，書寫基隆河與台北盆地四百年的糾葛。附河道變遷對照圖 12 幅、老照片 60 幀。</textarea></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="saveBtn">✓ 完成編目並入藏</button>
        <button class="btn ghost" type="button" onclick="location.href='search.html'">取消並回查詢</button>
      </div>
    </form>

    <div>
      <h2>目 錄 卡 預 覽（ 即 時 ）</h2>
      <div class="pv">
        <div class="ccard">
          <span class="dewey" id="pvDewey">863.55 / 0000</span>
          <h4 id="pvTitle">基隆河記：一條河的城市身世</h4>
          <div class="author" id="pvAuthor">舒國治 著 · 聯合文學 · 2026</div>
          <div class="meta"><span id="pvIsbn">ISBN 978-986-13-6602-4</span><span id="pvLoc">總館 2F 文學區</span><span class="st st-in" id="pvSt">新書展示</span></div>
        </div>
        <div class="hint">
          ▸ 登錄號（暫配）：B-2026-004182 起，依複本數連號。<br>
          ▸ 索書號將於完成編目後由系統依「分類號 / 作者號」自動生成。<br>
          ▸ 若勾選「參考書」，複本將一律典藏於參考室並鎖定外借。
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function pv(){
  $('pvTitle').textContent=$('fTitle').value.trim()||'（未命名書目）';
  $('pvAuthor').textContent=($('fAuthor').value.trim()||'—')+' · '+($('fPub').value.trim()||'—');
  $('pvIsbn').textContent='ISBN '+($('fIsbn').value.trim()||'—');
  $('pvLoc').textContent=$('fLoc').value;
  const cn=String(1000+($('fTitle').value.length*137)%9000);
  $('pvDewey').textContent=$('fCat').value+' / '+cn;
  $('pvSt').textContent=$('ckNew').checked?'新書展示':($('ckRef').checked?'限館內閱覽':'在架');
}
['fTitle','fAuthor','fIsbn','fPub','fCat','fLoc'].forEach(id=>$(id).addEventListener('input',pv));
['ckNew','ckRef'].forEach(id=>$(id).addEventListener('change',pv));
pv();
$('saveBtn').addEventListener('click',()=>{
  $('sttag').textContent='已入藏';
  $('sttag').style.borderColor='#4d7c4d'; $('sttag').style.color='#4d7c4d';
  const t=$('toast');
  t.textContent='✓ 編目完成：'+$('pvDewey').textContent+'，複本 '+$('fCopy').value+' 冊已入藏';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800);
});
</script>
</body>
</html>
