<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>填報列表 · 卷宗打字機填報單系統</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdf6e3; --paper-edge:#e8dcc0; --ink:#2d2a26; --strike:#c0392b;
  --stamp:#b3402a; --roller:#3a3733; --ok:#2d6a4f; --pending:#8a6d1a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#6b5f4c;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.06), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(0,0,0,.15), transparent 50%),
    repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,.02) 4px 8px);
  min-height:100vh;
  font-family:'Noto Serif TC','Courier New',serif;
  color:var(--ink);
  padding:24px 16px 64px;
}
.topbar{max-width:980px;margin:0 auto 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.back-link{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Special Elite','Courier New',monospace;
  font-size:14px;letter-spacing:2px;color:#fdf6e3;text-decoration:none;
  background:var(--roller);border:2px solid #241f1a;border-radius:6px;
  padding:8px 16px;box-shadow:0 3px 0 #241f1a, inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .15s, box-shadow .15s;
}
.back-link:hover{transform:translateY(1px);box-shadow:0 2px 0 #241f1a;}
.back-link:active{transform:translateY(3px);box-shadow:0 0 0 #241f1a;}
.back-link.sub{font-size:12px;padding:6px 12px;}
.topbar-title{font-family:'Special Elite','Courier New',monospace;color:rgba(253,246,227,.75);font-size:13px;letter-spacing:3px;}

.sheet{
  max-width:980px;margin:0 auto;
  background:var(--paper);
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(45,42,38,.06) 31px 32px);
  border:1px solid var(--paper-edge);
  box-shadow:0 12px 32px rgba(0,0,0,.45);
  padding:34px 44px 40px;
}
.sheet h1{
  font-size:22px;letter-spacing:8px;border-bottom:2px solid var(--ink);
  padding-bottom:12px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
}
.sheet h1 .en{font-family:'Special Elite',monospace;font-size:12px;color:#8a7f6a;letter-spacing:2px;}
.sheet .lead{font-size:13px;color:#6a6152;letter-spacing:2px;margin-bottom:18px;}

/* 摘要卡 */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.stat{
  border:1.5px dashed #8a7f6a;padding:12px 16px;text-align:center;
  background:rgba(45,42,38,.03);
}
.stat .num{font-family:'Special Elite','Courier New',monospace;font-size:26px;font-weight:700;}
.stat .cap{font-size:12px;letter-spacing:3px;color:#6a6152;margin-top:4px;}
.stat.s-ok .num{color:var(--ok);}
.stat.s-review .num{color:var(--pending);}
.stat.s-return .num{color:var(--strike);}

/* 篩選 */
.filter-bar{
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  border-top:2px solid var(--ink);border-bottom:1px dashed #8a7f6a;
  padding:12px 0;margin-bottom:6px;font-size:13px;letter-spacing:2px;
}
.filter-bar select,.filter-bar input{
  font-family:'Special Elite','Courier New','Noto Serif TC',monospace;
  background:transparent;border:1px solid #8a7f6a;padding:5px 9px;font-size:13px;color:var(--ink);
}
.filter-bar input{min-width:200px;}
.filter-bar .cnt{margin-left:auto;font-family:'Special Elite',monospace;color:#8a7f6a;font-size:12px;letter-spacing:2px;}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;}
th{
  font-family:'Special Elite','Courier New',monospace;letter-spacing:2px;
  font-size:12px;color:#5c5344;border-bottom:2px solid var(--ink);
  padding:8px 6px;text-align:left;
}
td{border-bottom:1px dashed #b8ab8d;padding:9px 6px;}
tbody tr{transition:background .2s;}
tbody tr:hover{background:rgba(45,42,38,.04);}
tr.row-hidden{display:none;}
.tag{display:inline-block;font-size:12px;letter-spacing:2px;padding:2px 10px;border:1.5px solid currentColor;border-radius:3px;font-weight:600;}
.tag.ok{color:var(--ok);}
.tag.review{color:var(--pending);}
.tag.return{color:var(--strike);}
.row-link{
  font-family:'Special Elite','Courier New',monospace;font-size:13px;letter-spacing:1px;
  color:var(--stamp);text-decoration:underline dotted;white-space:nowrap;
}
.row-link:hover{color:var(--strike);background:rgba(192,57,43,.08);}
.empty-tip{text-align:center;padding:24px;font-family:'Special Elite',monospace;color:#8a7f6a;letter-spacing:3px;display:none;}

.note{
  margin-top:22px;font-size:12px;color:#8a7f6a;letter-spacing:2px;line-height:2;
  border-left:3px solid var(--stamp);padding-left:12px;
}
@media (max-width:680px){.sheet{padding:24px 16px;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <span class="topbar-title">FORM NO. TP-115 · 文書填報股</span>
  <a class="back-link sub" href="urge.html" style="margin-left:auto;">催辦紀錄</a>
  <a class="back-link sub" href="report.html">統計報表</a>
</div>

<div class="sheet">
  <h1>填　報　列　表 <span class="en">REPORT LEDGER · 115 年度</span></h1>
  <p class="lead">本股受理之計畫填報單總冊，依收文先後登載。點「詳情」可調閱該卷全文。</p>

  <div class="stat-row">
    <div class="stat"><div class="num" id="cAll">0</div><div class="cap">本年收文</div></div>
    <div class="stat s-ok"><div class="num" id="cOk">0</div><div class="cap">已核定</div></div>
    <div class="stat s-review"><div class="num" id="cReview">0</div><div class="cap">審核中</div></div>
    <div class="stat s-return"><div class="num" id="cReturn">0</div><div class="cap">退補件</div></div>
  </div>

  <div class="filter-bar">
    狀態：
    <select id="fStatus">
      <option value="all">全部</option>
      <option value="ok">已核定</option>
      <option value="review">審核中</option>
      <option value="return">退補件</option>
    </select>
    類別：
    <select id="fCat">
      <option value="all">全部</option>
      <option>都市更新</option>
      <option>交通建設</option>
      <option>社會福利</option>
      <option>環境保護</option>
      <option>教育文化</option>
    </select>
    關鍵字：<input type="text" id="fKw" placeholder="計畫名稱或文號…">
    <span class="cnt" id="cntTip"></span>
  </div>

  <table>
    <thead>
      <tr><th>文號</th><th>計畫名稱</th><th>類別</th><th>預算（元）</th><th>填報日</th><th>狀態</th><th>操作</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty-tip" id="emptyTip">─ 無符合之填報紀錄 ─</div>

  <p class="note">
    說明：狀態「退補件」者，承辦人應於五日內補正後重新送審；逾期本股將依「定期填報作業要點」第 7 條簽辦催辦（見催辦紀錄頁）。
  </p>
</div>

<script>
const rows = [
  {no:'115-研填-0041', name:'老城區步行環境改善計畫',   cat:'都市更新', budget:'4,800,000',  date:'115-08-26', st:'review', stTxt:'審核中'},
  {no:'115-研填-0040', name:'社區長照據點增設計畫',     cat:'社會福利', budget:'6,350,000',  date:'115-08-19', st:'review', stTxt:'審核中'},
  {no:'115-研填-0039', name:'河濱自行車道拓寬工程',     cat:'交通建設', budget:'12,600,000', date:'115-08-12', st:'ok',     stTxt:'已核定'},
  {no:'115-研填-0037', name:'校園老舊廁所整修（二期）', cat:'教育文化', budget:'3,920,000',  date:'115-08-05', st:'return', stTxt:'退補件'},
  {no:'115-研填-0033', name:'焚化爐底渣再利用示範',     cat:'環境保護', budget:'8,100,000',  date:'115-07-22', st:'ok',     stTxt:'已核定'},
  {no:'115-研填-0029', name:'市場攤棚耐震補強計畫',     cat:'都市更新', budget:'9,450,000',  date:'115-07-08', st:'ok',     stTxt:'已核定'},
  {no:'115-研填-0025', name:'路口號誌智慧化（三期）',   cat:'交通建設', budget:'15,200,000', date:'115-06-24', st:'return', stTxt:'退補件'},
  {no:'115-研填-0021', name:'社區公園共融遊具更新',     cat:'社會福利', budget:'5,600,000',  date:'115-06-10', st:'ok',     stTxt:'已核定'},
  {no:'115-研填-0016', name:'圖書館自修室延長開放評估', cat:'教育文化', budget:'1,150,000',  date:'115-05-19', st:'ok',     stTxt:'已核定'}
];
const tbody = document.getElementById('tbody');
rows.forEach(function(r){
  const tr = document.createElement('tr');
  tr.dataset.status = r.st;
  tr.dataset.cat = r.cat;
  tr.innerHTML =
    '<td>' + r.no + '</td><td class="c-name"></td><td>' + r.cat + '</td><td>' + r.budget + '</td>' +
    '<td>' + r.date + '</td><td><span class="tag ' + r.st + '">' + r.stTxt + '</span></td>' +
    '<td><a class="row-link" href="detail.html">詳情 ▸</a></td>';
  tr.querySelector('.c-name').textContent = r.name;
  tbody.appendChild(tr);
});

/* 統計 */
document.getElementById('cAll').textContent = rows.length;
document.getElementById('cOk').textContent = rows.filter(function(r){return r.st==='ok';}).length;
document.getElementById('cReview').textContent = rows.filter(function(r){return r.st==='review';}).length;
document.getElementById('cReturn').textContent = rows.filter(function(r){return r.st==='return';}).length;

/* 三重篩選 */
const fStatus = document.getElementById('fStatus');
const fCat = document.getElementById('fCat');
const fKw = document.getElementById('fKw');
function applyFilter(){
  const sv = fStatus.value, cv = fCat.value, kw = fKw.value.trim();
  let n = 0;
  tbody.querySelectorAll('tr').forEach(function(tr){
    const show =
      (sv === 'all' || tr.dataset.status === sv) &&
      (cv === 'all' || tr.dataset.cat === cv) &&
      (!kw || tr.textContent.indexOf(kw) !== -1);
    tr.classList.toggle('row-hidden', !show);
    if (show) n++;
  });
  document.getElementById('cntTip').textContent = '檢得 ' + n + ' 卷';
  document.getElementById('emptyTip').style.display = n ? 'none' : 'block';
}
fStatus.addEventListener('change', applyFilter);
fCat.addEventListener('change', applyFilter);
fKw.addEventListener('input', applyFilter);
applyFilter();
</script>
</body>
</html>
