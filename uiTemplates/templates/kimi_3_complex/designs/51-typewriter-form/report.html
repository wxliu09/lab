<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統計報表 · 卷宗打字機填報單系統</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdf6e3; --paper-edge:#e8dcc0; --ink:#2d2a26; --strike:#c0392b;
  --stamp:#b3402a; --roller:#3a3733; --ok:#2d6a4f; --pending:#8a6d1a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#6b5f4c;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.06), transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(0,0,0,.15), transparent 50%),
    repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,.02) 4px 8px);
  min-height:100vh;
  font-family:'Noto Serif TC','Courier New',serif;
  color:var(--ink);
  padding:24px 16px 64px;
}
.topbar{max-width:980px;margin:0 auto 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.back-link{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Special Elite','Courier New',monospace;
  font-size:14px;letter-spacing:2px;color:#fdf6e3;text-decoration:none;
  background:var(--roller);border:2px solid #241f1a;border-radius:6px;
  padding:8px 16px;box-shadow:0 3px 0 #241f1a, inset 0 1px 0 rgba(255,255,255,.12);
  transition:transform .15s, box-shadow .15s;
}
.back-link:hover{transform:translateY(1px);box-shadow:0 2px 0 #241f1a;}
.back-link.sub{font-size:12px;padding:6px 12px;}
.topbar-title{font-family:'Special Elite','Courier New',monospace;color:rgba(253,246,227,.75);font-size:13px;letter-spacing:3px;}

.sheet{
  max-width:980px;margin:0 auto;
  background:var(--paper);
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(45,42,38,.06) 31px 32px);
  border:1px solid var(--paper-edge);
  box-shadow:0 12px 32px rgba(0,0,0,.45);
  padding:34px 44px 40px;
}
.sheet h1{
  font-size:22px;letter-spacing:8px;border-bottom:2px solid var(--ink);
  padding-bottom:12px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
}
.sheet h1 .en{font-family:'Special Elite',monospace;font-size:12px;color:#8a7f6a;letter-spacing:2px;}
.sheet .lead{font-size:13px;color:#6a6152;letter-spacing:2px;margin-bottom:14px;}
.sec-title{
  font-family:'Special Elite','Courier New',monospace;
  font-size:14px;letter-spacing:4px;color:#5c5344;
  border-bottom:1.5px dashed #8a7f6a;padding-bottom:6px;
  margin:24px 0 14px;
}

/* 月份長條圖（打字機格線風） */
.bars{display:flex;align-items:flex-end;gap:20px;height:180px;padding:8px 4px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.bar{
  width:100%;max-width:56px;
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.12) 0 3px, transparent 3px 7px),
    linear-gradient(180deg, #4a443c, var(--ink));
  height:0;transition:height 1s cubic-bezier(.3,.9,.3,1);
  position:relative;cursor:pointer;
}
.bar .val{
  position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  font-family:'Special Elite',monospace;font-size:13px;font-weight:700;
  opacity:0;transition:opacity .2s;
}
.bar:hover .val{opacity:1;}
.bar-lab{font-family:'Special Elite',monospace;font-size:12px;letter-spacing:1px;color:#6a6152;}

/* 類別統計表 */
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;}
th{
  font-family:'Special Elite','Courier New',monospace;letter-spacing:2px;
  font-size:12px;color:#5c5344;border-bottom:2px solid var(--ink);
  padding:8px 6px;text-align:left;
}
td{border-bottom:1px dashed #b8ab8d;padding:9px 6px;}
tbody tr:hover{background:rgba(45,42,38,.04);}
.meter{
  display:inline-block;height:10px;background:var(--ink);vertical-align:middle;
  width:0;transition:width 1s ease;
  background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 3px, transparent 3px 6px);
}
.meter.ok{background-color:var(--ok);}
.meter.review{background-color:var(--pending);}
.meter.return{background-color:var(--strike);}

/* 狀態比例印章列 */
.ratio-row{display:flex;gap:16px;flex-wrap:wrap;}
.ratio{
  flex:1;min-width:180px;text-align:center;padding:16px 10px;
  border:2px double currentColor;border-radius:50%/18%;
  font-weight:700;letter-spacing:3px;
}
.ratio .rn{font-family:'Special Elite',monospace;font-size:28px;display:block;margin-bottom:4px;}
.ratio.ok{color:var(--ok);}
.ratio.review{color:var(--pending);}
.ratio.return{color:var(--strike);}

.print-row{margin-top:26px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.btn-type{
  font-family:'Special Elite','Courier New',monospace;
  font-size:15px;letter-spacing:4px;cursor:pointer;
  color:var(--paper);background:var(--ink);border:none;padding:11px 28px;
  box-shadow:0 4px 0 #141210;transition:transform .12s, box-shadow .12s;
}
.btn-type:hover{transform:translateY(1px);box-shadow:0 3px 0 #141210;}
.btn-type:active{transform:translateY(4px);box-shadow:0 0 0 #141210;}
.btn-type:disabled{opacity:.55;}
.form-msg{font-family:'Special Elite',monospace;font-size:13px;color:var(--ok);letter-spacing:2px;}
@media (max-width:680px){.sheet{padding:24px 16px;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <span class="topbar-title">STATISTICS · 文書填報股</span>
  <a class="back-link sub" href="list.html" style="margin-left:auto;">填報列表</a>
  <a class="back-link sub" href="urge.html">催辦紀錄</a>
</div>

<div class="sheet">
  <h1>統　計　報　表 <span class="en">MONTHLY STATISTICS · 115 年 1–8 月</span></h1>
  <p class="lead">本表由系統帳冊自動結算，供股室週報及研考會月會簡報引用。</p>

  <div class="sec-title">▍各月填報收件量</div>
  <div class="bars" id="bars"></div>

  <div class="sec-title">▍計畫類別分布與核定率</div>
  <table>
    <thead><tr><th>類別</th><th>收件數</th><th>已核定</th><th>核定率</th><th colspan="2">比例尺</th></tr></thead>
    <tbody id="catBody"></tbody>
  </table>

  <div class="sec-title">▍全年度案件狀態比例</div>
  <div class="ratio-row">
    <div class="ratio ok"><span class="rn">62%</span>已核定</div>
    <div class="ratio review"><span class="rn">24%</span>審核中</div>
    <div class="ratio return"><span class="rn">14%</span>退補件</div>
  </div>

  <div class="print-row">
    <button type="button" class="btn-type" id="btnPrint">▸ 繕 打 本 表</button>
    <span class="form-msg" id="printMsg"></span>
  </div>
</div>

<script>
/* 月度長條圖 */
const months = [
  {lab:'1 月', v:5},{lab:'2 月', v:3},{lab:'3 月', v:8},{lab:'4 月', v:6},
  {lab:'5 月', v:9},{lab:'6 月', v:7},{lab:'7 月', v:11},{lab:'8 月', v:9}
];
const bars = document.getElementById('bars');
const maxV = Math.max.apply(null, months.map(function(m){return m.v;}));
months.forEach(function(m){
  const col = document.createElement('div');
  col.className = 'bar-col';
  col.innerHTML = '<div class="bar" data-h="' + Math.round(m.v/maxV*100) + '%"><span class="val">' + m.v + ' 件</span></div><div class="bar-lab">' + m.lab + '</div>';
  bars.appendChild(col);
});

/* 類別統計表 */
const cats = [
  {cat:'都市更新', total:9,  ok:5},
  {cat:'交通建設', total:12, ok:8},
  {cat:'社會福利', total:14, ok:10},
  {cat:'環境保護', total:8,  ok:6},
  {cat:'教育文化', total:15, ok:9}
];
const catBody = document.getElementById('catBody');
const maxT = Math.max.apply(null, cats.map(function(c){return c.total;}));
cats.forEach(function(c){
  const rate = Math.round(c.ok / c.total * 100);
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td>' + c.cat + '</td><td>' + c.total + '</td><td>' + c.ok + '</td><td>' + rate + '%</td>' +
    '<td style="width:34%;"><span class="meter" data-w="' + Math.round(c.total/maxT*100) + '%"></span></td>' +
    '<td style="width:12%;font-family:\'Special Elite\',monospace;font-size:12px;color:#8a7f6a;">' + c.total + ' 件</td>';
  catBody.appendChild(tr);
});

/* 進場動畫 */
setTimeout(function(){
  document.querySelectorAll('.bar').forEach(function(b){ b.style.height = b.dataset.h; });
  document.querySelectorAll('.meter').forEach(function(m){ m.style.width = m.dataset.w; });
}, 250);

/* 繕打模擬 */
document.getElementById('btnPrint').addEventListener('click', function(){
  const btn = this, msg = document.getElementById('printMsg');
  btn.disabled = true;
  msg.textContent = '打字機走紙中…';
  setTimeout(function(){
    msg.textContent = '✓ 已繕打 1 份，送股長室用印';
    btn.disabled = false;
  }, 1400);
});
</script>
</body>
</html>
