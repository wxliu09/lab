<!DOCTYPE html>
<!-- 36 粉彩甘特 · 子頁：任務列表 tasks.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務列表 · 粉彩排程系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#b8e8d0; --pink:#ffd6e0; --yellow:#fff3b8; --purple:#dcd0ff;
  --bg:#fdfdff; --ink:#4a4a5a; --today:#ff6b81;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Noto Sans TC','Quicksand',sans-serif;color:var(--ink);min-height:100vh}
.topbar{display:flex;align-items:center;gap:18px;padding:16px 30px;background:#fff;border-bottom:1px solid #eee7f5;flex-wrap:wrap}
.logo{font-family:'Quicksand';font-weight:700;font-size:22px;
  background:linear-gradient(90deg,#7ed8b0,#f0a8c0,#b19ef0);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.pagenav{display:flex;gap:8px;flex-wrap:wrap}
.pagenav a{
  color:#8a8aa0;text-decoration:none;font-size:13px;padding:7px 16px;border-radius:20px;
  background:#f4f0fb;transition:.25s;font-weight:500;
}
.pagenav a:hover{background:var(--purple);color:#6a5aa8;transform:translateY(-2px)}
.pagenav a.on{background:linear-gradient(90deg,#b19ef0,#f0a8c0);color:#fff;font-weight:700}
.spacer{flex:1}
.back-link{color:#b19ef0;text-decoration:none;font-size:14px;font-weight:500;
  border:2px solid var(--purple);border-radius:24px;padding:8px 20px;transition:.25s;white-space:nowrap}
.back-link:hover{background:var(--purple);color:#6a5aa8;transform:translateX(-3px)}
.back-link.home{border-color:var(--mint);color:#5aa880}
.back-link.home:hover{background:var(--mint);color:#3a7a5a}
main{max-width:1300px;margin:0 auto;padding:26px 30px 60px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.kpi{border-radius:22px;padding:18px 22px;position:relative;overflow:hidden;transition:.25s}
.kpi:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(150,120,200,.18)}
.kpi.k-mint{background:var(--mint)}.kpi.k-pink{background:var(--pink)}
.kpi.k-yellow{background:var(--yellow)}.kpi.k-purple{background:var(--purple)}
.kpi h3{font-size:12px;color:#5a5a6e;letter-spacing:2px;font-weight:500}
.kpi .val{font-family:'Quicksand';font-size:36px;font-weight:700;color:#3a3a4c;line-height:1.15}
.kpi .sub{font-size:12px;color:#6e6e82}
.card{background:#fff;border-radius:26px;border:1px solid #f0e9fa;box-shadow:0 8px 30px rgba(170,140,220,.1);padding:24px 28px;margin-bottom:24px}
.card h2{font-size:17px;font-weight:700;letter-spacing:2px;margin-bottom:16px}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar button{
  border:2px solid #f0e9fa;background:#fff;border-radius:20px;padding:7px 18px;font-size:13px;
  cursor:pointer;font-family:inherit;color:#8a8aa0;transition:.2s;
}
.filter-bar button.on{border-color:#b19ef0;background:var(--purple);color:#6a5aa8;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;font-size:14px;border-bottom:1px dashed #f0e9fa}
thead th{font-size:12px;color:#a0a0b5;letter-spacing:2px;font-weight:600;font-family:'Quicksand'}
tbody tr{transition:.15s}
tbody tr:hover{background:#faf7ff}
.tag{display:inline-block;padding:3px 12px;border-radius:14px;font-size:12px;font-weight:700}
.tag.doing{background:var(--mint);color:#3a7a5a}
.tag.todo{background:var(--yellow);color:#8a6d1a}
.tag.review{background:var(--purple);color:#6a5aa8}
.tag.delay{background:var(--pink);color:#c0405a}
.tag.done{background:#eee7f5;color:#8a8aa0}
.avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:8px;vertical-align:middle}
.pbar{width:110px;height:8px;border-radius:5px;background:#f0e9fa;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#b8e8d0,#b19ef0)}
.due-soon{color:var(--today);font-weight:700}
.mini-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mini{border-radius:18px;padding:16px 20px;font-size:13px;line-height:1.9}
.mini b{font-size:14px}
.mini.m1{background:var(--pink)} .mini.m2{background:var(--yellow)} .mini.m3{background:var(--mint)}
.mini .d{font-family:'Quicksand';font-weight:700}
@media (max-width:980px){.kpi-row{grid-template-columns:repeat(2,1fr)}.mini-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">Pastel Plan ✿</div>
  <nav class="pagenav">
    <a href="index.html">甘特圖</a>
    <a href="tasks.html" class="on">任務列表</a>
    <a href="form.html">新增排程</a>
    <a href="report.html">負載報表</a>
  </nav>
  <div class="spacer"></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <div class="kpi-row">
    <div class="kpi k-mint"><h3>進行中</h3><div class="val">18</div><div class="sub">本週活躍任務</div></div>
    <div class="kpi k-yellow"><h3>待開始</h3><div class="val">7</div><div class="sub">已排定未啟動</div></div>
    <div class="kpi k-pink"><h3>已延誤</h3><div class="val">2</div><div class="sub">需要關注</div></div>
    <div class="kpi k-purple"><h3>已完成</h3><div class="val">31</div><div class="sub">本季累計</div></div>
  </div>

  <section class="card">
    <h2>📋 全部任務</h2>
    <div class="filter-bar" id="filterBar">
      <button class="on" data-f="all">全部</button>
      <button data-f="doing">進行中</button>
      <button data-f="todo">待開始</button>
      <button data-f="review">審核中</button>
      <button data-f="delay">已延誤</button>
      <button data-f="done">已完成</button>
    </div>
    <table>
      <thead><tr><th>任務名稱</th><th>負責人</th><th>期間</th><th>進度</th><th>狀態</th><th>到期</th></tr></thead>
      <tbody id="taskBody"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>⏰ 即將到期提醒</h2>
    <div class="mini-list">
      <div class="mini m1"><b>迴歸測試 v2.4</b><br>負責人：張家豪<br>截止：<span class="d due-soon">09/01（剩 4 天）</span></div>
      <div class="mini m2"><b>新版官網視覺稿</b><br>負責人：林書羽<br>截止：<span class="d">09/02（剩 5 天）</span></div>
      <div class="mini m3"><b>客戶驗收會議</b><br>負責人：蘇品妤<br>截止：<span class="d">09/03（剩 6 天）</span></div>
    </div>
  </section>
</main>
<script>
const tasks=[
  {name:'新版官網視覺稿',who:'林書羽',c:'var(--purple)',span:'08/24 — 08/27',pct:85,st:'doing',stTxt:'進行中',due:'09/02'},
  {name:'設計系統元件庫',who:'林書羽',c:'var(--purple)',span:'08/29 — 09/02',pct:30,st:'doing',stTxt:'進行中',due:'09/05'},
  {name:'首頁切版開發',who:'陳冠廷',c:'var(--mint)',span:'08/26 — 08/30',pct:60,st:'doing',stTxt:'進行中',due:'09/01'},
  {name:'購物車流程',who:'陳冠廷',c:'var(--mint)',span:'09/01 — 09/04',pct:10,st:'todo',stTxt:'待開始',due:'09/08'},
  {name:'訂單 API 重構',who:'黃郁雯',c:'var(--yellow)',span:'08/25 — 08/30',pct:70,st:'review',stTxt:'審核中',due:'09/03'},
  {name:'金流串接測試',who:'黃郁雯',c:'var(--yellow)',span:'08/31 — 09/04',pct:0,st:'todo',stTxt:'待開始',due:'09/09'},
  {name:'迴歸測試 v2.4',who:'張家豪',c:'var(--pink)',span:'08/28 — 08/31',pct:45,st:'delay',stTxt:'已延誤',due:'09/01'},
  {name:'壓力測試腳本',who:'張家豪',c:'var(--pink)',span:'09/02 — 09/04',pct:0,st:'todo',stTxt:'待開始',due:'09/10'},
  {name:'Sprint 15 規劃',who:'蘇品妤',c:'var(--purple)',span:'08/24 — 08/25',pct:100,st:'done',stTxt:'已完成',due:'—'},
  {name:'客戶驗收會議',who:'蘇品妤',c:'var(--pink)',span:'08/31 — 09/01',pct:50,st:'doing',stTxt:'進行中',due:'09/03'},
  {name:'v2.5 發佈準備',who:'蘇品妤',c:'var(--purple)',span:'09/03 — 09/06',pct:0,st:'todo',stTxt:'待開始',due:'09/11'},
  {name:'舊版退場資料移轉',who:'黃郁雯',c:'var(--yellow)',span:'08/20 — 08/26',pct:100,st:'delay',stTxt:'已延誤',due:'08/28'},
];
const bodyEl=document.getElementById('taskBody');
function render(f){
  const list=f==='all'?tasks:tasks.filter(t=>t.st===f);
  bodyEl.innerHTML=list.map(t=>`<tr>
    <td><b>${t.name}</b></td>
    <td><span class="avatar" style="background:${t.c}">${t.who[0]}</span>${t.who}</td>
    <td style="font-family:'Quicksand'">${t.span}</td>
    <td><span class="pbar"><i style="width:${t.pct}%"></i></span> <span style="font-family:'Quicksand';font-size:12px">${t.pct}%</span></td>
    <td><span class="tag ${t.st}">${t.stTxt}</span></td>
    <td class="${t.due==='09/01'?'due-soon':''}" style="font-family:'Quicksand'">${t.due}</td>
  </tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:#a0a0b5;padding:30px">此分類目前沒有任務 🌱</td></tr>';
}
render('all');
document.querySelectorAll('#filterBar button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#filterBar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.f);
}));
</script>
</body>
</html>
