<!DOCTYPE html>
<!-- 36 粉彩甘特 · 子頁：資源負載報表 report.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資源負載報表 · 粉彩排程系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#b8e8d0; --pink:#ffd6e0; --yellow:#fff3b8; --purple:#dcd0ff;
  --bg:#fdfdff; --ink:#4a4a5a; --today:#ff6b81;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Noto Sans TC','Quicksand',sans-serif;color:var(--ink);min-height:100vh}
.topbar{display:flex;align-items:center;gap:18px;padding:16px 30px;background:#fff;border-bottom:1px solid #eee7f5;flex-wrap:wrap}
.logo{font-family:'Quicksand';font-weight:700;font-size:22px;
  background:linear-gradient(90deg,#7ed8b0,#f0a8c0,#b19ef0);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.pagenav{display:flex;gap:8px;flex-wrap:wrap}
.pagenav a{color:#8a8aa0;text-decoration:none;font-size:13px;padding:7px 16px;border-radius:20px;background:#f4f0fb;transition:.25s;font-weight:500}
.pagenav a:hover{background:var(--purple);color:#6a5aa8;transform:translateY(-2px)}
.pagenav a.on{background:linear-gradient(90deg,#b19ef0,#f0a8c0);color:#fff;font-weight:700}
.spacer{flex:1}
.back-link{color:#b19ef0;text-decoration:none;font-size:14px;font-weight:500;
  border:2px solid var(--purple);border-radius:24px;padding:8px 20px;transition:.25s;white-space:nowrap}
.back-link:hover{background:var(--purple);color:#6a5aa8;transform:translateX(-3px)}
.back-link.home{border-color:var(--mint);color:#5aa880}
.back-link.home:hover{background:var(--mint);color:#3a7a5a}
main{max-width:1300px;margin:0 auto;padding:26px 30px 60px}
.card{background:#fff;border-radius:26px;border:1px solid #f0e9fa;box-shadow:0 8px 30px rgba(170,140,220,.1);padding:26px 30px;margin-bottom:24px}
.card h2{font-size:17px;font-weight:700;letter-spacing:2px;margin-bottom:18px}
.load-row{display:grid;grid-template-columns:170px 1fr 90px;align-items:center;gap:16px;padding:12px 0;border-bottom:1px dashed #f0e9fa}
.load-row:last-child{border-bottom:none}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.who .nm{font-size:14px;font-weight:700}
.who .role{font-size:11px;color:#a0a0b5}
.lbar{height:20px;border-radius:12px;background:#f6f1fc;overflow:hidden;position:relative}
.lbar i{display:block;height:100%;border-radius:12px;width:0;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.lbar .cap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#5a5a6e;font-family:'Quicksand'}
.pct{font-family:'Quicksand';font-weight:700;font-size:20px;text-align:right}
.pct small{display:block;font-size:11px;color:#a0a0b5;font-weight:500}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-left:6px}
.tag.ok{background:var(--mint);color:#3a7a5a}.tag.warn{background:var(--yellow);color:#8a6d1a}.tag.over{background:var(--pink);color:#c0405a}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sum{border-radius:18px;padding:18px 22px;font-size:13px;line-height:2}
.sum .big{font-family:'Quicksand';font-size:30px;font-weight:700}
.sum.s1{background:var(--mint)}.sum.s2{background:var(--purple)}.sum.s3{background:var(--yellow)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;font-size:13px;border-bottom:1px dashed #f0e9fa}
thead th{font-size:12px;color:#a0a0b5;letter-spacing:2px;font-weight:600;font-family:'Quicksand'}
tbody tr:hover{background:#faf7ff}
td.num,th.num{text-align:right;font-family:'Quicksand'}
@media (max-width:980px){.sum-grid{grid-template-columns:1fr}.load-row{grid-template-columns:120px 1fr 70px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">Pastel Plan ✿</div>
  <nav class="pagenav">
    <a href="index.html">甘特圖</a>
    <a href="tasks.html">任務列表</a>
    <a href="form.html">新增排程</a>
    <a href="report.html" class="on">負載報表</a>
  </nav>
  <div class="spacer"></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <section class="card">
    <h2>🌈 本週人力負載（08/24 — 08/30）</h2>
    <div id="loads"></div>
  </section>

  <section class="card">
    <h2>📊 專案工時分佈</h2>
    <table>
      <thead><tr><th>專案</th><th class="num">已投入工時</th><th class="num">預估工時</th><th class="num">消耗率</th><th>狀態</th></tr></thead>
      <tbody>
        <tr><td><b>官網改版 v2.5</b></td><td class="num">126 h</td><td class="num">180 h</td><td class="num">70%</td><td><span class="tag ok">健康</span></td></tr>
        <tr><td><b>購物車優化</b></td><td class="num">54 h</td><td class="num">90 h</td><td class="num">60%</td><td><span class="tag ok">健康</span></td></tr>
        <tr><td><b>訂單系統重構</b></td><td class="num">142 h</td><td class="num">150 h</td><td class="num">95%</td><td><span class="tag warn">瀕臨超支</span></td></tr>
        <tr><td><b>品質保證專案</b></td><td class="num">88 h</td><td class="num">80 h</td><td class="num">110%</td><td><span class="tag over">已超支</span></td></tr>
      </tbody>
    </table>
  </section>

  <section class="card">
    <h2>🍀 負載摘要</h2>
    <div class="sum-grid">
      <div class="sum s1"><div class="big">82%</div>團隊平均負載<br>較上週 +6%</div>
      <div class="sum s2"><div class="big">2 人</div>負載超過 100%<br>建議重新分配 3 件任務</div>
      <div class="sum s3"><div class="big">9 人</div>下週可用人力<br>2 人排定休假（09/02 — 09/04）</div>
    </div>
  </section>
</main>
<script>
const data=[
  {nm:'林書羽',role:'UI 設計師',c:'var(--purple)',pct:88},
  {nm:'陳冠廷',role:'前端工程師',c:'var(--mint)',pct:105},
  {nm:'黃郁雯',role:'後端工程師',c:'var(--yellow)',pct:96},
  {nm:'張家豪',role:'QA 工程師',c:'var(--pink)',pct:72},
  {nm:'蘇品妤',role:'專案經理',c:'var(--purple)',pct:64},
];
const wrap=document.getElementById('loads');
data.forEach(m=>{
  const cls=m.pct>=100?'over':m.pct>=85?'warn':'ok';
  const txt=m.pct>=100?'超載':m.pct>=85?'偏高':'正常';
  const row=document.createElement('div');row.className='load-row';
  row.innerHTML=`<div class="who"><div class="avatar" style="background:${m.c}">${m.nm[0]}</div>
    <div><div class="nm">${m.nm}<span class="tag ${cls}">${txt}</span></div><div class="role">${m.role}</div></div></div>
    <div class="lbar"><i style="background:${m.c}"></i><span class="cap">${m.pct}%</span></div>
    <div class="pct">${m.pct}%<small>${(m.pct*0.4).toFixed(0)} h / 40 h</small></div>`;
  wrap.appendChild(row);
  setTimeout(()=>row.querySelector('i').style.width=Math.min(m.pct,100)+'%',200);
});
</script>
</body>
</html>
