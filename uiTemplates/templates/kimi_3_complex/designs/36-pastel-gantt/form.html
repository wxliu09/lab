<!DOCTYPE html>
<!-- 36 粉彩甘特 · 子頁：新增排程表單 form.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增排程 · 粉彩排程系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#b8e8d0; --pink:#ffd6e0; --yellow:#fff3b8; --purple:#dcd0ff;
  --bg:#fdfdff; --ink:#4a4a5a; --today:#ff6b81;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Noto Sans TC','Quicksand',sans-serif;color:var(--ink);min-height:100vh}
.topbar{display:flex;align-items:center;gap:18px;padding:16px 30px;background:#fff;border-bottom:1px solid #eee7f5;flex-wrap:wrap}
.logo{font-family:'Quicksand';font-weight:700;font-size:22px;
  background:linear-gradient(90deg,#7ed8b0,#f0a8c0,#b19ef0);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.pagenav{display:flex;gap:8px;flex-wrap:wrap}
.pagenav a{color:#8a8aa0;text-decoration:none;font-size:13px;padding:7px 16px;border-radius:20px;background:#f4f0fb;transition:.25s;font-weight:500}
.pagenav a:hover{background:var(--purple);color:#6a5aa8;transform:translateY(-2px)}
.pagenav a.on{background:linear-gradient(90deg,#b19ef0,#f0a8c0);color:#fff;font-weight:700}
.spacer{flex:1}
.back-link{color:#b19ef0;text-decoration:none;font-size:14px;font-weight:500;
  border:2px solid var(--purple);border-radius:24px;padding:8px 20px;transition:.25s;white-space:nowrap}
.back-link:hover{background:var(--purple);color:#6a5aa8;transform:translateX(-3px)}
.back-link.home{border-color:var(--mint);color:#5aa880}
.back-link.home:hover{background:var(--mint);color:#3a7a5a}
main{max-width:1180px;margin:0 auto;padding:26px 30px 60px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.card{background:#fff;border-radius:26px;border:1px solid #f0e9fa;box-shadow:0 8px 30px rgba(170,140,220,.1);padding:26px 30px}
.card h2{font-size:17px;font-weight:700;letter-spacing:2px;margin-bottom:20px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
.field label .req{color:var(--today)}
.field input[type=text],.field input[type=date],.field select,.field textarea{
  width:100%;border:2px solid #f0e9fa;border-radius:16px;padding:11px 16px;font-size:14px;
  font-family:inherit;color:var(--ink);background:#fdfbff;transition:.2s;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#b19ef0;background:#fff;box-shadow:0 4px 14px rgba(177,158,240,.2)}
.field textarea{resize:vertical;min-height:90px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.radios,.checks{display:flex;gap:10px;flex-wrap:wrap}
.radios label,.checks label{
  display:inline-flex;align-items:center;gap:7px;border:2px solid #f0e9fa;border-radius:18px;
  padding:8px 16px;font-size:13px;cursor:pointer;font-weight:500;margin:0;transition:.2s;
}
.radios input,.checks input{accent-color:#b19ef0}
.radios label:has(input:checked){border-color:#b19ef0;background:var(--purple);color:#6a5aa8;font-weight:700}
.checks label:has(input:checked){border-color:#7ed8b0;background:var(--mint);color:#3a7a5a;font-weight:700}
.actions{display:flex;gap:14px;margin-top:6px}
.btn{border:none;border-radius:24px;padding:13px 34px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.25s;letter-spacing:1px}
.btn.save{background:linear-gradient(90deg,#b19ef0,#f0a8c0);color:#fff}
.btn.save:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(177,158,240,.4)}
.btn.ghost{background:#f4f0fb;color:#8a8aa0}
.btn.ghost:hover{background:var(--purple);color:#6a5aa8}
/* 預覽 */
.preview .bar-demo{height:36px;border-radius:18px;display:flex;align-items:center;padding:0 16px;font-size:13px;font-weight:700;transition:.3s;min-width:120px}
.pv-meta{font-size:13px;line-height:2.1;color:#6e6e82;margin-top:18px}
.pv-meta b{color:var(--ink)}
.pv-tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 12px;border-radius:14px;font-size:12px;font-weight:700}
.tag.mint{background:var(--mint);color:#3a7a5a}.tag.pink{background:var(--pink);color:#c0405a}
.tag.yellow{background:var(--yellow);color:#8a6d1a}.tag.purple{background:var(--purple);color:#6a5aa8}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;
  background:#3a3a4c;color:#fff;padding:13px 26px;border-radius:22px;font-size:14px;transition:.3s;pointer-events:none;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">Pastel Plan ✿</div>
  <nav class="pagenav">
    <a href="index.html">甘特圖</a>
    <a href="tasks.html">任務列表</a>
    <a href="form.html" class="on">新增排程</a>
    <a href="report.html">負載報表</a>
  </nav>
  <div class="spacer"></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <div class="cols">
    <section class="card">
      <h2>🌷 新增排程任務</h2>
      <form id="taskForm">
        <div class="field">
          <label>任務名稱 <span class="req">*</span></label>
          <input type="text" id="fName" placeholder="例如：會員中心頁面切版" required>
        </div>
        <div class="row2">
          <div class="field">
            <label>負責人 <span class="req">*</span></label>
            <select id="fWho">
              <option>林書羽（UI 設計師）</option>
              <option>陳冠廷（前端工程師）</option>
              <option selected>黃郁雯（後端工程師）</option>
              <option>張家豪（QA 工程師）</option>
              <option>蘇品妤（專案經理）</option>
            </select>
          </div>
          <div class="field">
            <label>所屬專案</label>
            <select id="fProj">
              <option>官網改版 v2.5</option>
              <option>購物車優化</option>
              <option>訂單系統重構</option>
              <option>品質保證專案</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>開始日期 <span class="req">*</span></label>
            <input type="date" id="fStart" value="2026-08-31">
          </div>
          <div class="field">
            <label>結束日期 <span class="req">*</span></label>
            <input type="date" id="fEnd" value="2026-09-04">
          </div>
        </div>
        <div class="field">
          <label>優先級</label>
          <div class="radios">
            <label><input type="radio" name="pri" value="高">🔥 高</label>
            <label><input type="radio" name="pri" value="中" checked>🌿 中</label>
            <label><input type="radio" name="pri" value="低">☁️ 低</label>
          </div>
        </div>
        <div class="field">
          <label>通知與設定</label>
          <div class="checks">
            <label><input type="checkbox" checked>到期前一天提醒</label>
            <label><input type="checkbox">同步至行事曆</label>
            <label><input type="checkbox">需要主管審核</label>
            <label><input type="checkbox" checked>顯示於甘特圖</label>
          </div>
        </div>
        <div class="field">
          <label>任務備註</label>
          <textarea id="fNote" placeholder="補充說明、相依任務或驗收條件…"></textarea>
        </div>
        <div class="actions">
          <button type="submit" class="btn save">儲存排程 ✿</button>
          <button type="reset" class="btn ghost">清除重填</button>
        </div>
      </form>
    </section>

    <div>
      <section class="card preview" style="margin-bottom:24px">
        <h2>👀 甘特列預覽</h2>
        <div class="bar-demo" id="pvBar" style="background:var(--yellow);width:60%">新任務預覽</div>
        <div class="pv-meta">
          負責人：<b id="pvWho">黃郁雯（後端工程師）</b><br>
          期間：<b id="pvDate" style="font-family:'Quicksand'">08/31 — 09/04（5 天）</b><br>
          優先級：<b id="pvPri">🌿 中</b>
        </div>
        <div class="pv-tags" id="pvTags">
          <span class="tag yellow">待開始</span><span class="tag mint">顯示於甘特圖</span>
        </div>
      </section>
      <section class="card">
        <h2>💡 排程小提醒</h2>
        <div class="pv-meta" style="margin-top:0">
          · 黃郁雯目前手上有 <b>2</b> 件進行中任務<br>
          · 09/02 有 <b>3</b> 件任務到期，請避開撞期<br>
          · 選擇「需要主管審核」時，任務將先進入<span class="tag purple" style="margin:0 4px">審核中</span>狀態<br>
          · 建議單一任務不超過 <b>10</b> 個工作天
        </div>
      </section>
    </div>
  </div>
</main>
<div id="toast">✿ 排程已儲存，已加入甘特圖！</div>
<script>
const colors=['var(--purple)','var(--mint)','var(--yellow)','var(--pink)'];
const fName=document.getElementById('fName'),fWho=document.getElementById('fWho'),
      fStart=document.getElementById('fStart'),fEnd=document.getElementById('fEnd'),
      pvBar=document.getElementById('pvBar');
function days(){const s=new Date(fStart.value),e=new Date(fEnd.value);
  return isNaN(s)||isNaN(e)?0:Math.round((e-s)/86400000)+1;}
function refresh(){
  const nm=fName.value.trim()||'新任務預覽';
  pvBar.textContent=nm;
  const wi=document.getElementById('fWho').selectedIndex;
  pvBar.style.background=colors[wi%4];
  document.getElementById('pvWho').textContent=fWho.value;
  const d=days();
  const fmt=v=>v?v.slice(5).replace('-','/'):'—';
  document.getElementById('pvDate').textContent=`${fmt(fStart.value)} — ${fmt(fEnd.value)}（${d>0?d+' 天':'日期有誤'}）`;
  document.getElementById('pvPri').textContent=document.querySelector('input[name=pri]:checked').parentElement.textContent.trim();
  pvBar.style.width=Math.min(Math.max(d*12,18),100)+'%';
  const ok=d>0;
  pvBar.style.filter=ok?'none':'grayscale(.6)';
}
[fName,fWho,fStart,fEnd].forEach(el=>el.addEventListener('input',refresh));
document.querySelectorAll('input[name=pri]').forEach(r=>r.addEventListener('change',refresh));
refresh();
document.getElementById('taskForm').addEventListener('submit',e=>{
  e.preventDefault();
  if(days()<=0){alert('結束日期必須晚於開始日期喔！');return;}
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
  setTimeout(()=>location.href='tasks.html',2600);
});
</script>
</body>
</html>
