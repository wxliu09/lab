<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增工單 · HelpDesk</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:#fafafa;color:#18181b;min-height:100vh}
  kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;background:#fff;border:1px solid #d4d4d8;border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:#52525b}
  header{background:#fff;border-bottom:1px solid #e4e4e7;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  .back{font-size:13px;color:#52525b;text-decoration:none;padding:6px 12px;border-radius:6px;border:1px solid #e4e4e7;transition:.15s}
  .back:hover{color:#2563eb;border-color:#2563eb;background:#eff6ff}
  h1{font-size:15px;font-weight:700}
  .sttag{font-size:11px;padding:2px 10px;border-radius:99px;background:#fef9c3;color:#a16207;font-weight:500;margin-left:6px}
  .keys{margin-left:auto;display:flex;gap:14px;font-size:12px;color:#71717a;align-items:center}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 24px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
  .card{background:#fff;border:1px solid #e4e4e7;border-radius:10px;padding:22px}
  .card h3{font-size:12px;letter-spacing:1.5px;color:#71717a;margin-bottom:14px;text-transform:uppercase}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12.5px;color:#52525b;margin-bottom:5px}
  .fld label b{color:#dc2626}
  .inp{width:100%;border:1px solid #d4d4d8;border-radius:6px;padding:9px 12px;font-size:13.5px;font-family:inherit;outline:none;background:#fff;transition:.15s}
  .inp:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  textarea.inp{min-height:120px;resize:vertical;line-height:1.7}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid #e4e4e7;border-radius:99px;font-size:12.5px;cursor:pointer;color:#52525b;transition:.15s;background:#fff}
  .opt:has(input:checked){border-color:#2563eb;color:#2563eb;background:#eff6ff;font-weight:500}
  .opt input{accent-color:#2563eb}
  .pradio{display:flex;gap:8px}
  .popt{flex:1;text-align:center;padding:9px 0;border:1px solid #e4e4e7;border-radius:8px;font-size:12.5px;cursor:pointer;transition:.15s;background:#fff}
  .popt input{display:none}
  .popt:has(input:checked){font-weight:700}
  .popt.p1:has(input:checked){border-color:#dc2626;color:#dc2626;background:#fef2f2}
  .popt.p2:has(input:checked){border-color:#ea580c;color:#ea580c;background:#fff7ed}
  .popt.p3:has(input:checked){border-color:#2563eb;color:#2563eb;background:#eff6ff}
  .popt.p4:has(input:checked){border-color:#a1a1aa;color:#52525b;background:#f4f4f5}
  .send{width:100%;background:#2563eb;color:#fff;border:none;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:8px;cursor:pointer;transition:.15s}
  .send:hover{background:#1d4ed8}
  .ghost{width:100%;background:#fff;color:#52525b;border:1px solid #e4e4e7;font-family:inherit;font-size:13px;padding:11px;border-radius:8px;cursor:pointer;margin-top:10px;transition:.15s}
  .ghost:hover{border-color:#2563eb;color:#2563eb}
  .cnt{font-size:11.5px;color:#a1a1aa;text-align:right;margin-top:4px;font-family:ui-monospace,monospace}
  .ai{border:1px dashed #c7d2fe;background:#eef2ff;border-radius:8px;padding:12px 14px;margin-top:16px}
  .ai .t{font-size:12px;font-weight:700;color:#4338ca;margin-bottom:6px}
  .ai .b{font-size:12.5px;color:#3f3f46;line-height:1.7}
  .ai button{margin-top:8px;font-size:12px;border:1px solid #c7d2fe;background:#fff;color:#4338ca;border-radius:6px;padding:5px 12px;cursor:pointer}
  .ai button:hover{background:#e0e7ff}
  .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:#18181b;color:#fff;font-size:13px;padding:10px 22px;border-radius:8px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:960px){.wrap{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a class="back" href="../../index.html">← 返回入口</a>
  <a class="back" href="index.html">⌂ 返回主控台</a>
  <h1>新增工單<span class="sttag" id="sttag">草稿</span></h1>
  <div class="keys"><span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 送出</span><a class="back" href="shortcuts.html" style="padding:4px 10px">? 快捷鍵</a></div>
</header>

<div class="wrap">
  <form class="card" onsubmit="return false">
    <h3>工單內容</h3>
    <div class="frow">
      <div class="fld"><label>客戶 <b>*</b></label>
        <select class="inp" id="fCust"><option>鼎新精密工業</option><option>澄光生技股份</option><option>翔宇連鎖餐飲</option><option>巨輪物流</option><option>泓達電子</option></select></div>
      <div class="fld"><label>聯絡人 <b>*</b></label><input class="inp" id="fWho" value="蔡承翰（採購部）"></div>
    </div>
    <div class="fld"><label>主旨 <b>*</b></label><input class="inp" id="fSubj" value="ERP 匯入廠商主檔時欄位對應錯誤" placeholder="一句話描述問題"></div>
    <div class="fld"><label>問題描述 <b>*</b></label>
      <textarea class="inp" id="fDesc" placeholder="發生時間、操作步驟、錯誤訊息、影響範圍…">今天用 Excel 範本匯入 1,842 筆廠商主檔，匯入後「統一編號」欄位全部跑到「聯絡電話」欄。範本是上週從系統下載的最新版，錯誤訊息：IMPORT_FIELD_MISMATCH (col 7)。</textarea>
      <div class="cnt" id="cnt">0 / 2000 字</div></div>
    <div class="fld"><label>分類標籤（可複選）</label>
      <div class="opts">
        <label class="opt"><input type="checkbox" checked>資料匯入</label>
        <label class="opt"><input type="checkbox" checked>ERP</label>
        <label class="opt"><input type="checkbox">帳號權限</label>
        <label class="opt"><input type="checkbox">報表</label>
        <label class="opt"><input type="checkbox">API</label>
        <label class="opt"><input type="checkbox">功能建議</label>
      </div></div>
    <button class="send" id="sendBtn">建立工單 ⏎</button>
    <button class="ghost" type="button" onclick="location.href='index.html'">取消並回列表</button>
  </form>

  <div>
    <div class="card">
      <h3>受理設定</h3>
      <div class="fld"><label>優先級</label>
        <div class="pradio">
          <label class="popt p1"><input type="radio" name="p" value="1">P1<br><span style="font-size:10px">4 小時</span></label>
          <label class="popt p2"><input type="radio" name="p" value="2" checked>P2<br><span style="font-size:10px">1 工作天</span></label>
          <label class="popt p3"><input type="radio" name="p" value="3">P3<br><span style="font-size:10px">3 工作天</span></label>
          <label class="popt p4"><input type="radio" name="p" value="4">P4<br><span style="font-size:10px">彈性</span></label>
        </div></div>
      <div class="fld"><label>期望回覆日期</label><input class="inp" type="date" value="2026-08-29"></div>
      <div class="fld"><label>受理管道</label>
        <div class="opts">
          <label class="opt"><input type="radio" name="ch" checked>客戶來電</label>
          <label class="opt"><input type="radio" name="ch">Email</label>
          <label class="opt"><input type="radio" name="ch">LINE 官方帳號</label>
        </div></div>
      <div class="fld" style="margin:0"><label>通知選項</label>
        <div class="opts">
          <label class="opt"><input type="checkbox" checked>狀態更新通知客戶</label>
          <label class="opt"><input type="checkbox">同步建立 Jira 連結單</label>
        </div></div>
    </div>
    <div class="ai">
      <div class="t">🤖 AI 輔助分析</div>
      <div class="b" id="aiTxt">依主旨初步分類為「資料匯入 / ERP」，相似歷史工單：TK-87921（欄位對應表 v2.3 更新所致）。建議優先級 P2。</div>
      <button type="button" onclick="document.getElementById('aiTxt').textContent='已帶入建議：指派予 ERP 模組值班工程師，並附 KB-1996「匯入範本欄位對應表」連結給客戶。';this.disabled=true;this.textContent='已帶入';">帶入建議</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const desc=document.getElementById('fDesc');
function cnt(){ document.getElementById('cnt').textContent=desc.value.length+' / 2000 字'; }
desc.addEventListener('input',cnt); cnt();
function submit(){
  const tag=document.getElementById('sttag');
  tag.textContent='已建立 TK-88432'; tag.style.background='#dcfce7'; tag.style.color='#16a34a';
  const t=document.getElementById('toast');
  t.textContent='✓ 工單 TK-88432 已建立並指派（按任意鍵回列表）';
  t.classList.add('show');
  setTimeout(()=>{ location.href='index.html'; },1800);
}
document.getElementById('sendBtn').addEventListener('click',submit);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.ctrlKey){ e.preventDefault(); submit(); }
});
</script>
</body>
</html>
