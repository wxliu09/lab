<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本詳情 · 日晷長影表單版本稽核</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece7dd; --ink:#2e2a24; --shadow:rgba(46,42,36,.13);
  --g-bg:#dff0d8; --g-tx:#4a7c59; --r-bg:#f2dede; --r-tx:#a94442; --y-bg:#fcf3cf; --y-tx:#8a6d3b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.serif{font-family:'Cormorant Garamond','Noto Serif TC',serif}
.ls-text{text-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),6px 6px 0 var(--shadow),8px 8px 0 var(--shadow),10px 10px 0 var(--shadow),13px 13px 0 var(--shadow),16px 16px 0 rgba(46,42,36,.05)}

.topbar{display:flex;align-items:center;gap:22px;padding:22px 36px 26px;border-bottom:1px solid rgba(46,42,36,.25);flex-wrap:wrap}
.back{
  text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:2px;
  border:1.5px solid var(--ink);padding:8px 18px;background:var(--bg);transition:all .2s;
}
.back:hover{background:var(--ink);color:var(--bg)}
.brand{flex:1;min-width:260px}
.brand h1{font-family:'Cormorant Garamond','Noto Serif TC';font-size:28px;font-weight:600;letter-spacing:3px}
.brand p{font-size:11px;letter-spacing:4px;color:rgba(46,42,36,.55);margin-top:3px}
.subnav{display:flex;gap:10px;flex-wrap:wrap}
.subnav a{
  text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;letter-spacing:2px;padding:6px 14px;
  border:1px solid rgba(46,42,36,.4);background:#fff;
  box-shadow:2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 rgba(46,42,36,.06);
  transition:all .2s;
}
.subnav a:hover{background:var(--ink);color:var(--bg)}
.subnav a.on{background:var(--ink);color:var(--bg)}

.layout{display:grid;grid-template-columns:320px 1fr;gap:44px;padding:40px 36px 80px;max-width:1400px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}

.card{
  background:#fff;border:1.5px solid var(--ink);padding:24px 26px;margin-bottom:34px;
  box-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),7px 7px 0 rgba(46,42,36,.06),9px 9px 0 rgba(46,42,36,.04);
}
.card h3{font-family:'Cormorant Garamond';font-size:22px;font-weight:600;letter-spacing:2px;margin-bottom:14px}
.card h3 .vsel{float:right}

.vsel{display:flex;align-items:center;gap:10px}
.vsel label{font-size:11px;letter-spacing:2px;color:rgba(46,42,36,.55)}
.vsel select{
  font-family:'Cormorant Garamond';font-size:17px;font-weight:600;padding:6px 12px;
  background:#fff;border:1.5px solid var(--ink);color:var(--ink);outline:none;cursor:pointer;
  box-shadow:2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 rgba(46,42,36,.06);
}

/* 版本資訊 */
.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;font-size:13.5px}
.meta .k{font-size:10.5px;letter-spacing:2px;color:rgba(46,42,36,.55)}
.meta .v{margin-top:3px}
.meta .full{grid-column:1/-1}
.pill{font-size:10.5px;letter-spacing:2px;padding:2px 10px;font-weight:700}
.pill.prod{background:var(--ink);color:var(--bg)}
.pill.stage{border:1px solid var(--ink)}
.pill.arc{color:rgba(46,42,36,.5);border:1px solid rgba(46,42,36,.35)}

/* 欄位表 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:2px;text-align:left;padding:12px 16px;border-bottom:1.5px solid var(--ink);color:rgba(46,42,36,.6);font-weight:700;background:rgba(236,231,221,.5)}
td{padding:12px 16px;border-bottom:1px solid rgba(46,42,36,.15);vertical-align:top}
tr:last-child td{border-bottom:none}
.fld{font-weight:700;letter-spacing:.5px}
.type{font-family:'Cormorant Garamond';font-size:15px;letter-spacing:1px}
.req{font-size:10.5px;letter-spacing:1px;font-weight:700;color:var(--r-tx);border:1px solid var(--r-tx);padding:1px 7px;margin-left:8px}
.opt{font-size:10.5px;letter-spacing:1px;color:rgba(46,42,36,.5);border:1px solid rgba(46,42,36,.3);padding:1px 7px;margin-left:8px}

/* 變更摘要 */
.summary{display:flex;gap:26px;font-size:12.5px;letter-spacing:1px;flex-wrap:wrap}
.summary b{font-family:'Cormorant Garamond';font-size:19px;margin-right:4px}
.cmp-link{
  display:inline-block;margin-top:18px;font-size:12.5px;letter-spacing:2px;font-weight:700;
  color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);padding:8px 18px;background:var(--bg);
  transition:all .2s;
}
.cmp-link:hover{background:var(--ink);color:var(--bg)}
</style>
</head>
<body>

<header class="topbar">
  <a class="back ls-text" href="../../index.html">← 返回入口</a>
  <div class="brand">
    <h1 class="ls-text">版本詳情 VERSION DETAIL</h1>
    <p>「員工在職進修補助申請表」單一版本規格檢視</p>
  </div>
  <nav class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="list.html">版本列表</a>
    <a href="detail.html" class="on">版本詳情</a>
    <a href="form.html">新增版本</a>
    <a href="compare.html">比對紀錄</a>
  </nav>
</header>

<div class="layout">
  <!-- 左欄：版本資訊 -->
  <aside>
    <div class="card">
      <h3>版本資訊 <span class="vsel"><label>版本</label><select id="selV"></select></span></h3>
      <div class="meta">
        <div><div class="k">發布日期</div><div class="v" id="mDate">—</div></div>
        <div><div class="k">發布人</div><div class="v" id="mWho">—</div></div>
        <div><div class="k">環境</div><div class="v" id="mEnv">—</div></div>
        <div><div class="k">欄位數</div><div class="v serif" style="font-size:19px" id="mCnt">—</div></div>
        <div class="full"><div class="k">版本說明</div><div class="v" id="mNote" style="line-height:1.8">—</div></div>
      </div>
      <a class="cmp-link" href="compare.html">前往比對紀錄 →</a>
    </div>

    <div class="card">
      <h3>稽核備註 AUDIT NOTE</h3>
      <div style="font-size:12.5px;line-height:2;color:rgba(46,42,36,.75)">
        ※ 欄位清單以發布凍結時點為準，後續草稿變更不影響本頁內容。<br>
        ※ 封存版本僅供查閱，不可再發布；如需復刻請以「新增版本」建立。<br>
        ※ 與前一版本的差異可於「比對紀錄」頁重現。
      </div>
    </div>
  </aside>

  <!-- 右欄：欄位清單 -->
  <main>
    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead><tr><th style="width:56px">序</th><th>欄位名稱</th><th style="width:110px">型別</th><th>規格說明</th></tr></thead>
        <tbody id="fBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>與前一版本差異摘要 DIFF SUMMARY</h3>
      <div class="summary" id="diffSummary"></div>
    </div>
  </main>
</div>

<script>
const VERSIONS = {
  'v1.0': { date:'2025/11/10', who:'人資室 賴秋燕', env:['封存','arc'], prev:null,
    note:'初版上線（紙本數位化）。',
    fields: [
      ['申請人姓名','文字','必填，限 20 字',1],
      ['員工編號','文字','必填，格式：EMP+5 碼',1],
      ['所屬部門','下拉','12 個部門代碼',1],
      ['課程名稱','文字','必填',1],
      ['補助金額','數字','上限 20,000 元',1],
      ['紙本簽章','核取','需檢附紙本簽名掃描檔',1],
    ]},
  'v2.0': { date:'2026/03/02', who:'系統分析師 簡宏仁', env:['封存','arc'], prev:'v1.0',
    note:'全面改版：導入電子簽核流程，紙本簽章欄位移除。',
    fields: [
      ['申請人姓名','文字','必填，限 20 字',1],
      ['員工編號','文字','必填，格式：EMP+6 碼（配合新人資系統）',1],
      ['所屬部門','下拉','12 個部門代碼',1],
      ['課程名稱','文字','必填',1],
      ['主辦單位','文字','必填，課程開辦機構全銜',1],
      ['課程起訖日','日期','起訖區間選擇器',1],
      ['補助金額','數字','上限 20,000 元',1],
      ['電子簽核','簽核','線上直屬主管一級簽核',1],
    ]},
  'v2.1': { date:'2026/05/18', who:'系統分析師 簡宏仁', env:['封存','arc'], prev:'v2.0',
    note:'配合組織調整更新部門代碼清單（12 → 18 個）。',
    fields: [
      ['申請人姓名','文字','必填，限 20 字',1],
      ['員工編號','文字','必填，格式：EMP+6 碼（配合新人資系統）',1],
      ['所屬部門','下拉','18 個部門代碼（組織調整後）',1],
      ['課程名稱','文字','必填',1],
      ['主辦單位','文字','必填，課程開辦機構全銜',1],
      ['課程起訖日','日期','起訖區間選擇器',1],
      ['補助金額','數字','上限 20,000 元',1],
      ['電子簽核','簽核','線上直屬主管一級簽核',1],
    ]},
  'v2.2': { date:'2026/07/06', who:'表單管理員 江芷琳', env:['測試','stage'], prev:'v2.1',
    note:'調整補助上限欄位驗證，測試通過待排程。',
    fields: [
      ['申請人姓名','文字','必填，限 20 字',1],
      ['員工編號','文字','必填，格式：EMP+6 碼（配合新人資系統）',1],
      ['所屬部門','下拉','18 個部門代碼（組織調整後）',1],
      ['課程名稱','文字','必填',1],
      ['主辦單位','文字','必填，課程開辦機構全銜',1],
      ['課程起訖日','日期','起訖區間選擇器',1],
      ['補助金額','數字','上限 30,000 元，超過 20,000 元需附估價單',1],
      ['電子簽核','簽核','線上直屬主管一級簽核',1],
    ]},
  'v2.3': { date:'2026/08/20', who:'表單管理員 江芷琳', env:['正式','prod'], prev:'v2.2', current:true,
    note:'新增「課程時數證明」附件必填規則；簽核改為二級。',
    fields: [
      ['申請人姓名','文字','必填，限 20 字',1],
      ['員工編號','文字','必填，格式：EMP+6 碼（配合新人資系統）',1],
      ['所屬部門','下拉','18 個部門代碼（組織調整後）',1],
      ['課程名稱','文字','必填',1],
      ['主辦單位','文字','必填，課程開辦機構全銜',1],
      ['課程起訖日','日期','起訖區間選擇器',1],
      ['課程時數證明','附件','必填，PDF 或 JPG，上限 5MB',1],
      ['補助金額','數字','上限 30,000 元，超過 20,000 元需附估價單',1],
      ['電子簽核','簽核','改為二級簽核：直屬主管 → 人資室',1],
    ]},
};
const ORDER = ['v1.0','v2.0','v2.1','v2.2','v2.3'];
const sel = document.getElementById('selV');
sel.innerHTML = ORDER.map(v=>`<option${v==='v2.3'?' selected':''}>${v}</option>`).join('');

function diffSummary(a, b){
  // b → a 的差異（a 為目前檢視版本）
  if (!b) return '<span style="color:rgba(46,42,36,.6)">初版上線，無前一版本可比對。</span>';
  const fa = Object.fromEntries(VERSIONS[a].fields.map(f=>[f[0], f[2]]));
  const fb = Object.fromEntries(VERSIONS[b].fields.map(f=>[f[0], f[2]]));
  let add=0, del=0, mod=0;
  new Set([...Object.keys(fa), ...Object.keys(fb)]).forEach(k=>{
    if (!fb[k]) add++;
    else if (!fa[k]) del++;
    else if (fa[k]!==fb[k]) mod++;
  });
  return `<span>比對：<b class="serif">${b} → ${a}</b></span>
    <span style="color:var(--g-tx)"><b>＋${add}</b>新增欄位</span>
    <span style="color:var(--r-tx)"><b>－${del}</b>刪除欄位</span>
    <span style="color:var(--y-tx)"><b>±${mod}</b>修改欄位</span>`;
}

function render(v){
  const d = VERSIONS[v];
  document.getElementById('mDate').textContent = d.date;
  document.getElementById('mWho').textContent = d.who;
  document.getElementById('mEnv').innerHTML = `<span class="pill ${d.env[1]}">${d.env[0]}</span>` + (d.current?' <span class="pill prod">現行</span>':'');
  document.getElementById('mCnt').textContent = d.fields.length;
  document.getElementById('mNote').textContent = d.note;
  document.getElementById('fBody').innerHTML = d.fields.map(([name,type,desc,req],i)=>`
    <tr>
      <td class="type">${String(i+1).padStart(2,'0')}</td>
      <td class="fld">${name}${req?'<span class="req">必填</span>':'<span class="opt">選填</span>'}</td>
      <td class="type">${type}</td>
      <td>${desc}</td>
    </tr>`).join('');
  document.getElementById('diffSummary').innerHTML = diffSummary(v, d.prev);
}
sel.addEventListener('change', e=>render(e.target.value));
render('v2.3');
</script>
</body>
</html>
