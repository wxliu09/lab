<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本列表 · 日晷長影表單版本稽核</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece7dd; --ink:#2e2a24; --shadow:rgba(46,42,36,.13);
  --g-bg:#dff0d8; --g-tx:#4a7c59; --r-bg:#f2dede; --r-tx:#a94442; --y-bg:#fcf3cf; --y-tx:#8a6d3b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.serif{font-family:'Cormorant Garamond','Noto Serif TC',serif}
.ls-text{text-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),6px 6px 0 var(--shadow),8px 8px 0 var(--shadow),10px 10px 0 var(--shadow),13px 13px 0 var(--shadow),16px 16px 0 rgba(46,42,36,.05)}

.topbar{display:flex;align-items:center;gap:22px;padding:22px 36px 26px;border-bottom:1px solid rgba(46,42,36,.25);flex-wrap:wrap}
.back{
  text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:2px;
  border:1.5px solid var(--ink);padding:8px 18px;background:var(--bg);transition:all .2s;
}
.back:hover{background:var(--ink);color:var(--bg)}
.brand{flex:1;min-width:260px}
.brand h1{font-family:'Cormorant Garamond','Noto Serif TC';font-size:28px;font-weight:600;letter-spacing:3px}
.brand p{font-size:11px;letter-spacing:4px;color:rgba(46,42,36,.55);margin-top:3px}
.subnav{display:flex;gap:10px;flex-wrap:wrap}
.subnav a{
  text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;letter-spacing:2px;padding:6px 14px;
  border:1px solid rgba(46,42,36,.4);background:#fff;
  box-shadow:2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 rgba(46,42,36,.06);
  transition:all .2s;
}
.subnav a:hover{background:var(--ink);color:var(--bg)}
.subnav a.on{background:var(--ink);color:var(--bg)}

.layout{display:grid;grid-template-columns:320px 1fr;gap:44px;padding:40px 36px 80px;max-width:1400px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.tl-title{font-size:12px;letter-spacing:4px;color:rgba(46,42,36,.55);margin-bottom:22px;font-weight:700}

/* 時間軸 */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1.5px;background:rgba(46,42,36,.3)}
.vnode{position:relative;padding:14px 16px;margin-bottom:14px;cursor:pointer;background:transparent;border:1px solid transparent;transition:all .2s}
.vnode::before{
  content:'';position:absolute;left:-25px;top:20px;width:12px;height:12px;border-radius:50%;
  background:var(--bg);border:2px solid var(--ink);transition:all .2s;
}
.vnode:hover{background:rgba(255,255,255,.45)}
.vnode.sel{background:#fff;border-color:var(--ink);box-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),6px 6px 0 rgba(46,42,36,.07),8px 8px 0 rgba(46,42,36,.04)}
.vnode.sel::before{background:var(--ink)}
.vnode .ver{font-family:'Cormorant Garamond';font-size:21px;font-weight:600;letter-spacing:1px}
.vnode .date{font-size:11px;letter-spacing:1px;color:rgba(46,42,36,.55);margin-top:1px}
.vnode .note{font-size:12.5px;margin-top:6px;color:rgba(46,42,36,.8);line-height:1.6}
.vnode .who{font-size:11px;margin-top:4px;color:rgba(46,42,36,.5)}
.vnode .cur{display:inline-block;font-size:10px;letter-spacing:2px;background:var(--ink);color:var(--bg);padding:1px 8px;margin-left:8px;vertical-align:2px}

/* 右欄卡片 */
.card{
  background:#fff;border:1.5px solid var(--ink);padding:24px 26px;margin-bottom:34px;
  box-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),7px 7px 0 rgba(46,42,36,.06),9px 9px 0 rgba(46,42,36,.04);
}
.card h3{font-family:'Cormorant Garamond';font-size:22px;font-weight:600;letter-spacing:2px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:2px;text-align:left;padding:12px 16px;border-bottom:1.5px solid var(--ink);color:rgba(46,42,36,.6);font-weight:700;background:rgba(236,231,221,.5)}
td{padding:12px 16px;border-bottom:1px solid rgba(46,42,36,.15);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(46,42,36,.05)}
.pill{font-size:10.5px;letter-spacing:2px;padding:2px 10px;font-weight:700;white-space:nowrap}
.pill.prod{background:var(--ink);color:var(--bg)}
.pill.stage{border:1px solid var(--ink)}
.pill.arc{color:rgba(46,42,36,.5);border:1px solid rgba(46,42,36,.35)}

/* 統計數字 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.stat .n{font-family:'Cormorant Garamond';font-size:40px;font-weight:600;line-height:1}
.stat .t{font-size:11px;letter-spacing:3px;color:rgba(46,42,36,.55);margin-top:6px}
.stat{border-left:1.5px solid rgba(46,42,36,.3);padding-left:16px}

/* 欄位數演變 */
.evo{display:flex;align-items:flex-end;gap:22px;height:150px;margin-top:10px;padding:0 6px}
.ecol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.ebar{width:70%;max-width:60px;background:var(--ink);height:0;transition:height .7s cubic-bezier(.2,.8,.3,1);
  box-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),6px 6px 0 rgba(46,42,36,.06)}
.ecol .en{font-family:'Cormorant Garamond';font-size:17px;font-weight:600}
.ecol .ev{font-size:11px;letter-spacing:1px;color:rgba(46,42,36,.55)}
.evo-base{border-top:1.5px solid var(--ink);margin:-22px 6px 0}
.detail-link{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--ink)}
.detail-link:hover{background:var(--y-bg)}
</style>
</head>
<body>

<header class="topbar">
  <a class="back ls-text" href="../../index.html">← 返回入口</a>
  <div class="brand">
    <h1 class="ls-text">版本列表 VERSION INDEX</h1>
    <p>「員工在職進修補助申請表」全版本一覽</p>
  </div>
  <nav class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="list.html" class="on">版本列表</a>
    <a href="detail.html">版本詳情</a>
    <a href="form.html">新增版本</a>
    <a href="compare.html">比對紀錄</a>
  </nav>
</header>

<div class="layout">
  <!-- 左欄：時間軸 -->
  <aside>
    <div class="tl-title">版本歷程 VERSION TIMELINE</div>
    <div class="timeline" id="timeline"></div>
  </aside>

  <!-- 右欄 -->
  <main>
    <div class="card">
      <h3>版本統計 STATISTICS</h3>
      <div class="stats">
        <div class="stat"><div class="n">5</div><div class="t">版本總數</div></div>
        <div class="stat"><div class="n" id="kFields">9</div><div class="t">現行欄位數</div></div>
        <div class="stat"><div class="n">27</div><div class="t">累計欄位變更</div></div>
        <div class="stat"><div class="n" style="color:var(--g-tx)">v2.3</div><div class="t">現行版本</div></div>
      </div>
    </div>

    <div class="card">
      <h3>欄位數演變 FIELD GROWTH</h3>
      <div class="evo" id="evo"></div>
      <div class="evo-base"></div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead><tr><th>版本</th><th>發布時間</th><th>發布人</th><th>環境</th><th>欄位數</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
const VERSIONS = [
  {v:'v2.3', date:'2026/08/20', who:'表單管理員 江芷琳', env:'prod',  envT:'正式', fields:9, note:'新增「課程時數證明」附件必填規則', current:true},
  {v:'v2.2', date:'2026/07/06', who:'表單管理員 江芷琳', env:'stage', envT:'測試', fields:8, note:'調整補助上限欄位驗證，測試通過待排程'},
  {v:'v2.1', date:'2026/05/18', who:'系統分析師 簡宏仁', env:'arc',   envT:'封存', fields:8, note:'配合組織調整更新部門代碼清單'},
  {v:'v2.0', date:'2026/03/02', who:'系統分析師 簡宏仁', env:'arc',   envT:'封存', fields:8, note:'全面改版：導入電子簽核流程'},
  {v:'v1.0', date:'2025/11/10', who:'人資室 賴秋燕',     env:'arc',   envT:'封存', fields:6, note:'初版上線（紙本數位化）'},
];

/* 時間軸 */
const tl = document.getElementById('timeline');
tl.innerHTML = VERSIONS.map(d=>`
  <div class="vnode" data-v="${d.v}" data-f="${d.fields}">
    <div class="ver serif">${d.v}${d.current?'<span class="cur">現行</span>':''}</div>
    <div class="date">${d.date}</div>
    <div class="note">${d.note}</div>
    <div class="who">— ${d.who}</div>
  </div>`).join('');

tl.addEventListener('click', e=>{
  const n = e.target.closest('.vnode'); if(!n) return;
  tl.querySelectorAll('.vnode').forEach(x=>x.classList.remove('sel'));
  n.classList.add('sel');
  document.getElementById('kFields').textContent = n.dataset.f;
});
tl.querySelector('[data-v="v2.3"]').classList.add('sel');

/* 欄位數演變 */
const evo = document.getElementById('evo');
const maxF = Math.max(...VERSIONS.map(d=>d.fields));
evo.innerHTML = [...VERSIONS].reverse().map(d=>`
  <div class="ecol">
    <span class="en">${d.fields}</span>
    <span class="ebar" data-h="${Math.round(d.fields/maxF*120)}"></span>
    <span class="ev">${d.v}</span>
  </div>`).join('');
requestAnimationFrame(()=>setTimeout(()=>{
  evo.querySelectorAll('.ebar').forEach(b=>b.style.height = b.dataset.h + 'px');
}, 80));

/* 總覽表 */
document.getElementById('tbody').innerHTML = VERSIONS.map(d=>`
  <tr>
    <td class="serif" style="font-size:18px;font-weight:600">${d.v}${d.current?' <span class="cur" style="font-family:Noto Sans TC">現行</span>':''}</td>
    <td>${d.date}</td>
    <td>${d.who}</td>
    <td><span class="pill ${d.env}">${d.envT}</span></td>
    <td class="serif" style="font-size:16px">${d.fields}</td>
    <td><a class="detail-link" href="detail.html">詳情 →</a></td>
  </tr>`).join('');
document.querySelectorAll('#tbody tr').forEach(tr=>tr.addEventListener('click', e=>{
  if (e.target.closest('a')) return;
  location.href = 'detail.html';
}));
</script>
</body>
</html>
