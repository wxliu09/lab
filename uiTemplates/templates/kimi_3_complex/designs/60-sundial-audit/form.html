<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增版本 · 日晷長影表單版本稽核</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece7dd; --ink:#2e2a24; --shadow:rgba(46,42,36,.13);
  --g-bg:#dff0d8; --g-tx:#4a7c59; --r-bg:#f2dede; --r-tx:#a94442; --y-bg:#fcf3cf; --y-tx:#8a6d3b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.serif{font-family:'Cormorant Garamond','Noto Serif TC',serif}
.ls-text{text-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),6px 6px 0 var(--shadow),8px 8px 0 var(--shadow),10px 10px 0 var(--shadow),13px 13px 0 var(--shadow),16px 16px 0 rgba(46,42,36,.05)}

.topbar{display:flex;align-items:center;gap:22px;padding:22px 36px 26px;border-bottom:1px solid rgba(46,42,36,.25);flex-wrap:wrap}
.back{
  text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:2px;
  border:1.5px solid var(--ink);padding:8px 18px;background:var(--bg);transition:all .2s;
}
.back:hover{background:var(--ink);color:var(--bg)}
.brand{flex:1;min-width:260px}
.brand h1{font-family:'Cormorant Garamond','Noto Serif TC';font-size:28px;font-weight:600;letter-spacing:3px}
.brand p{font-size:11px;letter-spacing:4px;color:rgba(46,42,36,.55);margin-top:3px}
.subnav{display:flex;gap:10px;flex-wrap:wrap}
.subnav a{
  text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:700;letter-spacing:2px;padding:6px 14px;
  border:1px solid rgba(46,42,36,.4);background:#fff;
  box-shadow:2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 rgba(46,42,36,.06);
  transition:all .2s;
}
.subnav a:hover{background:var(--ink);color:var(--bg)}
.subnav a.on{background:var(--ink);color:var(--bg)}

.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;padding:40px 36px 80px;max-width:1360px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.card{
  background:#fff;border:1.5px solid var(--ink);padding:24px 26px;margin-bottom:34px;
  box-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),5px 5px 0 var(--shadow),7px 7px 0 rgba(46,42,36,.06),9px 9px 0 rgba(46,42,36,.04);
}
.card h3{font-family:'Cormorant Garamond';font-size:22px;font-weight:600;letter-spacing:2px;margin-bottom:16px}

/* 表單 */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.frm .full{grid-column:1/-1}
.frm label.lab{font-size:11px;letter-spacing:2px;color:rgba(46,42,36,.55);display:block;margin-bottom:6px;font-weight:700}
.frm input[type=text],.frm input[type=date],.frm select,.frm textarea{
  width:100%;padding:9px 12px;font-family:inherit;font-size:14px;color:var(--ink);
  background:#fff;border:1.5px solid var(--ink);outline:none;
  box-shadow:2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 rgba(46,42,36,.06);
}
.frm input:focus,.frm select:focus,.frm textarea:focus{background:var(--y-bg)}
.frm textarea{resize:vertical;min-height:80px}
.radios,.checks{display:flex;gap:10px;flex-wrap:wrap}
.radios label,.checks label{
  display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;
  border:1px solid rgba(46,42,36,.4);padding:6px 13px;background:#fff;transition:all .15s;
}
.radios input,.checks input{accent-color:var(--ink)}
.radios label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.checks label:has(input:checked){background:var(--g-bg);color:var(--g-tx);border-color:var(--g-tx)}
.submit{
  grid-column:1/-1;padding:13px;font-family:inherit;font-weight:700;font-size:14px;letter-spacing:4px;
  cursor:pointer;background:var(--ink);color:var(--bg);border:none;transition:all .2s;
  box-shadow:2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 var(--shadow),6px 6px 0 rgba(46,42,36,.06);
}
.submit:hover{letter-spacing:6px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 命名規則 */
.rules{font-size:12.5px;line-height:2.1;color:rgba(46,42,36,.75)}
.rules b{font-family:'Cormorant Garamond';font-size:15px}

/* 草稿列 */
.draft-row{
  display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;
  border:1px solid rgba(46,42,36,.35);padding:12px 16px;margin-bottom:12px;background:#fff;
  box-shadow:1px 1px 0 var(--shadow),2px 2px 0 var(--shadow),3px 3px 0 var(--shadow),4px 4px 0 rgba(46,42,36,.06);
}
.draft-row.fresh{animation:slidein .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.draft-row .dv{font-family:'Cormorant Garamond';font-size:22px;font-weight:600}
.draft-row .dt{font-size:12.5px;line-height:1.7}
.draft-row .dd{font-size:11px;color:rgba(46,42,36,.5)}
.pill{font-size:10.5px;letter-spacing:2px;padding:2px 10px;font-weight:700;white-space:nowrap;border:1px solid var(--y-tx);color:var(--y-tx);background:var(--y-bg)}
.empty{padding:20px;text-align:center;font-size:12.5px;color:rgba(46,42,36,.5);letter-spacing:2px;border:1px dashed rgba(46,42,36,.35)}
</style>
</head>
<body>

<header class="topbar">
  <a class="back ls-text" href="../../index.html">← 返回入口</a>
  <div class="brand">
    <h1 class="ls-text">新增版本 NEW VERSION</h1>
    <p>「員工在職進修補助申請表」版本變更申請</p>
  </div>
  <nav class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="list.html">版本列表</a>
    <a href="detail.html">版本詳情</a>
    <a href="form.html" class="on">新增版本</a>
    <a href="compare.html">比對紀錄</a>
  </nav>
</header>

<div class="layout">
  <!-- 左欄：表單 -->
  <main>
    <div class="card">
      <h3>版本變更申請單</h3>
      <form class="frm" id="verForm">
        <div><label class="lab">新版本號 *</label><input type="text" id="vNo" placeholder="v2.4"></div>
        <div>
          <label class="lab">基準版本</label>
          <select id="vBase"><option>v2.3（現行）</option><option>v2.2</option><option>v2.1</option><option>v2.0</option></select>
        </div>
        <div><label class="lab">預定發布日 *</label><input type="date" id="vDate" value="2026-09-15"></div>
        <div>
          <label class="lab">目標環境</label>
          <select id="vEnv"><option>測試（先行驗證）</option><option>正式（直接發布）</option></select>
        </div>
        <div class="full">
          <label class="lab">變更性質</label>
          <div class="radios">
            <label><input type="radio" name="kind" value="例行更新" checked>例行更新</label>
            <label><input type="radio" name="kind" value="緊急修正">緊急修正</label>
            <label><input type="radio" name="kind" value="法規配合">法規配合</label>
            <label><input type="radio" name="kind" value="組織調整">組織調整</label>
          </div>
        </div>
        <div class="full">
          <label class="lab">發布前檢核（可複選）</label>
          <div class="checks">
            <label><input type="checkbox" checked>欄位驗證測試</label>
            <label><input type="checkbox" checked>簽核流程測試</label>
            <label><input type="checkbox">歷史資料相容性檢查</label>
            <label><input type="checkbox">行動裝置版面檢視</label>
          </div>
        </div>
        <div class="full"><label class="lab">變更說明 *</label><textarea id="vNote" placeholder="例：依人資室 115 年度新規，補助上限調整為 35,000 元，並新增「緊急聯絡人」欄位…"></textarea></div>
        <button type="submit" class="submit">建 立 草 稿 版 本</button>
      </form>
    </div>
  </main>

  <!-- 右欄 -->
  <aside>
    <div class="card">
      <h3>版本命名規則</h3>
      <div class="rules">
        ※ 主版號（<b>v2</b>.x）：表單結構性改版（流程、簽核層級變更）。<br>
        ※ 次版號（v2.<b>x</b>）：欄位增刪、驗證規則、代碼清單調整。<br>
        ※ 建立草稿後，需表單管理員核准才進入測試環境。<br>
        ※ 草稿與基準版本的差異可至 <a href="compare.html" style="color:var(--ink)"><b>比對紀錄</b></a> 產生報告。
      </div>
    </div>

    <div class="card">
      <h3>草稿版本 DRAFTS</h3>
      <div id="drafts">
        <div class="empty">— 目前無草稿版本 —</div>
      </div>
    </div>
  </aside>
</div>

<script>
document.getElementById('verForm').addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target;
  const no = document.getElementById('vNo').value.trim();
  const note = document.getElementById('vNote').value.trim();
  if (!no || !note || !/^v\d+\.\d+$/.test(no)){
    f.classList.add('shake'); setTimeout(()=>f.classList.remove('shake'), 450);
    if (no && !/^v\d+\.\d+$/.test(no)) document.getElementById('vNo').focus();
    return;
  }
  const kind = document.querySelector('input[name=kind]:checked').value;
  const date = document.getElementById('vDate').value;
  const env = document.getElementById('vEnv').value.split('（')[0];
  const box = document.getElementById('drafts');
  const empty = box.querySelector('.empty');
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'draft-row fresh';
  row.innerHTML = `<div class="dv">${no}</div>
    <div><div class="dt"><b>${kind}</b> ｜ 預定 ${date} 發布至${env}環境</div>
    <div class="dd">${note.length>40 ? note.slice(0,40)+'…' : note}</div></div>
    <span class="pill">草稿</span>`;
  box.prepend(row);
  document.getElementById('vNo').value = '';
  document.getElementById('vNote').value = '';
});
</script>
</body>
</html>
