<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增任務 · 專案看板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:#f4f5f7;color:#172b4d;min-height:100vh}
  .topbar{background:#fff;border-bottom:1px solid #dfe1e6;padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#ebecf0;border-radius:6px;color:#42526e;text-decoration:none;font-size:14px;font-weight:500;transition:.2s}
  .back-btn:hover{background:#dfe1e6;color:#172b4d}
  .topbar h1{font-size:18px;font-weight:900}
  .topbar .sub{font-size:13px;color:#6b778c}
  .navlinks{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .navlinks a{font-size:13.5px;color:#42526e;text-decoration:none;font-weight:500;padding:7px 12px;border-radius:6px;transition:.15s}
  .navlinks a:hover{background:#ebecf0;color:#172b4d}
  .navlinks a.on{color:#2684ff;background:#deebff}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:8px;padding:22px;box-shadow:0 1px 2px rgba(9,30,66,.12)}
  .panel h2{font-size:15px;margin-bottom:16px}
  .panel h2 span{font-size:12px;color:#6b778c;font-weight:400;margin-left:8px}
  .frow{margin-bottom:16px}
  .frow label{display:block;font-size:13px;font-weight:700;color:#42526e;margin-bottom:7px}
  .frow label i{color:#ff5630;font-style:normal}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;border:2px solid #dfe1e6;background:#fafbfc;border-radius:6px;padding:10px 12px;
    font-family:inherit;font-size:14px;color:#172b4d;outline:none;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:#2684ff;background:#fff}
  input[readonly]{color:#6b778c}
  textarea{resize:vertical;min-height:100px;line-height:1.7}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.fgrid{grid-template-columns:1fr}}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{border:1.5px solid #dfe1e6;background:#fff;color:#42526e;font-size:13px;padding:7px 14px;border-radius:6px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;font-weight:500}
  .opt:hover{border-color:#2684ff}
  .opt:has(input:checked){border-color:#2684ff;background:#deebff;color:#0052cc}
  .opt input{accent-color:#2684ff}
  .btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .btn{padding:10px 24px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.15s;text-decoration:none;display:inline-block}
  .btn.pri{background:#2684ff;color:#fff}
  .btn.pri:hover{background:#1a6fdd}
  .btn.ghost{background:#ebecf0;color:#42526e}
  .btn.ghost:hover{background:#dfe1e6}
  #msg{display:none;margin-top:14px;padding:12px 16px;border-radius:6px;font-size:13.5px;font-weight:500}
  #msg.ok{display:block;background:#e3fcef;color:#006644}
  #msg.err{display:block;background:#ffebe6;color:#bf2600}
  /* 預覽卡（沿用看板卡片樣式） */
  .pv{background:#ebecf0;border-radius:10px;padding:14px}
  .pv .lane-name{font-size:12.5px;font-weight:700;color:#42526e;margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .pv .lane-name .dot{width:9px;height:9px;border-radius:50%;background:#97a0af}
  .card{background:#fff;border-radius:6px;padding:12px;box-shadow:0 1px 2px rgba(9,30,66,.15)}
  .card .title{font-size:14px;font-weight:500;line-height:1.5;margin-bottom:8px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;color:#fff}
  .card .meta{display:flex;align-items:center;gap:10px}
  .avatar{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .due{margin-left:auto;font-size:11px;color:#6b778c}
  .hint{font-size:12.5px;color:#6b778c;line-height:1.9}
  .hint b{color:#172b4d}
  .recent{display:flex;flex-direction:column;gap:10px}
  .recent .r{font-size:13px;color:#42526e;border-left:3px solid #dfe1e6;padding:4px 10px;line-height:1.6}
  .recent .r span{color:#97a0af;font-size:11.5px;display:block}
</style>
</head>
<body>
<header class="topbar">
  <a class="back-btn" href="../../index.html">← 返回入口</a>
  <div>
    <h1>億銓資訊 · 專案看板</h1>
    <div class="sub">ERP 系統升級專案 — Sprint 14</div>
  </div>
  <nav class="navlinks">
    <a href="index.html">返回主控台</a>
    <a href="members.html">成員</a>
    <a href="report.html">報表</a>
    <a href="new-task.html" class="on">＋ 新增任務</a>
  </nav>
</header>

<div class="wrap">
  <div class="grid2">
    <!-- 表單 -->
    <div class="panel">
      <h2>新增任務<span>狀態：<b class="tag" id="stTag" style="background:#97a0af">草稿</b></span></h2>
      <form id="taskForm" novalidate>
        <div class="frow"><label>任務標題 <i>*</i></label><input type="text" id="fTitle" placeholder="例：訂單查詢頁篩選器重構" maxlength="60"></div>
        <div class="fgrid">
          <div class="frow"><label>放入泳道</label>
            <select id="fLane">
              <option value="待辦" selected>待辦</option>
              <option value="進行中">進行中</option>
              <option value="審核">審核</option>
            </select>
          </div>
          <div class="frow"><label>負責人 <i>*</i></label>
            <select id="fOwner">
              <option value="">— 請選擇 —</option>
              <option>陳志豪</option><option>林怡君</option><option>王建明</option>
              <option>黃雅婷</option><option>張國華</option><option>吳淑芬</option><option>李宗翰</option>
            </select>
          </div>
        </div>
        <div class="fgrid">
          <div class="frow"><label>截止日期 <i>*</i></label><input type="date" id="fDue" value="2026-09-04"></div>
          <div class="frow"><label>預估工時（小時）</label><input type="number" id="fHrs" value="8" min="1" max="80"></div>
        </div>
        <div class="frow"><label>標籤（可複選）</label>
          <div class="opts">
            <label class="opt"><input type="checkbox" value="前端" data-c="#2684ff" checked>前端</label>
            <label class="opt"><input type="checkbox" value="後端" data-c="#36b37e">後端</label>
            <label class="opt"><input type="checkbox" value="設計" data-c="#ff8b00">設計</label>
            <label class="opt"><input type="checkbox" value="測試" data-c="#8777d9">測試</label>
            <label class="opt"><input type="checkbox" value="急件" data-c="#ff5630">急件</label>
          </div>
        </div>
        <div class="frow"><label>優先級</label>
          <div class="opts">
            <label class="opt"><input type="radio" name="pri" checked>一般</label>
            <label class="opt"><input type="radio" name="pri">高</label>
            <label class="opt"><input type="radio" name="pri">最高（本 Sprint 必達）</label>
          </div>
        </div>
        <div class="frow"><label>驗收條件 / 描述</label>
          <textarea id="fDesc" maxlength="300" placeholder="描述完成標準、相依任務與注意事項…"></textarea>
        </div>
        <div class="frow"><label>附加設定</label>
          <div class="opts">
            <label class="opt"><input type="checkbox" checked>建立後通知負責人</label>
            <label class="opt"><input type="checkbox">列入 Sprint 14 燃盡</label>
            <label class="opt"><input type="checkbox">需要 Code Review</label>
          </div>
        </div>
        <div class="btns">
          <button type="submit" class="btn pri">建立任務</button>
          <button type="reset" class="btn ghost" id="resetBtn">清除</button>
          <a class="btn ghost" href="index.html">返回看板</a>
        </div>
        <div id="msg"></div>
      </form>
    </div>

    <!-- 預覽 + 說明 -->
    <div>
      <div class="panel">
        <h2>看板預覽<span>LIVE PREVIEW</span></h2>
        <div class="pv">
          <div class="lane-name"><span class="dot" id="pvDot"></span><span id="pvLane">待辦</span></div>
          <div class="card">
            <div class="title" id="pvTitle">（尚未輸入標題）</div>
            <div class="tags" id="pvTags"><span class="tag" style="background:#2684ff">前端</span></div>
            <div class="meta">
              <span class="avatar" id="pvAvatar" style="background:#97a0af">＿</span>
              <span class="due" id="pvDue">📅 09/04</span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel" style="margin-top:18px">
        <h2>建立小提示</h2>
        <p class="hint">
          ‧ 標題建議 <b>20 字內</b>，動詞開頭（例：修正、實作、調整）<br>
          ‧ 預估工時超過 <b>24h</b> 建議拆成子任務<br>
          ‧ 「急件」標籤會在卡片上以紅色顯示並通知組長<br>
          ‧ 建立後可在看板上<b>拖曳</b>調整泳道與排序
        </p>
        <div class="recent" style="margin-top:14px">
          <div class="r">李宗翰 建立了「單元測試覆蓋率提升至 70%」<span>08/24 14:02</span></div>
          <div class="r">黃雅婷 建立了「登入頁兩步驟驗證 UI 設計稿」<span>08/22 10:31</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const $=id=>document.getElementById(id);
  const MC={'陳志豪':'#0052cc','林怡君':'#e774bb','王建明':'#00875a','黃雅婷':'#ff8b00','張國華':'#6554c0','吳淑芬':'#00b8d9','李宗翰':'#ff5630'};
  const LC={'待辦':'#97a0af','進行中':'#2684ff','審核':'#ff8b00'};
  function pv(){
    $('pvTitle').textContent=$('fTitle').value.trim()||'（尚未輸入標題）';
    $('pvLane').textContent=$('fLane').value;
    $('pvDot').style.background=LC[$('fLane').value];
    const o=$('fOwner').value;
    $('pvAvatar').textContent=o?o[0]:'＿';
    $('pvAvatar').style.background=o?MC[o]:'#97a0af';
    const d=$('fDue').value;
    $('pvDue').textContent='📅 '+(d?d.slice(5).replace('-','/'):'—');
    const tags=[...document.querySelectorAll('.opts input[type=checkbox][data-c]:checked')];
    $('pvTags').innerHTML=tags.length
      ? tags.map(t=>`<span class="tag" style="background:${t.dataset.c}">${t.value}</span>`).join('')
      : '<span class="tag" style="background:#97a0af">無標籤</span>';
  }
  ['fTitle','fLane','fOwner','fDue'].forEach(id=>$(id).addEventListener('input',pv));
  document.querySelectorAll('.opts input[data-c]').forEach(t=>t.addEventListener('change',pv));
  pv();
  $('taskForm').addEventListener('submit',e=>{
    e.preventDefault();
    const msg=$('msg');
    if(!$('fTitle').value.trim()||!$('fOwner').value||!$('fDue').value){
      msg.className='err';msg.textContent='⚠ 請先完成必填欄位：任務標題、負責人、截止日期。';
      return;
    }
    msg.className='ok';msg.textContent='✔ 任務「'+$('fTitle').value.trim()+'」已建立並放入「'+$('fLane').value+'」泳道（示範畫面，返回看板不會新增卡片）。';
    $('stTag').textContent='已建立';$('stTag').style.background='#36b37e';
    msg.scrollIntoView({behavior:'smooth',block:'center'});
  });
  $('resetBtn').addEventListener('click',()=>setTimeout(pv,0));
</script>
</body>
</html>
