<!DOCTYPE html>
<!--
  設計規格 — 25-kanban-pm.html 看板泳道·專案管理
  風格定位：現代 SaaS 專案管理工具，明亮清爽、卡片式 Kanban
  配色：背景 #f4f5f7｜卡片 #ffffff｜標題 #172b4d｜次要字 #6b778c
        欄位色：待辦 #dfe1e6 / 進行中 #deebff / 審核 #fff0b3 / 完成 #e3fcef
        標籤色：前端 #2684ff、後端 #36b37e、設計 #ff8b00、急件 #ff5630
  字體：Noto Sans TC（Google Fonts）
  版面結構：頂部工具列（返回入口＋專案總覽進度）→ KPI 卡片列 → 四欄 Kanban 泳道
  動態效果：HTML5 drag & drop 拖曳換欄、卡片拖曳時半透明、KPI 數字遞增動畫、欄位計數即時更新
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案看板 · MIS 專案管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:#f4f5f7;color:#172b4d;min-height:100vh}
  .topbar{background:#fff;border-bottom:1px solid #dfe1e6;padding:12px 24px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:10}
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#ebecf0;border-radius:6px;color:#42526e;text-decoration:none;font-size:14px;font-weight:500;transition:.2s}
  .back-btn:hover{background:#dfe1e6;color:#172b4d}
  .topbar h1{font-size:18px;font-weight:900}
  .topbar .sub{font-size:13px;color:#6b778c}
  .overview{margin-left:auto;display:flex;align-items:center;gap:14px}
  .overview .bar{width:220px;height:8px;background:#ebecf0;border-radius:99px;overflow:hidden}
  .overview .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2684ff,#36b37e);border-radius:99px;transition:width 1.4s cubic-bezier(.22,1,.36,1)}
  .overview .pct{font-weight:900;color:#2684ff;font-size:15px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 24px 8px}
  .kpi{background:#fff;border-radius:8px;padding:16px 18px;box-shadow:0 1px 2px rgba(9,30,66,.08);border-top:4px solid #2684ff;animation:fadeUp .5s both}
  .kpi:nth-child(2){border-top-color:#ff8b00;animation-delay:.08s}
  .kpi:nth-child(3){border-top-color:#ff5630;animation-delay:.16s}
  .kpi:nth-child(4){border-top-color:#36b37e;animation-delay:.24s}
  .kpi .label{font-size:13px;color:#6b778c}
  .kpi .num{font-size:32px;font-weight:900;margin-top:4px}
  .kpi .trend{font-size:12px;margin-top:4px}
  .up{color:#36b37e}.down{color:#ff5630}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px 24px 32px;align-items:start}
  .lane{background:#ebecf0;border-radius:10px;padding:10px;min-height:300px;transition:.2s}
  .lane.dragover{background:#deebff;outline:2px dashed #2684ff;outline-offset:-6px}
  .lane-head{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:14px}
  .lane-head .dot{width:10px;height:10px;border-radius:50%}
  .lane-head .count{margin-left:auto;background:rgba(9,30,66,.09);border-radius:10px;padding:1px 9px;font-size:12px;color:#42526e}
  .card{background:#fff;border-radius:6px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(9,30,66,.15);cursor:grab;transition:.15s}
  .card:hover{box-shadow:0 4px 10px rgba(9,30,66,.2);transform:translateY(-1px)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card .title{font-size:14px;font-weight:500;line-height:1.5;margin-bottom:8px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;color:#fff}
  .card .meta{display:flex;align-items:center;gap:10px}
  .avatars{display:flex}
  .avatar{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-6px}
  .avatars .avatar:first-child{margin-left:0}
  .due{margin-left:auto;font-size:11px;color:#6b778c}
  .progress{height:5px;background:#ebecf0;border-radius:99px;margin-top:10px;overflow:hidden}
  .progress i{display:block;height:100%;border-radius:99px;background:#36b37e}
  .progress.mid i{background:#ff8b00}.progress.low i{background:#ff5630}
  .progress-text{font-size:11px;color:#6b778c;margin-top:4px;display:flex;justify-content:space-between}
  .empty-hint{font-size:12px;color:#97a0af;text-align:center;padding:20px 0}
  /* 子頁導覽 */
  .navlinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .navlinks a{font-size:13.5px;color:#42526e;text-decoration:none;font-weight:500;padding:7px 12px;border-radius:6px;transition:.15s}
  .navlinks a:hover{background:#ebecf0;color:#172b4d}
  .navlinks a.pri{background:#2684ff;color:#fff}
  .navlinks a.pri:hover{background:#1a6fdd;color:#fff}
  .dlink{display:inline-block;margin-top:10px;font-size:12.5px;color:#2684ff;text-decoration:none;font-weight:500}
  .dlink:hover{text-decoration:underline}
  @media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <a class="back-btn" href="../../index.html">← 返回入口</a>
  <div>
    <h1>億銓資訊 · 專案看板</h1>
    <div class="sub">ERP 系統升級專案 — Sprint 14（2026/08/17 – 08/28）</div>
  </div>
  <nav class="navlinks">
    <a href="members.html">成員</a>
    <a href="report.html">報表</a>
    <a href="new-task.html" class="pri">＋ 新增任務</a>
  </nav>
  <div class="overview">
    <span style="font-size:13px;color:#6b778c">專案總進度</span>
    <div class="bar"><i id="ovBar"></i></div>
    <span class="pct" id="ovPct">0%</span>
  </div>
</header>

<section class="kpis">
  <div class="kpi"><div class="label">本 Sprint 任務總數</div><div class="num" data-count="24">0</div><div class="trend up">▲ 較上週 +3</div></div>
  <div class="kpi"><div class="label">進行中任務</div><div class="num" data-count="7">0</div><div class="trend up">▲ 流速正常</div></div>
  <div class="kpi"><div class="label">逾期任務</div><div class="num" data-count="2">0</div><div class="trend down">▼ 需立即處理</div></div>
  <div class="kpi"><div class="label">Sprint 完成率</div><div class="num" data-count="62" data-suffix="%">0</div><div class="trend up">▲ 符合預期燃盡</div></div>
</section>

<main class="board" id="board"></main>

<script>
const TAGS = {
  frontend:{t:'前端',c:'#2684ff'}, backend:{t:'後端',c:'#36b37e'},
  design:{t:'設計',c:'#ff8b00'}, urgent:{t:'急件',c:'#ff5630'}, test:{t:'測試',c:'#8777d9'}
};
const MEMBERS = {
  '陳志豪':'#0052cc','林怡君':'#e774bb','王建明':'#00875a','黃雅婷':'#ff8b00',
  '張國華':'#6554c0','吳淑芬':'#00b8d9','李宗翰':'#ff5630'
};
const LANES = [
  {id:'todo', name:'待辦', dot:'#97a0af'},
  {id:'doing', name:'進行中', dot:'#2684ff'},
  {id:'review', name:'審核', dot:'#ff8b00'},
  {id:'done', name:'完成', dot:'#36b37e'}
];
const TASKS = [
  {id:1, lane:'todo', title:'使用者權限模組 — API 規格書撰寫', tags:['backend'], members:['陳志豪','林怡君'], due:'09/02', prog:0, hrs:'0 / 16h'},
  {id:2, lane:'todo', title:'報表匯出 Excel 格式異常修正', tags:['backend','urgent'], members:['王建明'], due:'08/30', prog:0, hrs:'0 / 8h'},
  {id:3, lane:'todo', title:'登入頁兩步驟驗證 UI 設計稿', tags:['design'], members:['黃雅婷'], due:'09/04', prog:0, hrs:'0 / 12h'},
  {id:4, lane:'todo', title:'庫存盤點批次作業效能優化', tags:['backend'], members:['張國華','李宗翰'], due:'09/08', prog:0, hrs:'0 / 24h'},
  {id:5, lane:'todo', title:'部門公告跑馬燈元件', tags:['frontend'], members:['吳淑芬'], due:'09/05', prog:0, hrs:'0 / 6h'},
  {id:6, lane:'doing', title:'訂單查詢頁篩選器重構（Vue3 組合式）', tags:['frontend'], members:['林怡君','吳淑芬'], due:'08/29', prog:65, hrs:'13 / 20h'},
  {id:7, lane:'doing', title:'電子簽核流程引擎 — 會簽邏輯實作', tags:['backend'], members:['陳志豪','張國華'], due:'09/01', prog:40, hrs:'16 / 40h'},
  {id:8, lane:'doing', title:'行動版儀表板 RWD 調整', tags:['frontend','design'], members:['黃雅婷'], due:'08/28', prog:80, hrs:'10 / 12h'},
  {id:9, lane:'doing', title:'資料庫索引健檢與慢查詢修正', tags:['backend','urgent'], members:['王建明'], due:'08/27', prog:55, hrs:'11 / 20h'},
  {id:10, lane:'doing', title:'單元測試覆蓋率提升至 70%', tags:['test'], members:['李宗翰'], due:'09/03', prog:30, hrs:'9 / 30h'},
  {id:11, lane:'review', title:'請購單多幣別換算功能', tags:['frontend','backend'], members:['陳志豪','林怡君'], due:'08/26', prog:100, hrs:'18 / 18h'},
  {id:12, lane:'review', title:'密碼政策強化（90 天強制變更）', tags:['backend','urgent'], members:['王建明'], due:'08/25', prog:100, hrs:'8 / 8h'},
  {id:13, lane:'review', title:'系統公告 Email 樣板更新', tags:['design'], members:['黃雅婷'], due:'08/27', prog:100, hrs:'5 / 5h'},
  {id:14, lane:'done', title:'組織架構樹拖曳排序', tags:['frontend'], members:['吳淑芬','林怡君'], due:'08/21', prog:100, hrs:'14 / 14h'},
  {id:15, lane:'done', title:'LDAP 帳號同步排程', tags:['backend'], members:['張國華'], due:'08/20', prog:100, hrs:'16 / 16h'},
  {id:16, lane:'done', title:'首頁 KPI 卡片載入骨架屏', tags:['frontend','design'], members:['黃雅婷'], due:'08/19', prog:100, hrs:'7 / 7h'},
  {id:17, lane:'done', title:'操作日誌稽核查詢介面', tags:['backend','test'], members:['陳志豪','李宗翰'], due:'08/22', prog:100, hrs:'20 / 20h'}
];

const board = document.getElementById('board');
function render(){
  board.innerHTML = '';
  LANES.forEach(lane=>{
    const tasks = TASKS.filter(t=>t.lane===lane.id);
    const el = document.createElement('div');
    el.className = 'lane';
    el.dataset.lane = lane.id;
    el.innerHTML = `<div class="lane-head"><span class="dot" style="background:${lane.dot}"></span>${lane.name}<span class="count">${tasks.length}</span></div>`;
    tasks.forEach(t=>{
      const pcls = t.prog<34?'low':(t.prog<80?'mid':'');
      const card = document.createElement('div');
      card.className='card'; card.draggable = true; card.dataset.id=t.id;
      card.innerHTML = `
        <div class="title">${t.title}</div>
        <div class="tags">${t.tags.map(k=>`<span class="tag" style="background:${TAGS[k].c}">${TAGS[k].t}</span>`).join('')}</div>
        <div class="meta">
          <div class="avatars">${t.members.map(m=>`<span class="avatar" style="background:${MEMBERS[m]}" title="${m}">${m[0]}</span>`).join('')}</div>
          <span class="due">📅 ${t.due}</span>
        </div>
        <div class="progress ${pcls}"><i style="width:${t.prog}%"></i></div>
        <div class="progress-text"><span>工時 ${t.hrs}</span><span>${t.prog}%</span></div>
        <a class="dlink" href="task.html" draggable="false">詳情 →</a>`;
      card.addEventListener('dragstart', e=>{ card.classList.add('dragging'); e.dataTransfer.setData('text/plain', t.id); });
      card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
      el.appendChild(card);
    });
    if(!tasks.length){ const h=document.createElement('div'); h.className='empty-hint'; h.textContent='拖曳卡片至此'; el.appendChild(h); }
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('dragover'));
    el.addEventListener('drop', e=>{
      e.preventDefault(); el.classList.remove('dragover');
      const id = +e.dataTransfer.getData('text/plain');
      const task = TASKS.find(x=>x.id===id);
      if(task && task.lane!==lane.id){ task.lane = lane.id; render(); }
    });
    board.appendChild(el);
  });
  const done = TASKS.filter(t=>t.lane==='done').length;
  const pct = Math.round(done/TASKS.length*100);
  document.getElementById('ovBar').style.width = pct+'%';
  document.getElementById('ovPct').textContent = pct+'%';
}
render();

document.querySelectorAll('.num').forEach(el=>{
  const target = +el.dataset.count, suffix = el.dataset.suffix||'';
  let cur = 0; const step = Math.max(1, Math.ceil(target/40));
  const tick = ()=>{ cur = Math.min(target, cur+step); el.textContent = cur+suffix; if(cur<target) requestAnimationFrame(tick); };
  tick();
});
</script>
</body>
</html>
