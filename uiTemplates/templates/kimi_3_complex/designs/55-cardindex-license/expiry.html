<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>到期提醒 · 索引卡盒證照核發管理</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f5efdd; --wood:#8a6b4a; --wood-dark:#6d5238;
  --tab:#e7d9b8; --tab-ink:#7a5a34;
  --review:#b98a2e; --issued:#4d7c5a; --expire:#b3402a;
  --ink:#4a3a28;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#cbb28e;
  background-image:
    repeating-linear-gradient(90deg, rgba(109,82,56,.06) 0 2px, transparent 2px 90px),
    linear-gradient(180deg, #d6bf9c, #c2a87f);
  font-family:'Noto Serif TC','Courier Prime',serif;
  color:var(--ink);min-height:100vh;padding-bottom:60px;
}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:
    repeating-linear-gradient(95deg, rgba(0,0,0,.05) 0 3px, transparent 3px 14px),
    linear-gradient(180deg, var(--wood), var(--wood-dark));
  padding:14px 26px;
  box-shadow:0 4px 14px rgba(60,40,20,.4);
  border-bottom:3px solid #523d27;
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--ink);font-weight:700;letter-spacing:2px;font-size:14px;
  background:var(--ivory);border:2px solid #523d27;border-radius:4px;
  padding:7px 15px;box-shadow:0 3px 0 #523d27;
  transition:transform .12s, box-shadow .12s;
}
.back-link:hover{transform:translateY(1px);box-shadow:0 2px 0 #523d27;}
.back-link.nav{background:var(--tab);font-size:12px;padding:6px 12px;}
.topbar h1{color:var(--ivory);font-size:20px;letter-spacing:6px;text-shadow:0 2px 3px rgba(0,0,0,.35);}
.topbar .sub{color:rgba(245,239,221,.7);font-size:12px;letter-spacing:3px;}
.topbar .stats{margin-left:auto;display:flex;gap:18px;font-size:12px;letter-spacing:2px;color:var(--ivory);}
.topbar .stats b{font-family:'Courier Prime',monospace;font-size:16px;}

.main{max-width:960px;margin:34px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:22px;}

/* 天數分組摘要 */
.day-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
.dcard{
  background:var(--ivory);border:1.5px solid #c9b98f;border-radius:6px;
  box-shadow:0 6px 14px rgba(60,40,20,.3);
  padding:16px;text-align:center;cursor:pointer;
  transition:transform .18s, box-shadow .18s;position:relative;
}
.dcard:hover{transform:translateY(-6px);box-shadow:0 12px 22px rgba(60,40,20,.4);}
.dcard.sel{border:2px solid var(--expire);box-shadow:0 8px 18px rgba(179,64,42,.35);}
.dcard .dn{font-family:'Courier Prime',monospace;font-size:30px;font-weight:700;}
.dcard.d30 .dn{color:var(--expire);}
.dcard.d60 .dn{color:var(--review);}
.dcard.d90 .dn{color:var(--wood-dark);}
.dcard .dc{font-size:12px;letter-spacing:3px;color:#7a5a34;margin-top:4px;}
.dcard .dnote{font-size:11px;color:#9a8763;letter-spacing:1px;margin-top:6px;}

.panel{
  background:var(--ivory);border:1.5px solid #c9b98f;border-radius:6px;
  box-shadow:0 6px 16px rgba(60,40,20,.3);padding:20px 24px;
}
.panel h2{
  font-size:15px;letter-spacing:4px;border-bottom:2px solid var(--ink);
  padding-bottom:8px;margin-bottom:12px;
  font-family:'Courier Prime','Noto Serif TC',monospace;
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;
}
.panel h2 .cnt{font-size:11px;color:#9a8763;letter-spacing:2px;}

/* 將到期清單 */
.ex-item{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 14px;border-bottom:1px dashed #c9b98f;
  border-left:8px solid var(--expire);background:rgba(245,239,221,.6);
  margin-bottom:8px;border-radius:4px;
  transition:transform .18s, box-shadow .18s;
}
.ex-item:hover{transform:translateY(-4px);box-shadow:0 8px 14px rgba(60,40,20,.25);}
.ex-item.w60{border-left-color:var(--review);}
.ex-item.w90{border-left-color:var(--wood-dark);}
.ex-item .ex-name{font-size:16px;font-weight:700;letter-spacing:2px;min-width:90px;}
.ex-item .ex-type{font-size:13px;color:#7a5a34;letter-spacing:1px;flex:1;min-width:150px;}
.ex-item .ex-date{font-family:'Courier Prime',monospace;font-size:13px;}
.ex-item .ex-days{
  font-family:'Courier Prime',monospace;font-weight:700;font-size:13px;
  padding:3px 10px;border-radius:3px;color:#fff;background:var(--expire);white-space:nowrap;
  animation:expirePulse 2s ease-in-out infinite;
}
.ex-item.w60 .ex-days{background:var(--review);animation:none;}
.ex-item.w90 .ex-days{background:var(--wood-dark);animation:none;}
@keyframes expirePulse{50%{box-shadow:0 0 10px rgba(179,64,42,.7);}}
.ex-item .op{
  font-family:'Courier Prime','Noto Serif TC',monospace;font-size:13px;font-weight:700;
  color:var(--expire);text-decoration:underline dotted;white-space:nowrap;
}
.ex-item .op:hover{color:#8c2f1e;}
.ex-item.hide{display:none;}
.empty-tip{text-align:center;padding:26px;color:#9a8763;letter-spacing:4px;display:none;}

/* 發送紀錄 */
table{width:100%;border-collapse:collapse;font-size:14px;}
th{
  text-align:left;font-family:'Courier Prime','Noto Serif TC',monospace;
  font-size:12px;letter-spacing:2px;color:#7a5a34;
  border-bottom:2px solid #b49b6d;padding:8px 8px;
}
td{padding:10px 8px;border-bottom:1px dashed #c9b98f;}
.mono{font-family:'Courier Prime',monospace;font-size:13px;}
.stag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;padding:2px 10px;border-radius:3px;color:#fff;}
.stag.sent{background:var(--issued);}
.stag.sched{background:var(--review);}

/* 一鍵提醒 */
.btn-remind{
  cursor:pointer;font-family:inherit;
  background:var(--expire);color:var(--ivory);border:2px solid #523d27;
  font-size:13px;font-weight:700;letter-spacing:3px;
  padding:8px 20px;border-radius:4px;box-shadow:0 3px 0 #523d27;
  transition:transform .12s, box-shadow .12s;
}
.btn-remind:hover{transform:translateY(1px);box-shadow:0 2px 0 #523d27;}
.btn-remind:disabled{opacity:.55;}
.remind-msg{font-size:13px;letter-spacing:2px;color:var(--issued);font-weight:700;margin-top:10px;min-height:18px;}
@media (max-width:680px){.topbar .stats{display:none;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <h1>到期提醒</h1>
  <span class="sub">紅邊卡巡匣作業</span>
  <a class="back-link nav" href="list.html">證照列表</a>
  <a class="back-link nav" href="form.html">新增申請</a>
  <div class="stats"><span>將到期 <b>4</b> 張</span></div>
</div>

<div class="main">
  <div class="day-row" id="dayRow">
    <div class="dcard d30 sel" data-days="30"><div class="dn">30</div><div class="dc">日內屆期</div><div class="dnote">紅色急件 ・ 每週巡匣</div></div>
    <div class="dcard d60" data-days="60"><div class="dn">60</div><div class="dc">日內屆期</div><div class="dnote">琥珀追蹤 ・ 每月巡匣</div></div>
    <div class="dcard d90" data-days="90"><div class="dn">90</div><div class="dc">日內屆期</div><div class="dnote">例行提醒 ・ 換發窗口期</div></div>
  </div>

  <div class="panel">
    <h2>▍將到期卡片 <span class="cnt" id="cntTip"></span></h2>
    <div id="exList"></div>
    <div class="empty-tip" id="emptyTip">─ 此區間無將到期卡片 ─</div>
    <div style="margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
      <button type="button" class="btn-remind" id="btnAll">◈ 對目前清單全數寄發提醒</button>
      <span style="font-size:12px;color:#9a8763;letter-spacing:2px;">寄發管道：掛號信 ＋ 電子郵件（依卡面通訊資料）</span>
    </div>
    <div class="remind-msg" id="remindMsg"></div>
  </div>

  <div class="panel">
    <h2>▍提醒發送紀錄</h2>
    <table>
      <thead><tr><th>發送時間</th><th>對象</th><th>證照類別</th><th>管道</th><th>狀態</th></tr></thead>
      <tbody id="logBody">
        <tr><td class="mono">115-08-15 09:00</td><td>林佳穎</td><td>升降機裝修技術士</td><td>掛號＋電郵</td><td><span class="stag sent">已送達</span></td></tr>
        <tr><td class="mono">115-08-15 09:00</td><td>蔡佩珊</td><td>用電設備檢驗員</td><td>掛號＋電郵</td><td><span class="stag sent">已送達</span></td></tr>
        <tr><td class="mono">115-09-01 09:00</td><td>林佳穎</td><td>升降機裝修技術士</td><td>掛號＋電郵</td><td><span class="stag sched">已排程</span></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
/* 將到期資料（以 115-08-28 為基準日） */
const expiring = [
  {name:'林佳穎', type:'升降機裝修技術士',   expire:'115-12-04', days:98,  band:90},
  {name:'蔡佩珊', type:'用電設備檢驗員',     expire:'116-09-01', days:368, band:90},
  {name:'何淑芬', type:'職業安全衛生管理員', expire:'117-06-24', days:300, band:90},
  {name:'張文彬', type:'冷凍空調技術士',     expire:'117-03-13', days:197, band:60}
];
/* 依選擇區間換算展示（示範資料以相對級距歸組） */
const exList = document.getElementById('exList');
expiring.forEach(function(x){
  const div = document.createElement('div');
  div.className = 'ex-item w' + x.band;
  div.dataset.band = x.band;
  div.innerHTML =
    '<span class="ex-name"></span><span class="ex-type"></span>' +
    '<span class="ex-date">屆期 ' + x.expire + '</span>' +
    '<span class="ex-days">剩 ' + x.days + ' 日</span>' +
    '<a class="op" href="detail.html">抽卡詳閱 ▸</a>';
  div.querySelector('.ex-name').textContent = x.name;
  div.querySelector('.ex-type').textContent = x.type;
  exList.appendChild(div);
});

/* 天數卡篩選 */
let currentBand = 30;
function applyBand(){
  let n = 0;
  exList.querySelectorAll('.ex-item').forEach(function(it){
    /* 30 日內僅顯示真正急件（示範資料無 30 日內者，提示空匣）；60/90 顯示對應級距 */
    const show = String(currentBand) === it.dataset.band;
    it.classList.toggle('hide', !show);
    if (show) n++;
  });
  document.getElementById('cntTip').textContent = '巡得 ' + n + ' 張';
  document.getElementById('emptyTip').style.display = n ? 'none' : 'block';
  document.getElementById('remindMsg').textContent = '';
}
document.querySelectorAll('.dcard').forEach(function(card){
  card.addEventListener('click', function(){
    document.querySelectorAll('.dcard').forEach(function(c){ c.classList.remove('sel'); });
    card.classList.add('sel');
    currentBand = +card.dataset.days;
    applyBand();
  });
});
applyBand();

/* 一鍵寄發提醒 */
document.getElementById('btnAll').addEventListener('click', function(){
  const btn = this;
  const visible = Array.from(exList.querySelectorAll('.ex-item')).filter(function(it){return !it.classList.contains('hide');});
  const msg = document.getElementById('remindMsg');
  if (!visible.length){ msg.textContent = '※ 目前清單為空，無需寄發'; return; }
  btn.disabled = true;
  btn.textContent = '繕打通知中…';
  setTimeout(function(){
    btn.disabled = false;
    btn.textContent = '◈ 對目前清單全數寄發提醒';
    msg.textContent = '✓ 已寄發 ' + visible.length + ' 封提醒（115-08-28 ' + new Date().toTimeString().substr(0,5) + '）';
    /* 寫入紀錄 */
    const tbody = document.getElementById('logBody');
    visible.forEach(function(it){
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="mono">115-08-28 ' + new Date().toTimeString().substr(0,5) + '</td>' +
        '<td></td><td></td><td>掛號＋電郵</td>' +
        '<td><span class="stag sent">已送達</span></td>';
      tr.children[1].textContent = it.querySelector('.ex-name').textContent;
      tr.children[2].textContent = it.querySelector('.ex-type').textContent;
      tbody.prepend(tr);
    });
  }, 1000);
});
</script>
</body>
</html>
