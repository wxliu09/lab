<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>證照列表 · 索引卡盒證照核發管理</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f5efdd; --wood:#8a6b4a; --wood-dark:#6d5238;
  --tab:#e7d9b8; --tab-ink:#7a5a34;
  --review:#b98a2e; --issued:#4d7c5a; --expire:#b3402a;
  --ink:#4a3a28;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#cbb28e;
  background-image:
    repeating-linear-gradient(90deg, rgba(109,82,56,.06) 0 2px, transparent 2px 90px),
    linear-gradient(180deg, #d6bf9c, #c2a87f);
  font-family:'Noto Serif TC','Courier Prime',serif;
  color:var(--ink);min-height:100vh;padding-bottom:60px;
}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:
    repeating-linear-gradient(95deg, rgba(0,0,0,.05) 0 3px, transparent 3px 14px),
    linear-gradient(180deg, var(--wood), var(--wood-dark));
  padding:14px 26px;
  box-shadow:0 4px 14px rgba(60,40,20,.4);
  border-bottom:3px solid #523d27;
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--ink);font-weight:700;letter-spacing:2px;font-size:14px;
  background:var(--ivory);border:2px solid #523d27;border-radius:4px;
  padding:7px 15px;box-shadow:0 3px 0 #523d27;
  transition:transform .12s, box-shadow .12s;
}
.back-link:hover{transform:translateY(1px);box-shadow:0 2px 0 #523d27;}
.back-link.nav{background:var(--tab);font-size:12px;padding:6px 12px;}
.topbar h1{color:var(--ivory);font-size:20px;letter-spacing:6px;text-shadow:0 2px 3px rgba(0,0,0,.35);}
.topbar .sub{color:rgba(245,239,221,.7);font-size:12px;letter-spacing:3px;}
.topbar .stats{margin-left:auto;display:flex;gap:18px;font-size:12px;letter-spacing:2px;color:var(--ivory);}
.topbar .stats b{font-family:'Courier Prime',monospace;font-size:16px;}

.box-wrap{max-width:1080px;margin:34px auto 0;padding:0 20px;}
.cardbox{
  background:
    repeating-linear-gradient(95deg, rgba(0,0,0,.04) 0 3px, transparent 3px 16px),
    linear-gradient(180deg, #9a7a55, var(--wood));
  border:3px solid #523d27;border-radius:10px;
  box-shadow:0 14px 34px rgba(60,40,20,.45), inset 0 2px 0 rgba(255,255,255,.2);
  padding:0 22px 26px;
}
.tabs{display:flex;gap:5px;padding:0 10px;flex-wrap:wrap;}
.atab{
  margin-top:-2px;
  font-family:'Courier Prime',monospace;font-weight:700;font-size:15px;color:var(--tab-ink);
  background:linear-gradient(180deg, #f3e8cc, var(--tab));
  border:2px solid #b49b6d;border-bottom:none;border-radius:8px 8px 0 0;
  padding:8px 13px 10px;cursor:pointer;user-select:none;
  box-shadow:0 -2px 5px rgba(60,40,20,.18);
  transform:translateY(-8px);transition:transform .15s, background .15s;
}
.atab:hover{transform:translateY(-12px);}
.atab.active{transform:translateY(-2px);background:linear-gradient(180deg, #fff8e6, var(--ivory));color:var(--ink);}
.atab .cnt{font-size:10px;vertical-align:super;margin-left:2px;}
.box-inner{
  background:linear-gradient(180deg, #efe3c8, #e8dab9);
  border:2px solid #b49b6d;border-radius:0 8px 8px 8px;
  box-shadow:inset 0 3px 10px rgba(60,40,20,.2);
  padding:22px;min-height:280px;
}

/* 篩選列 */
.filter-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px;letter-spacing:2px;}
.filter-bar select,.filter-bar input{
  font-family:'Courier Prime','Noto Serif TC',monospace;font-size:13px;color:var(--ink);
  background:var(--ivory);border:1.5px solid #b49b6d;border-radius:4px;
  padding:6px 10px;outline:none;
}
.filter-bar input{min-width:200px;}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--wood);box-shadow:0 0 0 2px rgba(138,107,74,.2);}
.filter-bar .cnt{margin-left:auto;font-family:'Courier Prime',monospace;font-size:12px;color:#7a5a34;letter-spacing:2px;}

/* 清單表 */
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--ivory);border:1.5px solid #c9b98f;border-radius:4px;overflow:hidden;}
th{
  text-align:left;font-family:'Courier Prime','Noto Serif TC',monospace;
  font-size:12px;letter-spacing:2px;color:#7a5a34;
  background:#efe3c8;border-bottom:2px solid #b49b6d;padding:9px 10px;
}
td{padding:10px;border-bottom:1px dashed #c9b98f;}
tbody tr{transition:background .15s, transform .15s;}
tbody tr:hover{background:rgba(138,107,74,.08);}
tr.hide{display:none;}
.mono{font-family:'Courier Prime',monospace;font-size:13px;}
.stag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;
  padding:2px 10px;border-radius:3px;color:#fff;white-space:nowrap;
}
.stag.review{background:var(--review);}
.stag.issued{background:var(--issued);}
.stag.expire{background:var(--expire);animation:expirePulse 2s ease-in-out infinite;}
@keyframes expirePulse{50%{box-shadow:0 0 10px rgba(179,64,42,.7);}}
.op{
  font-family:'Courier Prime','Noto Serif TC',monospace;font-size:13px;font-weight:700;
  color:var(--expire);text-decoration:underline dotted;white-space:nowrap;
}
.op:hover{color:#8c2f1e;background:rgba(179,64,42,.08);}
.empty-tip{text-align:center;padding:40px 0;color:#9a8763;letter-spacing:4px;font-size:14px;display:none;}
@media (max-width:680px){.topbar .stats{display:none;}.filter-bar input{min-width:130px;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <h1>證照列表</h1>
  <span class="sub">建設局職業證照股</span>
  <a class="back-link nav" href="form.html">新增申請</a>
  <a class="back-link nav" href="expiry.html">到期提醒</a>
  <div class="stats">
    <span>清單筆數 <b id="stTotal">0</b></span>
  </div>
</div>

<div class="box-wrap">
  <div class="cardbox">
    <div class="tabs" id="tabs"></div>
    <div class="box-inner">
      <div class="filter-bar">
        狀態：
        <select id="fState">
          <option value="all">全部</option>
          <option value="issued">已核發</option>
          <option value="review">審核中</option>
          <option value="expire">將到期</option>
        </select>
        類別：
        <select id="fType">
          <option value="all">全部</option>
          <option>室內配線技術士</option>
          <option>冷凍空調技術士</option>
          <option>升降機裝修技術士</option>
          <option>用電設備檢驗員</option>
          <option>職業安全衛生管理員</option>
        </select>
        關鍵字：<input type="text" id="fKw" placeholder="姓名或卡號…">
        <span class="cnt" id="cntTip"></span>
      </div>
      <table>
        <thead>
          <tr><th>卡號</th><th>姓名</th><th>證照類別</th><th>核發日期</th><th>有效期限</th><th>狀態</th><th>操作</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty-tip" id="emptyTip">─ 此篩選條件下無卡片 ─</div>
    </div>
  </div>
</div>

<script>
const licenses = [
  {no:101, name:'陳志豪', key:'C', type:'室內配線技術士',    issue:'113-04-18', expire:'118-04-17', st:'issued', stTxt:'已核發'},
  {no:102, name:'蔡佩珊', key:'C', type:'用電設備檢驗員',    issue:'111-09-02', expire:'116-09-01', st:'expire', stTxt:'將到期'},
  {no:103, name:'黃國棟', key:'H', type:'冷凍空調技術士',    issue:'115-08-11', expire:'120-08-10', st:'review', stTxt:'審核中'},
  {no:104, name:'何淑芬', key:'H', type:'職業安全衛生管理員', issue:'112-06-25', expire:'117-06-24', st:'issued', stTxt:'已核發'},
  {no:105, name:'林佳穎', key:'L', type:'升降機裝修技術士',  issue:'110-12-05', expire:'115-12-04', st:'expire', stTxt:'將到期'},
  {no:106, name:'李俊賢', key:'L', type:'室內配線技術士',    issue:'114-02-20', expire:'119-02-19', st:'issued', stTxt:'已核發'},
  {no:107, name:'吳明達', key:'W', type:'用電設備檢驗員',    issue:'115-08-22', expire:'120-08-21', st:'review', stTxt:'審核中'},
  {no:108, name:'王雅婷', key:'W', type:'職業安全衛生管理員', issue:'113-10-30', expire:'118-10-29', st:'issued', stTxt:'已核發'},
  {no:109, name:'張文彬', key:'Z', type:'冷凍空調技術士',    issue:'112-03-14', expire:'117-03-13', st:'issued', stTxt:'已核發'},
  {no:110, name:'周曉菁', key:'Z', type:'升降機裝修技術士',  issue:'115-08-26', expire:'120-08-25', st:'review', stTxt:'審核中'}
];
let currentKey = 'ALL';
const tabsEl = document.getElementById('tabs');
const tbody = document.getElementById('tbody');

function buildTabs(){
  const keys = ['ALL'].concat(Array.from(new Set(licenses.map(function(x){return x.key;}))).sort());
  tabsEl.innerHTML = '';
  keys.forEach(function(k){
    const n = k === 'ALL' ? licenses.length : licenses.filter(function(x){return x.key===k;}).length;
    const t = document.createElement('span');
    t.className = 'atab' + (k === currentKey ? ' active' : '');
    t.innerHTML = (k === 'ALL' ? '全' : k) + '<span class="cnt">' + n + '</span>';
    t.addEventListener('click', function(){
      currentKey = k;
      buildTabs();
      apply();
    });
    tabsEl.appendChild(t);
  });
}

licenses.forEach(function(x){
  const tr = document.createElement('tr');
  tr.dataset.key = x.key;
  tr.dataset.st = x.st;
  tr.dataset.type = x.type;
  tr.innerHTML =
    '<td class="mono">NO.' + x.no + '</td><td class="c-name"></td><td></td>' +
    '<td class="mono">' + x.issue + '</td><td class="mono">' + x.expire + '</td>' +
    '<td><span class="stag ' + x.st + '">' + x.stTxt + '</span></td>' +
    '<td><a class="op" href="detail.html">抽卡詳閱 ▸</a></td>';
  tr.children[1].textContent = x.name;
  tr.children[2].textContent = x.type;
  tbody.appendChild(tr);
});
document.getElementById('stTotal').textContent = licenses.length;

const fState = document.getElementById('fState');
const fType = document.getElementById('fType');
const fKw = document.getElementById('fKw');
function apply(){
  const sv = fState.value, tv = fType.value, kw = fKw.value.trim();
  let n = 0;
  tbody.querySelectorAll('tr').forEach(function(tr){
    const show =
      (currentKey === 'ALL' || tr.dataset.key === currentKey) &&
      (sv === 'all' || tr.dataset.st === sv) &&
      (tv === 'all' || tr.dataset.type === tv) &&
      (!kw || tr.textContent.indexOf(kw) !== -1);
    tr.classList.toggle('hide', !show);
    if (show) n++;
  });
  document.getElementById('cntTip').textContent = '抽得 ' + n + ' 張卡片';
  document.getElementById('emptyTip').style.display = n ? 'none' : 'block';
}
fState.addEventListener('change', apply);
fType.addEventListener('change', apply);
fKw.addEventListener('input', apply);
buildTabs();
apply();
</script>
</body>
</html>
