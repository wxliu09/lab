<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════════════
  【設計規格】索引卡盒·證照核發管理 (55-cardindex-license.html)
  ─────────────────────────────────────────────────────────────────────────────
  ■ 風格定位：圖書館舊式卡片目錄櫃——木質卡盒、凸出的字母分隔片、
      象牙白索引卡；證照資料像一張張可抽出的索引卡。
  ■ 配色（附色碼）：
      象牙白 #f5efdd（索引卡）
      木框 #8a6b4a（卡片盒），深木紋 #6d5238
      字母片標籤 #e7d9b8，字母 #7a5a34
      審核中 #b98a2e（琥珀）、已核發 #4d7c5a（墨綠）、將到期 #b3402a（磚紅）
      文字 #4a3a28
  ■ 字體：'Noto Serif TC'（中文）、'Courier Prime'（卡面打字英數）
  ■ 版面結構：頂部木紋標題列（返回＋標題）→ 木框卡盒：
      上緣凸出 A–Z 字母分隔片 → 盒內索引卡格網（卡片左緣狀態色條、
      將到期紅邊卡）→ 底部新增申請小表單（收納抽屜式展開）。
  ■ 動態效果：
      1. 點字母片：該片下沉（壓下感），卡片以「抽出—翻回」動畫篩選。
      2. 卡片 hover 向上抽出 8px（translateY）如從卡盒抽出。
      3. 新增申請送出後，新卡自下方滑入卡盒。
      4. 將到期卡片紅邊呼吸閃爍。
  ■ 返回入口：頂部木紋標題列左側「← 返回入口」連結（../../index.html）。
  ═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>索引卡盒 · 證照核發管理</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f5efdd;
  --wood:#8a6b4a;
  --wood-dark:#6d5238;
  --tab:#e7d9b8;
  --tab-ink:#7a5a34;
  --review:#b98a2e;
  --issued:#4d7c5a;
  --expire:#b3402a;
  --ink:#4a3a28;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#cbb28e;
  background-image:
    repeating-linear-gradient(90deg, rgba(109,82,56,.06) 0 2px, transparent 2px 90px),
    linear-gradient(180deg, #d6bf9c, #c2a87f);
  font-family:'Noto Serif TC','Courier Prime',serif;
  color:var(--ink);
  min-height:100vh;
  padding-bottom:60px;
}

/* ── 頂部木紋列 ── */
.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:
    repeating-linear-gradient(95deg, rgba(0,0,0,.05) 0 3px, transparent 3px 14px),
    linear-gradient(180deg, var(--wood), var(--wood-dark));
  padding:14px 26px;
  box-shadow:0 4px 14px rgba(60,40,20,.4);
  border-bottom:3px solid #523d27;
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--ink);font-weight:700;letter-spacing:2px;font-size:14px;
  background:var(--ivory);
  border:2px solid #523d27;border-radius:4px;
  padding:7px 15px;
  box-shadow:0 3px 0 #523d27;
  transition:transform .12s, box-shadow .12s;
}
.back-link:hover{transform:translateY(1px);box-shadow:0 2px 0 #523d27;}
.back-link.nav{background:var(--tab);font-size:12px;padding:6px 12px;}
.card-op{
  font-family:'Courier Prime','Noto Serif TC',monospace;font-size:12px;font-weight:700;
  color:var(--expire);text-decoration:underline dotted;white-space:nowrap;
  margin-left:10px;cursor:pointer;
}
.card-op:hover{color:#8c2f1e;}
.stats a{color:var(--ivory);text-decoration:none;border-bottom:1px dashed rgba(245,239,221,.5);}
.stats a:hover{border-bottom-style:solid;}
.topbar h1{
  color:var(--ivory);font-size:20px;letter-spacing:6px;
  text-shadow:0 2px 3px rgba(0,0,0,.35);
}
.topbar .sub{color:rgba(245,239,221,.7);font-size:12px;letter-spacing:3px;}
.topbar .stats{
  margin-left:auto;display:flex;gap:18px;font-size:12px;letter-spacing:2px;
  color:var(--ivory);
}
.topbar .stats b{font-family:'Courier Prime',monospace;font-size:16px;}

/* ── 卡盒 ── */
.box-wrap{max-width:1080px;margin:34px auto 0;padding:0 20px;}
.cardbox{
  background:
    repeating-linear-gradient(95deg, rgba(0,0,0,.04) 0 3px, transparent 3px 16px),
    linear-gradient(180deg, #9a7a55, var(--wood));
  border:3px solid #523d27;
  border-radius:10px;
  box-shadow:0 14px 34px rgba(60,40,20,.45), inset 0 2px 0 rgba(255,255,255,.2);
  padding:0 22px 26px;
}
/* 字母分隔片 */
.tabs{
  display:flex;gap:5px;padding:0 10px;flex-wrap:wrap;
}
.atab{
  margin-top:-2px;
  font-family:'Courier Prime',monospace;font-weight:700;font-size:15px;
  color:var(--tab-ink);
  background:linear-gradient(180deg, #f3e8cc, var(--tab));
  border:2px solid #b49b6d;border-bottom:none;
  border-radius:8px 8px 0 0;
  padding:8px 13px 10px;cursor:pointer;user-select:none;
  box-shadow:0 -2px 5px rgba(60,40,20,.18);
  transform:translateY(-8px);
  transition:transform .15s, background .15s;
}
.atab:hover{transform:translateY(-12px);}
.atab.active{
  transform:translateY(-2px);
  background:linear-gradient(180deg, #fff8e6, var(--ivory));
  color:var(--ink);
}
.atab .cnt{font-size:10px;vertical-align:super;margin-left:2px;}

/* 盒內 */
.box-inner{
  background:linear-gradient(180deg, #efe3c8, #e8dab9);
  border:2px solid #b49b6d;border-radius:0 8px 8px 8px;
  box-shadow:inset 0 3px 10px rgba(60,40,20,.2);
  padding:22px;
  min-height:280px;
}
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;
}
.icard{
  background:var(--ivory);
  background-image:repeating-linear-gradient(transparent 0 26px, rgba(74,58,40,.08) 26px 27px);
  border:1.5px solid #c9b98f;
  border-left:8px solid var(--issued);
  border-radius:4px;
  box-shadow:0 3px 8px rgba(60,40,20,.25);
  padding:14px 16px 12px;
  position:relative;
  transition:transform .22s ease, box-shadow .22s ease;
  cursor:default;
}
.icard:hover{
  transform:translateY(-8px);
  box-shadow:0 12px 20px rgba(60,40,20,.35);
}
.icard.st-review{border-left-color:var(--review);}
.icard.st-issued{border-left-color:var(--issued);}
.icard.st-expire{
  border-left-color:var(--expire);
  border-top-color:var(--expire);border-right-color:var(--expire);border-bottom-color:var(--expire);
  animation:expirePulse 2s ease-in-out infinite;
}
@keyframes expirePulse{
  0%,100%{box-shadow:0 3px 8px rgba(60,40,20,.25);}
  50%{box-shadow:0 3px 14px rgba(179,64,42,.55);}
}
.icard.pop-in{animation:popIn .5s cubic-bezier(.3,1.4,.4,1);}
@keyframes popIn{
  0%{transform:translateY(36px);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
.icard.pop-out{animation:popOut .25s ease forwards;}
@keyframes popOut{
  to{transform:translateY(-26px) rotate(-1.5deg);opacity:0;}
}
.icard .cname{
  font-size:17px;font-weight:700;letter-spacing:2px;
  border-bottom:1.5px solid rgba(74,58,40,.35);padding-bottom:6px;
  display:flex;justify-content:space-between;align-items:baseline;
}
.icard .cname .eno{
  font-family:'Courier Prime',monospace;font-size:11px;color:#9a8763;letter-spacing:1px;
}
.icard .crow{
  display:flex;justify-content:space-between;gap:10px;
  font-size:13px;letter-spacing:1px;margin-top:8px;
}
.icard .crow .k{color:#9a8763;font-size:12px;letter-spacing:2px;}
.icard .crow .v{font-family:'Courier Prime','Noto Serif TC',monospace;font-weight:700;}
.stag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;
  padding:2px 10px;border-radius:3px;margin-top:10px;color:#fff;
}
.stag.review{background:var(--review);}
.stag.issued{background:var(--issued);}
.stag.expire{background:var(--expire);}
.empty-tip{
  text-align:center;padding:40px 0;color:#9a8763;
  letter-spacing:4px;font-size:14px;display:none;
}

/* ── 新增申請抽屜 ── */
.drawer-wrap{max-width:1080px;margin:22px auto 0;padding:0 20px;}
.drawer-toggle{
  width:100%;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg, var(--wood), var(--wood-dark));
  color:var(--ivory);border:3px solid #523d27;border-radius:8px;
  font-size:15px;font-weight:700;letter-spacing:5px;padding:12px 0;
  box-shadow:0 5px 14px rgba(60,40,20,.4);
  transition:filter .15s;
}
.drawer-toggle:hover{filter:brightness(1.1);}
.drawer{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .5s cubic-bezier(.3,.9,.3,1), opacity .35s;
}
.drawer.open{max-height:400px;opacity:1;}
.drawer-inner{
  margin-top:14px;
  background:var(--ivory);border:2px solid #b49b6d;border-radius:6px;
  box-shadow:0 6px 16px rgba(60,40,20,.3);
  padding:20px 24px;
}
.drawer-inner h3{font-size:15px;letter-spacing:4px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:14px;}
.nform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px;}
.nf label{display:block;font-size:12px;letter-spacing:2px;color:#9a8763;margin-bottom:4px;}
.nf input,.nf select{
  width:100%;font-family:'Courier Prime','Noto Serif TC',monospace;
  font-size:14px;color:var(--ink);
  background:transparent;border:none;border-bottom:2px solid #c9b98f;
  padding:6px 2px;outline:none;
}
.nf input:focus,.nf select:focus{border-bottom-color:var(--wood);}
.nf .err{font-size:11px;color:var(--expire);min-height:15px;margin-top:2px;}
.nf-actions{grid-column:1/-1;display:flex;align-items:center;gap:16px;}
.btn-add{
  cursor:pointer;font-family:inherit;
  background:var(--wood-dark);color:var(--ivory);border:2px solid #523d27;
  font-size:14px;font-weight:700;letter-spacing:4px;
  padding:10px 26px;border-radius:4px;
  box-shadow:0 3px 0 #523d27;
  transition:transform .12s, box-shadow .12s;
}
.btn-add:hover{transform:translateY(1px);box-shadow:0 2px 0 #523d27;}
.btn-add:active{transform:translateY(3px);box-shadow:none;}
.nmsg{font-size:13px;letter-spacing:2px;color:var(--issued);font-weight:700;}

@media (max-width:680px){
  .topbar .stats{display:none;}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <h1>索引卡盒 · 證照核發管理</h1>
  <span class="sub">建設局職業證照股</span>
  <a class="back-link nav" href="list.html">證照列表</a>
  <a class="back-link nav" href="form.html">新增申請</a>
  <a class="back-link nav" href="expiry.html">到期提醒</a>
  <div class="stats">
    <span>卡盒總量 <b id="stTotal">0</b></span>
    <span>審核中 <b id="stReview">0</b></span>
    <a href="expiry.html" title="前往到期提醒"><span>將到期 <b id="stExpire">0</b></span></a>
  </div>
</div>

<div class="box-wrap">
  <div class="cardbox">
    <div class="tabs" id="tabs"></div>
    <div class="box-inner">
      <div class="cards" id="cards"></div>
      <div class="empty-tip" id="emptyTip">─ 此字母分隔片下尚無卡片 ─</div>
    </div>
  </div>
</div>

<div class="drawer-wrap">
  <button class="drawer-toggle" id="drawerToggle">▤ 拉開申請抽屜（新增證照申請）</button>
  <div class="drawer" id="drawer">
    <div class="drawer-inner">
      <h3>證照申請卡 · 填寫</h3>
      <form class="nform" id="newForm" novalidate>
        <div class="nf">
          <label>申請人姓名</label>
          <input type="text" id="nName" placeholder="例：林佳穎">
          <div class="err" id="eName"></div>
        </div>
        <div class="nf">
          <label>證照類別</label>
          <select id="nType">
            <option>室內配線技術士</option>
            <option>冷凍空調技術士</option>
            <option>升降機裝修技術士</option>
            <option>用電設備檢驗員</option>
            <option>職業安全衛生管理員</option>
          </select>
          <div class="err"></div>
        </div>
        <div class="nf">
          <label>核發日期</label>
          <input type="date" id="nIssue" value="2026-08-28">
          <div class="err"></div>
        </div>
        <div class="nf">
          <label>有效年限</label>
          <select id="nYears">
            <option value="3">3 年</option>
            <option value="5" selected>5 年</option>
            <option value="6">6 年</option>
          </select>
          <div class="err"></div>
        </div>
        <div class="nf-actions">
          <button type="submit" class="btn-add">＋ 插入卡片</button>
          <span class="nmsg" id="nMsg"></span>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
/* 證照資料（拼音首字母作為索引鍵） */
const licenses = [
  {name:'陳志豪', key:'C', type:'室內配線技術士',   issue:'113-04-18', expire:'118-04-17', st:'issued', stTxt:'已核發'},
  {name:'蔡佩珊', key:'C', type:'用電設備檢驗員',   issue:'111-09-02', expire:'116-09-01', st:'expire', stTxt:'將到期'},
  {name:'黃國棟', key:'H', type:'冷凍空調技術士',   issue:'115-08-11', expire:'120-08-10', st:'review', stTxt:'審核中'},
  {name:'何淑芬', key:'H', type:'職業安全衛生管理員', issue:'112-06-25', expire:'117-06-24', st:'issued', stTxt:'已核發'},
  {name:'林佳穎', key:'L', type:'升降機裝修技術士', issue:'110-12-05', expire:'115-12-04', st:'expire', stTxt:'將到期'},
  {name:'李俊賢', key:'L', type:'室內配線技術士',   issue:'114-02-20', expire:'119-02-19', st:'issued', stTxt:'已核發'},
  {name:'吳明達', key:'W', type:'用電設備檢驗員',   issue:'115-08-22', expire:'120-08-21', st:'review', stTxt:'審核中'},
  {name:'王雅婷', key:'W', type:'職業安全衛生管理員', issue:'113-10-30', expire:'118-10-29', st:'issued', stTxt:'已核發'},
  {name:'張文彬', key:'Z', type:'冷凍空調技術士',   issue:'112-03-14', expire:'117-03-13', st:'issued', stTxt:'已核發'},
  {name:'周曉菁', key:'Z', type:'升降機裝修技術士', issue:'115-08-26', expire:'120-08-25', st:'review', stTxt:'審核中'}
];
let serial = 118;

const tabsEl = document.getElementById('tabs');
const cardsEl = document.getElementById('cards');
const emptyTip = document.getElementById('emptyTip');
let currentKey = 'ALL';

/* 字母片 */
function buildTabs(){
  const keys = ['ALL'].concat(Array.from(new Set(licenses.map(function(x){ return x.key; }))).sort());
  tabsEl.innerHTML = '';
  keys.forEach(function(k){
    const n = k === 'ALL' ? licenses.length : licenses.filter(function(x){ return x.key === k; }).length;
    const t = document.createElement('span');
    t.className = 'atab' + (k === currentKey ? ' active' : '');
    t.innerHTML = (k === 'ALL' ? '全' : k) + '<span class="cnt">' + n + '</span>';
    t.addEventListener('click', function(){
      if (currentKey === k) return;
      currentKey = k;
      buildTabs();
      renderCards(true);
    });
    tabsEl.appendChild(t);
  });
}

/* 渲染卡片（animated：先抽出舊卡再翻入新卡） */
function cardHTML(x){
  return '<div class="cname"><span class="nm"></span><span class="eno">NO.' + (x.no || '') + '</span></div>' +
    '<div class="crow"><span class="k">證照類別</span><span class="v"></span></div>' +
    '<div class="crow"><span class="k">核發日期</span><span>' + x.issue + '</span></div>' +
    '<div class="crow"><span class="k">有效期限</span><span>' + x.expire + '</span></div>' +
    '<span class="stag ' + x.st + '">' + x.stTxt + '</span>' +
    '<a class="card-op" href="detail.html">抽卡詳閱 ▸</a>';
}
function makeCard(x, popIn){
  const c = document.createElement('div');
  c.className = 'icard st-' + x.st + (popIn ? ' pop-in' : '');
  c.innerHTML = cardHTML(x);
  c.querySelector('.nm').textContent = x.name;
  c.querySelector('.v').textContent = x.type;
  return c;
}
function filtered(){
  return licenses.filter(function(x){ return currentKey === 'ALL' || x.key === currentKey; });
}
function renderCards(animated){
  const list = filtered();
  const paint = function(){
    cardsEl.innerHTML = '';
    list.forEach(function(x){ cardsEl.appendChild(makeCard(x, animated)); });
    emptyTip.style.display = list.length ? 'none' : 'block';
  };
  if (animated && cardsEl.children.length){
    Array.from(cardsEl.children).forEach(function(c){ c.classList.add('pop-out'); });
    setTimeout(paint, 240);
  } else {
    paint();
  }
}

/* 統計 */
function renderStats(){
  document.getElementById('stTotal').textContent = licenses.length;
  document.getElementById('stReview').textContent = licenses.filter(function(x){return x.st==='review';}).length;
  document.getElementById('stExpire').textContent = licenses.filter(function(x){return x.st==='expire';}).length;
}

/* 抽屜 */
const drawer = document.getElementById('drawer');
const drawerToggle = document.getElementById('drawerToggle');
drawerToggle.addEventListener('click', function(){
  const opening = !drawer.classList.contains('open');
  drawer.classList.toggle('open');
  this.textContent = opening ? '▥ 收起申請抽屜' : '▤ 拉開申請抽屜（新增證照申請）';
});

/* 新增申請 */
document.getElementById('newForm').addEventListener('submit', function(e){
  e.preventDefault();
  const nameEl = document.getElementById('nName');
  const msg = document.getElementById('nMsg');
  const nm = nameEl.value.trim();
  if (!nm){
    document.getElementById('eName').textContent = '※ 請填寫申請人姓名';
    return;
  }
  document.getElementById('eName').textContent = '';
  /* 以常見姓氏拼音對應首字母，其餘歸 # */
  const surMap = {'陳':'C','蔡':'C','黃':'H','何':'H','林':'L','李':'L','吳':'W','王':'W','張':'Z','周':'Z','鄭':'Z','劉':'L','許':'X','謝':'X','郭':'G','高':'G'};
  const key = surMap[nm.charAt(0)] || '#';
  const issue = document.getElementById('nIssue').value || '2026-08-28';
  const years = +document.getElementById('nYears').value;
  const y = +issue.substr(0,4) - 1911 + years;
  const expRoc = y + issue.substr(4);
  licenses.push({
    name:nm, key:key, type:document.getElementById('nType').value,
    issue:issue.replace(/^(\d{4})/, function(m){ return +m - 1911; }).replace(/-/g,'-'),
    expire:expRoc, st:'review', stTxt:'審核中', no: ++serial
  });
  msg.textContent = '✓ 已插入「' + nm + '」申請卡（歸檔於 ' + key + ' 分隔片）';
  buildTabs();
  renderCards(true);
  renderStats();
  nameEl.value = '';
  setTimeout(function(){ msg.textContent = ''; }, 3200);
});

buildTabs();
renderCards(false);
renderStats();
</script>
</body>
</html>
