<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增證照申請 · 索引卡盒證照核發管理</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#f5efdd; --wood:#8a6b4a; --wood-dark:#6d5238;
  --tab:#e7d9b8; --tab-ink:#7a5a34;
  --review:#b98a2e; --issued:#4d7c5a; --expire:#b3402a;
  --ink:#4a3a28;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#cbb28e;
  background-image:
    repeating-linear-gradient(90deg, rgba(109,82,56,.06) 0 2px, transparent 2px 90px),
    linear-gradient(180deg, #d6bf9c, #c2a87f);
  font-family:'Noto Serif TC','Courier Prime',serif;
  color:var(--ink);min-height:100vh;padding-bottom:60px;
}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:
    repeating-linear-gradient(95deg, rgba(0,0,0,.05) 0 3px, transparent 3px 14px),
    linear-gradient(180deg, var(--wood), var(--wood-dark));
  padding:14px 26px;
  box-shadow:0 4px 14px rgba(60,40,20,.4);
  border-bottom:3px solid #523d27;
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--ink);font-weight:700;letter-spacing:2px;font-size:14px;
  background:var(--ivory);border:2px solid #523d27;border-radius:4px;
  padding:7px 15px;box-shadow:0 3px 0 #523d27;
  transition:transform .12s, box-shadow .12s;
}
.back-link:hover{transform:translateY(1px);box-shadow:0 2px 0 #523d27;}
.back-link.nav{background:var(--tab);font-size:12px;padding:6px 12px;}
.topbar h1{color:var(--ivory);font-size:20px;letter-spacing:6px;text-shadow:0 2px 3px rgba(0,0,0,.35);}
.topbar .sub{color:rgba(245,239,221,.7);font-size:12px;letter-spacing:3px;}

.main{max-width:900px;margin:34px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:22px;}

/* 申請卡 */
.formcard{
  background:var(--ivory);
  background-image:repeating-linear-gradient(transparent 0 30px, rgba(74,58,40,.08) 30px 31px);
  border:1.5px solid #c9b98f;border-top:10px solid var(--tab);
  border-radius:6px;
  box-shadow:0 12px 26px rgba(60,40,20,.4);
  padding:26px 32px 26px;
  animation:pullOut .6s cubic-bezier(.25,.9,.3,1) both;
}
@keyframes pullOut{0%{transform:translateY(60px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
.formcard h2{
  font-size:16px;letter-spacing:5px;border-bottom:2px solid var(--ink);
  padding-bottom:10px;margin-bottom:16px;
  font-family:'Courier Prime','Noto Serif TC',monospace;
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;
}
.formcard h2 .no{font-size:11px;color:#9a8763;letter-spacing:2px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field>label{font-size:13px;letter-spacing:2px;font-weight:700;}
.field>label .req{color:var(--expire);}
.field input[type=text],.field input[type=date],.field select,.field textarea{
  font-family:'Courier Prime','Noto Serif TC',monospace;
  font-size:15px;color:var(--ink);background:transparent;
  border:none;border-bottom:2px solid #c9b98f;padding:7px 2px;outline:none;
}
.field textarea{resize:vertical;min-height:64px;line-height:31px;}
.field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:var(--wood);}
.field .hint{font-size:12px;color:var(--expire);min-height:16px;letter-spacing:1px;}

.radio-row,.check-row{display:flex;gap:12px;flex-wrap:wrap;padding-top:4px;}
.radio-row label,.check-row label{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  background:rgba(138,107,74,.08);border:1.5px solid #c9b98f;border-radius:4px;
  padding:7px 14px;font-size:14px;letter-spacing:1px;transition:all .15s;
}
.radio-row label:has(input:checked),.check-row label:has(input:checked){
  border-color:var(--wood-dark);background:rgba(138,107,74,.18);font-weight:700;
}
.radio-row input,.check-row input{accent-color:var(--wood-dark);width:15px;height:15px;}

.submit-row{display:flex;gap:16px;align-items:center;margin-top:20px;flex-wrap:wrap;}
.btn-add{
  cursor:pointer;font-family:inherit;
  background:var(--wood-dark);color:var(--ivory);border:2px solid #523d27;
  font-size:15px;font-weight:700;letter-spacing:4px;
  padding:11px 30px;border-radius:4px;box-shadow:0 3px 0 #523d27;
  transition:transform .12s, box-shadow .12s;
}
.btn-add:hover{transform:translateY(1px);box-shadow:0 2px 0 #523d27;}
.btn-add:active{transform:translateY(3px);box-shadow:none;}
.btn-add:disabled{opacity:.55;}
.nmsg{font-size:13px;letter-spacing:2px;color:var(--issued);font-weight:700;}
.nmsg.bad{color:var(--expire);}

/* 小抄與狀態說明 */
.panel{
  background:var(--ivory);border:1.5px solid #c9b98f;border-radius:6px;
  box-shadow:0 6px 16px rgba(60,40,20,.3);padding:20px 24px;
}
.panel h2{
  font-size:15px;letter-spacing:4px;border-bottom:2px solid var(--ink);
  padding-bottom:8px;margin-bottom:12px;
  font-family:'Courier Prime','Noto Serif TC',monospace;
}
.steps{font-size:14px;line-height:2.3;letter-spacing:1px;}
.steps .sn{
  display:inline-block;width:24px;height:24px;line-height:22px;text-align:center;
  border:1.5px solid var(--wood-dark);border-radius:50%;
  font-family:'Courier Prime',monospace;font-weight:700;font-size:12px;margin-right:8px;
}
.stag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;padding:2px 10px;border-radius:3px;color:#fff;}
.stag.review{background:var(--review);}
.stag.issued{background:var(--issued);}
.stag.expire{background:var(--expire);}
@media (max-width:680px){.form-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <h1>新增證照申請</h1>
  <span class="sub">建設局職業證照股</span>
  <a class="back-link nav" href="list.html">證照列表</a>
  <a class="back-link nav" href="expiry.html">到期提醒</a>
</div>

<div class="main">
  <div class="formcard">
    <h2>證照申請卡 · 填寫 <span class="no">FORM LC-NEW-115 ・ 一式一聯</span></h2>
    <form class="form-grid" id="newForm" novalidate>
      <div class="field">
        <label for="nName">申請人姓名 <span class="req">*</span></label>
        <input type="text" id="nName" placeholder="例：林佳穎">
        <div class="hint" id="hName"></div>
      </div>
      <div class="field">
        <label for="nId">身分證字號 <span class="req">*</span></label>
        <input type="text" id="nId" placeholder="例：A228456789" maxlength="10">
        <div class="hint" id="hId"></div>
      </div>
      <div class="field">
        <label for="nType">證照類別 <span class="req">*</span></label>
        <select id="nType">
          <option>室內配線技術士</option>
          <option>冷凍空調技術士</option>
          <option>升降機裝修技術士</option>
          <option>用電設備檢驗員</option>
          <option>職業安全衛生管理員</option>
        </select>
        <div class="hint"></div>
      </div>
      <div class="field">
        <label for="nIssue">核發日期 <span class="req">*</span></label>
        <input type="date" id="nIssue" value="2026-08-28">
        <div class="hint" id="hIssue"></div>
      </div>
      <div class="field full">
        <label>申請別 <span class="req">*</span></label>
        <div class="radio-row">
          <label><input type="radio" name="nKind" value="新領" checked> 新領</label>
          <label><input type="radio" name="nKind" value="換發"> 換發（屆期）</label>
          <label><input type="radio" name="nKind" value="補發"> 補發（遺失／毀損）</label>
        </div>
      </div>
      <div class="field full">
        <label>隨卡文件（可複選）<span class="req">*</span></label>
        <div class="check-row">
          <label><input type="checkbox" class="nDoc"> 身分證影本</label>
          <label><input type="checkbox" class="nDoc"> 一吋照片 2 張</label>
          <label><input type="checkbox" class="nDoc"> 考試及格證書</label>
          <label><input type="checkbox" class="nDoc"> 在職證明</label>
        </div>
        <div class="hint" id="hDoc"></div>
      </div>
      <div class="field full">
        <label for="nNote">備註</label>
        <textarea id="nNote" rows="2" placeholder="例：舊證已於搬家時遺失，附切結書一份。"></textarea>
        <div class="hint"></div>
      </div>
      <div class="field full submit-row" style="margin-top:0;">
        <button type="submit" class="btn-add" id="btnAdd">＋ 插入卡片（送審）</button>
        <span class="nmsg" id="nMsg"></span>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>▍申請流程小抄</h2>
    <div class="steps">
      <div><span class="sn">1</span>送出申請卡 → 狀態 <span class="stag review">審核中</span>（3 個工作日內初審）</div>
      <div><span class="sn">2</span>初審通過 → 製卡用印 → 狀態 <span class="stag issued">已核發</span>（掛號寄出）</div>
      <div><span class="sn">3</span>屆期前 90 日 → 系統改掛 <span class="stag expire">將到期</span> 紅邊卡並寄發提醒</div>
    </div>
  </div>
</div>

<script>
document.getElementById('newForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('nName');
  const idno = document.getElementById('nId');
  const issue = document.getElementById('nIssue');
  const msg = document.getElementById('nMsg');
  let ok = true;
  document.getElementById('hName').textContent = name.value.trim() ? '' : '※ 請填寫申請人姓名';
  if (!name.value.trim()) ok = false;
  document.getElementById('hId').textContent = /^[A-Z][12]\d{8}$/.test(idno.value.trim()) ? '' : '※ 身分證字號格式不正確';
  if (!/^[A-Z][12]\d{8}$/.test(idno.value.trim())) ok = false;
  document.getElementById('hIssue').textContent = issue.value ? '' : '※ 請選擇核發日期';
  if (!issue.value) ok = false;
  const docs = Array.from(document.querySelectorAll('.nDoc')).filter(function(c){return c.checked;}).length;
  document.getElementById('hDoc').textContent = docs >= 2 ? '' : '※ 至少勾選 2 項隨卡文件';
  if (docs < 2) ok = false;
  if (!ok){ msg.textContent = '⚠ 卡面資料未齊，請檢查紅字欄位'; msg.className = 'nmsg bad'; return; }

  const btn = document.getElementById('btnAdd');
  btn.disabled = true;
  btn.textContent = '打字歸檔中…';
  msg.textContent = '';
  setTimeout(function(){
    const kind = document.querySelector('input[name="nKind"]:checked').value;
    msg.textContent = '✓ 申請卡已插入卡盒（' + kind + '・狀態：審核中），可至「證照列表」查看';
    msg.className = 'nmsg';
    btn.disabled = false;
    btn.textContent = '＋ 插入卡片（送審）';
    document.getElementById('nName').value = '';
    document.getElementById('nId').value = '';
    document.getElementById('nNote').value = '';
  }, 1100);
});
</script>
</body>
</html>
