<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智造通 MES｜新增維修工單</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1c1f24;color:#d7dce2;font-family:'Noto Sans TC','Roboto Mono',sans-serif;min-height:100vh}
  .topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;background:#17191d;border-bottom:1px solid #33383f}
  .back{color:#d7dce2;text-decoration:none;font-size:13px;border:1px solid #33383f;padding:7px 14px;transition:.2s;letter-spacing:1px}
  .back:hover{border-color:#69f0ae;color:#69f0ae}
  .topbar h1{font-size:16px;font-weight:500;letter-spacing:2px}
  .topbar h1 span{color:#69f0ae;font-family:'Roboto Mono',monospace}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:18px;font-family:'Roboto Mono',monospace;font-size:13px;color:#8a929c}
  #clock{color:#d7dce2}
  .subnav{display:flex;gap:2px;background:#17191d;border-bottom:1px solid #33383f;padding:0 22px}
  .subnav a{color:#8a929c;text-decoration:none;font-size:13px;padding:10px 16px;letter-spacing:1px;border-bottom:2px solid transparent;transition:.2s}
  .subnav a:hover{color:#d7dce2}
  .subnav a.on{color:#69f0ae;border-bottom-color:#69f0ae}
  .wrap{padding:18px 22px 40px;max-width:1400px;margin:0 auto}
  .lamp{width:9px;height:9px;border-radius:50%;display:inline-block}
  .lamp.g{background:#69f0ae;box-shadow:0 0 8px #69f0ae;animation:blink 2.4s infinite}
  .lamp.y{background:#ffd740;box-shadow:0 0 8px #ffd740;animation:blink 1.4s infinite}
  .lamp.r{background:#ff5252;box-shadow:0 0 8px #ff5252;animation:blink .7s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:3px 12px;border:1px solid;border-radius:2px;font-family:'Noto Sans TC'}
  .b-g{color:#69f0ae;border-color:rgba(105,240,174,.4);background:rgba(105,240,174,.08)}
  .b-y{color:#ffd740;border-color:rgba(255,215,64,.4);background:rgba(255,215,64,.08)}
  .b-r{color:#ff5252;border-color:rgba(255,82,82,.4);background:rgba(255,82,82,.08)}
  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .panel{background:#24282f;border:1px solid #33383f}
  .panel-h{padding:12px 16px;border-bottom:1px solid #33383f;font-size:12.5px;letter-spacing:2px;color:#8a929c;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .panel-h b{color:#d7dce2;font-weight:500}
  .panel-b{padding:18px 16px}
  .mono{font-family:'Roboto Mono',monospace}
  .frow{margin-bottom:16px}
  .frow label{display:block;font-size:12px;letter-spacing:2px;color:#8a929c;margin-bottom:8px}
  .frow label i{color:#ff5252;font-style:normal}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;background:#1c1f24;color:#d7dce2;border:1px solid #33383f;padding:9px 12px;
    font-family:'Noto Sans TC',sans-serif;font-size:13.5px;outline:none;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:#69f0ae}
  input[readonly]{color:#8a929c;font-family:'Roboto Mono',monospace}
  textarea{resize:vertical;min-height:110px;line-height:1.7}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.fgrid{grid-template-columns:1fr}}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{border:1px solid #33383f;padding:8px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#8a929c;transition:.15s}
  .opt:hover{border-color:#69f0ae}
  .opt input{accent-color:#69f0ae}
  .cnt{font-size:11px;color:#5c636c;text-align:right;margin-top:4px;font-family:'Roboto Mono',monospace}
  .btns{display:flex;gap:12px;margin-top:20px}
  .btn{padding:10px 26px;font-size:13.5px;letter-spacing:2px;cursor:pointer;border:1px solid #33383f;background:#1c1f24;color:#d7dce2;font-family:'Noto Sans TC';transition:.15s;text-decoration:none;display:inline-block}
  .btn:hover{border-color:#69f0ae;color:#69f0ae}
  .btn.pri{background:rgba(105,240,174,.12);border-color:#69f0ae;color:#69f0ae}
  .btn.pri:hover{background:rgba(105,240,174,.22)}
  #toast{display:none;margin-top:16px;padding:12px 16px;border:1px solid rgba(105,240,174,.5);background:rgba(105,240,174,.1);color:#69f0ae;font-size:13px}
  #toast.err{border-color:rgba(255,82,82,.5);background:rgba(255,82,82,.1);color:#ff5252}
  .side-stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2b3037;font-size:13px}
  .side-stat:last-child{border-bottom:none}
  .side-stat .n{font-family:'Roboto Mono',monospace;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:11px;letter-spacing:2px;color:#8a929c;text-align:left;padding:8px 10px;border-bottom:1px solid #33383f;font-weight:400}
  td{padding:9px 10px;border-bottom:1px solid #2b3037;font-family:'Roboto Mono',monospace}
  td.zh{font-family:'Noto Sans TC',sans-serif}
  tr:hover td{background:#282c33}
  .lnk{color:#69f0ae;text-decoration:none}
  .lnk:hover{text-decoration:underline}
  .foot{margin-top:14px;font-size:11px;color:#5c636c;letter-spacing:1px;display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace}
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html">← 返回入口</a>
    <h1>智造通 MES <span>// WORK-ORDER</span></h1>
    <div class="top-right">
      <span>SHIFT 夜班</span>
      <span id="clock">--:--:--</span>
    </div>
  </div>
  <div class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="lines.html">產線清單</a>
    <a href="workorder.html" class="on">維修工單</a>
    <a href="report.html">生產報表</a>
    <a href="settings.html">警報設定</a>
  </div>

  <div class="wrap">
    <div class="grid2">
      <!-- 工單表單 -->
      <div class="panel">
        <div class="panel-h"><b>新增維修工單</b><span class="badge b-y" id="stBadge"><span class="lamp y"></span>草稿</span></div>
        <div class="panel-b">
          <form id="woForm" novalidate>
            <div class="fgrid">
              <div class="frow"><label>工單編號（系統產生）</label><input type="text" value="WO-20260828-004" readonly></div>
              <div class="frow"><label>報修產線 <i>*</i></label>
                <select id="fLine">
                  <option value="">— 請選擇 —</option>
                  <option selected>L4 · 迴焊爐 RO-04</option>
                  <option>L1 · 貼片線</option>
                  <option>L3 · 插件線</option>
                  <option>L6 · 組裝線</option>
                  <option>L7 · 測試線</option>
                </select>
              </div>
            </div>
            <div class="frow"><label>設備 / 站點 <i>*</i></label><input type="text" id="fDev" value="迴焊爐 RO-04 溫區 3" placeholder="例：貼片機 CM-02"></div>
            <div class="fgrid">
              <div class="frow"><label>故障類別</label>
                <div class="opts">
                  <label class="opt"><input type="radio" name="cat" checked>機械</label>
                  <label class="opt"><input type="radio" name="cat">電氣</label>
                  <label class="opt"><input type="radio" name="cat">製程</label>
                  <label class="opt"><input type="radio" name="cat">軟體</label>
                </div>
              </div>
              <div class="frow"><label>優先等級</label>
                <div class="opts">
                  <label class="opt"><input type="radio" name="pri">一般</label>
                  <label class="opt"><input type="radio" name="pri" checked>急件</label>
                  <label class="opt"><input type="radio" name="pri">特急（停線）</label>
                </div>
              </div>
            </div>
            <div class="fgrid">
              <div class="frow"><label>指派維修員</label>
                <select>
                  <option>許哲瑋（設備工程師）</option>
                  <option>郭明憲（製程工程師）</option>
                  <option>周冠廷（電機技師）</option>
                  <option>待值班主管指派</option>
                </select>
              </div>
              <div class="frow"><label>預計修復期限 <i>*</i></label><input type="date" id="fDate" value="2026-08-29"></div>
            </div>
            <div class="frow"><label>附加作業</label>
              <div class="opts">
                <label class="opt"><input type="checkbox" checked>建立停機紀錄</label>
                <label class="opt"><input type="checkbox" checked>通知廠務值班</label>
                <label class="opt"><input type="checkbox">申請備品（SSR-40A）</label>
                <label class="opt"><input type="checkbox">完工後安排爐溫驗證</label>
              </div>
            </div>
            <div class="frow"><label>故障描述 <i>*</i></label>
              <textarea id="fDesc" maxlength="300" placeholder="請描述故障現象、發生時間與初步判斷…">21:05 溫區 3 實測 268.4°C 超過閾值 255°C 觸發停線。現場初判加熱模組 SSR 短路持續導通，已切斷該區加熱迴路，待備品更換。</textarea>
              <div class="cnt"><span id="descCnt">0</span> / 300</div>
            </div>
            <div class="btns">
              <button type="submit" class="btn pri">送出工單</button>
              <button type="reset" class="btn">清除重填</button>
              <a class="btn" href="lines.html">返回清單</a>
            </div>
            <div id="toast"></div>
          </form>
        </div>
      </div>

      <!-- 側欄 -->
      <div>
        <div class="panel">
          <div class="panel-h"><b>派工概況</b><span class="mono">TODAY</span></div>
          <div class="panel-b">
            <div class="side-stat"><span>待派工</span><span class="n" style="color:#ffd740">2 件</span></div>
            <div class="side-stat"><span>維修中</span><span class="n" style="color:#69f0ae">4 件</span></div>
            <div class="side-stat"><span>待驗收</span><span class="n">1 件</span></div>
            <div class="side-stat"><span>本週已完成</span><span class="n">11 件</span></div>
            <div class="side-stat"><span>平均修復時間 MTTR</span><span class="n">2.4 hr</span></div>
          </div>
        </div>
        <div class="panel" style="margin-top:14px">
          <div class="panel-h"><b>最近工單</b><a class="lnk" href="lines.html" style="font-size:11px">產線清單 →</a></div>
          <table>
            <tr><th>單號</th><th>內容</th><th>狀態</th></tr>
            <tr><td>WO-…-003</td><td class="zh">L6 送料器異音</td><td><span class="badge b-g">維修中</span></td></tr>
            <tr><td>WO-…-002</td><td class="zh">L2 AOI 光源衰減</td><td><span class="badge b-y">待料</span></td></tr>
            <tr><td>WO-…-001</td><td class="zh">L1 吸嘴堵塞</td><td><span class="badge b-g">已完成</span></td></tr>
          </table>
        </div>
      </div>
    </div>

    <div class="foot"><span>WORK ORDER MODULE · SLA: 特急 30min 內到場</span><span>© 智造通製造執行系統</span></div>
  </div>

<script>
  function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false});}
  tick();setInterval(tick,1000);
  // 字數統計
  const desc=document.getElementById('fDesc'),cnt=document.getElementById('descCnt');
  const upd=()=>cnt.textContent=desc.value.length;
  desc.addEventListener('input',upd);upd();
  // 送出驗證 + 狀態標籤切換
  document.getElementById('woForm').addEventListener('submit',e=>{
    e.preventDefault();
    const toast=document.getElementById('toast');
    const bad=!document.getElementById('fLine').value||!document.getElementById('fDev').value.trim()||!desc.value.trim()||!document.getElementById('fDate').value;
    toast.style.display='block';
    if(bad){
      toast.className='err';toast.id='toast';
      toast.textContent='⚠ 送出失敗：請確認必填欄位（產線 / 設備站點 / 修復期限 / 故障描述）皆已填寫。';
      return;
    }
    toast.className='';toast.id='toast';
    toast.textContent='✔ 工單 WO-20260828-004 已送出，系統已通知值班主管與指派維修員（示範畫面，未實際傳送）。';
    const st=document.getElementById('stBadge');
    st.className='badge b-g';
    st.innerHTML='<span class="lamp g"></span>已送出 · 待派工';
  });
</script>
</body>
</html>
