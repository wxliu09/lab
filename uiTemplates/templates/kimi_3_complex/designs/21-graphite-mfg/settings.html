<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智造通 MES｜警報閾值設定</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1c1f24;color:#d7dce2;font-family:'Noto Sans TC','Roboto Mono',sans-serif;min-height:100vh}
  .topbar{display:flex;align-items:center;gap:16px;padding:12px 22px;background:#17191d;border-bottom:1px solid #33383f}
  .back{color:#d7dce2;text-decoration:none;font-size:13px;border:1px solid #33383f;padding:7px 14px;transition:.2s;letter-spacing:1px}
  .back:hover{border-color:#69f0ae;color:#69f0ae}
  .topbar h1{font-size:16px;font-weight:500;letter-spacing:2px}
  .topbar h1 span{color:#69f0ae;font-family:'Roboto Mono',monospace}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:18px;font-family:'Roboto Mono',monospace;font-size:13px;color:#8a929c}
  #clock{color:#d7dce2}
  .subnav{display:flex;gap:2px;background:#17191d;border-bottom:1px solid #33383f;padding:0 22px}
  .subnav a{color:#8a929c;text-decoration:none;font-size:13px;padding:10px 16px;letter-spacing:1px;border-bottom:2px solid transparent;transition:.2s}
  .subnav a:hover{color:#d7dce2}
  .subnav a.on{color:#69f0ae;border-bottom-color:#69f0ae}
  .wrap{padding:18px 22px 40px;max-width:1400px;margin:0 auto}
  .lamp{width:9px;height:9px;border-radius:50%;display:inline-block}
  .lamp.g{background:#69f0ae;box-shadow:0 0 8px #69f0ae;animation:blink 2.4s infinite}
  .lamp.y{background:#ffd740;box-shadow:0 0 8px #ffd740;animation:blink 1.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:3px 12px;border:1px solid;border-radius:2px;font-family:'Noto Sans TC'}
  .b-g{color:#69f0ae;border-color:rgba(105,240,174,.4);background:rgba(105,240,174,.08)}
  .b-y{color:#ffd740;border-color:rgba(255,215,64,.4);background:rgba(255,215,64,.08)}
  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .panel{background:#24282f;border:1px solid #33383f}
  .panel-h{padding:12px 16px;border-bottom:1px solid #33383f;font-size:12.5px;letter-spacing:2px;color:#8a929c;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  .panel-h b{color:#d7dce2;font-weight:500}
  .panel-b{padding:18px 16px}
  .mono{font-family:'Roboto Mono',monospace}
  .frow{margin-bottom:16px}
  .frow label{display:block;font-size:12px;letter-spacing:2px;color:#8a929c;margin-bottom:8px}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;background:#1c1f24;color:#d7dce2;border:1px solid #33383f;padding:9px 12px;
    font-family:'Noto Sans TC',sans-serif;font-size:13.5px;outline:none;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:#69f0ae}
  textarea{resize:vertical;min-height:90px;line-height:1.7}
  .fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:760px){.fgrid{grid-template-columns:1fr}}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{border:1px solid #33383f;padding:8px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#8a929c;transition:.15s}
  .opt:hover{border-color:#69f0ae}
  .opt input{accent-color:#69f0ae}
  .btns{display:flex;gap:12px;margin-top:20px}
  .btn{padding:10px 26px;font-size:13.5px;letter-spacing:2px;cursor:pointer;border:1px solid #33383f;background:#1c1f24;color:#d7dce2;font-family:'Noto Sans TC';transition:.15s}
  .btn:hover{border-color:#69f0ae;color:#69f0ae}
  .btn.pri{background:rgba(105,240,174,.12);border-color:#69f0ae;color:#69f0ae}
  #toast{display:none;margin-top:16px;padding:12px 16px;border:1px solid rgba(105,240,174,.5);background:rgba(105,240,174,.1);color:#69f0ae;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;letter-spacing:2px;color:#8a929c;text-align:left;padding:10px 12px;border-bottom:1px solid #33383f;font-weight:400}
  td{padding:10px 12px;border-bottom:1px solid #2b3037;font-family:'Roboto Mono',monospace}
  td.zh{font-family:'Noto Sans TC',sans-serif}
  tr:hover td{background:#282c33}
  .foot{margin-top:14px;font-size:11px;color:#5c636c;letter-spacing:1px;display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace}
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html">← 返回入口</a>
    <h1>智造通 MES <span>// ALARM-CONFIG</span></h1>
    <div class="top-right">
      <span>權限：廠務工程師</span>
      <span id="clock">--:--:--</span>
    </div>
  </div>
  <div class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="lines.html">產線清單</a>
    <a href="workorder.html">維修工單</a>
    <a href="report.html">生產報表</a>
    <a href="settings.html" class="on">警報設定</a>
  </div>

  <div class="wrap">
    <div class="grid2">
      <!-- 閾值設定表單 -->
      <div class="panel">
        <div class="panel-h"><b>警報閾值設定</b><span class="badge b-y" id="stBadge"><span class="lamp y"></span>未儲存變更</span></div>
        <div class="panel-b">
          <form id="cfgForm">
            <div class="fgrid">
              <div class="frow"><label>OEE 下限（%）</label><input type="number" id="vOee" value="80" min="0" max="100" step="0.5"></div>
              <div class="frow"><label>UPH 下限（pcs/hr）</label><input type="number" id="vUph" value="1700" min="0" step="50"></div>
              <div class="frow"><label>爐溫上限（°C）</label><input type="number" id="vTemp" value="255" min="100" max="400"></div>
            </div>
            <div class="fgrid">
              <div class="frow"><label>適用產線</label>
                <select><option>全部產線</option><option>L1–L2 SMT 段</option><option>L3–L4 迴焊段</option><option>L5–L6 組裝段</option></select>
              </div>
              <div class="frow"><label>生效日期</label><input type="date" value="2026-09-01"></div>
              <div class="frow"><label>複核主管</label>
                <select><option>生產部 王協理</option><option>製造部 陳經理</option><option>品保部 林副理</option></select>
              </div>
            </div>
            <div class="frow"><label>越限處置層級</label>
              <div class="opts">
                <label class="opt"><input type="radio" name="lv" checked>僅戰情室提醒</label>
                <label class="opt"><input type="radio" name="lv">提醒 + 通知線長</label>
                <label class="opt"><input type="radio" name="lv">自動降速</label>
                <label class="opt"><input type="radio" name="lv">觸發停線連鎖</label>
              </div>
            </div>
            <div class="frow"><label>通知管道</label>
              <div class="opts">
                <label class="opt"><input type="checkbox" checked>戰情室看板</label>
                <label class="opt"><input type="checkbox" checked>Email 群組</label>
                <label class="opt"><input type="checkbox">簡訊（值班手機）</label>
                <label class="opt"><input type="checkbox">LINE 群組推播</label>
              </div>
            </div>
            <div class="frow"><label>警報通知文案</label>
              <textarea maxlength="120">【智造通】{產線} {測點} 越限：實測 {數值}（閾值 {閾值}），請即處置。</textarea>
            </div>
            <div class="btns">
              <button type="submit" class="btn pri">儲存設定</button>
              <button type="button" class="btn" id="resetBtn">恢復原廠預設</button>
            </div>
            <div id="toast"></div>
          </form>
        </div>
      </div>

      <!-- 現行設定 -->
      <div>
        <div class="panel">
          <div class="panel-h"><b>現行生效值</b><span class="mono">SINCE 2026-07-01</span></div>
          <table>
            <tr><th>項目</th><th>閾值</th><th>層級</th></tr>
            <tr><td class="zh">OEE 下限</td><td>80%</td><td class="zh">提醒</td></tr>
            <tr><td class="zh">UPH 下限</td><td>1,700</td><td class="zh">通知線長</td></tr>
            <tr><td class="zh">爐溫上限</td><td>255 °C</td><td class="zh">停線連鎖</td></tr>
            <tr><td class="zh">濕度上限</td><td>70 %RH</td><td class="zh">提醒</td></tr>
            <tr><td class="zh">靜電壓上限</td><td>100 V</td><td class="zh">提醒</td></tr>
          </table>
        </div>
        <div class="panel" style="margin-top:14px">
          <div class="panel-h"><b>通知群組</b><span class="mono">4 GROUPS</span></div>
          <table>
            <tr><th>群組</th><th>成員</th><th>管道</th></tr>
            <tr><td class="zh">值班主管</td><td>3 人</td><td class="zh">簡訊+Email</td></tr>
            <tr><td class="zh">設備工程師</td><td>6 人</td><td class="zh">Email</td></tr>
            <tr><td class="zh">品保窗口</td><td>2 人</td><td class="zh">LINE</td></tr>
            <tr><td class="zh">廠務值班</td><td>4 人</td><td class="zh">簡訊</td></tr>
          </table>
        </div>
      </div>
    </div>

    <div class="foot"><span>CONFIG-NODE: TC-01 · 變更需複核後生效</span><span>© 智造通製造執行系統</span></div>
  </div>

<script>
  function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false});}
  tick();setInterval(tick,1000);
  const toast=document.getElementById('toast'),st=document.getElementById('stBadge');
  document.getElementById('cfgForm').addEventListener('submit',e=>{
    e.preventDefault();
    toast.style.display='block';
    toast.textContent='✔ 設定已送出複核：OEE<'+document.getElementById('vOee').value+'%、UPH<'+document.getElementById('vUph').value+'、爐溫>'+document.getElementById('vTemp').value+'°C（示範畫面，未實際寫入）。';
    st.className='badge b-g';
    st.innerHTML='<span class="lamp g"></span>已送出複核';
  });
  document.getElementById('resetBtn').addEventListener('click',()=>{
    document.getElementById('vOee').value=80;
    document.getElementById('vUph').value=1700;
    document.getElementById('vTemp').value=255;
    toast.style.display='block';
    toast.textContent='↺ 已恢復原廠預設值，記得按「儲存設定」送出複核。';
    st.className='badge b-y';
    st.innerHTML='<span class="lamp y"></span>未儲存變更';
  });
</script>
</body>
</html>
