<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歷史查詢 · 太空艙窗定期申報平台</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1020; --panel:#141a30; --amber:#ffb454; --oxy:#3ddc97;
  --alert:#ff4d5e; --ice:#7fb2ff; --txt:#dfe8ff; --dim:#6d7ca6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 50% 120%, rgba(127,178,255,.08), transparent 60%);
  color:var(--txt);
  font-family:'Chakra Petch','Noto Sans TC',sans-serif;
  min-height:100vh;padding-bottom:40px;
}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 24px;border-bottom:1px solid rgba(127,178,255,.2);
  background:linear-gradient(180deg, rgba(20,26,48,.95), rgba(12,16,32,.9));
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--amber);font-weight:700;letter-spacing:2px;font-size:14px;
  border:1px solid rgba(255,180,84,.6);border-radius:20px;padding:7px 16px;
  box-shadow:0 0 12px rgba(255,180,84,.18), inset 0 0 10px rgba(255,180,84,.06);
  transition:all .2s;
}
.back-link:hover{background:rgba(255,180,84,.12);box-shadow:0 0 20px rgba(255,180,84,.4);}
.back-link.nav{
  color:var(--ice);border-color:rgba(127,178,255,.5);font-size:12px;padding:5px 13px;
  box-shadow:0 0 10px rgba(127,178,255,.15);
}
.back-link.nav:hover{background:rgba(127,178,255,.12);box-shadow:0 0 18px rgba(127,178,255,.4);}
.topbar h1{font-size:18px;letter-spacing:4px;}
.topbar h1 span{color:var(--amber);}
.mission-clock{
  margin-left:auto;font-size:13px;letter-spacing:2px;color:var(--dim);
  border:1px solid rgba(127,178,255,.25);border-radius:20px;padding:6px 16px;
  font-variant-numeric:tabular-nums;
}
.mission-clock b{color:var(--oxy);}

.main{padding:20px 24px;display:flex;flex-direction:column;gap:18px;}
.panel{
  background:var(--panel);border:1px solid rgba(127,178,255,.18);
  border-radius:12px;padding:18px;
  box-shadow:inset 0 0 30px rgba(5,8,20,.6);
}
.panel h2{
  font-size:13px;letter-spacing:4px;color:var(--amber);
  border-bottom:1px solid rgba(255,180,84,.25);
  padding-bottom:9px;margin-bottom:14px;
}

/* 查詢條件 */
.q-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:end;}
.f-row label{display:block;font-size:11px;color:var(--dim);letter-spacing:3px;margin-bottom:5px;}
.f-row select,.f-row input{
  width:100%;font-family:inherit;font-size:13px;letter-spacing:1px;
  background:#0d1226;border:1px solid rgba(127,178,255,.3);
  color:var(--txt);border-radius:8px;padding:9px 12px;outline:none;
}
.f-row select:focus,.f-row input:focus{border-color:var(--amber);box-shadow:0 0 10px rgba(255,180,84,.3);}
.btn-search{
  cursor:pointer;font-family:inherit;width:100%;
  background:linear-gradient(90deg, rgba(255,180,84,.18), rgba(255,180,84,.06));
  border:1px solid var(--amber);color:var(--amber);
  font-size:13px;font-weight:700;letter-spacing:3px;
  padding:9px 0;border-radius:8px;
  box-shadow:0 0 12px rgba(255,180,84,.2);transition:all .2s;
}
.btn-search:hover{background:rgba(255,180,84,.2);box-shadow:0 0 22px rgba(255,180,84,.45);}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{
  text-align:left;font-size:11px;letter-spacing:3px;color:var(--dim);
  border-bottom:1px solid rgba(127,178,255,.3);padding:8px;
}
td{padding:10px 8px;border-bottom:1px solid rgba(109,124,166,.15);}
tbody tr{transition:background .15s;}
tbody tr:hover{background:rgba(255,180,84,.05);}
tr.hide{display:none;}
.stag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;
  padding:3px 12px;border-radius:20px;border:1px solid currentColor;
}
.stag.done{color:var(--oxy);}
.stag.late{color:var(--alert);}
.stag.makeup{color:var(--amber);}
.op{color:var(--ice);text-decoration:none;font-size:13px;letter-spacing:1px;white-space:nowrap;}
.op:hover{text-decoration:underline;text-shadow:0 0 8px rgba(127,178,255,.8);}
.mono{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;}
.cnt-line{font-size:12px;letter-spacing:2px;color:var(--dim);margin-bottom:10px;}
.cnt-line b{color:var(--amber);}
.empty-tip{text-align:center;padding:26px;color:var(--dim);letter-spacing:4px;display:none;}

/* 期別完成率 */
.rate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.rate{
  border:1px solid rgba(127,178,255,.25);border-radius:10px;padding:12px;text-align:center;
  background:rgba(127,178,255,.04);
}
.rate .rn{font-size:24px;font-weight:700;color:var(--oxy);font-variant-numeric:tabular-nums;}
.rate.warn .rn{color:var(--amber);}
.rate .rc{font-size:11px;letter-spacing:2px;color:var(--dim);margin-top:3px;}
.rate .rbar{height:6px;border-radius:3px;background:rgba(109,124,166,.2);margin-top:10px;overflow:hidden;}
.rate .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--oxy),var(--amber));width:0;transition:width 1s ease;}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <h1>歷史查詢 <span>·</span> ARCHIVE DECK</h1>
  <a class="back-link nav" href="list.html">申報列表</a>
  <a class="back-link nav" href="settings.html">申報設定</a>
  <div class="mission-clock">資料艙 <b>114–115 年度</b></div>
</div>

<div class="main">
  <div class="panel">
    <h2>查詢條件 ▸ QUERY</h2>
    <div class="q-grid">
      <div class="f-row">
        <label>年度</label>
        <select id="qYear">
          <option value="all">全部</option>
          <option value="115">115 年</option>
          <option value="114">114 年</option>
        </select>
      </div>
      <div class="f-row">
        <label>期別</label>
        <select id="qTerm">
          <option value="all">全部</option>
          <option>月份月報</option>
          <option>季度季報</option>
        </select>
      </div>
      <div class="f-row">
        <label>單位</label>
        <select id="qUnit">
          <option value="all">全部單位</option>
          <option>推進動力課</option>
          <option>通訊酬載課</option>
          <option>軌道材料試驗艙</option>
          <option>生命維持系統組</option>
        </select>
      </div>
      <div class="f-row">
        <label>審核結果</label>
        <select id="qSt">
          <option value="all">全部</option>
          <option value="done">如期受理</option>
          <option value="late">逾期受理</option>
          <option value="makeup">補報結案</option>
        </select>
      </div>
      <div class="f-row">
        <button type="button" class="btn-search" id="btnSearch">◉ 掃描資料艙</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>各期完成率 ▸ COMPLETION</h2>
    <div class="rate-grid">
      <div class="rate"><div class="rn">100%</div><div class="rc">115 年 5 月</div><div class="rbar"><i data-w="100%"></i></div></div>
      <div class="rate"><div class="rn">96%</div><div class="rc">115 年 6 月</div><div class="rbar"><i data-w="96%"></i></div></div>
      <div class="rate"><div class="rn">100%</div><div class="rc">115 年 7 月</div><div class="rbar"><i data-w="100%"></i></div></div>
      <div class="rate warn"><div class="rn">79%</div><div class="rc">115 年 8 月（進行中）</div><div class="rbar"><i data-w="79%"></i></div></div>
      <div class="rate"><div class="rn">98%</div><div class="rc">115 年 Q2 季報</div><div class="rbar"><i data-w="98%"></i></div></div>
    </div>
  </div>

  <div class="panel">
    <h2>歷史申報紀錄 ▸ LOG</h2>
    <div class="cnt-line" id="cntTip"></div>
    <table>
      <thead>
        <tr><th>申報編號</th><th>期別</th><th>單位</th><th>承辦人</th><th>申報時間</th><th>結果</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-tip" id="emptyTip">── 資料艙無符合紀錄 ──</div>
  </div>
</div>

<script>
const logs = [
  {no:'FIL-11508-101', term:'8 月份月報',  type:'月份月報', year:'115', unit:'推進動力課',     who:'魏子軒', time:'115-08-20 10:22', st:'done',   stTxt:'如期受理'},
  {no:'FIL-11508-108', term:'8 月份月報',  type:'月份月報', year:'115', unit:'通訊酬載課',     who:'蘇怡安', time:'115-08-21 15:07', st:'done',   stTxt:'如期受理'},
  {no:'FIL-11507-096', term:'7 月份月報',  type:'月份月報', year:'115', unit:'軌道材料試驗艙', who:'周子晴', time:'115-07-30 09:12', st:'done',   stTxt:'如期受理'},
  {no:'FIL-11507-077', term:'7 月份月報',  type:'月份月報', year:'115', unit:'生命維持系統組', who:'高逸凡', time:'115-08-02 14:55', st:'late',   stTxt:'逾期受理'},
  {no:'FIL-11506-052', term:'6 月份月報',  type:'月份月報', year:'115', unit:'推進動力課',     who:'魏子軒', time:'115-06-25 11:03', st:'done',   stTxt:'如期受理'},
  {no:'FIL-115Q2-009', term:'Q2 季報',     type:'季度季報', year:'115', unit:'通訊酬載課',     who:'蘇怡安', time:'115-07-08 16:40', st:'done',   stTxt:'如期受理'},
  {no:'FIL-115Q2-004', term:'Q2 季報',     type:'季度季報', year:'115', unit:'軌道材料試驗艙', who:'周子晴', time:'115-07-15 10:31', st:'makeup', stTxt:'補報結案'},
  {no:'FIL-11505-033', term:'5 月份月報',  type:'月份月報', year:'115', unit:'生命維持系統組', who:'高逸凡', time:'115-05-28 13:26', st:'done',   stTxt:'如期受理'},
  {no:'FIL-11412-118', term:'12 月份月報', type:'月份月報', year:'114', unit:'推進動力課',     who:'魏子軒', time:'114-12-27 15:48', st:'done',   stTxt:'如期受理'},
  {no:'FIL-114Q4-017', term:'Q4 季報',     type:'季度季報', year:'114', unit:'生命維持系統組', who:'高逸凡', time:'115-01-06 09:20', st:'late',   stTxt:'逾期受理'}
];
const tbody = document.getElementById('tbody');
logs.forEach(function(L){
  const tr = document.createElement('tr');
  tr.dataset.year = L.year;
  tr.dataset.type = L.type;
  tr.dataset.unit = L.unit;
  tr.dataset.st = L.st;
  tr.innerHTML =
    '<td class="mono">' + L.no + '</td><td>' + L.term + '</td><td class="c-unit"></td><td></td>' +
    '<td class="mono">' + L.time + '</td>' +
    '<td><span class="stag ' + L.st + '">' + L.stTxt + '</span></td>' +
    '<td><a class="op" href="detail.html">調閱 ▸</a></td>';
  tr.children[2].textContent = L.unit;
  tr.children[3].textContent = L.who;
  tbody.appendChild(tr);
});

function apply(){
  const y = document.getElementById('qYear').value;
  const t = document.getElementById('qTerm').value;
  const u = document.getElementById('qUnit').value;
  const s = document.getElementById('qSt').value;
  let n = 0;
  tbody.querySelectorAll('tr').forEach(function(tr){
    const show =
      (y === 'all' || tr.dataset.year === y) &&
      (t === 'all' || tr.dataset.type === t) &&
      (u === 'all' || tr.dataset.unit === u) &&
      (s === 'all' || tr.dataset.st === s);
    tr.classList.toggle('hide', !show);
    if (show) n++;
  });
  document.getElementById('cntTip').innerHTML = '掃描結果：共 <b>' + n + '</b> 筆歷史紀錄';
  document.getElementById('emptyTip').style.display = n ? 'none' : 'block';
}
document.getElementById('btnSearch').addEventListener('click', apply);
['qYear','qTerm','qUnit','qSt'].forEach(function(id){
  document.getElementById(id).addEventListener('change', apply);
});
apply();

setTimeout(function(){
  document.querySelectorAll('.rbar i').forEach(function(b){ b.style.width = b.dataset.w; });
}, 250);
</script>
</body>
</html>
