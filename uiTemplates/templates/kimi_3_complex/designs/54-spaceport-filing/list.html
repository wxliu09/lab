<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申報列表 · 太空艙窗定期申報平台</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1020; --panel:#141a30; --amber:#ffb454; --oxy:#3ddc97;
  --alert:#ff4d5e; --ice:#7fb2ff; --txt:#dfe8ff; --dim:#6d7ca6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 50% 120%, rgba(127,178,255,.08), transparent 60%);
  color:var(--txt);
  font-family:'Chakra Petch','Noto Sans TC',sans-serif;
  min-height:100vh;padding-bottom:40px;
}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 24px;border-bottom:1px solid rgba(127,178,255,.2);
  background:linear-gradient(180deg, rgba(20,26,48,.95), rgba(12,16,32,.9));
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--amber);font-weight:700;letter-spacing:2px;font-size:14px;
  border:1px solid rgba(255,180,84,.6);border-radius:20px;padding:7px 16px;
  box-shadow:0 0 12px rgba(255,180,84,.18), inset 0 0 10px rgba(255,180,84,.06);
  transition:all .2s;
}
.back-link:hover{background:rgba(255,180,84,.12);box-shadow:0 0 20px rgba(255,180,84,.4);}
.back-link.nav{
  color:var(--ice);border-color:rgba(127,178,255,.5);font-size:12px;padding:5px 13px;
  box-shadow:0 0 10px rgba(127,178,255,.15);
}
.back-link.nav:hover{background:rgba(127,178,255,.12);box-shadow:0 0 18px rgba(127,178,255,.4);}
.topbar h1{font-size:18px;letter-spacing:4px;}
.topbar h1 span{color:var(--amber);}
.mission-clock{
  margin-left:auto;font-size:13px;letter-spacing:2px;color:var(--dim);
  border:1px solid rgba(127,178,255,.25);border-radius:20px;padding:6px 16px;
  font-variant-numeric:tabular-nums;
}
.mission-clock b{color:var(--oxy);}

.main{padding:20px 24px;display:flex;flex-direction:column;gap:18px;}
.panel{
  background:var(--panel);border:1px solid rgba(127,178,255,.18);
  border-radius:12px;padding:18px;
  box-shadow:inset 0 0 30px rgba(5,8,20,.6);
}
.panel h2{
  font-size:13px;letter-spacing:4px;color:var(--amber);
  border-bottom:1px solid rgba(255,180,84,.25);
  padding-bottom:9px;margin-bottom:14px;
}

/* 摘要 */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.stat{
  border:1px solid rgba(127,178,255,.25);border-radius:10px;padding:14px 16px;
  background:rgba(127,178,255,.04);display:flex;align-items:center;gap:14px;
}
.stat .beacon{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.stat .sn{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat .sc{font-size:12px;letter-spacing:2px;color:var(--dim);}
.stat.g .beacon{background:var(--oxy);box-shadow:0 0 8px var(--oxy);}
.stat.g .sn{color:var(--oxy);}
.stat.a .beacon{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.stat.a .sn{color:var(--amber);}
.stat.r .beacon{background:var(--alert);box-shadow:0 0 8px var(--alert);animation:blink 1s steps(2) infinite;}
.stat.r .sn{color:var(--alert);}
@keyframes blink{50%{opacity:.15;}}

/* 篩選 */
.filter-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;letter-spacing:2px;color:var(--dim);}
.filter-bar select,.filter-bar input{
  font-family:inherit;font-size:13px;letter-spacing:1px;
  background:#0d1226;border:1px solid rgba(127,178,255,.3);
  color:var(--txt);border-radius:20px;padding:7px 14px;outline:none;
}
.filter-bar input{min-width:200px;}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--amber);box-shadow:0 0 10px rgba(255,180,84,.3);}
.filter-bar .cnt{margin-left:auto;font-size:12px;letter-spacing:2px;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{
  text-align:left;font-size:11px;letter-spacing:3px;color:var(--dim);
  border-bottom:1px solid rgba(127,178,255,.3);padding:8px;
}
td{padding:11px 8px;border-bottom:1px solid rgba(109,124,166,.15);}
tbody tr{transition:background .15s;}
tbody tr:hover{background:rgba(255,180,84,.05);}
tr.hide{display:none;}
.stag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;
  padding:3px 12px;border-radius:20px;border:1px solid currentColor;
}
.stag.done{color:var(--oxy);box-shadow:0 0 8px rgba(61,220,151,.2);}
.stag.none{color:var(--amber);box-shadow:0 0 8px rgba(255,180,84,.2);}
.stag.late{color:var(--alert);box-shadow:0 0 8px rgba(255,77,94,.25);animation:blinkTx 1.2s steps(2) infinite;}
@keyframes blinkTx{50%{opacity:.4;}}
.op{
  color:var(--ice);text-decoration:none;font-size:13px;letter-spacing:1px;white-space:nowrap;
}
.op:hover{text-decoration:underline;text-shadow:0 0 8px rgba(127,178,255,.8);}
.mono{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;}
.empty-tip{text-align:center;padding:26px;color:var(--dim);letter-spacing:4px;display:none;}
@media (max-width:760px){.filter-bar input{min-width:140px;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <h1>申報列表 <span>·</span> 8 月份月報</h1>
  <a class="back-link nav" href="history.html">歷史查詢</a>
  <a class="back-link nav" href="settings.html">申報設定</a>
  <div class="mission-clock">截止倒數 <b id="countdown">--:--:--</b></div>
</div>

<div class="main">
  <div class="panel">
    <h2>本期概要 ▸ 115 年 8 月份月報</h2>
    <div class="stat-row">
      <div class="stat g"><span class="beacon"></span><span><span class="sn">19</span><br><span class="sc">已申報</span></span></div>
      <div class="stat a"><span class="beacon"></span><span><span class="sn">3</span><br><span class="sc">未申報（期限內）</span></span></div>
      <div class="stat r"><span class="beacon"></span><span><span class="sn">2</span><br><span class="sc">逾期未報</span></span></div>
      <div class="stat"><span class="beacon" style="background:var(--ice);box-shadow:0 0 8px var(--ice);"></span><span><span class="sn" style="color:var(--ice);">24</span><br><span class="sc">應申報單位</span></span></div>
    </div>
  </div>

  <div class="panel">
    <h2>單位申報狀態 ▸ MANIFEST</h2>
    <div class="filter-bar">
      狀態：
      <select id="fState">
        <option value="all">全部</option>
        <option value="done">已申報</option>
        <option value="none">未申報</option>
        <option value="late">逾期未報</option>
      </select>
      關鍵字：<input type="text" id="fKw" placeholder="單位名稱／承辦人…">
      <span class="cnt" id="cntTip"></span>
    </div>
    <table>
      <thead>
        <tr><th>單位代號</th><th>單位名稱</th><th>承辦人</th><th>申報時間</th><th>編號</th><th>狀態</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-tip" id="emptyTip">── 雷達無符合目標 ──</div>
  </div>
</div>

<script>
const units = [
  {code:'UNT-01', name:'推進動力課',       who:'魏子軒', time:'115-08-20 10:22', no:'FIL-11508-101', st:'done', stTxt:'已申報'},
  {code:'UNT-02', name:'通訊酬載課',       who:'蘇怡安', time:'115-08-21 15:07', no:'FIL-11508-108', st:'done', stTxt:'已申報'},
  {code:'UNT-03', name='軌道材料試驗艙',   who:'周子晴', time:'—',               no:'—',            st:'late', stTxt:'逾期 2 日'},
  {code:'UNT-04', name='生命維持系統組',   who:'高逸凡', time:'—',               no:'—',            st:'late', stTxt:'逾期 1 日'},
  {code:'UNT-05', name:'姿態控制實驗室',   who:'何冠霖', time:'115-08-22 09:41', no:'FIL-11508-115', st:'done', stTxt:'已申報'},
  {code:'UNT-06', name:'熱控與散熱組',     who:'呂佩璇', time:'115-08-24 16:30', no:'FIL-11508-127', st:'done', stTxt:'已申報'},
  {code:'UNT-07', name='艙外活動支援課',   who:'游政勳', time:'—',               no:'—',            st:'none', stTxt:'未申報'},
  {code:'UNT-08', name:'電力調配中心',     who:'馮雅筑', time:'115-08-25 11:18', no:'FIL-11508-133', st:'done', stTxt:'已申報'},
  {code:'UNT-09', name='酬載整合測試組',   who:'藍于婷', time:'115-08-26 14:52', no:'FIL-11508-140', st:'done', stTxt:'已申報'},
  {code:'UNT-10', name='地面站聯絡課',     who:'古明翰', time:'—',               no:'—',            st:'none', stTxt:'未申報'},
  {code:'UNT-11', name:'結構健康監測組',   who:'柯佳穎', time:'115-08-27 08:36', no:'FIL-11508-146', st:'done', stTxt:'已申報'},
  {code:'UNT-12', name='航太醫學值班室',   who:'侯宇宸', time:'—',               no:'—',            st:'none', stTxt:'未申報'}
];
const tbody = document.getElementById('tbody');
units.forEach(function(u){
  const tr = document.createElement('tr');
  tr.dataset.st = u.st;
  tr.innerHTML =
    '<td class="mono">' + u.code + '</td><td class="c-name"></td><td></td>' +
    '<td class="mono">' + u.time + '</td><td class="mono">' + u.no + '</td>' +
    '<td><span class="stag ' + u.st + '">' + u.stTxt + '</span></td>' +
    '<td><a class="op" href="detail.html">遙測詳情 ▸</a></td>';
  tr.children[1].textContent = u.name;
  tr.children[2].textContent = u.who;
  tbody.appendChild(tr);
});

const fState = document.getElementById('fState');
const fKw = document.getElementById('fKw');
function apply(){
  const sv = fState.value, kw = fKw.value.trim();
  let n = 0;
  tbody.querySelectorAll('tr').forEach(function(tr){
    const show = (sv === 'all' || tr.dataset.st === sv) && (!kw || tr.textContent.indexOf(kw) !== -1);
    tr.classList.toggle('hide', !show);
    if (show) n++;
  });
  document.getElementById('cntTip').textContent = 'TRACKING ' + n + ' / ' + units.length + ' 單位';
  document.getElementById('emptyTip').style.display = n ? 'none' : 'block';
}
fState.addEventListener('change', apply);
fKw.addEventListener('input', apply);
apply();

/* 截止倒數（至 115-08-31 23:59:59） */
(function(){
  const t1 = new Date('2026-08-31T23:59:59+08:00').getTime();
  const el = document.getElementById('countdown');
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    let s = Math.max(0, Math.floor((t1 - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); const sec = s % 60;
    el.textContent = d + ' 日 ' + pad(h) + ':' + pad(m) + ':' + pad(sec);
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
