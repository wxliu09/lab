<!DOCTYPE html>
<!-- 40 午夜極簡 · 子頁：新增角色表單 form.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增角色 · Access Control MIS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#00e5c7;--line:rgba(255,255,255,.14);--grey:#6b6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#f5f5f5;font-family:'Noto Sans TC',sans-serif;font-weight:300;min-height:100vh}
.topbar{display:flex;align-items:center;gap:26px;padding:0 32px;height:60px;border-bottom:1px solid var(--line)}
.logo{font-size:14px;letter-spacing:6px;font-weight:400;white-space:nowrap}
.logo b{color:var(--acc);font-weight:500}
.topbar nav{display:flex;gap:2px}
.topbar nav a{color:var(--grey);text-decoration:none;font-size:12px;letter-spacing:2px;padding:6px 14px;transition:.2s}
.topbar nav a:hover{color:#fff}
.topbar nav a.on{color:var(--acc);border-bottom:1px solid var(--acc)}
.spacer{flex:1}
.back-link{color:#f5f5f5;text-decoration:none;font-size:12px;letter-spacing:2px;border:1px solid var(--line);padding:8px 18px;transition:.25s;white-space:nowrap}
.back-link:hover{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(0,229,199,.25)}
.back-link.home{color:var(--acc);border-color:rgba(0,229,199,.4)}
main{max-width:1200px;margin:0 auto;padding:30px 32px 60px}
h2{font-size:12px;letter-spacing:4px;color:var(--grey);font-weight:400;margin-bottom:16px}
h2::before{content:"◼ ";color:var(--acc);font-size:9px;vertical-align:2px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:36px}
.field{margin-bottom:22px}
.field label{display:block;font-size:11px;letter-spacing:3px;color:var(--grey);margin-bottom:8px;font-weight:400}
.field label .req{color:var(--acc)}
.field input[type=text],.field input[type=date],.field select,.field textarea{
  width:100%;background:transparent;border:1px solid var(--line);padding:11px 14px;font-size:13px;
  color:#f5f5f5;font-family:'JetBrains Mono',monospace;outline:none;transition:.2s;border-radius:0;
  color-scheme:dark;
}
.field textarea{font-family:'Noto Sans TC';resize:vertical;min-height:90px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);box-shadow:0 0 12px rgba(0,229,199,.2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.radios{display:flex;border:1px solid var(--line)}
.radios label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;font-size:12px;letter-spacing:2px;cursor:pointer;border-right:1px solid var(--line);margin:0;color:var(--grey);transition:.2s;font-weight:300}
.radios label:last-child{border-right:none}
.radios label:has(input:checked){color:var(--acc);background:rgba(0,229,199,.06);box-shadow:inset 0 -2px 0 var(--acc)}
.radios input{accent-color:var(--acc)}
.perm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
.perm-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px;display:flex;align-items:center;justify-content:space-between;transition:.2s}
.perm-cell:nth-child(3n){border-right:none}
.perm-cell:nth-last-child(-n+3){border-bottom:none}
.perm-cell:hover{background:rgba(0,229,199,.03)}
.perm-cell .pn{font-family:'JetBrains Mono';font-size:12px;letter-spacing:1px}
.perm-cell .pn small{display:block;color:var(--grey);font-size:10px;margin-top:3px;font-family:'Noto Sans TC'}
.tg{width:40px;height:20px;border:1px solid var(--grey);border-radius:20px;display:inline-block;position:relative;cursor:pointer;transition:.25s;background:transparent;flex-shrink:0}
.tg::before{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--grey);transition:.25s cubic-bezier(.3,1.4,.5,1)}
.tg.on{border-color:var(--acc);box-shadow:0 0 10px rgba(0,229,199,.35);animation:breathe 2.4s infinite}
@keyframes breathe{50%{box-shadow:0 0 16px rgba(0,229,199,.55)}}
.tg.on::before{left:22px;background:var(--acc)}
.btn{background:transparent;border:1px solid var(--acc);color:var(--acc);padding:12px 34px;font-size:12px;letter-spacing:3px;cursor:pointer;font-family:inherit;transition:.25s}
.btn:hover{background:var(--acc);color:#000;box-shadow:0 0 20px rgba(0,229,199,.5)}
.btn.ghost{border-color:var(--line);color:var(--grey)}
.btn.ghost:hover{border-color:#fff;color:#fff;background:transparent;box-shadow:none}
.actions{display:flex;gap:14px;margin-top:8px}
/* 右欄摘要 */
.summary{border:1px solid var(--line);padding:22px 24px;margin-bottom:24px}
.summary .line{display:flex;justify-content:space-between;font-size:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.summary .line:last-child{border-bottom:none}
.summary .k{color:var(--grey);letter-spacing:2px}
.summary .v{font-family:'JetBrains Mono';color:#f5f5f5}
.summary .v.acc{color:var(--acc)}
.chip{display:inline-block;font-size:10px;letter-spacing:2px;padding:3px 10px;border:1px solid var(--line);color:var(--grey)}
.chip.on{color:var(--acc);border-color:var(--acc)}
.policy{border:1px solid var(--line);padding:22px 24px;font-size:12px;line-height:2.2;color:var(--grey)}
.policy b{color:#f5f5f5;font-weight:400}
.policy::before{content:"POLICY NOTE";display:block;font-size:10px;letter-spacing:4px;color:var(--acc);margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;background:var(--acc);color:#000;padding:12px 28px;font-size:12px;letter-spacing:3px;transition:.3s;pointer-events:none;font-family:'JetBrains Mono'}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:1000px){.cols{grid-template-columns:1fr}.perm-grid{grid-template-columns:1fr 1fr}.perm-cell:nth-child(3n){border-right:1px solid var(--line)}.perm-cell:nth-child(2n){border-right:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">ACCESS <b>CONTROL</b></div>
  <nav>
    <a href="index.html">權限矩陣</a><a href="roles.html" class="on">角色管理</a><a href="audit.html">稽核報表</a><a href="keys.html">API 金鑰</a>
  </nav>
  <div class="spacer"></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <div class="cols">
    <section>
      <h2>新增角色 NEW ROLE</h2>
      <form id="roleForm">
        <div class="row2">
          <div class="field">
            <label>角色名稱 <span class="req">*</span></label>
            <input type="text" id="fName" placeholder="例如：行銷企劃" value="行銷企劃" style="font-family:'Noto Sans TC'">
          </div>
          <div class="field">
            <label>角色代碼（大寫英文）<span class="req">*</span></label>
            <input type="text" id="fCode" placeholder="MKT_STAFF" value="MKT_STAFF">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>資料範圍層級</label>
            <select id="fScope">
              <option>僅本人</option>
              <option selected>所屬部門</option>
              <option>全公司</option>
              <option>跨公司（集團）</option>
            </select>
          </div>
          <div class="field">
            <label>生效日期</label>
            <input type="date" id="fDate" value="2026-09-01">
          </div>
        </div>
        <div class="field">
          <label>帳號效期模式</label>
          <div class="radios">
            <label><input type="radio" name="exp" value="永久" checked>永久有效</label>
            <label><input type="radio" name="exp" value="年度覆審">年度覆審</label>
            <label><input type="radio" name="exp" value="專案制">專案制（到期停用）</label>
          </div>
        </div>
        <div class="field">
          <label>預設權限 PRESET PERMISSIONS</label>
          <div class="perm-grid" id="permGrid"></div>
        </div>
        <div class="field">
          <label>角色說明</label>
          <textarea id="fDesc" placeholder="說明此角色的業務職掌與授權依據…">負責行銷活動頁面維護與促銷資料上架，不涉及金流與成本資料。</textarea>
        </div>
        <div class="actions">
          <button type="submit" class="btn">建立角色 CREATE</button>
          <button type="reset" class="btn ghost">清除 RESET</button>
        </div>
      </form>
    </section>

    <aside>
      <h2>設定摘要 SUMMARY</h2>
      <div class="summary">
        <div class="line"><span class="k">角色名稱</span><span class="v" id="sName" style="font-family:'Noto Sans TC'">行銷企劃</span></div>
        <div class="line"><span class="k">角色代碼</span><span class="v acc" id="sCode">MKT_STAFF</span></div>
        <div class="line"><span class="k">資料範圍</span><span class="v" id="sScope" style="font-family:'Noto Sans TC'">所屬部門</span></div>
        <div class="line"><span class="k">效期模式</span><span class="v" id="sExp" style="font-family:'Noto Sans TC'">永久</span></div>
        <div class="line"><span class="k">已選權限</span><span class="v acc" id="sPerm">2 / 6</span></div>
        <div class="line"><span class="k">風險評等</span><span id="sRisk"><span class="chip on">LOW</span></span></div>
      </div>
      <div class="policy">
        <b>最小權限原則</b>：新角色預設不授予 delete / admin；如需授予，建立後需由系統管理員於權限矩陣二次確認。<br>
        <b>生效流程</b>：建立 → 資安覆核（1 工作天）→ 自動生效並寫入稽核軌跡。
      </div>
    </aside>
  </div>
</main>
<div id="toast">✓ ROLE MKT_STAFF CREATED</div>
<script>
const perms=[
  {p:'read',zh:'讀取',on:true},{p:'create',zh:'新增',on:true},{p:'update',zh:'修改',on:false},
  {p:'delete',zh:'刪除',on:false},{p:'export',zh:'匯出',on:false},{p:'admin',zh:'系統設定',on:false},
];
const grid=document.getElementById('permGrid');
perms.forEach(p=>{
  const c=document.createElement('div');c.className='perm-cell';
  c.innerHTML=`<div class="pn">${p.p}<small>${p.zh}</small></div>
    <button type="button" class="tg ${p.on?'on':''}" data-p="${p.p}"></button>`;
  grid.appendChild(c);
});
function refreshSummary(){
  document.getElementById('sName').textContent=document.getElementById('fName').value||'—';
  document.getElementById('sCode').textContent=document.getElementById('fCode').value||'—';
  document.getElementById('sScope').textContent=document.getElementById('fScope').value;
  document.getElementById('sExp').textContent=document.querySelector('input[name=exp]:checked').value;
  const ons=[...grid.querySelectorAll('.tg.on')].map(t=>t.dataset.p);
  document.getElementById('sPerm').textContent=ons.length+' / 6';
  const risky=ons.includes('delete')||ons.includes('admin');
  document.getElementById('sRisk').innerHTML=risky
    ?'<span class="chip">HIGH ▲ 需覆核</span>':'<span class="chip on">LOW</span>';
}
grid.addEventListener('click',e=>{
  if(!e.target.classList.contains('tg'))return;
  e.target.classList.toggle('on');refreshSummary();
});
['fName','fCode','fScope'].forEach(id=>document.getElementById(id).addEventListener('input',refreshSummary));
document.querySelectorAll('input[name=exp]').forEach(r=>r.addEventListener('change',refreshSummary));
refreshSummary();
document.getElementById('roleForm').addEventListener('submit',e=>{
  e.preventDefault();
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
  setTimeout(()=>location.href='roles.html',2400);
});
</script>
</body>
</html>
