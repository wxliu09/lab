<!DOCTYPE html>
<!-- 40 午夜極簡 · 子頁：稽核紀錄 audit.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>稽核報表 · Access Control MIS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#00e5c7;--line:rgba(255,255,255,.14);--grey:#6b6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#f5f5f5;font-family:'Noto Sans TC',sans-serif;font-weight:300;min-height:100vh}
.topbar{display:flex;align-items:center;gap:26px;padding:0 32px;height:60px;border-bottom:1px solid var(--line)}
.logo{font-size:14px;letter-spacing:6px;font-weight:400;white-space:nowrap}
.logo b{color:var(--acc);font-weight:500}
.topbar nav{display:flex;gap:2px}
.topbar nav a{color:var(--grey);text-decoration:none;font-size:12px;letter-spacing:2px;padding:6px 14px;transition:.2s}
.topbar nav a:hover{color:#fff}
.topbar nav a.on{color:var(--acc);border-bottom:1px solid var(--acc)}
.spacer{flex:1}
.back-link{color:#f5f5f5;text-decoration:none;font-size:12px;letter-spacing:2px;border:1px solid var(--line);padding:8px 18px;transition:.25s;white-space:nowrap}
.back-link:hover{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(0,229,199,.25)}
.back-link.home{color:var(--acc);border-color:rgba(0,229,199,.4)}
main{max-width:1360px;margin:0 auto;padding:30px 32px 60px}
h2{font-size:12px;letter-spacing:4px;color:var(--grey);font-weight:400;margin-bottom:16px}
h2::before{content:"◼ ";color:var(--acc);font-size:9px;vertical-align:2px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);margin-bottom:36px}
.kpi{padding:20px 26px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi h3{font-size:11px;letter-spacing:3px;color:var(--grey);font-weight:400}
.kpi .val{font-family:'JetBrains Mono';font-size:32px;font-weight:400;margin-top:6px}
.kpi .val.acc{color:var(--acc)}
.kpi .sub{font-size:11px;color:var(--grey);margin-top:2px;font-family:'JetBrains Mono'}
.filter-bar{display:flex;gap:0;border:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.filter-bar button{
  background:transparent;border:none;border-right:1px solid var(--line);color:var(--grey);
  padding:10px 22px;font-size:11px;letter-spacing:2px;cursor:pointer;font-family:'JetBrains Mono';transition:.2s;
}
.filter-bar button:last-child{border-right:none}
.filter-bar button.on{color:var(--acc);background:rgba(0,229,199,.06);box-shadow:inset 0 -2px 0 var(--acc)}
.log{border:1px solid var(--line);margin-bottom:36px}
.log-item{display:grid;grid-template-columns:170px 130px 1fr 120px;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.8;align-items:center;animation:slideIn .35s ease both}
@keyframes slideIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.log-item:hover{background:rgba(0,229,199,.03)}
.log-item .tm{font-family:'JetBrains Mono';color:var(--grey);font-size:11px;letter-spacing:1px}
.log-item .who{font-family:'JetBrains Mono';color:#f5f5f5}
.log-item .act{color:var(--acc);font-family:'JetBrains Mono'}
.log-item .obj{color:#bdbdbd}
.chip{display:inline-block;font-size:10px;letter-spacing:2px;padding:3px 10px;border:1px solid var(--line);color:var(--grey);text-align:center}
.chip.on{color:var(--acc);border-color:var(--acc)}
.chip.off{color:var(--grey)}
.chart{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);padding-bottom:0}
.chart .c{flex:1;background:rgba(0,229,199,.25);height:0;transition:height 1s ease;position:relative}
.chart .c:hover{background:var(--acc);box-shadow:0 0 10px rgba(0,229,199,.4)}
.chart .c span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono';font-size:10px;color:var(--grey);opacity:0;transition:.2s}
.chart .c:hover span{opacity:1;color:var(--acc)}
.chart-lbl{display:flex;gap:2px;margin-top:8px}
.chart-lbl span{flex:1;text-align:center;font-family:'JetBrains Mono';font-size:10px;color:var(--grey)}
.log-empty{padding:30px;text-align:center;color:var(--grey);font-size:12px;letter-spacing:2px}
@media (max-width:1000px){.log-item{grid-template-columns:1fr 1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">ACCESS <b>CONTROL</b></div>
  <nav>
    <a href="index.html">權限矩陣</a><a href="roles.html">角色管理</a><a href="audit.html" class="on">稽核報表</a><a href="keys.html">API 金鑰</a>
  </nav>
  <div class="spacer"></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <div class="kpi-row">
    <div class="kpi"><h3>本週異動</h3><div class="val">47</div><div class="sub">changes this week</div></div>
    <div class="kpi"><h3>權限提升</h3><div class="val acc">12</div><div class="sub">grants enabled</div></div>
    <div class="kpi"><h3>權限回收</h3><div class="val">35</div><div class="sub">grants revoked</div></div>
    <div class="kpi"><h3>高風險異動</h3><div class="val acc">3</div><div class="sub">delete / admin</div></div>
  </div>

  <h2>異動紀錄 CHANGE HISTORY</h2>
  <div class="filter-bar" id="filterBar">
    <button class="on" data-f="all">ALL</button>
    <button data-f="grant">GRANT 開啟</button>
    <button data-f="revoke">REVOKE 關閉</button>
    <button data-f="apply">APPLY 套用</button>
    <button data-f="risk">高風險</button>
  </div>
  <div class="log" id="log"></div>

  <h2>近 14 日異動量 ACTIVITY (14D)</h2>
  <div class="chart" id="chart"></div>
  <div class="chart-lbl" id="chartLbl"></div>
</main>
<script>
const logs=[
  {tm:'2026-08-28 20:41',who:'administrator',act:'GRANT',obj:'財務主管（FIN_MGR）→ export',type:'grant',risk:false},
  {tm:'2026-08-28 20:39',who:'administrator',act:'REVOKE',obj:'外部稽核（AUDITOR）→ update',type:'revoke',risk:false},
  {tm:'2026-08-28 18:02',who:'administrator',act:'APPLY',obj:'批次套用 4 項變更，寫入 audit_trail',type:'apply',risk:false},
  {tm:'2026-08-28 15:27',who:'sys.chen',act:'GRANT',obj:'倉儲專員（WH_STAFF）→ delete',type:'grant',risk:true},
  {tm:'2026-08-27 11:14',who:'administrator',act:'REVOKE',obj:'客服人員（CS_AGENT）→ export',type:'revoke',risk:false},
  {tm:'2026-08-27 09:50',who:'sys.chen',act:'GRANT',obj:'財務主管（FIN_MGR）→ update',type:'grant',risk:false},
  {tm:'2026-08-26 17:33',who:'administrator',act:'CREATE',obj:'新角色 外部稽核（AUDITOR）建檔',type:'apply',risk:false},
  {tm:'2026-08-26 10:05',who:'sys.lin',act:'REVOKE',obj:'實習生（INTERN）→ admin',type:'revoke',risk:true},
  {tm:'2026-08-25 14:48',who:'administrator',act:'GRANT',obj:'倉儲專員（WH_STAFF）→ export',type:'grant',risk:false},
  {tm:'2026-08-24 16:20',who:'sys.lin',act:'DISABLE',obj:'角色 實習生（INTERN）停用',type:'revoke',risk:true},
  {tm:'2026-08-24 09:12',who:'administrator',act:'APPLY',obj:'批次套用 7 項變更，寫入 audit_trail',type:'apply',risk:false},
];
const logEl=document.getElementById('log');
function render(f){
  const list=logs.filter(l=>f==='all'?true:f==='risk'?l.risk:l.type===f);
  logEl.innerHTML=list.map((l,i)=>`<div class="log-item" style="animation-delay:${i*0.04}s">
    <span class="tm">${l.tm}</span>
    <span class="who">${l.who}</span>
    <span><span class="act">${l.act}</span> <span class="obj">· ${l.obj}</span></span>
    <span class="chip ${l.risk?'':'on'}">${l.risk?'▲ RISK':'OK'}</span>
  </div>`).join('')||'<div class="log-empty">無符合條件的紀錄</div>';
}
render('all');
document.querySelectorAll('#filterBar button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#filterBar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.f);
}));
const vals=[3,5,2,7,4,6,1,3,8,5,2,4,6,9];
const chart=document.getElementById('chart'),lbl=document.getElementById('chartLbl');
const max=Math.max(...vals);
vals.forEach((v,i)=>{
  const c=document.createElement('div');c.className='c';
  c.innerHTML=`<span>${v}</span>`;
  chart.appendChild(c);
  setTimeout(()=>c.style.height=(v/max*100)+'%',150+i*50);
  const l=document.createElement('span');l.textContent=(15+i)+'';lbl.appendChild(l);
});
</script>
</body>
</html>
