<!DOCTYPE html>
<!-- 40 午夜極簡 · 子頁：角色列表 roles.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色管理 · Access Control MIS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@200;300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#00e5c7;--line:rgba(255,255,255,.14);--grey:#6b6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#f5f5f5;font-family:'Noto Sans TC',sans-serif;font-weight:300;min-height:100vh}
.topbar{display:flex;align-items:center;gap:26px;padding:0 32px;height:60px;border-bottom:1px solid var(--line)}
.logo{font-size:14px;letter-spacing:6px;font-weight:400;white-space:nowrap}
.logo b{color:var(--acc);font-weight:500}
.topbar nav{display:flex;gap:2px}
.topbar nav a{color:var(--grey);text-decoration:none;font-size:12px;letter-spacing:2px;padding:6px 14px;transition:.2s}
.topbar nav a:hover{color:#fff}
.topbar nav a.on{color:var(--acc);border-bottom:1px solid var(--acc)}
.spacer{flex:1}
.back-link{color:#f5f5f5;text-decoration:none;font-size:12px;letter-spacing:2px;border:1px solid var(--line);padding:8px 18px;transition:.25s;white-space:nowrap}
.back-link:hover{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(0,229,199,.25)}
.back-link.home{color:var(--acc);border-color:rgba(0,229,199,.4)}
main{max-width:1360px;margin:0 auto;padding:30px 32px 60px}
h2{font-size:12px;letter-spacing:4px;color:var(--grey);font-weight:400;margin-bottom:16px}
h2::before{content:"◼ ";color:var(--acc);font-size:9px;vertical-align:2px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);margin-bottom:36px}
.kpi{padding:20px 26px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi h3{font-size:11px;letter-spacing:3px;color:var(--grey);font-weight:400}
.kpi .val{font-family:'JetBrains Mono';font-size:32px;font-weight:400;margin-top:6px}
.kpi .val.acc{color:var(--acc)}
.kpi .sub{font-size:11px;color:var(--grey);margin-top:2px;font-family:'JetBrains Mono'}
.role-table{border:1px solid var(--line);margin-bottom:36px}
.role-table table{width:100%;border-collapse:collapse}
.role-table th,.role-table td{border:1px solid var(--line);padding:14px 18px;text-align:left}
.role-table thead th{font-size:11px;letter-spacing:2px;color:#f5f5f5;font-weight:400;background:rgba(255,255,255,.03)}
.role-table tbody tr{transition:.15s;cursor:pointer}
.role-table tbody tr:hover{background:rgba(0,229,199,.04)}
.role-table td:hover{box-shadow:inset 2px 0 0 var(--acc)}
.code{font-family:'JetBrains Mono';font-size:12px;color:var(--acc)}
.mut{font-family:'JetBrains Mono';font-size:11px;color:var(--grey)}
.chip{display:inline-block;font-size:10px;letter-spacing:2px;padding:3px 10px;border:1px solid var(--line);color:var(--grey)}
.chip.on{color:var(--acc);border-color:var(--acc)}
.mini-perms{display:flex;gap:6px;flex-wrap:wrap}
.mini-perms span{font-family:'JetBrains Mono';font-size:10px;letter-spacing:1px;padding:2px 8px;border:1px solid var(--line);color:var(--grey)}
.mini-perms span.g{color:var(--acc);border-color:rgba(0,229,199,.5)}
.tg{width:40px;height:20px;border:1px solid var(--grey);border-radius:20px;display:inline-block;position:relative;cursor:pointer;transition:.25s;vertical-align:middle;background:transparent}
.tg::before{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--grey);transition:.25s cubic-bezier(.3,1.4,.5,1)}
.tg.on{border-color:var(--acc);box-shadow:0 0 10px rgba(0,229,199,.35)}
.tg.on::before{left:22px;background:var(--acc)}
.btn-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:14px 22px;margin-bottom:36px}
.btn-row .tip{font-size:12px;color:var(--grey);letter-spacing:2px}
.btn{background:transparent;border:1px solid var(--acc);color:var(--acc);padding:10px 30px;font-size:12px;letter-spacing:3px;cursor:pointer;font-family:inherit;transition:.25s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--acc);color:#000;box-shadow:0 0 20px rgba(0,229,199,.5)}
.member-bars{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line)}
.mb{padding:18px 20px;border-right:1px solid var(--line)}
.mb:last-child{border-right:none}
.mb h4{font-size:12px;font-weight:400;letter-spacing:1px;margin-bottom:10px}
.mb .n{font-family:'JetBrains Mono';font-size:26px}
.mb .bar{height:4px;background:rgba(255,255,255,.08);margin-top:12px}
.mb .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width 1s ease;box-shadow:0 0 8px rgba(0,229,199,.5)}
@media (max-width:1000px){.member-bars{grid-template-columns:repeat(2,1fr)}.mb{border-bottom:1px solid var(--line)}.kpi-row{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">ACCESS <b>CONTROL</b></div>
  <nav>
    <a href="index.html">權限矩陣</a><a href="roles.html" class="on">角色管理</a><a href="audit.html">稽核報表</a><a href="keys.html">API 金鑰</a>
  </nav>
  <div class="spacer"></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <div class="kpi-row">
    <div class="kpi"><h3>角色總數</h3><div class="val">5</div><div class="sub">roles defined</div></div>
    <div class="kpi"><h3>啟用角色</h3><div class="val acc">4</div><div class="sub">active</div></div>
    <div class="kpi"><h3>指派帳號</h3><div class="val">38</div><div class="sub">accounts bound</div></div>
    <div class="kpi"><h3>停用角色</h3><div class="val">1</div><div class="sub">disabled</div></div>
  </div>

  <h2>角色清單 ROLE LIST</h2>
  <div class="role-table">
    <table>
      <thead><tr><th style="width:170px">角色</th><th style="width:120px">代碼</th><th>已授權限</th><th style="width:90px">帳號數</th><th style="width:130px">建立日期</th><th style="width:90px">狀態</th><th style="width:70px">啟用</th></tr></thead>
      <tbody id="roleBody"></tbody>
    </table>
  </div>

  <div class="btn-row">
    <div class="tip">◼ 角色停用後，其下帳號將僅保留 read 權限；點擊表格列可前往新增 / 編輯表單。</div>
    <a class="btn" href="form.html">＋ 新增角色 NEW ROLE</a>
  </div>

  <h2>各角色帳號分佈 ACCOUNTS PER ROLE</h2>
  <div class="member-bars" id="mbars"></div>
</main>
<script>
const roles=[
  {name:'系統管理員',code:'SYSADMIN',perms:['read','create','update','delete','export','admin'],n:3,created:'2025-11-12',on:true},
  {name:'財務主管',code:'FIN_MGR',perms:['read','create','update','export'],n:5,created:'2025-12-03',on:true},
  {name:'倉儲專員',code:'WH_STAFF',perms:['read','create','update'],n:18,created:'2026-01-20',on:true},
  {name:'客服人員',code:'CS_AGENT',perms:['read'],n:11,created:'2026-02-14',on:true},
  {name:'外部稽核',code:'AUDITOR',perms:['read','export'],n:1,created:'2026-06-01',on:false},
];
const all=['read','create','update','delete','export','admin'];
const tb=document.getElementById('roleBody');
roles.forEach((r,i)=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${r.name}</td><td class="code">${r.code}</td>
    <td><div class="mini-perms">${all.map(p=>`<span class="${r.perms.includes(p)?'g':''}">${p}</span>`).join('')}</div></td>
    <td class="code">${r.n}</td><td class="mut">${r.created}</td>
    <td><span class="chip ${r.on?'on':''}">${r.on?'ACTIVE':'DISABLED'}</span></td>
    <td><button class="tg ${r.on?'on':''}" data-i="${i}" aria-label="toggle ${r.code}"></button></td>`;
  tr.addEventListener('click',e=>{
    if(e.target.classList.contains('tg'))return;
    location.href='form.html';
  });
  tb.appendChild(tr);
});
tb.addEventListener('click',e=>{
  if(!e.target.classList.contains('tg'))return;
  e.target.classList.toggle('on');
  const chip=e.target.closest('tr').querySelector('.chip');
  const on=e.target.classList.contains('on');
  chip.className='chip'+(on?' on':'');chip.textContent=on?'ACTIVE':'DISABLED';
});
const mb=document.getElementById('mbars');
const maxN=Math.max(...roles.map(r=>r.n));
roles.forEach(r=>{
  const d=document.createElement('div');d.className='mb';
  d.innerHTML=`<h4>${r.name}</h4><div class="n">${r.n}<span class="mut"> 帳號</span></div>
    <div class="bar"><i></i></div>`;
  mb.appendChild(d);
  setTimeout(()=>d.querySelector('i').style.width=(r.n/maxN*100)+'%',250);
});
</script>
</body>
</html>
