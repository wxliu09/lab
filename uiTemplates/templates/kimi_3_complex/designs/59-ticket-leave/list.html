<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假單列表 · 硬式車票差勤假單系統</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#3a2c22; --card:#e9d8b4; --card-l:#f2e7cd; --ink:#24406e; --stamp:#b4553f;
  --line:#c9b58c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);
  min-height:100vh;background:var(--desk);
  background-image:
    radial-gradient(circle at 25% 15%, rgba(255,240,200,.06), transparent 40%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 90px);
}
.mono{font-family:'Courier Prime',monospace}

.topbar{
  display:flex;align-items:center;gap:20px;padding:16px 30px;flex-wrap:wrap;
  background:#2c211a;border-bottom:3px solid var(--stamp);
  box-shadow:0 4px 14px rgba(0,0,0,.4);position:sticky;top:0;z-index:60;
}
.back{
  text-decoration:none;font-weight:900;font-size:14px;letter-spacing:2px;
  color:var(--card);border:2px solid var(--card);padding:7px 16px;
  background:linear-gradient(180deg, rgba(233,216,180,.12), transparent);
  transition:all .15s;
}
.back:hover{background:var(--card);color:var(--ink)}
.brand{color:var(--card);font-size:21px;font-weight:900;letter-spacing:4px}
.brand small{display:block;font-family:'Courier Prime';font-size:10px;letter-spacing:3px;color:#a9927a;font-weight:400;margin-top:2px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.subnav a{
  text-decoration:none;color:var(--card);font-size:13px;font-weight:900;letter-spacing:2px;padding:6px 14px;
  border:1.5px dashed #a9927a;transition:all .15s;
}
.subnav a:hover{border-style:solid;border-color:var(--card);background:rgba(233,216,180,.15)}
.subnav a.on{border-style:solid;border-color:var(--card);background:rgba(233,216,180,.22)}

.wrap{max-width:1400px;margin:0 auto;padding:34px}
.sec-title{
  color:var(--card);font-size:13px;letter-spacing:4px;font-weight:700;margin:0 0 16px 4px;
  display:flex;align-items:center;gap:12px;
}
.sec-title::after{content:'';flex:1;height:1px;background:repeating-linear-gradient(90deg,#a9927a,#a9927a 6px,transparent 6px,transparent 12px)}

/* 統計票券 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:34px}
.bal{display:flex;align-items:stretch;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.3));transition:transform .2s}
.bal:hover{transform:translateX(6px)}
.bal .punches{width:28px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;padding:8px 0;background:var(--card);border-right:2px dashed rgba(36,64,110,.4)}
.bal .punches i{width:9px;height:9px;border-radius:50%;background:var(--desk);box-shadow:inset 1px 2px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.4)}
.bal .main{flex:1;padding:13px 18px;display:flex;align-items:center;gap:16px}
.bal.b1 .main{background:var(--card)}
.bal.b2 .main{background:#d8e0c8}
.bal.b3 .main{background:#ecd3c8}
.bal.b4 .main{background:#d3d9e8}
.bal.b1 .punches{background:var(--card)} .bal.b2 .punches{background:#d8e0c8}
.bal.b3 .punches{background:#ecd3c8} .bal.b4 .punches{background:#d3d9e8}
.bal .name{font-weight:900;font-size:15px;letter-spacing:2px}
.bal .en{font-family:'Courier Prime';font-size:10px;letter-spacing:2px;color:var(--stamp)}
.bal .days{margin-left:auto;text-align:right}
.bal .days b{font-family:'Courier Prime';font-size:26px;font-weight:700}
.bal .days small{display:block;font-size:10px;letter-spacing:2px;color:var(--stamp)}

/* 查詢板 */
.board{
  background:var(--card);filter:drop-shadow(5px 6px 0 rgba(0,0,0,.35));padding:20px 22px;
  background-image:repeating-linear-gradient(0deg, rgba(36,64,110,.03) 0 2px, transparent 2px 5px);
}
.t-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}
.t-head b{font-size:16px;font-weight:900;letter-spacing:3px}
.t-head .no{font-family:'Courier Prime';font-size:12px;letter-spacing:1px}
.qbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qbar select,.qbar input{
  padding:7px 10px;font-family:inherit;font-size:13px;border:1.5px solid var(--ink);
  background:rgba(255,255,255,.55);color:var(--ink);outline:none;
}
.qbar input{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{
  font-size:11px;letter-spacing:2px;color:var(--stamp);text-align:left;font-weight:900;
  border-bottom:2px solid var(--ink);padding:8px 10px;white-space:nowrap;
}
tbody td{padding:10px;border-bottom:1.5px dashed var(--line);vertical-align:middle}
tbody tr{transition:all .18s;cursor:pointer}
tbody tr:hover{background:rgba(36,64,110,.08);transform:translateX(5px)}
.mono-td{font-family:'Courier Prime';font-size:12.5px;white-space:nowrap}
.status{
  font-size:11.5px;font-weight:900;letter-spacing:2px;padding:3px 10px;white-space:nowrap;
  border:1.5px solid currentColor;display:inline-block;
}
.st-approved{color:#2e6b3a;background:rgba(46,107,58,.1)}
.st-pending{color:#a36b00;background:rgba(163,107,0,.12)}
.st-rejected{color:var(--stamp);background:rgba(180,85,63,.12)}
.holemark{
  display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--desk);
  box-shadow:inset 1px 2px 2px rgba(0,0,0,.55);margin-right:6px;vertical-align:-1px;
  animation:punchin .35s cubic-bezier(.2,1.6,.4,1);
}
@keyframes punchin{0%{transform:scale(2.6);opacity:0;box-shadow:0 0 0 4px rgba(180,85,63,.5)}100%{transform:scale(1);opacity:1}}
.rowpunch{animation:rowshake .3s}
@keyframes rowshake{0%,100%{transform:none}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}}
.approve-btn{
  font-family:inherit;font-size:12px;font-weight:900;letter-spacing:1px;cursor:pointer;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:4px 12px;
  transition:all .15s;white-space:nowrap;
}
.approve-btn:hover{background:var(--ink);color:var(--card)}
.stamp-ok{
  display:inline-block;border:2.5px solid var(--stamp);color:var(--stamp);font-weight:900;
  font-size:13px;letter-spacing:4px;padding:3px 12px;transform:rotate(-6deg);
  animation:stampIn .4s cubic-bezier(.2,2,.4,1);
}
@keyframes stampIn{0%{transform:rotate(-6deg) scale(2.2);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:.9}}
.empty{padding:26px;text-align:center;color:var(--stamp);letter-spacing:3px;font-weight:700}
.footnote{color:#a9927a;font-size:12px;letter-spacing:2px;margin-top:18px}
.footnote a{color:var(--card)}
</style>
</head>
<body>

<header class="topbar">
  <a class="back mono" href="../../index.html">← 返回入口</a>
  <div class="brand">硬式車票 · 差勤假單系統<small>EDMONDSON LEAVE TICKET OFFICE — RECORDS LEDGER</small></div>
  <nav class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="list.html" class="on">假單列表</a>
    <a href="detail.html">假單詳情</a>
    <a href="form.html">新增假單</a>
    <a href="balance.html">餘額查詢</a>
  </nav>
</header>

<div class="wrap">
  <h3 class="sec-title">本月概況 MONTHLY SUMMARY</h3>
  <div class="stats">
    <div class="bal b1">
      <div class="punches"><i></i><i></i><i></i></div>
      <div class="main"><div><div class="name">本月送審</div><div class="en">SUBMITTED</div></div><div class="days"><b>6</b><small>張票</small></div></div>
    </div>
    <div class="bal b2">
      <div class="punches"><i></i><i></i><i></i></div>
      <div class="main"><div><div class="name">已核准</div><div class="en">APPROVED</div></div><div class="days"><b>4</b><small>張票</small></div></div>
    </div>
    <div class="bal b4">
      <div class="punches"><i></i><i></i><i></i></div>
      <div class="main"><div><div class="name">審核中</div><div class="en">PENDING</div></div><div class="days"><b id="cPending">1</b><small>張票</small></div></div>
    </div>
    <div class="bal b3">
      <div class="punches"><i></i><i></i><i></i></div>
      <div class="main"><div><div class="name">已退回</div><div class="en">REJECTED</div></div><div class="days"><b>1</b><small>張票</small></div></div>
    </div>
  </div>

  <h3 class="sec-title">假單存根簿 TICKET RECORDS</h3>
  <div class="board">
    <div class="t-head"><b>假 單 列 表</b><span class="no">LEDGER 2026 · 全卷</span></div>
    <div class="qbar">
      <select id="qStatus">
        <option value="">全部狀態</option><option value="approved">已核准</option>
        <option value="pending">審核中</option><option value="rejected">已退回</option>
      </select>
      <select id="qType">
        <option value="">全部假別</option><option>特別休假</option><option>病假</option>
        <option>事假</option><option>生理假</option><option>家庭照顧假</option>
      </select>
      <input id="qKw" placeholder="搜尋單號或事由…">
    </div>
    <table>
      <thead>
        <tr><th>驗孔</th><th>單號</th><th>假別</th><th>期間</th><th>天數</th><th>事由</th><th>狀態</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="footnote">※ 點假單列可查看 <a href="detail.html">假單詳情</a>；審核中假單可就地打孔核准。</div>
</div>

<script>
const RECORDS = [
  {no:'LV-2608-039', type:'特別休假', from:'09/07', to:'09/08', days:2,   reason:'陪同母親至高雄長庚回診', status:'pending'},
  {no:'LV-2608-036', type:'特別休假', from:'08/24', to:'08/25', days:2,   reason:'返台南掃墓祭祖', status:'approved'},
  {no:'LV-2608-031', type:'事假',     from:'08/19', to:'08/19', days:1,   reason:'陪同子女新生註冊報到', status:'approved'},
  {no:'LV-2608-027', type:'病假',     from:'08/13', to:'08/14', days:2,   reason:'急性腸胃炎就醫（附診斷書）', status:'approved'},
  {no:'LV-2607-052', type:'特別休假', from:'07/30', to:'07/31', days:2,   reason:'家庭旅遊（墾丁）', status:'approved'},
  {no:'LV-2607-044', type:'事假',     from:'07/17', to:'07/17', days:0.5, reason:'至區公所辦理印鑑證明', status:'approved'},
  {no:'LV-2607-038', type:'生理假',   from:'07/09', to:'07/09', days:1,   reason:'身體不適在家休養', status:'approved'},
  {no:'LV-2606-029', type:'家庭照顧假', from:'06/22', to:'06/23', days:2, reason:'照顧確診流感之女兒', status:'rejected'},
  {no:'LV-2606-021', type:'特別休假', from:'06/08', to:'06/10', days:3,   reason:'參加妹妹婚禮（屏東）', status:'approved'},
];
const STATUS = {approved:['已核准','st-approved'], pending:['審核中','st-pending'], rejected:['已退回','st-rejected']};
const tbody = document.getElementById('tbody');

function render(){
  const qs = document.getElementById('qStatus').value;
  const qt = document.getElementById('qType').value;
  const kw = document.getElementById('qKw').value.trim();
  const rows = RECORDS.filter(r =>
    (!qs || r.status===qs) && (!qt || r.type===qt) &&
    (!kw || r.no.includes(kw) || r.reason.includes(kw))
  );
  document.getElementById('cPending').textContent = RECORDS.filter(r=>r.status==='pending').length;
  if (!rows.length){ tbody.innerHTML = '<tr><td colspan="8"><div class="empty">— 查無符合之假單存根 —</div></td></tr>'; return; }
  tbody.innerHTML = rows.map(r=>{
    const [label, cls] = STATUS[r.status];
    return `<tr data-no="${r.no}">
      <td>${r.status==='approved' ? '<span class="holemark"></span>' : ''}</td>
      <td class="mono-td"><b>${r.no}</b></td>
      <td>${r.type}</td>
      <td class="mono-td">${r.from} — ${r.to}</td>
      <td class="mono-td">${r.days}</td>
      <td>${r.reason}</td>
      <td><span class="status ${cls}">${label}</span></td>
      <td>${r.status==='pending' ? '<button class="approve-btn">打孔核准</button>' : (r.status==='approved' ? '<span class="stamp-ok">准</span>' : '')}</td>
    </tr>`;
  }).join('');
}

tbody.addEventListener('click', e=>{
  const b = e.target.closest('.approve-btn');
  if (b){
    const tr = b.closest('tr');
    const rec = RECORDS.find(r=>r.no===tr.dataset.no);
    tr.classList.add('rowpunch');
    b.disabled = true; b.textContent = '打孔中…';
    setTimeout(()=>{ rec.status = 'approved'; render(); }, 520);
    e.stopPropagation();
    return;
  }
  if (e.target.closest('tr[data-no]')) location.href = 'detail.html';
});

['qStatus','qType'].forEach(id=>document.getElementById(id).addEventListener('change', render));
document.getElementById('qKw').addEventListener('input', render);
render();
</script>
</body>
</html>
