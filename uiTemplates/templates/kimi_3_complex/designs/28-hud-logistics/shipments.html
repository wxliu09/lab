<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貨件列表 · SKYLINK 指揮中心</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:#030a14;color:#b8ffd9;min-height:100vh;position:relative;overflow-x:hidden}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
    background:repeating-linear-gradient(0deg,rgba(57,255,136,.028) 0 1px,transparent 1px 3px)}
  .mono{font-family:'Share Tech Mono',monospace}
  header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid rgba(57,255,136,.25);background:rgba(6,18,31,.85);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .back{font-family:'Share Tech Mono',monospace;font-size:13px;color:#39ff88;text-decoration:none;border:1px solid #39ff88;padding:6px 14px;letter-spacing:1px;transition:.2s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .back:hover{background:#39ff88;color:#030a14;box-shadow:0 0 18px rgba(57,255,136,.6)}
  .back.dim{color:#4a7a63;border-color:#4a7a63}
  .back.dim:hover{background:#39ff88;color:#030a14;border-color:#39ff88}
  h1{font-size:17px;letter-spacing:3px;color:#39ff88;text-shadow:0 0 12px rgba(57,255,136,.6)}
  .clock{margin-left:auto;font-family:'Share Tech Mono',monospace;color:#22d3ee;font-size:15px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:18px 22px 6px}
  .hud{background:rgba(6,18,31,.8);border:1px solid rgba(57,255,136,.3);position:relative;padding:14px 16px;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
  .hud::before{content:'';position:absolute;top:0;left:0;width:26px;height:2px;background:#39ff88;box-shadow:0 0 8px #39ff88}
  .kpi .lb{font-size:11px;letter-spacing:2px;color:#4a7a63;font-family:'Share Tech Mono',monospace}
  .kpi .vl{font-size:28px;font-family:'Share Tech Mono',monospace;color:#39ff88;text-shadow:0 0 14px rgba(57,255,136,.5);margin-top:4px}
  .kpi .sub{font-size:11px;margin-top:3px}
  .ok{color:#39ff88}.warn{color:#ffb454}.bad{color:#ff4d5e}.cyan{color:#22d3ee}
  main{padding:14px 22px 30px}
  .panel{background:rgba(6,18,31,.8);border:1px solid rgba(57,255,136,.3);padding:16px;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
  .ptitle{font-size:13px;letter-spacing:3px;color:#39ff88;font-family:'Share Tech Mono',monospace;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .ptitle::before{content:'▸';color:#22d3ee}
  .toolbar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:1px;color:#4a7a63;border:1px solid rgba(57,255,136,.25);padding:6px 14px;cursor:pointer;transition:.2s;background:transparent}
  .chip:hover{color:#39ff88;border-color:#39ff88}
  .chip.on{color:#030a14;background:#39ff88;border-color:#39ff88;box-shadow:0 0 14px rgba(57,255,136,.5)}
  .q{margin-left:auto;background:rgba(3,10,20,.8);border:1px solid rgba(57,255,136,.3);color:#b8ffd9;font-family:'Share Tech Mono',monospace;font-size:12.5px;padding:8px 14px;width:250px;outline:none}
  .q:focus{border-color:#39ff88;box-shadow:0 0 10px rgba(57,255,136,.3)}
  .q::placeholder{color:#4a7a63}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;color:#4a7a63;text-align:left;padding:9px 10px;border-bottom:1px solid rgba(57,255,136,.3)}
  td{padding:10px;border-bottom:1px solid rgba(57,255,136,.12);font-family:'Share Tech Mono',monospace;font-size:12.5px}
  tbody tr{transition:.15s}
  tbody tr:hover{background:rgba(57,255,136,.07)}
  .tid{color:#22d3ee;text-decoration:none;border-bottom:1px dashed rgba(34,211,238,.5)}
  .tid:hover{color:#39ff88;border-color:#39ff88;text-shadow:0 0 8px rgba(57,255,136,.6)}
  .tag{font-size:11px;padding:2px 9px;border:1px solid;letter-spacing:1px;white-space:nowrap}
  .t-air{color:#22d3ee;border-color:#22d3ee}.t-sea{color:#39ff88;border-color:#39ff88}
  .t-road{color:#ffb454;border-color:#ffb454}.t-delay{color:#ff4d5e;border-color:#ff4d5e;animation:blinkred 1.2s infinite}
  @keyframes blinkred{50%{opacity:.45}}
  .cnt{font-family:'Share Tech Mono',monospace;font-size:11.5px;color:#4a7a63;margin-top:12px;letter-spacing:1px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <a class="back" href="../../index.html">← BACK</a>
  <a class="back dim" href="index.html">⌂ CONSOLE</a>
  <h1>◉ SHIPMENT MANIFEST — 貨件列表</h1>
  <a class="back" href="form.html">＋ NEW ORDER</a>
  <a class="back dim" href="report.html">REPORT</a>
  <span class="clock" id="clock">--:--:--</span>
</header>

<section class="kpis">
  <div class="hud kpi"><div class="lb">TOTAL / 總貨件</div><div class="vl">1,472</div><div class="sub ok">▲ 本週 +86</div></div>
  <div class="hud kpi"><div class="lb">IN TRANSIT / 在途</div><div class="vl cyan">1,284</div><div class="sub ok">87.2% 佔比</div></div>
  <div class="hud kpi"><div class="lb">DELAYED / 延誤</div><div class="vl warn">23</div><div class="sub warn">⚠ 5 件逾 24 小時</div></div>
  <div class="hud kpi"><div class="lb">CUSTOMS HOLD / 待清關</div><div class="vl bad">9</div><div class="sub bad">✖ 需補件 3</div></div>
</section>

<main>
  <div class="panel">
    <div class="ptitle">FILTER &amp; QUERY — 篩選查詢</div>
    <div class="toolbar2">
      <button class="chip on" data-f="all">ALL 全部</button>
      <button class="chip" data-f="air">✈ 空運</button>
      <button class="chip" data-f="sea">🚢 海運</button>
      <button class="chip" data-f="road">🚚 陸運</button>
      <button class="chip" data-f="delay">⚠ 異常</button>
      <input class="q" id="q" placeholder="SEARCH: 追蹤編號 / 品項 / 路線…">
    </div>
  </div>
  <div style="height:14px"></div>
  <div class="panel">
    <div class="ptitle">ACTIVE MANIFEST — 重點監控貨件</div>
    <table>
      <thead><tr><th>追蹤編號</th><th>品項</th><th>路線</th><th>運具</th><th>重量/材積</th><th>狀態</th><th>ETA</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="cnt" id="cnt"></div>
  </div>
</main>
<script>
const SHIP=[
  {id:'SL-88412073',item:'晶圓設備(恆溫)',route:'TPE → PHX',m:'air',mt:'✈ 空運',w:'1,240 KG / 8.2 CBM',st:['t-air','飛航中'],eta:'08/30 06:20'},
  {id:'SL-88412065',item:'生技試劑(冷鏈)',route:'KHH → SIN',m:'sea',mt:'🚢 海運',w:'860 KG / 4.0 CBM',st:['t-sea','航程中'],eta:'09/02 14:00'},
  {id:'SL-88412058',item:'汽車零組件',route:'TXG → TPE',m:'road',mt:'🚚 陸運',w:'2,150 KG',st:['t-road','配送中'],eta:'08/28 21:45'},
  {id:'SL-88412041',item:'醫療顯影劑(冷鏈)',route:'TPE → FRA',m:'air',mt:'✈ 空運',w:'420 KG / 2.1 CBM',st:['t-delay','溫控異常'],eta:'08/29 18:10',delay:1},
  {id:'SL-88412036',item:'電競筆電整櫃',route:'CAN → KHH',m:'sea',mt:'🚢 海運',w:'12,400 KG / 40HQ',st:['t-sea','航程中'],eta:'08/31 09:30'},
  {id:'SL-88412029',item:'精密儀器',route:'TPE → KHH',m:'road',mt:'🚚 陸運',w:'640 KG',st:['t-road','配送中'],eta:'08/28 20:15'},
  {id:'SL-88412022',item:'伺服器機櫃 x6',route:'SIN → TPE',m:'sea',mt:'🚢 海運',w:'3,880 KG / 20GP',st:['t-sea','航程中'],eta:'09/01 11:00'},
  {id:'SL-88412015',item:'疫苗冷鏈箱',route:'TPE → OKA',m:'air',mt:'✈ 空運',w:'95 KG / 0.8 CBM',st:['t-air','飛航中'],eta:'08/29 07:40'},
  {id:'SL-88412008',item:'風機葉片螺栓組',route:'TXG → HAM',m:'sea',mt:'🚢 海運',w:'9,200 KG / OT',st:['t-delay','路線偏離'],eta:'09/06 16:00',delay:1},
  {id:'SL-88411997',item:'半導體化學品(危)',route:'KHH → TPE',m:'road',mt:'🚚 陸運',w:'1,100 KG',st:['t-road','配送中'],eta:'08/28 23:30'}
];
let f='all';
const tbody=document.getElementById('tbody');
function render(){
  const q=document.getElementById('q').value.trim().toUpperCase();
  const list=SHIP.filter(s=>{
    const okF = f==='all'||(f==='delay'?s.delay:s.m===f);
    const okQ = !q||(s.id+s.item+s.route).toUpperCase().includes(q);
    return okF&&okQ;
  });
  tbody.innerHTML=list.map(s=>`
    <tr><td><a class="tid" href="tracking.html">${s.id}</a></td><td style="font-family:'Noto Sans TC'">${s.item}</td>
    <td>${s.route}</td><td>${s.mt}</td><td>${s.w}</td>
    <td><span class="tag ${s.st[0]}">${s.st[1]}</span></td><td class="${s.delay?'bad':''}">${s.eta}</td></tr>`).join('');
  document.getElementById('cnt').textContent=`▸ QUERY RESULT: ${list.length} / ${SHIP.length} RECORDS`;
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); f=c.dataset.f; render();
}));
document.getElementById('q').addEventListener('input',render);
render();
function tick(){ const d=new Date();
  document.getElementById('clock').textContent='UTC+8 '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')+' TST';
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
