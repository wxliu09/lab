<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增託運單 · SKYLINK</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:#030a14;color:#b8ffd9;min-height:100vh;position:relative;overflow-x:hidden}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
    background:repeating-linear-gradient(0deg,rgba(57,255,136,.028) 0 1px,transparent 1px 3px)}
  .mono{font-family:'Share Tech Mono',monospace}
  header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid rgba(57,255,136,.25);background:rgba(6,18,31,.85);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .back{font-family:'Share Tech Mono',monospace;font-size:13px;color:#39ff88;text-decoration:none;border:1px solid #39ff88;padding:6px 14px;letter-spacing:1px;transition:.2s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .back:hover{background:#39ff88;color:#030a14;box-shadow:0 0 18px rgba(57,255,136,.6)}
  .back.dim{color:#4a7a63;border-color:#4a7a63}
  .back.dim:hover{background:#39ff88;color:#030a14;border-color:#39ff88}
  h1{font-size:17px;letter-spacing:3px;color:#39ff88;text-shadow:0 0 12px rgba(57,255,136,.6)}
  .clock{margin-left:auto;font-family:'Share Tech Mono',monospace;color:#22d3ee;font-size:15px}
  main{padding:18px 22px 30px;display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
  .hud{background:rgba(6,18,31,.8);border:1px solid rgba(57,255,136,.3);position:relative;padding:18px;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
  .hud::before{content:'';position:absolute;top:0;left:0;width:26px;height:2px;background:#39ff88;box-shadow:0 0 8px #39ff88}
  .ptitle{font-size:13px;letter-spacing:3px;color:#39ff88;font-family:'Share Tech Mono',monospace;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .ptitle::before{content:'▸';color:#22d3ee}
  .ok{color:#39ff88}.warn{color:#ffb454}.bad{color:#ff4d5e}.cyan{color:#22d3ee}
  .sttag{font-size:11px;padding:3px 10px;border:1px solid #ffb454;color:#ffb454;letter-spacing:2px;font-family:'Share Tech Mono',monospace;margin-left:auto}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;letter-spacing:2px;color:#4a7a63;font-family:'Share Tech Mono',monospace;margin-bottom:6px}
  .inp{width:100%;background:rgba(3,10,20,.85);border:1px solid rgba(57,255,136,.3);color:#b8ffd9;font-family:'Share Tech Mono',monospace;font-size:13px;padding:10px 12px;outline:none;transition:.2s}
  .inp:focus{border-color:#39ff88;box-shadow:0 0 10px rgba(57,255,136,.3)}
  select.inp option{background:#06121f}
  textarea.inp{min-height:96px;resize:vertical;font-family:'Noto Sans TC',sans-serif;line-height:1.7}
  .opts{display:flex;gap:9px;flex-wrap:wrap}
  .opt{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid rgba(57,255,136,.25);font-size:12.5px;cursor:pointer;transition:.2s;font-family:'Noto Sans TC',sans-serif;background:rgba(57,255,136,.03)}
  .opt:has(input:checked){border-color:#39ff88;color:#39ff88;box-shadow:0 0 10px rgba(57,255,136,.3)}
  .opt input{accent-color:#39ff88}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px dashed rgba(57,255,136,.18);font-family:'Share Tech Mono',monospace}
  .kv:last-child{border:none}
  .kv .k{color:#4a7a63;letter-spacing:1px}
  .big{font-family:'Share Tech Mono',monospace;font-size:32px;color:#39ff88;text-shadow:0 0 14px rgba(57,255,136,.5);margin:6px 0}
  .btn{display:inline-block;width:100%;text-align:center;background:#39ff88;color:#030a14;border:none;font-family:'Share Tech Mono',monospace;font-size:14px;font-weight:700;letter-spacing:3px;padding:13px;cursor:pointer;transition:.2s;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  .btn:hover{box-shadow:0 0 24px rgba(57,255,136,.7)}
  .btn.ghost{background:transparent;border:1px solid #4a7a63;color:#4a7a63;margin-top:10px}
  .btn.ghost:hover{border-color:#39ff88;color:#39ff88;box-shadow:none}
  .idbox{border:1px dashed rgba(34,211,238,.5);padding:12px;margin-bottom:14px;text-align:center}
  .idbox .id{font-family:'Share Tech Mono',monospace;font-size:22px;color:#22d3ee;letter-spacing:2px;text-shadow:0 0 10px rgba(34,211,238,.5)}
  @media(max-width:1100px){main{grid-template-columns:1fr}.frow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a class="back" href="../../index.html">← BACK</a>
  <a class="back dim" href="index.html">⌂ CONSOLE</a>
  <a class="back dim" href="shipments.html">≡ MANIFEST</a>
  <h1>◉ NEW SHIPPING ORDER — 新增託運單</h1>
  <span class="clock" id="clock">--:--:--</span>
</header>

<main>
  <form class="hud" onsubmit="return false">
    <div class="ptitle">ORDER FORM — 託運資料<span class="sttag" id="sttag">DRAFT 草稿</span></div>
    <div class="frow">
      <div class="field"><label>託運人 SHIPPER *</label><input class="inp" id="fShip" value="台芯科技股份有限公司" style="font-family:'Noto Sans TC'"></div>
      <div class="field"><label>收件人 CONSIGNEE *</label><input class="inp" id="fCons" value="AZ Semi Phoenix Fab" style="font-family:'Noto Sans TC'"></div>
    </div>
    <div class="frow">
      <div class="field"><label>起運港 ORIGIN</label>
        <select class="inp" id="fOrg"><option value="TPE">TPE 台北</option><option value="KHH">KHH 高雄</option><option value="TXG">TXG 台中</option></select></div>
      <div class="field"><label>目的港 DESTINATION</label>
        <select class="inp" id="fDst"><option value="PHX">PHX 鳳凰城</option><option value="NRT">NRT 東京</option><option value="SIN">SIN 新加坡</option><option value="FRA">FRA 法蘭克福</option><option value="LAX">LAX 洛杉磯</option></select></div>
    </div>
    <div class="frow">
      <div class="field"><label>預計起運日 ETD</label><input class="inp" type="date" id="fDate" value="2026-08-30"></div>
      <div class="field"><label>總重量 TOTAL WEIGHT (KG)</label><input class="inp" type="number" id="fWt" value="1200" min="1"></div>
    </div>
    <div class="field"><label>運具 MODE</label>
      <div class="opts" id="modeOpts">
        <label class="opt"><input type="radio" name="mode" value="air" data-rate="85" checked>✈ 空運（NT$85/KG）</label>
        <label class="opt"><input type="radio" name="mode" value="sea" data-rate="12">🚢 海運（NT$12/KG）</label>
        <label class="opt"><input type="radio" name="mode" value="road" data-rate="18">🚚 陸運（NT$18/KG）</label>
      </div></div>
    <div class="field"><label>特殊需求 OPTIONS</label>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="opCold" data-fee="0.15">冷鏈恆溫（+15%）</label>
        <label class="opt"><input type="checkbox" id="opIns" data-fee="0.08">全額保險（+8%）</label>
        <label class="opt"><input type="checkbox" id="opDg" data-fee="0.25">危險品（+25%）</label>
        <label class="opt"><input type="checkbox" id="opExp" data-fee="0.1">優先配載（+10%）</label>
      </div></div>
    <div class="field"><label>品項描述 DESCRIPTION *</label>
      <textarea class="inp" id="fDesc" placeholder="品名、件數、材積、包裝方式、海關稅則…">曝光機防震基座 2 PLT、真空幫浦模組 3 PLT、精密感測器組 1 PLT，共 6 板 8.2 CBM，木箱包裝，稅則 8486.20。</textarea></div>
    <button class="btn" id="createBtn">▸ SUBMIT ORDER — 建立託運單</button>
    <button class="btn ghost" type="button" onclick="location.href='shipments.html'">CANCEL — 回貨件列表</button>
  </form>

  <div class="hud">
    <div class="ptitle">ESTIMATION — 運費試算</div>
    <div class="idbox"><div style="font-size:10px;letter-spacing:2px;color:#4a7a63;font-family:'Share Tech Mono',monospace">預配追蹤編號 TRACKING NO.</div>
      <div class="id" id="trackId">SL-88412105</div></div>
    <div class="kv"><span class="k">航線 ROUTE</span><span class="cyan" id="rRoute">TPE → PHX</span></div>
    <div class="kv"><span class="k">計費重量</span><span id="rWt">1,200 KG</span></div>
    <div class="kv"><span class="k">基本運費</span><span id="rBase">NT$ 102,000</span></div>
    <div class="kv"><span class="k">附加費</span><span id="rFee" class="warn">NT$ 0</span></div>
    <div style="margin-top:14px;font-size:10px;letter-spacing:2px;color:#4a7a63;font-family:'Share Tech Mono',monospace">TOTAL ESTIMATE</div>
    <div class="big" id="rTotal">NT$ 102,000</div>
    <div style="font-size:11px;color:#4a7a63;font-family:'Share Tech Mono',monospace" id="rEta">預估航程：5–7 天（空運直達）</div>
  </div>
</main>
<script>
function tick(){ const d=new Date();
  document.getElementById('clock').textContent='UTC+8 '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')+' TST';
}
tick(); setInterval(tick,1000);
const wt=document.getElementById('fWt'), org=document.getElementById('fOrg'), dst=document.getElementById('fDst');
function recalc(){
  const w=+wt.value||0;
  const rate=+document.querySelector('input[name=mode]:checked').dataset.rate;
  let feePct=0;
  document.querySelectorAll('.opts .opt input[type=checkbox]:checked').forEach(c=>feePct+=+c.dataset.fee);
  const base=w*rate, fee=Math.round(base*feePct), total=base+fee;
  document.getElementById('rRoute').textContent=org.value+' → '+dst.value;
  document.getElementById('rWt').textContent=w.toLocaleString()+' KG';
  document.getElementById('rBase').textContent='NT$ '+base.toLocaleString();
  document.getElementById('rFee').textContent='NT$ '+fee.toLocaleString()+'（+'+Math.round(feePct*100)+'%）';
  document.getElementById('rTotal').textContent='NT$ '+total.toLocaleString();
  const mode=document.querySelector('input[name=mode]:checked').value;
  document.getElementById('rEta').textContent='預估時效：'+(mode==='air'?'5–7 天（空運）':mode==='sea'?'18–26 天（海運）':'1–2 天（陸運）');
}
[wt,org,dst].forEach(el=>el.addEventListener('input',recalc));
document.querySelectorAll('.opts input').forEach(el=>el.addEventListener('change',recalc));
recalc();
document.getElementById('createBtn').addEventListener('click',()=>{
  const tag=document.getElementById('sttag');
  tag.textContent='✓ SUBMITTED 已受理';
  tag.style.borderColor='#39ff88'; tag.style.color='#39ff88';
  document.getElementById('trackId').textContent='SL-88412105';
  document.getElementById('createBtn').textContent='✓ 已建立 — 前往貨件列表';
  document.getElementById('createBtn').onclick=()=>location.href='shipments.html';
});
</script>
</body>
</html>
