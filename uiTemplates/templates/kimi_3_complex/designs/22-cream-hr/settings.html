<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禾木 HR｜系統設定</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fdf8f0;color:#6b6258;font-family:'Noto Sans TC',sans-serif;min-height:100vh;display:flex}
  .side{width:230px;flex:none;background:#fff;border-radius:0 28px 28px 0;
    box-shadow:8px 0 30px rgba(190,170,140,.12);padding:26px 18px;display:flex;flex-direction:column;gap:6px;
    position:sticky;top:0;height:100vh}
  .logo{font-size:20px;font-weight:700;color:#3f3a33;padding:6px 12px 20px;letter-spacing:1px}
  .logo em{font-style:normal;color:#f4a259}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:999px;
    font-size:14px;color:#8a8177;text-decoration:none;transition:.25s;position:relative;cursor:pointer}
  .nav-item:hover{background:#fdf8f0;transform:translateX(4px)}
  .nav-item.active{background:#f4a259;color:#fff;box-shadow:0 6px 16px rgba(244,162,89,.4)}
  .nav-item .ic{font-size:16px;width:22px;text-align:center}
  .side .sp{flex:1}
  .main{flex:1;padding:28px 34px 50px;min-width:0}
  .toprow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .hello h1{font-size:24px;color:#3f3a33}
  .hello p{font-size:13px;color:#a79c8f;margin-top:4px}
  .toprow .sp{flex:1}
  .back{display:inline-block;text-decoration:none;font-size:13px;color:#8a8177;background:#fff;
    padding:9px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(190,170,140,.18);transition:.2s}
  .back:hover{color:#f4a259;transform:translateY(-2px)}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f4a259,#8ab17d);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:24px;align-items:start}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:24px;padding:26px;box-shadow:0 10px 28px rgba(190,170,140,.16)}
  .panel h3{font-size:15px;color:#3f3a33;margin-bottom:18px}
  .panel h3 span{font-size:11px;color:#a79c8f;font-weight:400;margin-left:8px}
  .frow{margin-bottom:18px}
  .frow label{display:block;font-size:13px;color:#a79c8f;margin-bottom:8px}
  input[type=text],input[type=time],input[type=number],input[type=date],select,textarea{
    width:100%;border:1.5px solid #efe6d8;background:#fdf8f0;border-radius:14px;padding:11px 16px;
    font-size:14px;font-family:inherit;color:#3f3a33;outline:none;transition:.2s}
  input:focus,select:focus,textarea:focus{border-color:#f4a259;background:#fff}
  textarea{resize:vertical;min-height:90px;line-height:1.7}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.fgrid{grid-template-columns:1fr}}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{border:1.5px solid #efe6d8;background:#fff;color:#8a8177;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
  .opt:hover{border-color:#f4a259;color:#f4a259}
  .opt:has(input:checked){background:#f4a259;border-color:#f4a259;color:#fff}
  .opt input{accent-color:#f4a259}
  .btns{display:flex;gap:12px;margin-top:6px}
  .btn{padding:12px 28px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:.2s}
  .btn.pri{background:#f4a259;color:#fff;box-shadow:0 8px 20px rgba(244,162,89,.4)}
  .btn.pri:hover{transform:translateY(-2px)}
  .btn.ghost{background:#fff;color:#8a8177;border:1.5px solid #efe6d8}
  .tag{font-size:12px;padding:4px 14px;border-radius:999px;font-weight:700;white-space:nowrap;display:inline-block}
  .t-on{background:#e9f2e4;color:#5f8a52}
  .t-prob{background:#f6efe3;color:#a79c8f}
  #msg{display:none;margin-top:16px;padding:14px 18px;border-radius:16px;font-size:14px}
  #msg.ok{display:block;background:#e9f2e4;color:#5f8a52}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:12px;color:#a79c8f;letter-spacing:1px;padding:8px 12px;font-weight:500}
  td{padding:12px;border-top:1px solid #f3ecdf;color:#5c554c}
  tr:hover td{background:#fdf8f0}
  @media(max-width:760px){.side{display:none}}
</style>
</head>
<body>
  <nav class="side">
    <div class="logo">禾木<em>HR</em> 🌿</div>
    <a class="nav-item" href="index.html"><span class="ic">🏠</span>員工總覽</a>
    <a class="nav-item" href="employees.html"><span class="ic">👥</span>員工名錄</a>
    <a class="nav-item" href="form.html"><span class="ic">➕</span>新增員工</a>
    <a class="nav-item" href="report.html"><span class="ic">🗓️</span>假勤管理</a>
    <a class="nav-item active" href="settings.html"><span class="ic">⚙️</span>系統設定</a>
    <div class="sp"></div>
    <a class="nav-item" href="index.html"><span class="ic">🖥️</span>返回主控台</a>
    <a class="nav-item" href="../../index.html"><span class="ic">↩</span>返回入口</a>
  </nav>

  <main class="main">
    <div class="toprow">
      <div class="hello">
        <h1>系統設定 ⚙️</h1>
        <p>考勤規則與簽核流程 · 變更需人資主管複核後生效</p>
      </div>
      <div class="sp"></div>
      <a class="back" href="index.html">返回主控台</a>
      <a class="back" href="../../index.html">← 返回入口</a>
      <div class="avatar">王</div>
    </div>

    <div class="grid2">
      <!-- 考勤規則 -->
      <div class="panel">
        <h3>考勤規則<span>狀態：<b class="tag t-prob" id="stTag">未儲存</b></span></h3>
        <form id="cfgForm">
          <div class="fgrid">
            <div class="frow"><label>上班時間</label><input type="time" value="09:00"></div>
            <div class="frow"><label>下班時間</label><input type="time" value="18:00"></div>
          </div>
          <div class="frow"><label>彈性上下班</label>
            <div class="opts">
              <label class="opt"><input type="radio" name="flex" checked>不彈性</label>
              <label class="opt"><input type="radio" name="flex">彈性 ±30 分</label>
              <label class="opt"><input type="radio" name="flex">彈性 ±60 分</label>
            </div>
          </div>
          <div class="fgrid">
            <div class="frow"><label>每月補卡上限（次）</label><input type="number" value="3" min="0" max="10"></div>
            <div class="frow"><label>加班起算（分鐘後）</label>
              <select><option>30 分鐘</option><option selected>60 分鐘</option><option>不設下限</option></select>
            </div>
          </div>
          <div class="frow"><label>生效日期</label><input type="date" value="2026-09-01"></div>
          <div class="frow"><label>通知設定</label>
            <div class="opts">
              <label class="opt"><input type="checkbox" checked>異常出勤通知本人</label>
              <label class="opt"><input type="checkbox" checked>通知直屬主管</label>
              <label class="opt"><input type="checkbox">每日彙報人資</label>
            </div>
          </div>
          <div class="frow"><label>公告文案（顯示於員工打卡頁）</label>
            <textarea maxlength="120">9 月起試行彈性上下班評估，請同仁照常打卡，異常請於三日內補單。</textarea>
          </div>
          <div class="btns">
            <button type="submit" class="btn pri">儲存設定</button>
            <button type="reset" class="btn ghost">還原</button>
          </div>
          <div id="msg"></div>
        </form>
      </div>

      <!-- 角色權限 -->
      <div>
        <div class="panel">
          <h3>角色權限<span>ROLES</span></h3>
          <table>
            <tr><th>角色</th><th>人數</th><th>權限範圍</th></tr>
            <tr><td>系統管理員</td><td>2</td><td>全部功能</td></tr>
            <tr><td>人資專員</td><td>4</td><td>名錄 / 假勤 / 報表</td></tr>
            <tr><td>部門主管</td><td>12</td><td>簽核 / 部門報表</td></tr>
            <tr><td>一般員工</td><td>230</td><td>個人假勤查詢</td></tr>
          </table>
        </div>
        <div class="panel" style="margin-top:18px">
          <h3>簽核流程<span>APPROVAL FLOW</span></h3>
          <table>
            <tr><th>關卡</th><th>簽核人</th><th>時限</th></tr>
            <tr><td>1. 直屬主管</td><td>各單位主管</td><td>24h</td></tr>
            <tr><td>2. 人資複核</td><td>吳靜怡</td><td>48h</td></tr>
            <tr><td>3. 薪資結算歸檔</td><td>系統自動</td><td>—</td></tr>
          </table>
          <p style="font-size:12.5px;color:#a79c8f;margin-top:14px;line-height:1.8">
            相關作業：前往 <a href="report.html" style="color:#f4a259">假勤管理</a> 檢視待簽核案件。
          </p>
        </div>
      </div>
    </div>
  </main>

<script>
  document.getElementById('cfgForm').addEventListener('submit',e=>{
    e.preventDefault();
    const m=document.getElementById('msg');
    m.className='ok';
    m.textContent='✔ 設定已儲存並送出人資主管複核，將於生效日自動套用（示範畫面）。';
    const t=document.getElementById('stTag');
    t.className='tag t-on';t.textContent='已儲存 · 待生效';
  });
</script>
</body>
</html>
