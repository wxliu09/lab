<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禾木 HR｜新增員工</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fdf8f0;color:#6b6258;font-family:'Noto Sans TC',sans-serif;min-height:100vh;display:flex}
  .side{width:230px;flex:none;background:#fff;border-radius:0 28px 28px 0;
    box-shadow:8px 0 30px rgba(190,170,140,.12);padding:26px 18px;display:flex;flex-direction:column;gap:6px;
    position:sticky;top:0;height:100vh}
  .logo{font-size:20px;font-weight:700;color:#3f3a33;padding:6px 12px 20px;letter-spacing:1px}
  .logo em{font-style:normal;color:#f4a259}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:999px;
    font-size:14px;color:#8a8177;text-decoration:none;transition:.25s;position:relative;cursor:pointer}
  .nav-item:hover{background:#fdf8f0;transform:translateX(4px)}
  .nav-item.active{background:#f4a259;color:#fff;box-shadow:0 6px 16px rgba(244,162,89,.4)}
  .nav-item .ic{font-size:16px;width:22px;text-align:center}
  .side .sp{flex:1}
  .main{flex:1;padding:28px 34px 50px;min-width:0}
  .toprow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .hello h1{font-size:24px;color:#3f3a33}
  .hello p{font-size:13px;color:#a79c8f;margin-top:4px}
  .toprow .sp{flex:1}
  .back{display:inline-block;text-decoration:none;font-size:13px;color:#8a8177;background:#fff;
    padding:9px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(190,170,140,.18);transition:.2s}
  .back:hover{color:#f4a259;transform:translateY(-2px)}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f4a259,#8ab17d);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:24px;align-items:start}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  .panel{background:#fff;border-radius:24px;padding:26px;box-shadow:0 10px 28px rgba(190,170,140,.16)}
  .panel h3{font-size:15px;color:#3f3a33;margin-bottom:18px}
  .panel h3 span{font-size:11px;color:#a79c8f;font-weight:400;margin-left:8px}
  .frow{margin-bottom:18px}
  .frow label{display:block;font-size:13px;color:#a79c8f;margin-bottom:8px}
  .frow label i{color:#d17a2c;font-style:normal}
  input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{
    width:100%;border:1.5px solid #efe6d8;background:#fdf8f0;border-radius:14px;padding:11px 16px;
    font-size:14px;font-family:inherit;color:#3f3a33;outline:none;transition:.2s}
  input:focus,select:focus,textarea:focus{border-color:#f4a259;background:#fff}
  input[readonly]{color:#a79c8f}
  textarea{resize:vertical;min-height:100px;line-height:1.7}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.fgrid{grid-template-columns:1fr}}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{border:1.5px solid #efe6d8;background:#fff;color:#8a8177;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px}
  .opt:hover{border-color:#f4a259;color:#f4a259}
  .opt:has(input:checked){background:#f4a259;border-color:#f4a259;color:#fff}
  .opt input{accent-color:#f4a259}
  .btns{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
  .btn{padding:12px 28px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:.2s;text-decoration:none;display:inline-block}
  .btn.pri{background:#f4a259;color:#fff;box-shadow:0 8px 20px rgba(244,162,89,.4)}
  .btn.pri:hover{transform:translateY(-2px)}
  .btn.ghost{background:#fff;color:#8a8177;border:1.5px solid #efe6d8}
  .btn.ghost:hover{color:#f4a259;border-color:#f4a259}
  .tag{font-size:12px;padding:4px 14px;border-radius:999px;font-weight:700;white-space:nowrap;display:inline-block}
  .t-on{background:#e9f2e4;color:#5f8a52}
  .t-leave{background:#fdeada;color:#d17a2c}
  .t-prob{background:#f6efe3;color:#a79c8f}
  #msg{display:none;margin-top:16px;padding:14px 18px;border-radius:16px;font-size:14px}
  #msg.ok{display:block;background:#e9f2e4;color:#5f8a52}
  #msg.err{display:block;background:#fdeada;color:#d17a2c}
  /* 預覽卡 */
  .preview{position:sticky;top:24px}
  .pv-card{background:linear-gradient(135deg,#fff7ee,#fdf8f0);border:1.5px solid #f3ecdf;border-radius:20px;padding:22px;text-align:center}
  .pv-face{width:72px;height:72px;border-radius:26px;background:#f4a259;color:#fff;font-size:28px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 8px 20px rgba(244,162,89,.3)}
  .pv-card h4{font-size:18px;color:#3f3a33}
  .pv-card .r{font-size:13px;color:#a79c8f;margin-top:4px}
  .pv-card .tags{margin-top:12px}
  .check li{list-style:none;display:flex;gap:10px;align-items:center;font-size:13.5px;padding:9px 0;border-bottom:1px dashed #f3ecdf;color:#5c554c}
  .check li:last-child{border-bottom:none}
  .check .dot{width:20px;height:20px;border-radius:50%;background:#e9f2e4;color:#5f8a52;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
  .check .dot.wait{background:#f6efe3;color:#a79c8f}
  @media(max-width:760px){.side{display:none}}
</style>
</head>
<body>
  <nav class="side">
    <div class="logo">禾木<em>HR</em> 🌿</div>
    <a class="nav-item" href="index.html"><span class="ic">🏠</span>員工總覽</a>
    <a class="nav-item" href="employees.html"><span class="ic">👥</span>員工名錄</a>
    <a class="nav-item active" href="form.html"><span class="ic">➕</span>新增員工</a>
    <a class="nav-item" href="report.html"><span class="ic">🗓️</span>假勤管理</a>
    <a class="nav-item" href="settings.html"><span class="ic">⚙️</span>系統設定</a>
    <div class="sp"></div>
    <a class="nav-item" href="index.html"><span class="ic">🖥️</span>返回主控台</a>
    <a class="nav-item" href="../../index.html"><span class="ic">↩</span>返回入口</a>
  </nav>

  <main class="main">
    <div class="toprow">
      <div class="hello">
        <h1>新增員工 ➕</h1>
        <p>建立到職建檔資料，送出後交由人資主管複核</p>
      </div>
      <div class="sp"></div>
      <a class="back" href="employees.html">員工名錄</a>
      <a class="back" href="../../index.html">← 返回入口</a>
      <div class="avatar">王</div>
    </div>

    <div class="grid2">
      <!-- 表單 -->
      <div class="panel">
        <h3>基本資料建檔<span>狀態：<b class="tag t-prob" id="stTag">草稿</b></span></h3>
        <form id="empForm" novalidate>
          <div class="fgrid">
            <div class="frow"><label>姓名 <i>*</i></label><input type="text" id="fName" placeholder="例：林宜蓁"></div>
            <div class="frow"><label>員工編號（系統產生）</label><input type="text" value="HM-0267" readonly></div>
          </div>
          <div class="fgrid">
            <div class="frow"><label>部門 <i>*</i></label>
              <select id="fDept">
                <option value="">— 請選擇 —</option>
                <option>研發工程部</option><option>業務行銷部</option>
                <option>營運行政部</option><option>客戶成功部</option><option>人資財會部</option>
              </select>
            </div>
            <div class="frow"><label>職務 <i>*</i></label>
              <select id="fRole">
                <option value="">— 請選擇 —</option>
                <option>前端工程師</option><option>後端工程師</option><option>測試工程師</option>
                <option>資深業務</option><option>行銷企劃</option><option>總務專員</option>
                <option>CSM 客戶成功經理</option><option>招募專員</option>
              </select>
            </div>
          </div>
          <div class="fgrid">
            <div class="frow"><label>到職日 <i>*</i></label><input type="date" id="fDate" value="2026-09-01"></div>
            <div class="frow"><label>公司信箱</label><input type="email" placeholder="name@hemu.example.tw"></div>
          </div>
          <div class="frow"><label>僱用類型</label>
            <div class="opts">
              <label class="opt"><input type="radio" name="etype" value="正職" checked>正職</label>
              <label class="opt"><input type="radio" name="etype" value="約聘">約聘</label>
              <label class="opt"><input type="radio" name="etype" value="實習">實習</label>
              <label class="opt"><input type="radio" name="etype" value="顧問">顧問</label>
            </div>
          </div>
          <div class="frow"><label>報到準備（可複選）</label>
            <div class="opts">
              <label class="opt"><input type="checkbox" checked>開通公司帳號</label>
              <label class="opt"><input type="checkbox" checked>配發筆電</label>
              <label class="opt"><input type="checkbox">門禁卡</label>
              <label class="opt"><input type="checkbox">安排健檢</label>
              <label class="opt"><input type="checkbox">每週遠端一日</label>
            </div>
          </div>
          <div class="fgrid">
            <div class="frow"><label>緊急聯絡人</label><input type="text" placeholder="姓名 / 關係"></div>
            <div class="frow"><label>聯絡電話</label><input type="tel" placeholder="09xx-xxx-xxx"></div>
          </div>
          <div class="frow"><label>備註</label><textarea placeholder="其他需交辦事項…"></textarea></div>
          <div class="btns">
            <button type="submit" class="btn pri">送出審核</button>
            <button type="reset" class="btn ghost">清除重填</button>
            <a class="btn ghost" href="employees.html">取消返回</a>
          </div>
          <div id="msg"></div>
        </form>
      </div>

      <!-- 預覽 + 檢核 -->
      <div>
        <div class="panel preview">
          <h3>名錄預覽<span>LIVE PREVIEW</span></h3>
          <div class="pv-card">
            <div class="pv-face" id="pvFace">＿</div>
            <h4 id="pvName">（尚未輸入姓名）</h4>
            <p class="r" id="pvRole">部門 · 職務</p>
            <div class="tags">
              <span class="tag t-prob" id="pvType">正職</span>
              <span class="tag t-on" id="pvDate">2026-09-01 到職</span>
            </div>
          </div>
        </div>
        <div class="panel" style="margin-top:18px">
          <h3>到職檢核清單<span>ONBOARDING</span></h3>
          <ul class="check">
            <li><span class="dot">✓</span>聘僱合約回簽</li>
            <li><span class="dot">✓</span>個資同意書 / 保密協定</li>
            <li><span class="dot wait">…</span>勞健保加保（到職當日）</li>
            <li><span class="dot wait">…</span>帳號與設備開通</li>
            <li><span class="dot wait">…</span>新人訓練排程</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

<script>
  // 即時預覽
  const $=id=>document.getElementById(id);
  $('fName').addEventListener('input',e=>{
    const v=e.target.value.trim();
    $('pvName').textContent=v||'（尚未輸入姓名）';
    $('pvFace').textContent=v?v[0]:'＿';
  });
  function pvRole(){
    const d=$('fDept').value||'部門', r=$('fRole').value||'職務';
    $('pvRole').textContent=d+' · '+r;
  }
  $('fDept').addEventListener('change',pvRole);
  $('fRole').addEventListener('change',pvRole);
  $('fDate').addEventListener('change',e=>$('pvDate').textContent=e.target.value+' 到職');
  document.querySelectorAll('input[name=etype]').forEach(r=>r.addEventListener('change',()=>$('pvType').textContent=r.value));
  // 送出
  $('empForm').addEventListener('submit',e=>{
    e.preventDefault();
    const msg=$('msg');
    if(!$('fName').value.trim()||!$('fDept').value||!$('fRole').value||!$('fDate').value){
      msg.className='err';msg.textContent='⚠ 請先完成必填欄位：姓名、部門、職務、到職日。';
      return;
    }
    msg.className='ok';msg.textContent='✔ 建檔完成！已送出人資主管複核，通過後將自動通知 IT 開通帳號（示範畫面）。';
    $('stTag').className='tag t-leave';$('stTag').textContent='待複核';
    msg.scrollIntoView({behavior:'smooth',block:'center'});
  });
</script>
</body>
</html>
