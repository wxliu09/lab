<!DOCTYPE html>
<!-- 38 毛玻璃列車 · 子頁：車次列表 trains.html -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車次列表 · 車務調度中心</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#39d0d8; --orange:#f5a623;
  --ok:#4ade80; --late:#fbbf24; --bad:#f87171;
  --glass:rgba(255,255,255,.07); --glass-b:rgba(255,255,255,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:
    radial-gradient(1000px 500px at 80% -10%,rgba(57,208,216,.14),transparent 60%),
    radial-gradient(800px 500px at 10% 110%,rgba(245,166,35,.1),transparent 60%),
    linear-gradient(160deg,#0b1220,#131c30);
  color:#dce6f2;font-family:'Noto Sans TC',sans-serif;min-height:100vh;
}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px}
.topbar{display:flex;align-items:center;gap:20px;margin:18px 26px 0;padding:14px 24px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:2px}
.logo span{color:var(--teal)}
.pagenav{display:flex;gap:8px;flex-wrap:wrap}
.pagenav a{color:#8ea3c0;text-decoration:none;font-size:12px;letter-spacing:1px;padding:7px 16px;border-radius:20px;border:1px solid transparent;transition:.2s}
.pagenav a:hover{color:#fff;border-color:var(--glass-b);background:rgba(255,255,255,.05)}
.pagenav a.on{color:var(--teal);border-color:var(--teal);background:rgba(57,208,216,.08)}
.clock{font-family:'Share Tech Mono';font-size:22px;color:var(--teal);margin-left:auto;letter-spacing:2px}
.back-link{color:#dce6f2;text-decoration:none;font-size:13px;padding:8px 18px;border-radius:24px;border:1px solid var(--glass-b);background:rgba(255,255,255,.05);transition:.25s;letter-spacing:1px;white-space:nowrap}
.back-link:hover{background:var(--teal);color:#0b1220;border-color:var(--teal)}
.back-link.home{border-color:rgba(245,166,35,.5)}
.back-link.home:hover{background:var(--orange);border-color:var(--orange)}
main{max-width:1360px;margin:0 auto;padding:22px 26px 50px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:16px 22px;transition:.25s}
.kpi:hover{transform:translateY(-4px);background:rgba(255,255,255,.1)}
.kpi h3{font-size:12px;color:#8ea3c0;letter-spacing:2px;font-weight:400}
.kpi .val{font-family:'Share Tech Mono';font-size:32px;margin-top:2px}
.kpi .val.ok{color:var(--ok)} .kpi .val.late{color:var(--late)} .kpi .val.bad{color:var(--bad)}
.kpi .sub{font-size:12px;color:#7288a5}
.panel{padding:20px 24px;margin-bottom:20px}
.panel h2{font-size:14px;letter-spacing:3px;color:#aFC3dd;margin-bottom:14px;font-weight:500}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;font-size:13px;border-bottom:1px dashed rgba(255,255,255,.1)}
thead th{font-size:11px;color:#7288a5;letter-spacing:2px;font-weight:400;font-family:'Share Tech Mono'}
tbody tr{cursor:pointer;transition:.15s}
tbody tr:hover{background:rgba(57,208,216,.07)}
.tno{font-family:'Share Tech Mono';font-size:16px;letter-spacing:1px}
.tno.s{color:var(--teal)} .tno.n{color:var(--orange)}
.min{font-family:'Share Tech Mono';font-weight:700;padding:2px 10px;border-radius:8px}
.min.y{color:var(--late);background:rgba(251,191,36,.12)}
.min.r{color:var(--bad);background:rgba(248,113,113,.12)}
.min.g{color:var(--ok);background:rgba(74,222,128,.1)}
.st{font-size:11px;padding:3px 12px;border-radius:12px;font-weight:700;letter-spacing:1px}
.st.run{background:rgba(57,208,216,.12);color:var(--teal);border:1px solid rgba(57,208,216,.4)}
.st.stop{background:rgba(74,222,128,.1);color:var(--ok);border:1px solid rgba(74,222,128,.4)}
.st.wait{background:rgba(251,191,36,.1);color:var(--late);border:1px solid rgba(251,191,36,.4)}
.st.hold{background:rgba(248,113,113,.12);color:var(--bad);border:1px solid rgba(248,113,113,.4)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filter-bar button{
  background:rgba(255,255,255,.05);border:1px solid var(--glass-b);color:#8ea3c0;border-radius:20px;
  padding:7px 18px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s;letter-spacing:1px;
}
.filter-bar button.on{color:var(--teal);border-color:var(--teal);background:rgba(57,208,216,.1)}
.mono{font-family:'Share Tech Mono'}
@media (max-width:1000px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar glass">
  <div class="logo">🚄 車務調度中心 <span>TRAIN DIAGRAM MIS</span></div>
  <nav class="pagenav">
    <a href="index.html">運行圖</a>
    <a href="trains.html" class="on">車次列表</a>
    <a href="detail.html">車次詳情</a>
    <a href="form.html">異常通報</a>
    <a href="report.html">準點報表</a>
  </nav>
  <div class="clock"><span id="clk">00:00:00</span></div>
  <a class="back-link home" href="index.html">返回主控台</a>
  <a class="back-link" href="../../index.html">← 返回入口</a>
</header>
<main>
  <div class="kpi-row">
    <div class="kpi glass"><h3>今日班表車次</h3><div class="val">58</div><div class="sub">自強 18 / 莒光 12 / 區間 28</div></div>
    <div class="kpi glass"><h3>運行中</h3><div class="val ok">26</div><div class="sub">北上 14 / 南下 12</div></div>
    <div class="kpi glass"><h3>停靠中</h3><div class="val">9</div><div class="sub">月台或側線</div></div>
    <div class="kpi glass"><h3>扣停 / 待發</h3><div class="val bad">2</div><div class="sub">號誌檢修影響</div></div>
  </div>

  <section class="panel glass">
    <h2>車次總表 TRAIN LIST</h2>
    <div class="filter-bar" id="filterBar">
      <button class="on" data-f="all">全部</button>
      <button data-f="run">運行中</button>
      <button data-f="stop">停靠中</button>
      <button data-f="wait">待發車</button>
      <button data-f="hold">扣停</button>
    </div>
    <table>
      <thead><tr><th>車次</th><th>車種</th><th>區間</th><th>方向</th><th>預定發車</th><th>狀態</th><th>誤點</th></tr></thead>
      <tbody id="trainBody"></tbody>
    </table>
  </section>
</main>
<script>
const trains=[
  {no:'自強 172',type:'自強號',route:'樹林 → 台中',dir:'南下',dep:'19:12',st:'run',stTxt:'運行中',min:'+12 min',cls:'r'},
  {no:'莒光 513',type:'莒光號',route:'七堵 → 彰化',dir:'南下',dep:'18:47',st:'run',stTxt:'運行中',min:'+8 min',cls:'y'},
  {no:'區間 1187',type:'區間車',route:'台北 → 中壢',dir:'南下',dep:'19:32',st:'run',stTxt:'運行中',min:'+0 min',cls:'g'},
  {no:'自強 121',type:'自強號',route:'台中 → 台北',dir:'北上',dep:'18:58',st:'run',stTxt:'運行中',min:'+5 min',cls:'y'},
  {no:'區間 2148',type:'區間車',route:'基隆 → 新竹',dir:'北上',dep:'19:05',st:'run',stTxt:'運行中',min:'+6 min',cls:'y'},
  {no:'自強 110',type:'自強號',route:'彰化 → 台北',dir:'北上',dep:'19:20',st:'run',stTxt:'運行中',min:'+0 min',cls:'g'},
  {no:'自強 174',type:'自強號',route:'台北 → 台中',dir:'南下',dep:'20:02',st:'wait',stTxt:'待發車',min:'—',cls:'g'},
  {no:'區間 1191',type:'區間車',route:'台北 → 竹南',dir:'南下',dep:'20:14',st:'wait',stTxt:'待發車',min:'—',cls:'g'},
  {no:'莒光 521',type:'莒光號',route:'台北 → 台中',dir:'南下',dep:'19:40',st:'stop',stTxt:'停靠中',min:'第 4 月台',cls:'g'},
  {no:'區間 2152',type:'區間車',route:'新竹 → 基隆',dir:'北上',dep:'19:55',st:'stop',stTxt:'停靠中',min:'第 2 月台',cls:'g'},
  {no:'自強 136',type:'自強號',route:'台中 → 台北',dir:'北上',dep:'19:48',st:'hold',stTxt:'扣停',min:'號誌檢修',cls:'r'},
  {no:'區間 1193',type:'區間車',route:'中壢 → 台北',dir:'北上',dep:'20:06',st:'hold',stTxt:'扣停',min:'等待進站',cls:'y'},
];
const bodyEl=document.getElementById('trainBody');
function render(f){
  const list=f==='all'?trains:trains.filter(t=>t.st===f);
  bodyEl.innerHTML=list.map(t=>`<tr onclick="location.href='detail.html'">
    <td><span class="tno ${t.dir==='南下'?'s':'n'}">${t.no}</span></td>
    <td>${t.type}</td><td>${t.route}</td>
    <td>${t.dir==='南下'?'▼ 南下':'▲ 北上'}</td>
    <td class="mono">${t.dep}</td>
    <td><span class="st ${t.st}">${t.stTxt}</span></td>
    <td><span class="min ${t.cls}">${t.min}</span></td>
  </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:#7288a5;padding:26px">無符合條件的車次</td></tr>';
}
render('all');
document.querySelectorAll('#filterBar button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#filterBar button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.f);
}));
setInterval(()=>{document.getElementById('clk').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false});},1000);
document.getElementById('clk').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false});
</script>
</body>
</html>
