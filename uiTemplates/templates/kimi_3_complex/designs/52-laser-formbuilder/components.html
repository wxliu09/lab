<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欄位元件說明 · 雷射切割表單設計器</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --panel:#0c1426; --laser:#00cfff; --violet:#7d5cff;
  --danger:#ff3b5c; --ok:#2ee6a8; --txt:#cfe7ff; --dim:#5f7ba6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(0,207,255,.07), transparent 55%),
    linear-gradient(rgba(0,207,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,207,255,.03) 1px, transparent 1px);
  background-size:100% 100%, 40px 40px, 40px 40px;
  color:var(--txt);
  font-family:'Rajdhani','Noto Sans TC',sans-serif;
  min-height:100vh;padding-bottom:40px;
}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid rgba(0,207,255,.25);
  background:linear-gradient(180deg, rgba(12,20,38,.95), rgba(7,11,22,.9));
  box-shadow:0 0 24px rgba(0,207,255,.08);
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--laser);font-weight:600;letter-spacing:2px;font-size:14px;
  border:1px solid var(--laser);padding:6px 14px;border-radius:3px;
  text-shadow:0 0 8px rgba(0,207,255,.7);
  box-shadow:0 0 10px rgba(0,207,255,.25), inset 0 0 8px rgba(0,207,255,.08);
  transition:all .2s;
}
.back-link:hover{background:rgba(0,207,255,.12);box-shadow:0 0 18px rgba(0,207,255,.5);}
.back-link.sub{font-size:12px;padding:5px 11px;color:var(--violet);border-color:var(--violet);text-shadow:0 0 8px rgba(125,92,255,.7);box-shadow:0 0 10px rgba(125,92,255,.25);}
.back-link.sub:hover{background:rgba(125,92,255,.12);box-shadow:0 0 18px rgba(125,92,255,.5);}
.topbar h1{font-size:18px;letter-spacing:4px;text-shadow:0 0 12px rgba(0,207,255,.6);}
.topbar .sub-t{color:var(--dim);font-size:12px;letter-spacing:3px;}
.status-lamps{margin-left:auto;font-size:12px;color:var(--dim);letter-spacing:2px;}
.lamp{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;}
.lamp.g{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite;}
@keyframes pulse{50%{opacity:.35;}}

.main{padding:18px 20px;display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}
.panel{
  background:var(--panel);border:1px solid rgba(0,207,255,.22);border-radius:6px;
  box-shadow:inset 0 0 30px rgba(0,20,60,.5), 0 0 14px rgba(0,207,255,.06);
  padding:16px 18px;
}
.panel h2{
  font-size:13px;letter-spacing:4px;color:var(--laser);
  border-bottom:1px solid rgba(0,207,255,.25);padding-bottom:8px;margin-bottom:14px;
  text-shadow:0 0 8px rgba(0,207,255,.5);
}

/* 元件索引 */
.comp-item{
  border:1px solid rgba(0,207,255,.35);border-radius:4px;
  padding:11px 13px;margin-bottom:9px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(90deg, rgba(0,207,255,.05), transparent);
  transition:all .18s;user-select:none;
}
.comp-item:hover{border-color:var(--laser);box-shadow:0 0 12px rgba(0,207,255,.35);transform:translateX(4px);}
.comp-item.sel{border-color:var(--violet);box-shadow:0 0 14px rgba(125,92,255,.5);}
.comp-item .ico{
  width:30px;height:30px;border:1px solid var(--laser);border-radius:3px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  color:var(--laser);text-shadow:0 0 6px var(--laser);
}
.comp-item .nm{font-size:14px;font-weight:600;letter-spacing:2px;}
.comp-item .used{font-size:11px;color:var(--dim);letter-spacing:1px;}
.search-box{
  width:100%;background:#0a1120;border:1px solid rgba(0,207,255,.35);color:var(--txt);
  padding:8px 10px;border-radius:3px;font-family:inherit;font-size:14px;letter-spacing:1px;
  outline:none;margin-bottom:12px;
}
.search-box:focus{border-color:var(--laser);box-shadow:0 0 10px rgba(0,207,255,.35);}

/* 說明區 */
.spec-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
.spec-head .big-ico{
  width:52px;height:52px;border:1.5px solid var(--laser);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  color:var(--laser);text-shadow:0 0 10px var(--laser);
  box-shadow:0 0 16px rgba(0,207,255,.35), inset 0 0 10px rgba(0,207,255,.12);
}
.spec-head h3{font-size:20px;letter-spacing:4px;text-shadow:0 0 10px rgba(0,207,255,.5);}
.spec-head .en{color:var(--dim);font-size:12px;letter-spacing:3px;}
.stag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;
  padding:2px 10px;border-radius:3px;border:1px solid currentColor;margin-left:auto;
}
.stag.stable{color:var(--ok);text-shadow:0 0 6px rgba(46,230,168,.7);}
.stag.beta{color:var(--violet);text-shadow:0 0 6px rgba(125,92,255,.7);}
.spec-desc{font-size:14px;line-height:2;letter-spacing:1px;color:var(--txt);margin:12px 0;}
.spec-sec{
  font-size:12px;letter-spacing:3px;color:var(--laser);margin:16px 0 8px;
  border-left:3px solid var(--laser);padding-left:8px;
}
.spec-table{width:100%;border-collapse:collapse;font-size:13px;}
.spec-table th{
  text-align:left;font-size:11px;letter-spacing:3px;color:var(--dim);
  border-bottom:1px solid rgba(0,207,255,.3);padding:7px 8px;
}
.spec-table td{padding:8px;border-bottom:1px solid rgba(95,123,166,.15);letter-spacing:1px;}
.spec-table .mono{font-variant-numeric:tabular-nums;color:var(--laser);font-size:12px;}
.demo-box{
  border:1px dashed rgba(0,207,255,.4);border-radius:5px;padding:14px 16px;
  background:rgba(0,207,255,.03);
}
.demo-box label{display:block;font-size:11px;color:var(--dim);letter-spacing:3px;margin-bottom:6px;}
.demo-box input[type=text],.demo-box select{
  width:100%;max-width:320px;background:#0a1120;border:1px solid rgba(0,207,255,.35);
  color:var(--txt);padding:8px 10px;border-radius:3px;font-family:inherit;font-size:14px;outline:none;
}
.demo-box input[type=date]{
  background:#0a1120;border:1px solid rgba(0,207,255,.35);color:var(--txt);
  padding:8px 10px;border-radius:3px;font-family:inherit;font-size:14px;outline:none;
}
.demo-box .chk{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:2px;cursor:pointer;}
.demo-box .chk input{accent-color:var(--laser);width:16px;height:16px;}
.demo-msg{font-size:12px;letter-spacing:2px;margin-top:8px;min-height:16px;color:var(--ok);}
.demo-msg.bad{color:var(--danger);}
@media (max-width:900px){.main{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <h1>欄位元件說明</h1>
  <span class="sub-t">COMPONENT MANUAL v3.2</span>
  <a class="back-link sub" href="list.html">表單列表</a>
  <a class="back-link sub" href="flow.html">流程設定</a>
  <a class="back-link sub" href="publish.html">發佈紀錄</a>
  <div class="status-lamps"><span><i class="lamp g"></i>元件庫 5 件在庫</span></div>
</div>

<div class="main">
  <div class="panel">
    <h2>元件索引 ▸ INDEX</h2>
    <input type="text" class="search-box" id="compKw" placeholder="掃描元件關鍵字…">
    <div id="compList"></div>
  </div>

  <div class="panel">
    <h2>規格書 ▸ SPEC</h2>
    <div class="spec-head">
      <span class="big-ico" id="spIco">T</span>
      <div>
        <h3 id="spName">文字輸入</h3>
        <span class="en" id="spEn">TEXT FIELD</span>
      </div>
      <span class="stag stable" id="spStag">穩定版</span>
    </div>
    <p class="spec-desc" id="spDesc"></p>

    <div class="spec-sec">可調屬性</div>
    <table class="spec-table">
      <thead><tr><th>屬性</th><th>型別</th><th>說明</th></tr></thead>
      <tbody id="spProps"></tbody>
    </table>

    <div class="spec-sec">支援驗證規則</div>
    <table class="spec-table">
      <thead><tr><th>規則代號</th><th>說明</th></tr></thead>
      <tbody id="spRules"></tbody>
    </table>

    <div class="spec-sec">線上試切 DEMO</div>
    <div class="demo-box" id="spDemo"></div>
  </div>
</div>

<script>
const comps = [
  {
    key:'text', ico:'T', name:'文字輸入', en:'TEXT FIELD', used:62, stag:'stable', stagTxt:'穩定版',
    desc:'最通用之單行文字欄位，適用姓名、地址、事由等自由文字。支援長度上限與正則驗證，雷射切出後預設寬度佔滿父容器。',
    props:[['欄位名稱','string','顯示於表單左側之標題'],['最大長度','int','超過即阻擋輸入，預設 100'],['預設值','string','開單時自動帶入'],['佔位提示','string','灰色提示文字']],
    rules:[['none','不驗證'],['idno','身分證字號（含檢查碼）'],['phone','市話／手機格式'],['email','電子郵件格式']],
    demo:'text'
  },
  {
    key:'dropdown', ico:'▾', name:'下拉選單', en:'DROPDOWN', used:34, stag:'stable', stagTxt:'穩定版',
    desc:'單一擇定型欄位，選項可由代碼表帶入或手動鍵入。選項超過 20 項時自動啟用關鍵字過濾。',
    props:[['欄位名稱','string','顯示標題'],['選項來源','list','手動清單或代碼表代號'],['允許空白','bool','true 時含「請選擇」空項']],
    rules:[['none','不驗證'],['required','必選一項']],
    demo:'dropdown'
  },
  {
    key:'date', ico:'◫', name:'日期選擇', en:'DATE PICKER', used:27, stag:'stable', stagTxt:'穩定版',
    desc:'日期欄位，支援民國年與西元年雙軌顯示；可限制可選區間（例如僅限本年度的申請日）。',
    props:[['欄位名稱','string','顯示標題'],['日期格式','enum','roc 民國年／iso 西元年'],['最早日期','date','可選區間下限'],['最晚日期','date','可選區間上限']],
    rules:[['none','不驗證'],['not-past','不得早於今日'],['this-year','限本年度']],
    demo:'date'
  },
  {
    key:'checkbox', ico:'☑', name:'核取方塊', en:'CHECKBOX', used:15, stag:'stable', stagTxt:'穩定版',
    desc:'布林確認欄位，常用於「已閱讀個資聲明」等同意條款；勾選狀態將以 true/false 寫入送審資料。',
    props:[['欄位名稱','string','顯示標題'],['勾選文字','string','方塊右側說明'],['預設勾選','bool','開單時是否已勾選']],
    rules:[['none','不驗證'],['must-check','必須勾選方可送出']],
    demo:'checkbox'
  },
  {
    key:'sign', ico:'✎', name:'電子簽名', en:'SIGNATURE', used:3, stag:'beta', stagTxt:'試用版',
    desc:'手寫簽名板，以觸控或滑鼠簽繪，輸出為向量筆跡並附加簽署時間戳。目前為試用版，僅開放特定表單啟用。',
    props:[['欄位名稱','string','顯示標題'],['筆跡顏色','color','預設雷射藍'],['簽署人綁定','bool','是否強制為登入者本人']],
    rules:[['none','不驗證'],['required','必須完成簽署']],
    demo:'sign'
  }
];
const listEl = document.getElementById('compList');
let current = 'text';

function renderList(kw){
  listEl.innerHTML = '';
  comps.forEach(function(c){
    if (kw && (c.name + c.en).toLowerCase().indexOf(kw.toLowerCase()) === -1) return;
    const div = document.createElement('div');
    div.className = 'comp-item' + (c.key === current ? ' sel' : '');
    div.innerHTML =
      '<span class="ico">' + c.ico + '</span>' +
      '<span><span class="nm"></span><br><span class="used">全機台使用 ' + c.used + ' 次</span></span>';
    div.querySelector('.nm').textContent = c.name;
    div.addEventListener('click', function(){ current = c.key; renderList(document.getElementById('compKw').value.trim()); renderSpec(c); });
    listEl.appendChild(div);
  });
  if (!listEl.children.length){
    listEl.innerHTML = '<p style="color:var(--dim);font-size:12px;letter-spacing:3px;padding:10px 0;">── 掃描無此元件 ──</p>';
  }
}

function renderSpec(c){
  document.getElementById('spIco').textContent = c.ico;
  document.getElementById('spName').textContent = c.name;
  document.getElementById('spEn').textContent = c.en;
  document.getElementById('spDesc').textContent = c.desc;
  const stag = document.getElementById('spStag');
  stag.textContent = c.stagTxt;
  stag.className = 'stag ' + c.stag;
  const pp = document.getElementById('spProps');
  pp.innerHTML = '';
  c.props.forEach(function(p){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="mono">' + p[0] + '</td><td class="mono">' + p[1] + '</td><td></td>';
    tr.children[2].textContent = p[2];
    pp.appendChild(tr);
  });
  const rr = document.getElementById('spRules');
  rr.innerHTML = '';
  c.rules.forEach(function(r){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="mono">' + r[0] + '</td><td></td>';
    tr.children[1].textContent = r[1];
    rr.appendChild(tr);
  });
  renderDemo(c.demo);
}

function renderDemo(kind){
  const box = document.getElementById('spDemo');
  if (kind === 'text'){
    box.innerHTML = '<label>試切 ▸ 文字輸入（驗證：手機）</label><input type="text" id="demoIn" placeholder="輸入 09 開頭 10 碼…"><div class="demo-msg" id="demoMsg"></div>';
    document.getElementById('demoIn').addEventListener('input', function(){
      const m = document.getElementById('demoMsg');
      if (!this.value){ m.textContent = ''; return; }
      const ok = /^09\d{8}$/.test(this.value);
      m.textContent = ok ? '✓ 格式命中 phone 規則' : '✕ 未通過 phone 規則';
      m.className = 'demo-msg' + (ok ? '' : ' bad');
    });
  } else if (kind === 'dropdown'){
    box.innerHTML = '<label>試切 ▸ 下拉選單</label><select><option>── 請選擇 ──</option><option>都市更新</option><option>交通建設</option><option>社會福利</option></select>';
  } else if (kind === 'date'){
    box.innerHTML = '<label>試切 ▸ 日期選擇（民國年併記）</label><input type="date" id="demoDate" value="2026-08-28"><div class="demo-msg" id="demoMsg"></div>';
    document.getElementById('demoDate').addEventListener('change', function(){
      const m = document.getElementById('demoMsg');
      if (!this.value){ m.textContent=''; return; }
      const d = this.value.split('-');
      m.textContent = '✓ 民國 ' + (+d[0] - 1911) + ' 年 ' + (+d[1]) + ' 月 ' + (+d[2]) + ' 日';
      m.className = 'demo-msg';
    });
  } else if (kind === 'checkbox'){
    box.innerHTML = '<label class="chk"><input type="checkbox" id="demoChk"> 本人已詳閱個人資料蒐集告知聲明</label><div class="demo-msg" id="demoMsg"></div>';
    document.getElementById('demoChk').addEventListener('change', function(){
      const m = document.getElementById('demoMsg');
      m.textContent = this.checked ? '✓ 送出值：true' : '✕ must-check 規則阻擋送出';
      m.className = 'demo-msg' + (this.checked ? '' : ' bad');
    });
  } else {
    box.innerHTML = '<p style="font-size:13px;color:var(--dim);letter-spacing:2px;line-height:2;">✎ 簽名板 DEMO 需觸控裝置，展示環境以文字說明代之：<br>筆跡取樣率 120Hz，輸出 SVG path，附時間戳與簽署人帳號雜湊。</p>';
  }
}

document.getElementById('compKw').addEventListener('input', function(){ renderList(this.value.trim()); });
renderList('');
renderSpec(comps[0]);
</script>
</body>
</html>
