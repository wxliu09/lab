<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表單列表 · 雷射切割表單設計器</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --panel:#0c1426; --laser:#00cfff; --violet:#7d5cff;
  --danger:#ff3b5c; --ok:#2ee6a8; --txt:#cfe7ff; --dim:#5f7ba6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(0,207,255,.07), transparent 55%),
    linear-gradient(rgba(0,207,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,207,255,.03) 1px, transparent 1px);
  background-size:100% 100%, 40px 40px, 40px 40px;
  color:var(--txt);
  font-family:'Rajdhani','Noto Sans TC',sans-serif;
  min-height:100vh;padding-bottom:40px;
}
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;border-bottom:1px solid rgba(0,207,255,.25);
  background:linear-gradient(180deg, rgba(12,20,38,.95), rgba(7,11,22,.9));
  box-shadow:0 0 24px rgba(0,207,255,.08);
}
.back-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--laser);font-weight:600;letter-spacing:2px;font-size:14px;
  border:1px solid var(--laser);padding:6px 14px;border-radius:3px;
  text-shadow:0 0 8px rgba(0,207,255,.7);
  box-shadow:0 0 10px rgba(0,207,255,.25), inset 0 0 8px rgba(0,207,255,.08);
  transition:all .2s;
}
.back-link:hover{background:rgba(0,207,255,.12);box-shadow:0 0 18px rgba(0,207,255,.5);}
.back-link.sub{font-size:12px;padding:5px 11px;color:var(--violet);border-color:var(--violet);text-shadow:0 0 8px rgba(125,92,255,.7);box-shadow:0 0 10px rgba(125,92,255,.25);}
.back-link.sub:hover{background:rgba(125,92,255,.12);box-shadow:0 0 18px rgba(125,92,255,.5);}
.topbar h1{font-size:18px;letter-spacing:4px;text-shadow:0 0 12px rgba(0,207,255,.6);}
.topbar .sub-t{color:var(--dim);font-size:12px;letter-spacing:3px;}
.status-lamps{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--dim);letter-spacing:2px;}
.lamp{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;}
.lamp.g{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite;}
.lamp.b{background:var(--laser);box-shadow:0 0 8px var(--laser);animation:pulse 1.4s infinite;}
@keyframes pulse{50%{opacity:.35;}}

.main{padding:18px 20px;display:flex;flex-direction:column;gap:16px;}
.panel{
  background:var(--panel);border:1px solid rgba(0,207,255,.22);border-radius:6px;
  box-shadow:inset 0 0 30px rgba(0,20,60,.5), 0 0 14px rgba(0,207,255,.06);
  padding:16px 18px;
}
.panel h2{
  font-size:13px;letter-spacing:4px;color:var(--laser);
  border-bottom:1px solid rgba(0,207,255,.25);padding-bottom:8px;margin-bottom:14px;
  text-shadow:0 0 8px rgba(0,207,255,.5);
}

/* 摘要燈號卡 */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.stat{
  border:1px solid rgba(0,207,255,.3);border-radius:5px;padding:12px 16px;
  background:linear-gradient(90deg, rgba(0,207,255,.05), transparent);
  display:flex;align-items:center;gap:14px;
}
.stat .sn{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat .sc{font-size:12px;letter-spacing:3px;color:var(--dim);}
.stat.a .sn{color:var(--ok);text-shadow:0 0 10px rgba(46,230,168,.6);}
.stat.b .sn{color:var(--laser);text-shadow:0 0 10px rgba(0,207,255,.6);}
.stat.c .sn{color:var(--violet);text-shadow:0 0 10px rgba(125,92,255,.6);}
.stat.d .sn{color:var(--danger);text-shadow:0 0 10px rgba(255,59,92,.6);}

/* 篩選列 */
.filter-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;letter-spacing:2px;color:var(--dim);}
.filter-bar select,.filter-bar input{
  background:#0a1120;border:1px solid rgba(0,207,255,.35);color:var(--txt);
  padding:7px 10px;border-radius:3px;font-family:inherit;font-size:13px;letter-spacing:1px;outline:none;
}
.filter-bar input{min-width:220px;}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--laser);box-shadow:0 0 10px rgba(0,207,255,.35);}
.filter-bar .cnt{margin-left:auto;font-size:12px;letter-spacing:2px;color:var(--dim);}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{
  text-align:left;font-size:11px;letter-spacing:3px;color:var(--dim);
  border-bottom:1px solid rgba(0,207,255,.3);padding:8px 8px;
}
td{padding:11px 8px;border-bottom:1px solid rgba(95,123,166,.15);}
tbody tr{transition:background .15s;}
tbody tr:hover{background:rgba(0,207,255,.05);}
tr.hide{display:none;}
.stag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;
  padding:3px 12px;border-radius:3px;border:1px solid currentColor;
}
.stag.pub{color:var(--ok);text-shadow:0 0 6px rgba(46,230,168,.7);box-shadow:0 0 8px rgba(46,230,168,.2);}
.stag.draft{color:var(--violet);text-shadow:0 0 6px rgba(125,92,255,.7);box-shadow:0 0 8px rgba(125,92,255,.2);}
.stag.off{color:var(--danger);text-shadow:0 0 6px rgba(255,59,92,.7);box-shadow:0 0 8px rgba(255,59,92,.2);}
.op{
  color:var(--laser);text-decoration:none;font-size:13px;letter-spacing:1px;
  margin-right:12px;white-space:nowrap;text-shadow:0 0 6px rgba(0,207,255,.5);
}
.op:hover{text-decoration:underline;}
.op.v{color:var(--violet);text-shadow:0 0 6px rgba(125,92,255,.5);}
.empty-tip{text-align:center;padding:26px;color:var(--dim);letter-spacing:4px;display:none;}
.mono{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;}
@media (max-width:760px){.filter-bar input{min-width:140px;}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link" href="index.html">⌂ 返回主控台</a>
  <h1>表單列表</h1>
  <span class="sub-t">FORM REGISTRY // LC-07</span>
  <a class="back-link sub" href="flow.html">流程設定</a>
  <a class="back-link sub" href="components.html">元件說明</a>
  <a class="back-link sub" href="publish.html">發佈紀錄</a>
  <div class="status-lamps">
    <span><i class="lamp g"></i>雷射待命</span>
    <span><i class="lamp b"></i>資料庫連線中</span>
  </div>
</div>

<div class="main">
  <div class="panel">
    <h2>機台概要 ▸ OVERVIEW</h2>
    <div class="stat-row">
      <div class="stat a"><span class="sn">12</span><span class="sc">已發佈表單</span></div>
      <div class="stat b"><span class="sn">5</span><span class="sc">設計中草稿</span></div>
      <div class="stat c"><span class="sn">138</span><span class="sc">欄位元件總數</span></div>
      <div class="stat d"><span class="sn">2</span><span class="sc">已停用表單</span></div>
    </div>
  </div>

  <div class="panel">
    <h2>表單登錄冊 ▸ REGISTRY</h2>
    <div class="filter-bar">
      狀態：
      <select id="fState">
        <option value="all">全部</option>
        <option value="pub">已發佈</option>
        <option value="draft">設計中</option>
        <option value="off">已停用</option>
      </select>
      關鍵字：<input type="text" id="fKw" placeholder="表單名稱／代號…">
      <span class="cnt" id="cntTip"></span>
    </div>
    <table>
      <thead>
        <tr><th>表單代號</th><th>表單名稱</th><th>版本</th><th>欄位數</th><th>最近修改</th><th>狀態</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty-tip" id="emptyTip">── 掃描無結果 ──</div>
  </div>
</div>

<script>
const forms = [
  {code:'FR-115-01', name:'115年度補助申請表',     ver:'v3.2', fields:14, mod:'115-08-26 14:20', st:'pub',   stTxt:'已發佈'},
  {code:'FR-115-02', name:'職業災害通報單',         ver:'v1.8', fields:11, mod:'115-08-21 09:05', st:'pub',   stTxt:'已發佈'},
  {code:'FR-115-03', name:'加班費申領表（新版）',   ver:'v0.9', fields:9,  mod:'115-08-27 17:42', st:'draft', stTxt:'設計中'},
  {code:'FR-115-04', name:'公務車輛派用申請',       ver:'v2.1', fields:8,  mod:'115-08-14 11:30', st:'pub',   stTxt:'已發佈'},
  {code:'FR-115-05', name:'採購驗收紀錄表',         ver:'v1.2', fields:16, mod:'115-08-08 15:56', st:'pub',   stTxt:'已發佈'},
  {code:'FR-115-06', name:'舊版出差旅費報告表',     ver:'v4.0', fields:12, mod:'115-05-30 10:12', st:'off',   stTxt:'已停用'},
  {code:'FR-115-07', name:'資訊設備報修單',         ver:'v0.4', fields:7,  mod:'115-08-28 08:44', st:'draft', stTxt:'設計中'},
  {code:'FR-114-18', name:'紙本請假單（停用）',     ver:'v5.6', fields:10, mod:'114-12-20 16:00', st:'off',   stTxt:'已停用'}
];
const tbody = document.getElementById('tbody');
forms.forEach(function(f){
  const tr = document.createElement('tr');
  tr.dataset.st = f.st;
  tr.innerHTML =
    '<td class="mono">' + f.code + '</td><td class="c-name"></td><td class="mono">' + f.ver + '</td>' +
    '<td class="mono">' + f.fields + '</td><td class="mono">' + f.mod + '</td>' +
    '<td><span class="stag ' + f.st + '">' + f.stTxt + '</span></td>' +
    '<td><a class="op" href="index.html">設計 ▸</a><a class="op v" href="publish.html">版本 ▸</a></td>';
  tr.querySelector('.c-name').textContent = f.name;
  tbody.appendChild(tr);
});

const fState = document.getElementById('fState');
const fKw = document.getElementById('fKw');
function apply(){
  const sv = fState.value, kw = fKw.value.trim();
  let n = 0;
  tbody.querySelectorAll('tr').forEach(function(tr){
    const show = (sv === 'all' || tr.dataset.st === sv) && (!kw || tr.textContent.indexOf(kw) !== -1);
    tr.classList.toggle('hide', !show);
    if (show) n++;
  });
  document.getElementById('cntTip').textContent = 'SCAN RESULT: ' + n + ' 筆';
  document.getElementById('emptyTip').style.display = n ? 'none' : 'block';
}
fState.addEventListener('change', apply);
fKw.addEventListener('input', apply);
apply();
</script>
</body>
</html>
