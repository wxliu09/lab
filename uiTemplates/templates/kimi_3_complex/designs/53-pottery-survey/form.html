<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增問卷 · 陶藝問卷工房</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --clay:#c67b5c; --bisque:#f2e4d5; --glaze:#5b7a6a;
  --brown:#4a3428; --kiln:#a34a3a; --soil:#e9d9c4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--soil);
  background-image:radial-gradient(rgba(74,52,40,.05) 1.5px, transparent 1.5px);
  background-size:22px 22px;
  font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;
  color:var(--brown);min-height:100vh;display:flex;
}
.sidebar{
  width:216px;flex-shrink:0;
  background:linear-gradient(180deg, #d9bfa4, var(--clay));
  border-right:3px solid rgba(74,52,40,.15);
  padding:22px 16px;display:flex;flex-direction:column;gap:8px;
  position:sticky;top:0;height:100vh;
}
.back-link{
  display:block;text-decoration:none;text-align:center;
  background:var(--brown);color:var(--bisque);
  font-weight:700;letter-spacing:3px;font-size:14px;
  padding:10px 0;border-radius:14px 4px 14px 4px;
  box-shadow:0 3px 0 rgba(74,52,40,.4);transition:transform .15s;
}
.back-link:hover{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,52,40,.4);}
.back-link.home{background:rgba(74,52,40,.55);}
.brand{text-align:center;margin:18px 0 8px;}
.brand .pot{
  width:64px;height:64px;margin:0 auto 8px;
  background:
    radial-gradient(circle at 50% 30%, var(--bisque) 0 8px, transparent 8px),
    radial-gradient(ellipse at 50% 78%, var(--glaze), #47614f);
  border-radius:50% 50% 46% 54% / 40% 40% 60% 60%;
  box-shadow:inset 0 -8px 12px rgba(0,0,0,.18);
}
.brand h1{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--brown);}
.brand small{font-size:11px;letter-spacing:3px;color:rgba(74,52,40,.65);}
.nav-item{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  color:var(--brown);font-weight:700;font-size:14px;letter-spacing:2px;
  padding:10px 14px;border-radius:12px 4px 12px 4px;transition:background .2s;
}
.nav-item:hover{background:rgba(242,228,213,.5);}
.nav-item.active{background:var(--bisque);box-shadow:inset 0 2px 4px rgba(74,52,40,.15);}
.side-note{margin-top:auto;font-size:11px;color:rgba(74,52,40,.7);letter-spacing:2px;line-height:1.9;text-align:center;}

.main{flex:1;padding:26px 30px 50px;min-width:0;max-width:900px;}
.page-head{margin-bottom:22px;}
.page-head h2{font-size:26px;font-weight:900;letter-spacing:4px;display:inline-block;position:relative;}
.page-head h2::after{
  content:'';position:absolute;left:0;right:8px;bottom:-6px;height:6px;
  background:var(--glaze);border-radius:3px;opacity:.55;transform:rotate(-.6deg);
}
.page-head p{margin-top:10px;font-size:13px;letter-spacing:2px;color:rgba(74,52,40,.7);}
.section-title{
  font-size:16px;font-weight:900;letter-spacing:4px;margin:26px 0 14px;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:14px;height:14px;background:var(--clay);
  border-radius:60% 40% 55% 45%/50% 55% 45% 50%;
}

.panel{
  background:var(--bisque);border:2px solid rgba(74,52,40,.14);
  border-radius:18px 8px 18px 8px;padding:22px 24px;
  box-shadow:0 4px 10px rgba(74,52,40,.14);
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.field>label{font-size:13px;font-weight:900;letter-spacing:2px;}
.field>label .req{color:var(--kiln);}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  font-family:inherit;font-size:14px;letter-spacing:1px;color:var(--brown);
  background:#fffaf2;border:2px solid rgba(74,52,40,.2);
  border-radius:12px 4px 12px 4px;padding:9px 14px;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--clay);}
.field textarea{resize:vertical;min-height:70px;line-height:1.9;}
.field .hint{font-size:12px;color:var(--kiln);min-height:16px;letter-spacing:1px;}
.radio-row,.check-row{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;letter-spacing:1px;padding-top:2px;}
.radio-row label,.check-row label{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  background:#fffaf2;border:2px solid rgba(74,52,40,.15);
  border-radius:12px 4px 12px 4px;padding:7px 14px;transition:all .15s;
}
.radio-row label:has(input:checked),.check-row label:has(input:checked){
  border-color:var(--glaze);background:rgba(91,122,106,.12);
}
.radio-row input,.check-row input{accent-color:var(--glaze);width:15px;height:15px;}

/* 題目編輯卡 */
.qedit{
  border:2px dashed rgba(74,52,40,.25);border-radius:16px 6px 16px 6px;
  padding:14px 16px;margin-bottom:12px;background:#fffaf2;
  display:grid;grid-template-columns:110px 1fr 90px auto;gap:12px;align-items:center;
}
.qedit .qno-badge{
  font-weight:900;color:var(--bisque);background:var(--clay);
  border-radius:10px 4px 10px 4px;padding:3px 0;text-align:center;font-size:13px;letter-spacing:1px;
}
.qedit input[type=text],.qedit select{
  font-family:inherit;font-size:14px;color:var(--brown);
  background:#fff;border:2px solid rgba(74,52,40,.2);
  border-radius:10px 4px 10px 4px;padding:8px 12px;outline:none;width:100%;
}
.qedit .rm{
  cursor:pointer;border:none;background:none;font-size:15px;color:rgba(74,52,40,.5);
}
.qedit .rm:hover{color:var(--kiln);transform:scale(1.2);}
.btn-line{
  cursor:pointer;font-family:inherit;font-weight:900;letter-spacing:3px;font-size:14px;
  background:transparent;color:var(--glaze);border:2px dashed var(--glaze);
  border-radius:14px 4px 14px 4px;padding:10px 22px;transition:all .2s;
}
.btn-line:hover{background:rgba(91,122,106,.12);}
.btn-clay{
  cursor:pointer;font-family:inherit;font-weight:900;letter-spacing:4px;font-size:16px;
  background:var(--clay);color:var(--bisque);border:none;
  border-radius:16px 6px 16px 6px;padding:13px 34px;
  box-shadow:0 4px 0 #a05f43;transition:transform .15s, box-shadow .15s;
}
.btn-clay:hover{transform:translateY(2px);box-shadow:0 2px 0 #a05f43;}
.btn-clay:active{transform:translateY(4px);box-shadow:none;}
.form-msg{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--glaze);align-self:center;}
.form-msg.bad{color:var(--kiln);}
.submit-row{display:flex;gap:18px;align-items:center;margin-top:6px;flex-wrap:wrap;}

@media (max-width:900px){
  body{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;}
  .side-note{display:none;}
  .brand{margin:0;}
  .form-grid{grid-template-columns:1fr;}
  .qedit{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<nav class="sidebar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link home" href="index.html">⌂ 返回主控台</a>
  <div class="brand">
    <div class="pot"></div>
    <h1>陶藝問卷工房</h1>
    <small>SURVEY KILN</small>
  </div>
  <a class="nav-item" href="index.html">◈ 問卷總覽</a>
  <a class="nav-item" href="types.html">◈ 題型管理</a>
  <a class="nav-item" href="stats.html">◈ 回收統計</a>
  <a class="nav-item" href="answers.html">◈ 填答查詢</a>
  <a class="nav-item active" href="form.html">◈ 新增問卷</a>
  <div class="side-note">本窯燒製中<br>窯溫 1,230°C</div>
</nav>

<div class="main">
  <div class="page-head">
    <h2>新增問卷</h2>
    <p>捏好陶坯再入窯——先填基本資料，再逐一加上題目，最後預覽發布。</p>
  </div>

  <form id="surveyForm" novalidate>
    <div class="section-title">① 基本資料</div>
    <div class="panel">
      <div class="form-grid">
        <div class="field full">
          <label for="sName">問卷名稱 <span class="req">*</span></label>
          <input type="text" id="sName" placeholder="例：秋季釉藥課程意向調查">
          <div class="hint" id="hName"></div>
        </div>
        <div class="field">
          <label for="sCat">調查類別 <span class="req">*</span></label>
          <select id="sCat">
            <option value="">── 請擇一 ──</option>
            <option>課程滿意度</option>
            <option>活動報名意願</option>
            <option>設施使用回饋</option>
            <option>攤商／講師訪談</option>
          </select>
          <div class="hint" id="hCat"></div>
        </div>
        <div class="field">
          <label for="sTotal">預計發放份數 <span class="req">*</span></label>
          <input type="number" id="sTotal" min="1" placeholder="例：100">
          <div class="hint" id="hTotal"></div>
        </div>
        <div class="field">
          <label for="sStart">開始日期 <span class="req">*</span></label>
          <input type="date" id="sStart" value="2026-09-01">
          <div class="hint" id="hStart"></div>
        </div>
        <div class="field">
          <label for="sEnd">截止日期 <span class="req">*</span></label>
          <input type="date" id="sEnd" value="2026-09-30">
          <div class="hint" id="hEnd"></div>
        </div>
        <div class="field full">
          <label>填答對象 <span class="req">*</span></label>
          <div class="radio-row">
            <label><input type="radio" name="sWho" value="學員" checked> 課程學員</label>
            <label><input type="radio" name="sWho" value="一般民眾"> 一般民眾</label>
            <label><input type="radio" name="sWho" value="攤商講師"> 攤商／講師</label>
          </div>
        </div>
        <div class="field full">
          <label>填答設定</label>
          <div class="check-row">
            <label><input type="checkbox" id="sAnon" checked> 匿名填答</label>
            <label><input type="checkbox" id="sOnce" checked> 每人限填一次</label>
            <label><input type="checkbox" id="sMail"> 截止前三天自動提醒</label>
          </div>
        </div>
        <div class="field full">
          <label for="sIntro">卷首說明</label>
          <textarea id="sIntro" rows="2" placeholder="寫給填答者的一段話…">感謝您撥冗填寫，本問卷僅供課程改進參考，資料將彙整後匿名使用。</textarea>
          <div class="hint"></div>
        </div>
      </div>
    </div>

    <div class="section-title">② 題目清單（已排入 <span id="qCount">2</span> 題）</div>
    <div id="qList">
      <div class="qedit">
        <span class="qno-badge">Q1</span>
        <input type="text" class="q-title" placeholder="題目內容…" value="您從何處得知本次活動訊息？">
        <select class="q-type"><option>單選題</option><option>多選題</option><option>量表題</option><option>問答題</option></select>
        <button type="button" class="rm" title="移除題目">✕</button>
      </div>
      <div class="qedit">
        <span class="qno-badge">Q2</span>
        <input type="text" class="q-title" placeholder="題目內容…" value="您對活動整體安排打幾分？">
        <select class="q-type"><option>單選題</option><option>多選題</option><option selected>量表題</option><option>問答題</option></select>
        <button type="button" class="rm" title="移除題目">✕</button>
      </div>
    </div>
    <button type="button" class="btn-line" id="addQ">＋ 再捏一題</button>

    <div class="section-title">③ 入窯發布</div>
    <div class="panel">
      <div class="submit-row">
        <button type="submit" class="btn-clay">◉ 送窯發布</button>
        <span class="form-msg" id="formMsg"></span>
      </div>
      <p style="font-size:12px;letter-spacing:2px;color:rgba(74,52,40,.65);margin-top:12px;line-height:2;">
        發布後題目即不可更動（如陶坯入窯）；若需修改請先「存為草稿」——目前草稿會保留在本機頁面。
      </p>
    </div>
  </form>
</div>

<script>
/* 動態加題／刪題，並即時重編題號 */
const qList = document.getElementById('qList');
const qCount = document.getElementById('qCount');
function renum(){
  qList.querySelectorAll('.qedit').forEach(function(q, i){
    q.querySelector('.qno-badge').textContent = 'Q' + (i + 1);
  });
  qCount.textContent = qList.children.length;
}
document.getElementById('addQ').addEventListener('click', function(){
  const div = document.createElement('div');
  div.className = 'qedit';
  div.innerHTML =
    '<span class="qno-badge"></span>' +
    '<input type="text" class="q-title" placeholder="題目內容…">' +
    '<select class="q-type"><option>單選題</option><option>多選題</option><option>量表題</option><option>問答題</option></select>' +
    '<button type="button" class="rm" title="移除題目">✕</button>';
  qList.appendChild(div);
  renum();
  div.querySelector('input').focus();
});
qList.addEventListener('click', function(e){
  if (e.target.classList.contains('rm')){
    e.target.closest('.qedit').remove();
    renum();
  }
});

/* 發布前檢核 */
document.getElementById('surveyForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('sName');
  const cat = document.getElementById('sCat');
  const total = document.getElementById('sTotal');
  const start = document.getElementById('sStart');
  const end = document.getElementById('sEnd');
  const msg = document.getElementById('formMsg');
  let ok = true;
  document.getElementById('hName').textContent = name.value.trim() ? '' : '※ 請為問卷命名';
  if (!name.value.trim()) ok = false;
  document.getElementById('hCat').textContent = cat.value ? '' : '※ 請選擇調查類別';
  if (!cat.value) ok = false;
  document.getElementById('hTotal').textContent = (+total.value > 0) ? '' : '※ 請輸入發放份數';
  if (!(+total.value > 0)) ok = false;
  const badDate = !start.value || !end.value || end.value < start.value;
  document.getElementById('hEnd').textContent = badDate ? '※ 截止日期須晚於開始日期' : '';
  if (badDate) ok = false;
  /* 題目不得為空 */
  let emptyQ = 0;
  qList.querySelectorAll('.q-title').forEach(function(t){ if (!t.value.trim()) emptyQ++; });
  if (emptyQ){ ok = false; }
  if (!ok){
    msg.textContent = emptyQ ? '⚠ 有 ' + emptyQ + ' 題尚未填寫題目內容' : '⚠ 陶坯尚未成形，請檢查紅色欄位';
    msg.className = 'form-msg bad';
    return;
  }
  msg.textContent = '✓ 窯門已關，問卷送入燒製（預計 115-09-01 開窯上線）';
  msg.className = 'form-msg';
});
</script>
</body>
</html>
