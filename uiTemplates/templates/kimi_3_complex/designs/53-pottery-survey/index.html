<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════════════
  【設計規格】陶藝手作·問卷調查平台 (53-pottery-survey.html)
  ─────────────────────────────────────────────────────────────────────────────
  ■ 風格定位：手作陶藝工房的管理後台——粗陶的溫潤、手捏不規則的邊角、
      釉下彩的配色；問卷像一只只待燒的陶坯，統計如窯溫紀錄。
  ■ 配色（附色碼）：
      陶橘 #c67b5c（主色：按鈕、重點）
      胚米 #f2e4d5（卡片底）
      釉綠 #5b7a6a（輔色：標籤、進度）
      深陶褐 #4a3428（文字）
      窯變紅 #a34a3a（警示／將截止）
      背景土黃 #e9d9c4（頁面底）
  ■ 字體：'Zen Maru Gothic'（圓潤手作感）、'Noto Sans TC'
  ■ 版面結構：左側直式導覽欄 → 主區四區塊：
      ① 問卷列表卡（含回收率 SVG 圓環）② 題型管理（單選／多選／量表／問答）
      ③ 回收統計長條圖 ④ 填答查詢表（含狀態標籤、關鍵字篩選）。
  ■ 動態效果：
      1. 卡片使用 border-radius 不規則值，hover 時如陶土微晃（rotate 搖擺）。
      2. 回收率圓環以 SVG stroke-dashoffset 動畫繞入。
      3. 長條圖載入時自底部生長，hover 顯示數值。
      4. 填答查詢表支援即時關鍵字篩選。
  ■ 返回入口：左側導覽欄頂部「← 返回入口」連結（../../index.html）。
  ═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陶藝手作 · 問卷調查平台</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --clay:#c67b5c;
  --bisque:#f2e4d5;
  --glaze:#5b7a6a;
  --brown:#4a3428;
  --kiln:#a34a3a;
  --soil:#e9d9c4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--soil);
  background-image:radial-gradient(rgba(74,52,40,.05) 1.5px, transparent 1.5px);
  background-size:22px 22px;
  font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;
  color:var(--brown);
  min-height:100vh;
  display:flex;
}

/* ── 側欄 ── */
.sidebar{
  width:216px;flex-shrink:0;
  background:linear-gradient(180deg, #d9bfa4, var(--clay));
  border-right:3px solid rgba(74,52,40,.15);
  padding:22px 16px;
  display:flex;flex-direction:column;gap:8px;
  position:sticky;top:0;height:100vh;
}
.back-link{
  display:block;text-decoration:none;text-align:center;
  background:var(--brown);color:var(--bisque);
  font-weight:700;letter-spacing:3px;font-size:14px;
  padding:10px 0;border-radius:14px 4px 14px 4px;
  box-shadow:0 3px 0 rgba(74,52,40,.4);
  transition:transform .15s;
}
.back-link:hover{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,52,40,.4);}
.brand{
  text-align:center;margin:18px 0 8px;
}
.brand .pot{
  width:64px;height:64px;margin:0 auto 8px;
  background:
    radial-gradient(circle at 50% 30%, var(--bisque) 0 8px, transparent 8px),
    radial-gradient(ellipse at 50% 78%, var(--glaze), #47614f);
  border-radius:50% 50% 46% 54% / 40% 40% 60% 60%;
  box-shadow:inset 0 -8px 12px rgba(0,0,0,.18);
}
.brand h1{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--brown);}
.brand small{font-size:11px;letter-spacing:3px;color:rgba(74,52,40,.65);}
.nav-item{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  color:var(--brown);font-weight:700;font-size:14px;letter-spacing:2px;
  padding:10px 14px;border-radius:12px 4px 12px 4px;
  transition:background .2s;
}
.nav-item:hover{background:rgba(242,228,213,.5);}
.nav-item.active{background:var(--bisque);box-shadow:inset 0 2px 4px rgba(74,52,40,.15);}
.side-note{
  margin-top:auto;font-size:11px;color:rgba(74,52,40,.7);
  letter-spacing:2px;line-height:1.9;text-align:center;
}

/* ── 主區 ── */
.main{flex:1;padding:26px 30px 50px;min-width:0;}
.page-head{margin-bottom:22px;}
.page-head h2{
  font-size:26px;font-weight:900;letter-spacing:4px;
  display:inline-block;position:relative;
}
.page-head h2::after{
  content:'';position:absolute;left:0;right:8px;bottom:-6px;height:6px;
  background:var(--glaze);border-radius:3px;opacity:.55;
  transform:rotate(-.6deg);
}
.page-head p{margin-top:10px;font-size:13px;letter-spacing:2px;color:rgba(74,52,40,.7);}

.section-title{
  font-size:16px;font-weight:900;letter-spacing:4px;margin:26px 0 14px;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:14px;height:14px;background:var(--clay);
  border-radius:60% 40% 55% 45%/50% 55% 45% 50%;
}

/* 問卷卡 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
.qcard{
  background:var(--bisque);
  border:2px solid rgba(74,52,40,.14);
  border-radius:26px 10px 24px 12px / 14px 26px 10px 22px;
  padding:18px 18px 16px;
  box-shadow:0 4px 10px rgba(74,52,40,.14);
  transition:transform .25s, box-shadow .25s;
  position:relative;
}
.qcard:nth-child(2n){border-radius:12px 26px 10px 24px / 24px 10px 26px 12px;}
.qcard:hover{
  animation:wobble .6s ease;
  box-shadow:0 10px 20px rgba(74,52,40,.22);
}
@keyframes wobble{
  0%{transform:rotate(0);}
  25%{transform:rotate(1.4deg) translateY(-3px);}
  55%{transform:rotate(-1.1deg);}
  80%{transform:rotate(.5deg);}
  100%{transform:rotate(0);}
}
.qcard .qname{font-size:16px;font-weight:900;letter-spacing:1px;}
.qcard .qmeta{font-size:12px;color:rgba(74,52,40,.65);letter-spacing:1px;margin-top:4px;}
.qcard .ring-wrap{display:flex;align-items:center;gap:14px;margin-top:12px;}
.ring{transform:rotate(-90deg);}
.ring .bgc{stroke:rgba(74,52,40,.12);}
.ring .fgc{
  stroke:var(--glaze);stroke-linecap:round;
  transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.3,1);
}
.ring-num{font-size:22px;font-weight:900;color:var(--glaze);}
.ring-cap{font-size:11px;letter-spacing:2px;color:rgba(74,52,40,.6);}
.badge{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;
  padding:3px 10px;border-radius:10px 4px 10px 4px;margin-top:10px;
}
.badge.open{background:var(--glaze);color:var(--bisque);}
.badge.close{background:var(--kiln);color:var(--bisque);}
.badge.draft{background:rgba(74,52,40,.2);color:var(--brown);}
.qcard .op{
  display:inline-block;margin-top:10px;margin-left:8px;
  color:var(--clay);font-weight:700;font-size:12px;letter-spacing:2px;text-decoration:none;
}
.qcard .op:hover{text-decoration:underline;}
.section-title .more{
  margin-left:auto;font-size:12px;font-weight:700;letter-spacing:2px;
  color:var(--glaze);text-decoration:none;
}
.section-title .more:hover{text-decoration:underline;}

/* 題型管理 */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;}
.tcard{
  background:var(--bisque);border:2px dashed rgba(74,52,40,.25);
  border-radius:20px 8px 20px 8px;
  padding:16px;text-align:center;
  transition:transform .2s;
}
.tcard:hover{transform:translateY(-4px) rotate(-.8deg);}
.tcard .tico{font-size:26px;}
.tcard .tname{font-weight:900;letter-spacing:2px;margin-top:6px;}
.tcard .tcount{font-size:12px;color:rgba(74,52,40,.65);margin-top:3px;letter-spacing:1px;}
.tcard .tbar{
  height:8px;border-radius:4px;background:rgba(74,52,40,.12);margin-top:10px;overflow:hidden;
}
.tcard .tbar i{display:block;height:100%;border-radius:4px;background:var(--clay);width:0;transition:width 1s ease;}
.tcard:nth-child(2) .tbar i{background:var(--glaze);}
.tcard:nth-child(3) .tbar i{background:#b08d57;}
.tcard:nth-child(4) .tbar i{background:var(--kiln);}

/* 長條圖 */
.chart{
  background:var(--bisque);border:2px solid rgba(74,52,40,.14);
  border-radius:18px 8px 18px 8px;padding:20px 22px;
}
.bars{display:flex;align-items:flex-end;gap:26px;height:170px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;position:relative;}
.bar{
  width:100%;max-width:58px;border-radius:8px 8px 3px 3px;
  background:linear-gradient(180deg, var(--clay), #a05f43);
  height:0;transition:height 1s cubic-bezier(.3,.9,.3,1);
  position:relative;cursor:pointer;
}
.bar:nth-child(odd), .bar-col:nth-child(even) .bar{background:linear-gradient(180deg, var(--glaze), #43604f);}
.bar .val{
  position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  font-size:12px;font-weight:900;color:var(--brown);
  opacity:0;transition:opacity .2s;
}
.bar:hover .val{opacity:1;}
.bar-lab{font-size:12px;letter-spacing:1px;color:rgba(74,52,40,.75);}

/* 查詢表 */
.query-panel{
  background:var(--bisque);border:2px solid rgba(74,52,40,.14);
  border-radius:18px 8px 18px 8px;padding:20px 22px;
}
.query-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.query-row input{
  flex:1;min-width:220px;
  font-family:inherit;font-size:14px;letter-spacing:1px;
  background:#fffaf2;border:2px solid rgba(74,52,40,.2);
  border-radius:12px 4px 12px 4px;padding:9px 14px;outline:none;color:var(--brown);
}
.query-row input:focus{border-color:var(--clay);}
.query-row .cnt{font-size:12px;letter-spacing:2px;color:rgba(74,52,40,.65);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{
  text-align:left;font-size:12px;letter-spacing:3px;color:rgba(74,52,40,.6);
  border-bottom:2px solid rgba(74,52,40,.3);padding:8px 8px;
}
td{padding:10px 8px;border-bottom:1px dashed rgba(74,52,40,.2);}
tr.hide{display:none;}
.stag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:10px 4px 10px 4px;}
.stag.done{background:var(--glaze);color:var(--bisque);}
.stag.part{background:#b08d57;color:#fff;}
.stag.invalid{background:var(--kiln);color:var(--bisque);}

@media (max-width:900px){
  body{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;}
  .side-note{display:none;}
  .brand{margin:0;}
}
</style>
</head>
<body>

<nav class="sidebar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <div class="brand">
    <div class="pot"></div>
    <h1>陶藝問卷工房</h1>
    <small>SURVEY KILN</small>
  </div>
  <a class="nav-item active" href="index.html">◈ 問卷總覽</a>
  <a class="nav-item" href="types.html">◈ 題型管理</a>
  <a class="nav-item" href="stats.html">◈ 回收統計</a>
  <a class="nav-item" href="answers.html">◈ 填答查詢</a>
  <a class="nav-item" href="form.html">◈ 新增問卷</a>
  <div class="side-note">本窯燒製中<br>窯溫 1,230°C</div>
</nav>

<div class="main">
  <div class="page-head">
    <h2>問卷調查平台</h2>
    <p>115 年度文化局社區營造系列調查 ｜ 最後燒窯：08-28 14:00</p>
  </div>

  <div class="section-title">問卷列表</div>
  <div class="cards" id="qCards"></div>

  <div class="section-title">題型管理 <a class="more" href="types.html">查看全部 ▸</a></div>
  <div class="types">
    <div class="tcard"><div class="tico">◉</div><div class="tname">單選題</div><div class="tcount">共 18 題使用中</div><div class="tbar"><i data-w="72%"></i></div></div>
    <div class="tcard"><div class="tico">☑</div><div class="tname">多選題</div><div class="tcount">共 11 題使用中</div><div class="tbar"><i data-w="44%"></i></div></div>
    <div class="tcard"><div class="tico">★</div><div class="tname">量表題</div><div class="tcount">共 9 題使用中</div><div class="tbar"><i data-w="36%"></i></div></div>
    <div class="tcard"><div class="tico">✎</div><div class="tname">問答題</div><div class="tcount">共 6 題使用中</div><div class="tbar"><i data-w="24%"></i></div></div>
  </div>

  <div class="section-title">回收統計（近六週） <a class="more" href="stats.html">完整統計 ▸</a></div>
  <div class="chart">
    <div class="bars" id="bars"></div>
  </div>

  <div class="section-title">填答查詢 <a class="more" href="answers.html">進階查詢 ▸</a></div>
  <div class="query-panel">
    <div class="query-row">
      <input type="text" id="kw" placeholder="🔍 輸入填答者姓名或問卷名稱關鍵字…">
      <span class="cnt" id="cntTip"></span>
    </div>
    <table>
      <thead>
        <tr><th>填答者</th><th>問卷名稱</th><th>填答時間</th><th>耗時</th><th>狀態</th></tr>
      </thead>
      <tbody id="ansBody"></tbody>
    </table>
  </div>
</div>

<script>
/* 問卷卡（含回收率圓環） */
const surveys = [
  {name:'社區陶藝課程滿意度調查', code:'SV-115-07', total:120, got:98,  state:'open',  sTxt:'填答中'},
  {name:'手作市集攤主需求訪談',   code:'SV-115-08', total:60,  got:57,  state:'open',  sTxt:'填答中'},
  {name:'釉藥體驗工作坊回饋',     code:'SV-115-05', total:80,  got:80,  state:'close', sTxt:'已截止'},
  {name:'親子捏陶活動意見蒐集',   code:'SV-115-09', total:150, got:0,   state:'draft', sTxt:'尚未發布'}
];
const CIRC = 2 * Math.PI * 26;
const cardWrap = document.getElementById('qCards');
surveys.forEach(function(s){
  const rate = s.total ? Math.round(s.got / s.total * 100) : 0;
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML =
    '<div class="qname"></div>' +
    '<div class="qmeta">編號 ' + s.code + ' ｜ 回收 ' + s.got + ' / ' + s.total + ' 份</div>' +
    '<div class="ring-wrap">' +
      '<svg class="ring" width="64" height="64">' +
        '<circle class="bgc" cx="32" cy="32" r="26" fill="none" stroke-width="7"/>' +
        '<circle class="fgc" cx="32" cy="32" r="26" fill="none" stroke-width="7" ' +
          'stroke-dasharray="' + CIRC.toFixed(1) + '" stroke-dashoffset="' + CIRC.toFixed(1) + '" data-rate="' + rate + '"/>' +
      '</svg>' +
      '<div><div class="ring-num">' + rate + '%</div><div class="ring-cap">回收率</div></div>' +
    '</div>' +
    '<span class="badge ' + s.state + '">' + s.sTxt + '</span>' +
    '<a class="op" href="detail.html">詳情 ▸</a>';
  card.querySelector('.qname').textContent = s.name;
  cardWrap.appendChild(card);
});
/* 圓環繞入 + 題型條生長 */
requestAnimationFrame(function(){
  setTimeout(function(){
    document.querySelectorAll('.fgc').forEach(function(c){
      const r = +c.dataset.rate;
      c.style.strokeDashoffset = (CIRC * (1 - r / 100)).toFixed(1);
    });
    document.querySelectorAll('.tbar i').forEach(function(b){ b.style.width = b.dataset.w; });
  }, 120);
});

/* 回收統計長條圖 */
const weeks = [
  {lab:'07/20 週', v:34}, {lab:'07/27 週', v:52}, {lab:'08/03 週', v:47},
  {lab:'08/10 週', v:71}, {lab:'08/17 週', v:63}, {lab:'08/24 週', v:88}
];
const bars = document.getElementById('bars');
const maxV = Math.max.apply(null, weeks.map(function(w){ return w.v; }));
weeks.forEach(function(w){
  const col = document.createElement('div');
  col.className = 'bar-col';
  col.innerHTML = '<div class="bar" data-h="' + Math.round(w.v / maxV * 100) + '%"><span class="val">' + w.v + ' 份</span></div><div class="bar-lab">' + w.lab + '</div>';
  bars.appendChild(col);
});
setTimeout(function(){
  document.querySelectorAll('.bar').forEach(function(b){ b.style.height = b.dataset.h; });
}, 200);

/* 填答查詢表 + 關鍵字篩選 */
const answers = [
  {who:'林郁庭', sv:'社區陶藝課程滿意度調查', time:'08-28 11:42', dur:'6 分 12 秒', st:'done',  stTxt:'有效'},
  {who:'陳建宏', sv:'手作市集攤主需求訪談',   time:'08-28 10:05', dur:'4 分 48 秒', st:'done',  stTxt:'有效'},
  {who:'黃美玲', sv:'社區陶藝課程滿意度調查', time:'08-27 16:30', dur:'1 分 03 秒', st:'invalid', stTxt:'作廢'},
  {who:'吳承翰', sv:'釉藥體驗工作坊回饋',     time:'08-27 15:11', dur:'5 分 37 秒', st:'done',  stTxt:'有效'},
  {who:'蔡宜靜', sv:'社區陶藝課程滿意度調查', time:'08-27 09:58', dur:'—',          st:'part',  stTxt:'未完成'},
  {who:'鄭宇翔', sv:'手作市集攤主需求訪談',   time:'08-26 20:14', dur:'7 分 02 秒', st:'done',  stTxt:'有效'}
];
const ansBody = document.getElementById('ansBody');
answers.forEach(function(a){
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td></td><td></td><td>' + a.time + '</td><td>' + a.dur + '</td>' +
    '<td><span class="stag ' + a.st + '">' + a.stTxt + '</span></td>';
  tr.children[0].textContent = a.who;
  tr.children[1].textContent = a.sv;
  ansBody.appendChild(tr);
});
const kw = document.getElementById('kw');
kw.addEventListener('input', function(){
  const k = this.value.trim();
  let n = 0;
  ansBody.querySelectorAll('tr').forEach(function(tr){
    const hit = !k || tr.textContent.indexOf(k) !== -1;
    tr.classList.toggle('hide', !hit);
    if (hit) n++;
  });
  document.getElementById('cntTip').textContent = '符合 ' + n + ' 筆';
});
kw.dispatchEvent(new Event('input'));
</script>
</body>
</html>
