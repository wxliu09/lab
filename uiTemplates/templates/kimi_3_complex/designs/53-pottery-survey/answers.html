<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>填答查詢 · 陶藝問卷工房</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --clay:#c67b5c; --bisque:#f2e4d5; --glaze:#5b7a6a;
  --brown:#4a3428; --kiln:#a34a3a; --soil:#e9d9c4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--soil);
  background-image:radial-gradient(rgba(74,52,40,.05) 1.5px, transparent 1.5px);
  background-size:22px 22px;
  font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;
  color:var(--brown);min-height:100vh;display:flex;
}
.sidebar{
  width:216px;flex-shrink:0;
  background:linear-gradient(180deg, #d9bfa4, var(--clay));
  border-right:3px solid rgba(74,52,40,.15);
  padding:22px 16px;display:flex;flex-direction:column;gap:8px;
  position:sticky;top:0;height:100vh;
}
.back-link{
  display:block;text-decoration:none;text-align:center;
  background:var(--brown);color:var(--bisque);
  font-weight:700;letter-spacing:3px;font-size:14px;
  padding:10px 0;border-radius:14px 4px 14px 4px;
  box-shadow:0 3px 0 rgba(74,52,40,.4);transition:transform .15s;
}
.back-link:hover{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,52,40,.4);}
.back-link.home{background:rgba(74,52,40,.55);}
.brand{text-align:center;margin:18px 0 8px;}
.brand .pot{
  width:64px;height:64px;margin:0 auto 8px;
  background:
    radial-gradient(circle at 50% 30%, var(--bisque) 0 8px, transparent 8px),
    radial-gradient(ellipse at 50% 78%, var(--glaze), #47614f);
  border-radius:50% 50% 46% 54% / 40% 40% 60% 60%;
  box-shadow:inset 0 -8px 12px rgba(0,0,0,.18);
}
.brand h1{font-size:17px;font-weight:900;letter-spacing:2px;color:var(--brown);}
.brand small{font-size:11px;letter-spacing:3px;color:rgba(74,52,40,.65);}
.nav-item{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  color:var(--brown);font-weight:700;font-size:14px;letter-spacing:2px;
  padding:10px 14px;border-radius:12px 4px 12px 4px;transition:background .2s;
}
.nav-item:hover{background:rgba(242,228,213,.5);}
.nav-item.active{background:var(--bisque);box-shadow:inset 0 2px 4px rgba(74,52,40,.15);}
.side-note{margin-top:auto;font-size:11px;color:rgba(74,52,40,.7);letter-spacing:2px;line-height:1.9;text-align:center;}

.main{flex:1;padding:26px 30px 50px;min-width:0;}
.page-head{margin-bottom:22px;}
.page-head h2{font-size:26px;font-weight:900;letter-spacing:4px;display:inline-block;position:relative;}
.page-head h2::after{
  content:'';position:absolute;left:0;right:8px;bottom:-6px;height:6px;
  background:var(--glaze);border-radius:3px;opacity:.55;transform:rotate(-.6deg);
}
.page-head p{margin-top:10px;font-size:13px;letter-spacing:2px;color:rgba(74,52,40,.7);}
.section-title{
  font-size:16px;font-weight:900;letter-spacing:4px;margin:26px 0 14px;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';width:14px;height:14px;background:var(--clay);
  border-radius:60% 40% 55% 45%/50% 55% 45% 50%;
}

.query-panel{
  background:var(--bisque);border:2px solid rgba(74,52,40,.14);
  border-radius:18px 8px 18px 8px;padding:20px 22px;
  box-shadow:0 4px 10px rgba(74,52,40,.14);
}
.query-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.query-row input[type=text]{
  flex:1;min-width:200px;
  font-family:inherit;font-size:14px;letter-spacing:1px;
  background:#fffaf2;border:2px solid rgba(74,52,40,.2);
  border-radius:12px 4px 12px 4px;padding:9px 14px;outline:none;color:var(--brown);
}
.query-row select,.query-row input[type=date]{
  font-family:inherit;font-size:13px;letter-spacing:1px;color:var(--brown);
  background:#fffaf2;border:2px solid rgba(74,52,40,.2);
  border-radius:12px 4px 12px 4px;padding:8px 10px;outline:none;
}
.query-row input:focus,.query-row select:focus{border-color:var(--clay);}
.query-row .cnt{font-size:12px;letter-spacing:2px;color:rgba(74,52,40,.65);width:100%;}
.btn-export{
  cursor:pointer;font-family:inherit;font-weight:900;letter-spacing:2px;font-size:13px;
  background:var(--glaze);color:var(--bisque);border:none;
  border-radius:12px 4px 12px 4px;padding:9px 18px;
  box-shadow:0 3px 0 #43604f;transition:transform .15s, box-shadow .15s;
}
.btn-export:hover{transform:translateY(1px);box-shadow:0 2px 0 #43604f;}
.btn-export:disabled{opacity:.6;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:12px;letter-spacing:3px;color:rgba(74,52,40,.6);border-bottom:2px solid rgba(74,52,40,.3);padding:8px;}
td{padding:10px 8px;border-bottom:1px dashed rgba(74,52,40,.2);}
tbody tr{transition:background .15s;}
tbody tr:hover{background:rgba(198,123,92,.08);}
tr.hide{display:none;}
.stag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:10px 4px 10px 4px;}
.stag.done{background:var(--glaze);color:var(--bisque);}
.stag.part{background:#b08d57;color:#fff;}
.stag.invalid{background:var(--kiln);color:var(--bisque);}
.empty-tip{text-align:center;padding:24px;color:rgba(74,52,40,.55);letter-spacing:3px;display:none;font-weight:700;}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;letter-spacing:2px;color:rgba(74,52,40,.7);margin-top:14px;}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px 3px 6px 3px;margin-right:5px;vertical-align:-1px;}
@media (max-width:900px){
  body{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;}
  .side-note{display:none;}
  .brand{margin:0;}
}
</style>
</head>
<body>

<nav class="sidebar">
  <a class="back-link" href="../../index.html">← 返回入口</a>
  <a class="back-link home" href="index.html">⌂ 返回主控台</a>
  <div class="brand">
    <div class="pot"></div>
    <h1>陶藝問卷工房</h1>
    <small>SURVEY KILN</small>
  </div>
  <a class="nav-item" href="index.html">◈ 問卷總覽</a>
  <a class="nav-item" href="types.html">◈ 題型管理</a>
  <a class="nav-item" href="stats.html">◈ 回收統計</a>
  <a class="nav-item active" href="answers.html">◈ 填答查詢</a>
  <a class="nav-item" href="form.html">◈ 新增問卷</a>
  <div class="side-note">本窯燒製中<br>窯溫 1,230°C</div>
</nav>

<div class="main">
  <div class="page-head">
    <h2>填答查詢</h2>
    <p>出窯清點：逐筆檢視填答紀錄，可按問卷、狀態與日期篩選。</p>
  </div>

  <div class="section-title">條件篩選</div>
  <div class="query-panel">
    <div class="query-row">
      <input type="text" id="kw" placeholder="🔍 填答者姓名／問卷名稱關鍵字…">
      <select id="fSurvey">
        <option value="all">全部問卷</option>
        <option>社區陶藝課程滿意度調查</option>
        <option>手作市集攤主需求訪談</option>
        <option>釉藥體驗工作坊回饋</option>
      </select>
      <select id="fState">
        <option value="all">全部狀態</option>
        <option value="done">有效</option>
        <option value="part">未完成</option>
        <option value="invalid">作廢</option>
      </select>
      <input type="date" id="fDate" title="填答日期">
      <button type="button" class="btn-export" id="btnExport">⬇ 匯出篩選結果</button>
      <span class="cnt" id="cntTip"></span>
    </div>
    <table>
      <thead>
        <tr><th>填答者</th><th>問卷名稱</th><th>填答日期</th><th>填答時間</th><th>耗時</th><th>狀態</th></tr>
      </thead>
      <tbody id="ansBody"></tbody>
    </table>
    <div class="empty-tip" id="emptyTip">─ 窯內無符合之填答 ─</div>
    <div class="legend">
      <span><i style="background:var(--glaze);"></i>有效：完整填答且通過檢核</span>
      <span><i style="background:#b08d57;"></i>未完成：逾 24 小時未繳交</span>
      <span><i style="background:var(--kiln);"></i>作廢：耗時過短或規律作答</span>
    </div>
  </div>
</div>

<script>
const answers = [
  {who:'林郁庭', sv:'社區陶藝課程滿意度調查', date:'2026-08-28', time:'11:42', dur:'6 分 12 秒', st:'done',    stTxt:'有效'},
  {who:'陳建宏', sv:'手作市集攤主需求訪談',   date:'2026-08-28', time:'10:05', dur:'4 分 48 秒', st:'done',    stTxt:'有效'},
  {who:'黃美玲', sv:'社區陶藝課程滿意度調查', date:'2026-08-27', time:'16:30', dur:'1 分 03 秒', st:'invalid', stTxt:'作廢'},
  {who:'吳承翰', sv:'釉藥體驗工作坊回饋',     date:'2026-08-27', time:'15:11', dur:'5 分 37 秒', st:'done',    stTxt:'有效'},
  {who:'蔡宜靜', sv:'社區陶藝課程滿意度調查', date:'2026-08-27', time:'09:58', dur:'—',          st:'part',    stTxt:'未完成'},
  {who:'鄭宇翔', sv:'手作市集攤主需求訪談',   date:'2026-08-26', time:'20:14', dur:'7 分 02 秒', st:'done',    stTxt:'有效'},
  {who:'許文琪', sv:'釉藥體驗工作坊回饋',     date:'2026-08-26', time:'14:22', dur:'5 分 01 秒', st:'done',    stTxt:'有效'},
  {who:'曾國豪', sv:'社區陶藝課程滿意度調查', date:'2026-08-25', time:'19:40', dur:'8 分 55 秒', st:'done',    stTxt:'有效'},
  {who:'賴思穎', sv:'手作市集攤主需求訪談',   date:'2026-08-25', time:'11:08', dur:'0 分 41 秒', st:'invalid', stTxt:'作廢'},
  {who:'江俊德', sv:'釉藥體驗工作坊回饋',     date:'2026-08-24', time:'16:47', dur:'6 分 20 秒', st:'done',    stTxt:'有效'}
];
const ansBody = document.getElementById('ansBody');
answers.forEach(function(a){
  const tr = document.createElement('tr');
  tr.dataset.st = a.st;
  tr.dataset.sv = a.sv;
  tr.dataset.date = a.date;
  tr.innerHTML =
    '<td class="c-who"></td><td class="c-sv"></td>' +
    '<td>' + a.date.replace(/^2026-/, '115-') + '</td><td>' + a.time + '</td><td>' + a.dur + '</td>' +
    '<td><span class="stag ' + a.st + '">' + a.stTxt + '</span></td>';
  tr.children[0].textContent = a.who;
  tr.children[1].textContent = a.sv;
  ansBody.appendChild(tr);
});

const kw = document.getElementById('kw');
const fSurvey = document.getElementById('fSurvey');
const fState = document.getElementById('fState');
const fDate = document.getElementById('fDate');
function apply(){
  const k = kw.value.trim(), sv = fSurvey.value, st = fState.value, dt = fDate.value;
  let n = 0;
  ansBody.querySelectorAll('tr').forEach(function(tr){
    const show =
      (!k || tr.textContent.indexOf(k) !== -1) &&
      (sv === 'all' || tr.dataset.sv === sv) &&
      (st === 'all' || tr.dataset.st === st) &&
      (!dt || tr.dataset.date === dt);
    tr.classList.toggle('hide', !show);
    if (show) n++;
  });
  document.getElementById('cntTip').textContent = '清點結果：' + n + ' 筆';
  document.getElementById('emptyTip').style.display = n ? 'none' : 'block';
}
[kw, fSurvey, fState, fDate].forEach(function(el){
  el.addEventListener('input', apply);
  el.addEventListener('change', apply);
});
apply();

/* 匯出模擬 */
document.getElementById('btnExport').addEventListener('click', function(){
  const btn = this;
  btn.disabled = true;
  btn.textContent = '包裝中…';
  setTimeout(function(){
    const n = Array.from(ansBody.querySelectorAll('tr')).filter(function(t){return !t.classList.contains('hide');}).length;
    btn.textContent = '✓ 已匯出 ' + n + ' 筆（CSV）';
    setTimeout(function(){ btn.textContent = '⬇ 匯出篩選結果'; btn.disabled = false; }, 2400);
  }, 900);
});
</script>
</body>
</html>
