<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案件列表 · 蜂巢六邊案件追蹤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#241a10; --cell:#3a2a18; --honey:#f0a82e; --honey-l:#ffd98a;
  --blue:#7fb8d4; --olive:#8a9a5b; --cream:#ffe9c0; --txt:#f3e6cf; --dim:#a68e6b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 30% 20%, rgba(240,168,46,.06), transparent 45%);
}
.serif{font-family:'Noto Serif TC','Microsoft JhengHei',serif}

.topbar{
  display:flex;align-items:center;gap:20px;padding:18px 30px;flex-wrap:wrap;
  border-bottom:1px solid rgba(240,168,46,.28);
  background:linear-gradient(180deg, rgba(58,42,24,.9), transparent);
  position:sticky;top:0;z-index:60;backdrop-filter:blur(4px);
}
.back{
  text-decoration:none;color:var(--honey);font-size:14px;font-weight:700;letter-spacing:1px;
  border:1.5px solid var(--honey);padding:7px 16px;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
  transition:all .2s;background:rgba(240,168,46,.08);
}
.back:hover{background:var(--honey);color:var(--bg)}
.brand{font-size:22px;font-weight:800;letter-spacing:4px}
.brand em{color:var(--honey);font-style:normal}
.brand small{display:block;font-size:10px;letter-spacing:5px;color:var(--dim);font-family:'Noto Sans TC';font-weight:300;margin-top:3px}
.subnav{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.subnav a{
  text-decoration:none;color:var(--honey-l);font-size:13px;font-weight:700;letter-spacing:1px;padding:6px 14px;
  background:rgba(240,168,46,.08);transition:all .2s;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);
}
.subnav a:hover{background:var(--honey);color:var(--bg)}
.subnav a.on{background:rgba(240,168,46,.3);color:var(--cream)}

.wrap{max-width:1280px;margin:0 auto;padding:26px 30px 60px}
.kpis{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:24px}
.kpi{border:1px solid rgba(240,168,46,.3);border-radius:12px;padding:14px 22px;min-width:150px}
.kpi .n{font-family:'Noto Serif TC';font-size:28px;font-weight:800;color:var(--honey);line-height:1}
.kpi .n small{font-size:13px;color:var(--dim);font-weight:400;margin-left:4px}
.kpi .k{font-size:11px;letter-spacing:2px;color:var(--dim);margin-top:4px}

.panel{border:1px solid rgba(240,168,46,.3);border-radius:14px;padding:22px;margin-bottom:26px;background:rgba(58,42,24,.35)}
h3.sec{font-family:'Noto Serif TC';font-size:17px;letter-spacing:3px;margin-bottom:16px;color:var(--honey-l)}
h3.sec::after{content:'';display:block;height:1px;background:repeating-linear-gradient(90deg,rgba(240,168,46,.5),rgba(240,168,46,.5) 6px,transparent 6px,transparent 12px);margin-top:8px}

/* 篩選 */
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.fbtn{
  display:inline-flex;align-items:center;gap:10px;background:transparent;border:none;cursor:pointer;
  color:var(--txt);font-family:inherit;font-size:14px;padding:8px 14px;text-align:left;
  border-radius:10px;transition:all .2s;
}
.fbtn:hover{background:rgba(240,168,46,.1)}
.fbtn.on{background:rgba(240,168,46,.18);box-shadow:inset 3px 0 0 var(--honey)}
.fbtn .dot{width:12px;height:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.fbtn .cnt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.search{
  margin-left:auto;padding:9px 14px;font-family:inherit;font-size:14px;color:var(--txt);
  background:rgba(20,14,7,.6);border:1px solid rgba(240,168,46,.4);border-radius:10px;outline:none;min-width:200px;
}
.search:focus{border-color:var(--honey)}
.search::placeholder{color:var(--dim)}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  text-align:left;padding:10px 12px;font-size:11.5px;letter-spacing:2px;color:var(--dim);
  border-bottom:1.5px solid rgba(240,168,46,.4);font-weight:500;white-space:nowrap;
}
td{padding:13px 12px;border-bottom:1px solid rgba(240,168,46,.14);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .18s}
tbody tr:hover{background:rgba(240,168,46,.08)}
.pip{
  display:inline-block;width:10px;height:11px;vertical-align:-1px;margin-right:8px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.pip.active{background:var(--honey)} .pip.reply{background:var(--blue)} .pip.done{background:var(--olive)} .pip.new{background:var(--cream)}
.dtag{
  display:inline-block;font-size:11.5px;padding:3px 12px;letter-spacing:2px;font-weight:700;white-space:nowrap;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);
}
.dtag.active{background:var(--honey);color:var(--bg)}
.dtag.reply{background:var(--blue);color:#10222b}
.dtag.done{background:var(--olive);color:#1c2210}
.dtag.new{background:var(--cream);color:#3a2c10}
.cid{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
.empty{padding:26px;text-align:center;color:var(--dim);letter-spacing:2px}
.note{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.9}
.note a{color:var(--honey-l)}
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="../../index.html">← 返回入口</a>
  <div class="brand serif">蜂巢<em>六邊</em>案件追蹤<small>HIVE CASE TRACKING — 案件列表檢視</small></div>
  <nav class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="list.html" class="on">案件列表</a>
    <a href="detail.html">案件詳情</a>
    <a href="form.html">新增案件</a>
  </nav>
</header>

<div class="wrap">
  <!-- KPI -->
  <div class="kpis">
    <div class="kpi"><div class="n" id="kAll">12<small>件</small></div><div class="k">巢箱總案件</div></div>
    <div class="kpi"><div class="n" id="kActive">5<small>件</small></div><div class="k">處理中</div></div>
    <div class="kpi"><div class="n" id="kReply">3<small>件</small></div><div class="k">待回覆</div></div>
    <div class="kpi"><div class="n" id="kDone">4<small>件</small></div><div class="k">已結案</div></div>
  </div>

  <div class="panel">
    <h3 class="sec">案件一覽表 CASE LEDGER</h3>
    <div class="fbar">
      <button class="fbtn on" data-f=""><span class="dot" style="background:var(--honey-l)"></span>全部 <span class="cnt">12</span></button>
      <button class="fbtn" data-f="active"><span class="dot" style="background:var(--honey)"></span>處理中</button>
      <button class="fbtn" data-f="reply"><span class="dot" style="background:var(--blue)"></span>待回覆</button>
      <button class="fbtn" data-f="done"><span class="dot" style="background:var(--olive)"></span>已結案</button>
      <input class="search" id="kw" placeholder="搜尋案號 / 標題 / 承辦…">
    </div>
    <table>
      <thead>
        <tr><th>案號</th><th>案件標題</th><th>類別</th><th>承辦</th><th>收件時間</th><th>狀態</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="note">✦ 點任一案件列可進入 <a href="detail.html">案件詳情</a> 示範頁；習慣六邊形巢牆檢視請回 <a href="index.html">主控台</a>。</div>
  </div>
</div>

<script>
const CASES = [
  {id:'HV-2201', title:'訂單 #88231 發票抬頭錯誤', who:'業務一部 / 趙敏君', status:'active', cat:'帳務', age:'今日 09:12'},
  {id:'HV-2202', title:'APP 推播通知重複發送', who:'產品組 / 吳冠霖', status:'reply', cat:'系統', age:'今日 08:47'},
  {id:'HV-2203', title:'VIP 客戶要求提前續約折扣', who:'業務二部 / 林佳蓉', status:'active', cat:'合約', age:'今日 08:15'},
  {id:'HV-2204', title:'門市 POS 離線無法結帳', who:'資訊組 / 高志明', status:'reply', cat:'系統', age:'昨日 17:40'},
  {id:'HV-2205', title:'退貨退款逾 7 日未入帳', who:'客服組 / 陳思妤', status:'active', cat:'帳務', age:'昨日 15:22'},
  {id:'HV-2206', title:'官網會員無法重置密碼', who:'產品組 / 張育誠', status:'done', cat:'系統', age:'昨日 11:08'},
  {id:'HV-2207', title:'大量訂單地址匯入格式錯誤', who:'電商組 / 蔡明勳', status:'done', cat:'資料', age:'08/26 16:51'},
  {id:'HV-2208', title:'企業客戶 API 金鑰即將到期', who:'技術支援 / 黃柏睿', status:'active', cat:'系統', age:'08/26 14:03'},
  {id:'HV-2209', title:'發票中獎通知未寄出', who:'帳務組 / 謝欣怡', status:'reply', cat:'帳務', age:'08/26 10:27'},
  {id:'HV-2210', title:'倉儲出貨延遲客訴', who:'物流組 / 曾國豪', status:'done', cat:'物流', age:'08/25 13:36'},
  {id:'HV-2211', title:'App 折價券無法使用', who:'行銷組 / 鄧雅文', status:'active', cat:'行銷', age:'08/25 09:44'},
  {id:'HV-2212', title:'年度滿意度調查邀請名單異常', who:'行銷組 / 呂承翰', status:'done', cat:'資料', age:'08/24 15:19'},
];
const STATUS = {active:'處理中', reply:'待回覆', done:'已結案', new:'新進件'};
let filter = '';
const tbody = document.getElementById('tbody');

function render(){
  const kw = document.getElementById('kw').value.trim();
  const rows = CASES.filter(c =>
    (!filter || c.status===filter) &&
    (!kw || c.id.includes(kw) || c.title.includes(kw) || c.who.includes(kw))
  );
  if (!rows.length){ tbody.innerHTML = '<tr><td colspan="6"><div class="empty">— 巢格空空如也 —</div></td></tr>'; return; }
  tbody.innerHTML = rows.map(c=>`
    <tr data-id="${c.id}">
      <td class="cid">${c.id}</td>
      <td><span class="pip ${c.status}"></span><b>${c.title}</b></td>
      <td>${c.cat}</td>
      <td>${c.who}</td>
      <td class="cid">${c.age}</td>
      <td><span class="dtag ${c.status}">${STATUS[c.status]}</span></td>
    </tr>`).join('');
  tbody.querySelectorAll('tr[data-id]').forEach(tr=>tr.addEventListener('click', ()=>location.href='detail.html'));
}
document.querySelectorAll('.fbtn[data-f]').forEach(b=>b.addEventListener('click', ()=>{
  document.querySelectorAll('.fbtn[data-f]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.f; render();
}));
document.getElementById('kw').addEventListener('input', render);
render();
</script>
</body>
</html>
