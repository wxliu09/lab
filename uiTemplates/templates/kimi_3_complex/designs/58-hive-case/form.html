<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增案件 · 蜂巢六邊案件追蹤</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#241a10; --cell:#3a2a18; --honey:#f0a82e; --honey-l:#ffd98a;
  --blue:#7fb8d4; --olive:#8a9a5b; --cream:#ffe9c0; --txt:#f3e6cf; --dim:#a68e6b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--txt);
  min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(circle at 30% 20%, rgba(240,168,46,.06), transparent 45%);
}
.serif{font-family:'Noto Serif TC','Microsoft JhengHei',serif}

.topbar{
  display:flex;align-items:center;gap:20px;padding:18px 30px;flex-wrap:wrap;
  border-bottom:1px solid rgba(240,168,46,.28);
  background:linear-gradient(180deg, rgba(58,42,24,.9), transparent);
  position:sticky;top:0;z-index:60;backdrop-filter:blur(4px);
}
.back{
  text-decoration:none;color:var(--honey);font-size:14px;font-weight:700;letter-spacing:1px;
  border:1.5px solid var(--honey);padding:7px 16px;
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);
  transition:all .2s;background:rgba(240,168,46,.08);
}
.back:hover{background:var(--honey);color:var(--bg)}
.brand{font-size:22px;font-weight:800;letter-spacing:4px}
.brand em{color:var(--honey);font-style:normal}
.brand small{display:block;font-size:10px;letter-spacing:5px;color:var(--dim);font-family:'Noto Sans TC';font-weight:300;margin-top:3px}
.subnav{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.subnav a{
  text-decoration:none;color:var(--honey-l);font-size:13px;font-weight:700;letter-spacing:1px;padding:6px 14px;
  background:rgba(240,168,46,.08);transition:all .2s;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);
}
.subnav a:hover{background:var(--honey);color:var(--bg)}
.subnav a.on{background:rgba(240,168,46,.3);color:var(--cream)}

.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;max-width:1280px;margin:0 auto;padding:26px 30px 60px}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.panel{
  border:1px solid rgba(240,168,46,.3);border-radius:14px;padding:24px;margin-bottom:26px;
  background:linear-gradient(200deg, rgba(58,42,24,.7), rgba(36,26,16,.5));
}
h3.sec{font-family:'Noto Serif TC';font-size:16px;letter-spacing:3px;margin-bottom:16px;color:var(--honey-l)}
h3.sec::after{content:'';display:block;height:1px;background:repeating-linear-gradient(90deg,rgba(240,168,46,.5),rgba(240,168,46,.5) 6px,transparent 6px,transparent 12px);margin-top:8px}

/* 表單 */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.frm .full{grid-column:1/-1}
.frm label.lab{font-size:11px;letter-spacing:2px;color:var(--dim);display:block;margin-bottom:6px}
.frm input[type=text],.frm input[type=date],.frm select,.frm textarea{
  width:100%;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--txt);
  background:rgba(20,14,7,.6);border:1px solid rgba(240,168,46,.4);border-radius:10px;outline:none;transition:border-color .2s;
}
.frm input:focus,.frm select:focus,.frm textarea:focus{border-color:var(--honey)}
.frm textarea{resize:vertical;min-height:90px}
.radios,.checks{display:flex;gap:10px;flex-wrap:wrap;padding-top:2px}
.radios label,.checks label{
  display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;
  border:1px solid rgba(240,168,46,.35);border-radius:10px;padding:7px 14px;transition:all .18s;
}
.radios input,.checks input{accent-color:var(--honey)}
.radios label:has(input:checked){background:rgba(240,168,46,.2);border-color:var(--honey);color:var(--honey-l)}
.checks label:has(input:checked){background:rgba(127,184,212,.18);border-color:var(--blue);color:var(--blue)}
.addbtn{
  grid-column:1/-1;padding:14px;font-family:'Noto Serif TC';font-size:15px;font-weight:800;
  letter-spacing:3px;cursor:pointer;color:var(--bg);background:linear-gradient(135deg,var(--honey),var(--honey-l));
  border:none;clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);
  transition:all .2s;
}
.addbtn:hover{filter:brightness(1.12);letter-spacing:5px}

/* 預覽巢格 */
.pv-zone{display:grid;place-items:center;padding:20px 0 8px}
.hex{
  width:150px;height:168px;position:relative;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(170deg,#54401e,#3e2e16);
  text-align:center;padding:20px 14px;
}
.hex .pip{
  width:10px;height:11px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:var(--cream);
}
.hex .cid{font-size:11px;letter-spacing:1px;color:var(--dim)}
.hex .ctitle{font-size:13px;font-weight:700;line-height:1.45;color:var(--txt)}
.hex .cwho{font-size:11px;color:var(--dim)}
@keyframes hatch{
  0%{transform:scale(0) rotate(-30deg);opacity:0;filter:brightness(3)}
  55%{transform:scale(1.18) rotate(4deg);opacity:1;filter:brightness(1.6)}
  100%{transform:scale(1) rotate(0);filter:brightness(1)}
}
.hex.hatching{animation:hatch .8s cubic-bezier(.3,1.3,.4,1)}
.hex.hatching::after{
  content:'';position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle, rgba(240,168,46,.55), transparent 65%);
  animation:halo .8s ease-out forwards;pointer-events:none;
}
@keyframes halo{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}

.statbox{border:1px solid rgba(240,168,46,.3);padding:16px;border-radius:12px;font-size:12.5px;color:var(--dim);line-height:2}
.statbox b{color:var(--honey-l)}
.pv-note{text-align:center;font-size:12px;color:var(--dim);margin-top:6px}
.d-tag{
  display:inline-block;font-size:11px;padding:3px 12px;letter-spacing:2px;font-weight:700;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);
  background:var(--cream);color:#3a2c10;
}
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="../../index.html">← 返回入口</a>
  <div class="brand serif">蜂巢<em>六邊</em>案件追蹤<small>HIVE CASE TRACKING — 新增案件</small></div>
  <nav class="subnav">
    <a href="index.html">返回主控台</a>
    <a href="list.html">案件列表</a>
    <a href="detail.html">案件詳情</a>
    <a href="form.html" class="on">新增案件</a>
  </nav>
</header>

<div class="layout">
  <!-- 左欄：表單 -->
  <div>
    <div class="panel">
      <h3 class="sec">釀入新案件 NEW CASE</h3>
      <form class="frm" id="caseForm">
        <div class="full"><label class="lab">案件標題 *</label><input type="text" id="cTitle" placeholder="例：客戶反映帳單金額與合約不符"></div>
        <div>
          <label class="lab">案件類別</label>
          <select id="cCat">
            <option>帳務</option><option>系統</option><option>合約</option><option>物流</option><option>行銷</option><option>資料</option><option>業務</option>
          </select>
        </div>
        <div><label class="lab">受理日期</label><input type="date" id="cDate" value="2026-08-28"></div>
        <div><label class="lab">客戶 / 反映人</label><input type="text" id="cWho" placeholder="例：辰星科技 王小姐"></div>
        <div><label class="lab">指派承辦</label>
          <select id="cOwner">
            <option>客服組 / 邱立群</option><option>帳務組 / 謝欣怡</option><option>產品組 / 郭靜怡</option>
            <option>業務一部 / 羅仕偉</option><option>技術支援 / 黃柏睿</option>
          </select>
        </div>
        <div class="full">
          <label class="lab">優先等級</label>
          <div class="radios">
            <label><input type="radio" name="pri" value="低">低</label>
            <label><input type="radio" name="pri" value="一般" checked>一般</label>
            <label><input type="radio" name="pri" value="高">高</label>
            <label><input type="radio" name="pri" value="緊急">緊急</label>
          </div>
        </div>
        <div class="full">
          <label class="lab">客戶通知方式（可複選）</label>
          <div class="checks">
            <label><input type="checkbox" checked>電話</label>
            <label><input type="checkbox" checked>電子郵件</label>
            <label><input type="checkbox">簡訊</label>
            <label><input type="checkbox">LINE 官方帳號</label>
          </div>
        </div>
        <div class="full"><label class="lab">案件內容 *</label><textarea id="cDesc" placeholder="描述客戶問題、影響範圍與期望處理方式…"></textarea></div>
        <button type="submit" class="addbtn serif">＋ 釀入巢箱（狀態：新進件）</button>
      </form>
    </div>
  </div>

  <!-- 右欄：預覽 + 分派規則 -->
  <div>
    <div class="panel">
      <h3 class="sec">巢格即時預覽 PREVIEW</h3>
      <div class="pv-zone">
        <div class="hex" id="pvHex">
          <span class="pip"></span>
          <span class="cid" id="pvId">HV-2213</span>
          <span class="ctitle" id="pvTitle">（待填寫標題）</span>
          <span class="cwho" id="pvWho">客服組</span>
        </div>
      </div>
      <div class="pv-note"><span class="d-tag">新進件</span>　<span id="pvMeta">帳務 ｜ 優先：一般</span></div>
    </div>

    <div class="panel">
      <h3 class="sec">自動分派規則 ROUTING</h3>
      <div class="statbox">
        帳務類 → <b>帳務組</b>（SLA 24hr）<br>
        系統類 → <b>產品組 + 資訊組</b>（SLA 8hr）<br>
        合約類 → <b>業務主管覆核</b>（SLA 48hr）<br>
        緊急優先 → <b>值班組長即時派工</b>（SLA 2hr）<br>
        <br>
        新案件孵出後會出現在 <b><a href="index.html" style="color:var(--honey-l)">主控台巢牆</a></b> 最前排。
      </div>
    </div>
  </div>
</div>

<script>
let seq = 2213;
const $ = id => document.getElementById(id);
function preview(){
  $('pvTitle').textContent = $('cTitle').value.trim() || '（待填寫標題）';
  $('pvWho').textContent = $('cOwner').value.split(' / ')[0];
  const pri = document.querySelector('input[name=pri]:checked').value;
  $('pvMeta').textContent = $('cCat').value + ' ｜ 優先：' + pri;
  $('pvId').textContent = 'HV-' + seq;
}
['cTitle','cOwner','cCat'].forEach(id=>$(id).addEventListener('input', preview));
document.querySelectorAll('input[name=pri]').forEach(r=>r.addEventListener('change', preview));
preview();

$('caseForm').addEventListener('submit', e=>{
  e.preventDefault();
  const hex = $('pvHex');
  if (!$('cTitle').value.trim() || !$('cDesc').value.trim()){
    $('pvTitle').textContent = '⚠ 標題與內容必填';
    hex.classList.remove('hatching'); void hex.offsetWidth; hex.classList.add('hatching');
    return;
  }
  hex.classList.remove('hatching'); void hex.offsetWidth; hex.classList.add('hatching');
  const old = hex.querySelector('.cid');
  old.textContent = 'HV-' + seq + ' ✓';
  const btn = e.target.querySelector('.addbtn');
  btn.textContent = '✓ 已孵入巢箱（HV-' + seq + '）';
  setTimeout(()=>{
    seq++;
    btn.textContent = '＋ 釀入巢箱（狀態：新進件）';
    e.target.reset();
    document.querySelectorAll('.checks input').forEach((c,i)=>c.checked = i<2);
    preview();
  }, 2200);
});
</script>
</body>
</html>
