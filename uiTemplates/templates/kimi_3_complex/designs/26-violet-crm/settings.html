<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系統設定 · 星雲 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:linear-gradient(135deg,#1a0533 0%,#2d1b4e 55%,#241040 100%);min-height:100vh;color:#f3efff;overflow-x:hidden}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0}
  .g1{width:480px;height:480px;background:#7c3aed;top:-140px;right:-100px;animation:drift 14s ease-in-out infinite alternate}
  .g2{width:380px;height:380px;background:#ff6ec7;bottom:-120px;left:180px;animation:drift 18s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.15)}}
  .layout{display:flex;position:relative;z-index:1;min-height:100vh}
  aside{width:230px;padding:28px 18px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.1);position:sticky;top:0;height:100vh}
  .logo{font-size:20px;font-weight:900;background:linear-gradient(90deg,#ff6ec7,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:30px}
  .nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;color:#b8a9d9;text-decoration:none;font-size:14px;margin-bottom:6px;transition:.25s}
  .nav a.active,.nav a:hover{background:rgba(167,139,250,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.35)}
  .nav a .ico{width:22px;text-align:center}
  main{flex:1;padding:26px 34px;max-width:1100px}
  .toprow{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);color:#e9e2ff;text-decoration:none;font-size:14px;transition:.25s}
  .back:hover{border-color:#ff6ec7;box-shadow:0 0 18px rgba(255,110,199,.35);color:#fff}
  .glass{background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:18px}
  .pink{color:#ff6ec7}.violet{color:#a78bfa}.green{color:#34d399}
  .section-title{font-size:17px;font-weight:700;margin:6px 0 16px;display:flex;align-items:center;gap:10px}
  .section-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(#ff6ec7,#a78bfa)}
  .panel{padding:24px;margin-bottom:18px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:#b8a9d9;margin-bottom:7px}
  .inp{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 14px;color:#f3efff;font-size:14px;outline:none;font-family:inherit;transition:.2s}
  .inp:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
  select.inp option{background:#2d1b4e;color:#f3efff}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:13px;cursor:pointer;transition:.2s;color:#d9ccf5}
  .opt:has(input:checked){background:rgba(167,139,250,.22);border-color:#a78bfa;color:#fff;box-shadow:0 0 12px rgba(167,139,250,.3)}
  .opt input{accent-color:#ff6ec7}
  .swrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  .swrow:last-child{border:none}
  .swrow .txt{flex:1}
  .swrow .t{font-size:14px}
  .swrow .d{font-size:12px;color:#b8a9d9;margin-top:2px}
  .sw{position:relative;width:46px;height:25px;flex:none;cursor:pointer}
  .sw input{opacity:0;width:0;height:0}
  .sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);transition:.25s}
  .sw i::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#b8a9d9;transition:.25s}
  .sw input:checked + i{background:linear-gradient(90deg,#ff6ec7,#a78bfa);box-shadow:0 0 14px rgba(255,110,199,.4)}
  .sw input:checked + i::after{left:23px;background:#fff}
  .stbadge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;background:rgba(52,211,153,.16);color:#34d399;border:1px solid rgba(52,211,153,.45);margin-left:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 26px;border-radius:12px;background:linear-gradient(90deg,#ff6ec7,#a78bfa);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(255,110,199,.3);transition:.25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(167,139,250,.45)}
  .toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:linear-gradient(90deg,#34d399,#22d3ee);color:#052e22;font-weight:700;font-size:14px;padding:13px 26px;border-radius:14px;opacity:0;pointer-events:none;transition:.35s;box-shadow:0 12px 30px rgba(52,211,153,.4);z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:1100px){.frow{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="layout">
<aside>
  <div class="logo">✦ 星雲 CRM</div>
  <nav class="nav">
    <a href="index.html"><span class="ico">◈</span>儀表板</a>
    <a href="customers.html"><span class="ico">👥</span>客戶管理</a>
    <a href="report.html#funnel"><span class="ico">📈</span>銷售管道</a>
    <a href="customer-detail.html#timeline"><span class="ico">🗓</span>活動行程</a>
    <a href="form.html"><span class="ico">📄</span>報價合約</a>
    <a href="report.html"><span class="ico">📊</span>業績分析</a>
    <a href="settings.html" class="active"><span class="ico">⚙</span>系統設定</a>
  </nav>
</aside>
<main>
  <div class="toprow">
    <a class="back" href="../../index.html">← 返回入口</a>
    <a class="back" href="index.html">⌂ 返回主控台</a>
    <h1 style="font-size:19px;font-weight:900">系統設定<span class="stbadge">已同步</span></h1>
  </div>

  <div class="glass panel">
    <div class="section-title" style="margin-top:0">個人資料</div>
    <div class="frow">
      <div class="field"><label>姓名</label><input class="inp" value="周雅嵐"></div>
      <div class="field"><label>職稱</label><input class="inp" value="資深業務經理"></div>
    </div>
    <div class="frow">
      <div class="field"><label>Email</label><input class="inp" type="email" value="yalan.chou@nebula-crm.tw"></div>
      <div class="field"><label>分機</label><input class="inp" value="#213"></div>
    </div>
  </div>

  <div class="glass panel">
    <div class="section-title" style="margin-top:0">通知偏好</div>
    <div class="swrow"><div class="txt"><div class="t">商機階段異動通知</div><div class="d">我負責或協作的商機變更階段時推播</div></div>
      <label class="sw"><input type="checkbox" checked><i></i></label></div>
    <div class="swrow"><div class="txt"><div class="t">高風險客戶警示</div><div class="d">健康度低於 40 或超過 7 天未互動時通知</div></div>
      <label class="sw"><input type="checkbox" checked><i></i></label></div>
    <div class="swrow"><div class="txt"><div class="t">每週業績摘要信</div><div class="d">每週一 08:00 寄送上週成交與管道摘要</div></div>
      <label class="sw"><input type="checkbox"><i></i></label></div>
    <div class="field" style="margin:14px 0 0"><label>通知管道</label>
      <div class="opts">
        <label class="opt"><input type="radio" name="ch" checked>系統內推播</label>
        <label class="opt"><input type="radio" name="ch">Email</label>
        <label class="opt"><input type="radio" name="ch">Teams</label>
      </div></div>
  </div>

  <div class="glass panel">
    <div class="section-title" style="margin-top:0">介面與區域</div>
    <div class="frow">
      <div class="field"><label>預設首頁</label>
        <select class="inp"><option>儀表板</option><option>客戶管理</option><option>業績分析</option></select></div>
      <div class="field"><label>幣別顯示</label>
        <select class="inp"><option>NT$ 新台幣</option><option>US$ 美元</option><option>JP¥ 日圓</option></select></div>
    </div>
    <div class="frow">
      <div class="field"><label>日期格式</label>
        <select class="inp"><option>民國年（115/08/28）</option><option>西元年（2026-08-28）</option></select></div>
      <div class="field"><label>每頁列數</label>
        <select class="inp"><option>20</option><option selected>50</option><option>100</option></select></div>
    </div>
  </div>

  <button class="btn" id="saveBtn">✦ 儲存設定</button>
</main>
</div>
<div class="toast" id="toast">✓ 設定已儲存並同步至所有裝置</div>
<script>
document.getElementById('saveBtn').addEventListener('click',()=>{
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
});
</script>
</body>
</html>
