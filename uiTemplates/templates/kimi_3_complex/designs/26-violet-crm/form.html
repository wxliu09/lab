<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增商機・報價 · 星雲 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:linear-gradient(135deg,#1a0533 0%,#2d1b4e 55%,#241040 100%);min-height:100vh;color:#f3efff;overflow-x:hidden}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0}
  .g1{width:480px;height:480px;background:#7c3aed;top:-140px;right:-100px;animation:drift 14s ease-in-out infinite alternate}
  .g2{width:380px;height:380px;background:#ff6ec7;bottom:-120px;left:180px;animation:drift 18s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.15)}}
  .layout{display:flex;position:relative;z-index:1;min-height:100vh}
  aside{width:230px;padding:28px 18px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.1);position:sticky;top:0;height:100vh}
  .logo{font-size:20px;font-weight:900;background:linear-gradient(90deg,#ff6ec7,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:30px}
  .nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;color:#b8a9d9;text-decoration:none;font-size:14px;margin-bottom:6px;transition:.25s}
  .nav a.active,.nav a:hover{background:rgba(167,139,250,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.35)}
  .nav a .ico{width:22px;text-align:center}
  main{flex:1;padding:26px 34px}
  .toprow{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);color:#e9e2ff;text-decoration:none;font-size:14px;transition:.25s}
  .back:hover{border-color:#ff6ec7;box-shadow:0 0 18px rgba(255,110,199,.35);color:#fff}
  .glass{background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:18px}
  .pink{color:#ff6ec7}.violet{color:#a78bfa}.green{color:#34d399}.rose{color:#fb7185}
  .section-title{font-size:17px;font-weight:700;margin:6px 0 16px;display:flex;align-items:center;gap:10px}
  .section-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(#ff6ec7,#a78bfa)}
  .formgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  .panel{padding:26px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:#b8a9d9;margin-bottom:7px;letter-spacing:.5px}
  .field label b{color:#ff6ec7}
  .inp{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 14px;color:#f3efff;font-size:14px;outline:none;font-family:inherit;transition:.2s}
  .inp:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
  select.inp option{background:#2d1b4e;color:#f3efff}
  textarea.inp{resize:vertical;min-height:110px;line-height:1.7}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:13px;cursor:pointer;transition:.2s;color:#d9ccf5}
  .opt:has(input:checked){background:rgba(167,139,250,.22);border-color:#a78bfa;color:#fff;box-shadow:0 0 12px rgba(167,139,250,.3)}
  .opt input{accent-color:#ff6ec7}
  .stbadge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;background:rgba(255,110,199,.16);color:#ff6ec7;border:1px solid rgba(255,110,199,.45);margin-left:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 26px;border-radius:12px;background:linear-gradient(90deg,#ff6ec7,#a78bfa);color:#fff;text-decoration:none;font-size:14px;font-weight:700;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(255,110,199,.3);transition:.25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(167,139,250,.45)}
  .btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid rgba(255,255,255,.16);font-weight:500}
  .sum{padding:22px;position:sticky;top:24px}
  .sum .big{font-size:36px;font-weight:900;font-family:'DM Mono',monospace;margin:4px 0}
  .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0 6px}
  .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a78bfa,#ff6ec7);transition:width .5s cubic-bezier(.22,1,.36,1)}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  .kv:last-child{border:none}
  .kv .k{color:#b8a9d9}
  .kv b{font-family:'DM Mono',monospace;font-weight:500}
  .toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:linear-gradient(90deg,#34d399,#22d3ee);color:#052e22;font-weight:700;font-size:14px;padding:13px 26px;border-radius:14px;opacity:0;pointer-events:none;transition:.35s;box-shadow:0 12px 30px rgba(52,211,153,.4);z-index:50}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:1100px){.formgrid{grid-template-columns:1fr}.frow{grid-template-columns:1fr}aside{display:none}.sum{position:static}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="layout">
<aside>
  <div class="logo">✦ 星雲 CRM</div>
  <nav class="nav">
    <a href="index.html"><span class="ico">◈</span>儀表板</a>
    <a href="customers.html"><span class="ico">👥</span>客戶管理</a>
    <a href="report.html#funnel"><span class="ico">📈</span>銷售管道</a>
    <a href="customer-detail.html#timeline"><span class="ico">🗓</span>活動行程</a>
    <a href="form.html" class="active"><span class="ico">📄</span>報價合約</a>
    <a href="report.html"><span class="ico">📊</span>業績分析</a>
    <a href="settings.html"><span class="ico">⚙</span>系統設定</a>
  </nav>
</aside>
<main>
  <div class="toprow">
    <a class="back" href="../../index.html">← 返回入口</a>
    <a class="back" href="index.html">⌂ 返回主控台</a>
    <h1 style="font-size:19px;font-weight:900">新增商機・報價<span class="stbadge">草稿</span></h1>
  </div>

  <div class="formgrid">
    <form class="glass panel" id="oppForm" onsubmit="return false">
      <div class="section-title" style="margin-top:0">商機基本資料</div>
      <div class="frow">
        <div class="field" style="margin:0"><label>商機名稱 <b>*</b></label><input class="inp" id="fName" placeholder="例：MES 二廠擴充授權案" value="鼎新精密 MES 二廠擴充授權案"></div>
        <div class="field" style="margin:0"><label>所屬客戶 <b>*</b></label>
          <select class="inp" id="fCust"><option>鼎新精密工業</option><option>澄光生技股份</option><option>翔宇連鎖餐飲</option><option>巨輪物流</option><option>泓達電子</option><option>禾豐建設</option></select></div>
      </div>
      <div class="frow">
        <div class="field" style="margin:0"><label>銷售階段</label>
          <select class="inp" id="fStage">
            <option value="0.2">初步接觸（成交率 20%）</option>
            <option value="0.4">需求確認（40%）</option>
            <option value="0.6" selected>方案提案（60%）</option>
            <option value="0.8">議價談判（80%）</option>
            <option value="1">成交簽約（100%）</option>
          </select></div>
        <div class="field" style="margin:0"><label>預計成交日</label><input class="inp" type="date" id="fDate" value="2026-09-30"></div>
      </div>
      <div class="frow">
        <div class="field" style="margin:0"><label>預估金額（NT$ 萬元）<b>*</b></label><input class="inp" type="number" id="fAmt" value="320" min="1"></div>
        <div class="field" style="margin:0"><label>負責業務</label>
          <select class="inp"><option>周雅嵐</option><option>林書宇</option><option>高敏珊</option></select></div>
      </div>
      <div class="field"><label>商機來源</label>
        <div class="opts">
          <label class="opt"><input type="radio" name="src" checked>既有客戶擴購</label>
          <label class="opt"><input type="radio" name="src">客戶轉介紹</label>
          <label class="opt"><input type="radio" name="src">行銷活動</label>
          <label class="opt"><input type="radio" name="src">主動開發</label>
        </div>
      </div>
      <div class="field"><label>需求項目（可複選）</label>
        <div class="opts">
          <label class="opt"><input type="checkbox" checked>軟體授權</label>
          <label class="opt"><input type="checkbox" checked>導入顧問服務</label>
          <label class="opt"><input type="checkbox">硬體報工機</label>
          <label class="opt"><input type="checkbox">教育訓練</label>
          <label class="opt"><input type="checkbox" checked>年度維護</label>
        </div>
      </div>
      <div class="field"><label>需求說明與備註</label>
        <textarea class="inp" id="fNote" placeholder="記錄客戶痛點、競品狀況、決策流程…">二廠預計 10 月試量產，需於 9 月底前完成 60 席授權擴充與 12 台報工機安裝。競品：鼎X 報價約低 8%，但客戶在意既有資料相容性。</textarea></div>
      <div style="display:flex;gap:12px;margin-top:6px">
        <button class="btn" id="saveBtn" type="button">✦ 建立商機</button>
        <a class="btn ghost" href="customers.html">取消並回列表</a>
      </div>
    </form>

    <div class="glass sum">
      <div class="section-title" style="margin-top:0">商機試算</div>
      <div style="font-size:12.5px;color:#b8a9d9">加權預估營收（金額 × 階段機率）</div>
      <div class="big pink" id="wAmt">NT$ 192 萬</div>
      <div class="meter"><i id="wBar" style="width:60%"></i></div>
      <div style="font-size:11.5px;color:#8f7cb8;margin-bottom:14px" id="wPct">階段成交機率 60%</div>
      <div class="kv"><span class="k">商機編號（暫）</span><b class="violet">OP-2618</b></div>
      <div class="kv"><span class="k">預估金額</span><b id="sAmt">NT$ 320 萬</b></div>
      <div class="kv"><span class="k">距預計成交</span><b id="sDays">33 天</b></div>
      <div class="kv"><span class="k">管道排名</span><b>第 4 大商機</b></div>
      <div class="kv"><span class="k">建議下一步</span><b style="font-family:inherit" class="green">安排產線實勘</b></div>
    </div>
  </div>
</main>
</div>
<div class="toast" id="toast">✓ 商機 OP-2618 已建立，並通知主管審閱報價</div>
<script>
const amt=document.getElementById('fAmt'), stage=document.getElementById('fStage'), date=document.getElementById('fDate');
function recalc(){
  const a=+amt.value||0, p=+stage.value;
  const w=Math.round(a*p);
  document.getElementById('wAmt').textContent='NT$ '+w.toLocaleString()+' 萬';
  document.getElementById('sAmt').textContent='NT$ '+a.toLocaleString()+' 萬';
  document.getElementById('wPct').textContent='階段成交機率 '+Math.round(p*100)+'%';
  document.getElementById('wBar').style.width=Math.max(p*100,6)+'%';
  const d=Math.round((new Date(date.value)-new Date('2026-08-28'))/86400000);
  document.getElementById('sDays').textContent=isNaN(d)?'—':d+' 天';
}
[amt,stage,date].forEach(el=>el.addEventListener('input',recalc));
recalc();
document.getElementById('saveBtn').addEventListener('click',()=>{
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
});
</script>
</body>
</html>
