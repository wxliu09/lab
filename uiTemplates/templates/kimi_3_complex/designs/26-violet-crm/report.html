<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業績分析 · 星雲 CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif}
  body{background:linear-gradient(135deg,#1a0533 0%,#2d1b4e 55%,#241040 100%);min-height:100vh;color:#f3efff;overflow-x:hidden}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none;z-index:0}
  .g1{width:480px;height:480px;background:#7c3aed;top:-140px;right:-100px;animation:drift 14s ease-in-out infinite alternate}
  .g2{width:380px;height:380px;background:#ff6ec7;bottom:-120px;left:180px;animation:drift 18s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.15)}}
  .layout{display:flex;position:relative;z-index:1;min-height:100vh}
  aside{width:230px;padding:28px 18px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.1);position:sticky;top:0;height:100vh}
  .logo{font-size:20px;font-weight:900;background:linear-gradient(90deg,#ff6ec7,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:30px}
  .nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;color:#b8a9d9;text-decoration:none;font-size:14px;margin-bottom:6px;transition:.25s}
  .nav a.active,.nav a:hover{background:rgba(167,139,250,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(167,139,250,.35)}
  .nav a .ico{width:22px;text-align:center}
  main{flex:1;padding:26px 34px}
  .toprow{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);color:#e9e2ff;text-decoration:none;font-size:14px;transition:.25s}
  .back:hover{border-color:#ff6ec7;box-shadow:0 0 18px rgba(255,110,199,.35);color:#fff}
  .glass{background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:18px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
  .kpi{padding:20px 22px;transition:.3s}
  .kpi:hover{transform:translateY(-4px);border-color:rgba(255,110,199,.5);box-shadow:0 12px 32px rgba(255,110,199,.18)}
  .kpi .lb{font-size:13px;color:#b8a9d9}
  .kpi .val{font-size:30px;font-weight:900;margin:6px 0 2px;font-family:'DM Mono',monospace}
  .kpi .delta{font-size:12px}
  .pink{color:#ff6ec7}.violet{color:#a78bfa}.green{color:#34d399}.rose{color:#fb7185}
  .section-title{font-size:17px;font-weight:700;margin:6px 0 16px;display:flex;align-items:center;gap:10px}
  .section-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(#ff6ec7,#a78bfa)}
  .panel{padding:22px}
  .chips{display:flex;gap:10px;margin-left:auto}
  .chip{padding:6px 15px;border-radius:99px;font-size:12.5px;color:#b8a9d9;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.2s}
  .chip.on{background:rgba(255,110,199,.2);color:#fff;border-color:#ff6ec7;box-shadow:0 0 14px rgba(255,110,199,.3)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  .chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding:10px 6px 0}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .col .bar{width:100%;max-width:52px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ff6ec7,#7c3aed);height:0;transition:height 1s cubic-bezier(.22,1,.36,1);box-shadow:0 0 16px rgba(255,110,199,.3);position:relative}
  .col .bar:hover{filter:brightness(1.25)}
  .col .bar .tip{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11px;font-family:'DM Mono',monospace;color:#ff6ec7;white-space:nowrap}
  .col .m{font-size:11.5px;color:#b8a9d9;font-family:'DM Mono',monospace}
  .funnel .stage{display:flex;align-items:center;gap:14px;margin-bottom:13px}
  .funnel .sname{width:82px;font-size:13px;color:#d9ccf5;text-align:right}
  .funnel .sbar{height:32px;border-radius:8px;background:linear-gradient(90deg,rgba(167,139,250,.85),rgba(255,110,199,.85));display:flex;align-items:center;justify-content:flex-end;padding-right:12px;font-family:'DM Mono',monospace;font-size:12.5px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1);box-shadow:0 0 14px rgba(167,139,250,.3);white-space:nowrap}
  .funnel .srate{font-size:11px;color:#b8a9d9;width:56px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11.5px;letter-spacing:1px;color:#8f7cb8;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.14);font-weight:500}
  td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .rank1{color:#ff6ec7;font-weight:900}
  .prog{width:130px;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a78bfa,#ff6ec7)}
  @media(max-width:1100px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}aside{display:none}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="layout">
<aside>
  <div class="logo">✦ 星雲 CRM</div>
  <nav class="nav">
    <a href="index.html"><span class="ico">◈</span>儀表板</a>
    <a href="customers.html"><span class="ico">👥</span>客戶管理</a>
    <a href="report.html#funnel"><span class="ico">📈</span>銷售管道</a>
    <a href="customer-detail.html#timeline"><span class="ico">🗓</span>活動行程</a>
    <a href="form.html"><span class="ico">📄</span>報價合約</a>
    <a href="report.html" class="active"><span class="ico">📊</span>業績分析</a>
    <a href="settings.html"><span class="ico">⚙</span>系統設定</a>
  </nav>
</aside>
<main>
  <div class="toprow">
    <a class="back" href="../../index.html">← 返回入口</a>
    <a class="back" href="index.html">⌂ 返回主控台</a>
    <h1 style="font-size:19px;font-weight:900">業績分析</h1>
    <div class="chips" id="period">
      <span class="chip" data-p="q2">Q2</span>
      <span class="chip on" data-p="q3">Q3</span>
      <span class="chip" data-p="y">115 全年</span>
    </div>
  </div>

  <div class="kpis">
    <div class="glass kpi"><div class="lb">本期成交金額（NT$）</div><div class="val pink" id="kAmt">1,860 萬</div><div class="delta green">▲ 目標達成 82%</div></div>
    <div class="glass kpi"><div class="lb">成交件數</div><div class="val violet" id="kCnt">38</div><div class="delta green">▲ 較上期 +6 件</div></div>
    <div class="glass kpi"><div class="lb">平均成交天數</div><div class="val green">46 天</div><div class="delta green">▲ 縮短 5 天</div></div>
    <div class="glass kpi"><div class="lb">流失商機（NT$）</div><div class="val rose">420 萬</div><div class="delta rose">▼ 主因：價格競爭</div></div>
  </div>

  <div class="grid">
    <div class="glass panel">
      <div class="section-title" style="margin-top:0">每月成交金額（萬元）</div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="glass panel funnel" id="funnel">
      <div class="section-title" style="margin-top:0">銷售管道漏斗（本期）</div>
      <div id="funnelBox"></div>
    </div>
  </div>

  <div class="glass panel">
    <div class="section-title" style="margin-top:0">業務排行榜</div>
    <table>
      <thead><tr><th>#</th><th>業務</th><th>成交金額</th><th>件數</th><th>成交率</th><th>目標達成</th></tr></thead>
      <tbody>
        <tr><td class="rank1 mono">1</td><td>周雅嵐</td><td class="mono">NT$ 860 萬</td><td class="mono">14</td><td class="mono green">38.2%</td><td><span class="prog"><i style="width:96%"></i></span><b class="mono">96%</b></td></tr>
        <tr><td class="mono">2</td><td>林書宇</td><td class="mono">NT$ 640 萬</td><td class="mono">13</td><td class="mono green">31.5%</td><td><span class="prog"><i style="width:84%"></i></span><b class="mono">84%</b></td></tr>
        <tr><td class="mono">3</td><td>高敏珊</td><td class="mono">NT$ 360 萬</td><td class="mono">11</td><td class="mono violet">27.4%</td><td><span class="prog"><i style="width:71%"></i></span><b class="mono">71%</b></td></tr>
      </tbody>
    </table>
  </div>
</main>
</div>
<script>
const DATA = {
  q2:{amt:'1,520 萬',cnt:'32',bars:[380,460,520,410,490,550],funnel:[104,72,44,26,12]},
  q3:{amt:'1,860 萬',cnt:'38',bars:[420,510,610,480,570,690],funnel:[128,86,52,29,15]},
  y:{amt:'6,240 萬',cnt:'131',bars:[380,460,520,610,570,690],funnel:[460,310,196,112,54]}
};
const MONTHS=['3月','4月','5月','6月','7月','8月'];
const STAGES=['初步接觸','需求確認','方案提案','議價談判','成交簽約'];
function render(p){
  const d=DATA[p];
  document.getElementById('kAmt').textContent=d.amt;
  document.getElementById('kCnt').textContent=d.cnt;
  const max=Math.max(...d.bars);
  const ch=document.getElementById('chart'); ch.innerHTML='';
  d.bars.forEach((v,i)=>{
    const c=document.createElement('div'); c.className='col';
    c.innerHTML=`<div class="bar" data-h="${v/max*100}"><span class="tip">${v}</span></div><span class="m">${MONTHS[i]}</span>`;
    ch.appendChild(c);
  });
  const fb=document.getElementById('funnelBox'); fb.innerHTML='';
  d.funnel.forEach((v,i)=>{
    const w=Math.round(v/d.funnel[0]*100);
    const r=document.createElement('div'); r.className='stage';
    r.innerHTML=`<span class="sname">${STAGES[i]}</span><div class="sbar" data-w="${Math.max(w,14)}">${v} 件</div><span class="srate">${w}%</span>`;
    fb.appendChild(r);
  });
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll('.col .bar').forEach(b=>b.style.height=b.dataset.h+'%');
    document.querySelectorAll('.sbar').forEach(b=>b.style.width=b.dataset.w+'%');
  },120));
}
document.getElementById('period').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  document.querySelectorAll('#period .chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); render(c.dataset.p);
});
render('q3');
</script>
</body>
</html>
