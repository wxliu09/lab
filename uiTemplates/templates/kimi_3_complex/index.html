<style>
  :root{
    --ink:#1a1a2e; --paper:#f7f5f0; --accent:#e94560; --accent2:#0f3460;

  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:var(--ink);}
  header{
    background:linear-gradient(135deg,var(--ink) 0%,var(--accent2) 60%,var(--accent) 100%);
    color:#fff;padding:64px 8vw 48px;position:relative;overflow:hidden;
  }
  header::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;
    border:2px solid rgba(255,255,255,.12);border-radius:50%;}
  header::before{content:"";position:absolute;right:60px;bottom:-100px;width:220px;height:220px;
    border:2px solid rgba(255,255,255,.08);border-radius:50%;}
  header h1{font-size:clamp(28px,4vw,44px);letter-spacing:.05em;}
  header p{margin-top:12px;opacity:.85;font-size:15px;letter-spacing:.12em;}
  .stats{display:flex;gap:24px;margin-top:24px;font-size:13px;}
  .stats span{background:rgba(255,255,255,.12);padding:6px 16px;border-radius:99px;letter-spacing:.08em;}
  main{max-width:1280px;margin:0 auto;padding:48px 24px 96px;}
  .cat-title{
    display:flex;align-items:center;gap:16px;margin:56px 0 24px;font-size:22px;font-weight:700;
  }
  .cat-title:first-child{margin-top:0;}
  .cat-title .bar{width:8px;height:28px;border-radius:4px;}
  .cat-pub .bar{background:var(--pub);} .cat-mis .bar{background:var(--mis);}
  .cat-gov .bar{background:var(--gov);} .cat-form .bar{background:var(--form);}
  .cat-title small{font-size:13px;font-weight:400;color:#888;letter-spacing:.15em;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;}
  .card{
    display:block;background:#fff;border:1px solid #e6e2d9;border-radius:14px;padding:20px 22px;
    text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s;position:relative;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(26,26,46,.12);}
  .card .num{font-size:12px;font-weight:700;letter-spacing:.2em;color:#aaa;}
  .card h3{margin:8px 0 8px;font-size:17px;line-height:1.45;}
  .card p{font-size:13px;color:#777;line-height:1.7;}
  .card .badge{position:absolute;top:18px;right:18px;font-size:11px;padding:3px 10px;border-radius:99px;letter-spacing:.1em;}
  .badge.done{background:#e6f6f0;color:#1d7a5f;}
  .badge.wip{background:#f3f0ea;color:#999;}
  .card.done-card{border-color:#bfe6d8;}
  footer{text-align:center;padding:40px 0 56px;color:#aaa;font-size:12px;letter-spacing:.2em;}
</style>

function render(){
  let done=0;
  DESIGNS.forEach(x=>{
    const grid=document.getElementById(CAT[x.c][0]);
    const a=document.createElement('a');
    a.className='card';
    a.href='designs/'+x.f.replace('.html','')+'/index.html';
    a.innerHTML=`<span class="num">${String(x.n).padStart(2,'0')} / ${CAT[x.c][1]}</span>
      <span class="badge done">完成</span>
      <h3>${x.t}</h3><p>${x.d}</p>`;
    grid.appendChild(a);
    done++;
  });
  document.getElementById('stat-done').textContent='完成 '+done;
  document.getElementById('stat-wip').textContent='未完成 '+(60-done);
}
